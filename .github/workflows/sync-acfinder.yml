name: Sync ACFinderBE

on:
  push:
    paths:
      - 'acfinder/acfinder[0-9]*.zip' # acfinder2026.0306.1200.zip 等の追加で発動
  workflow_dispatch:
    inputs:
      run_mode:
        description: '実行モード'
        type: choice
        options:
          - 'full_sync'  # ZIP展開 ＋ サーバー同期
          - 'github_only'  # ZIP展開 ＋ リポジトリ更新のみ
          - 'site_sync_only'    # サーバー同期のみ
          - 'push_notification_only' # プッシュ通知のみ
        default: 'full_sync'
      force_update:
        description: '実験室を強制更新（?update=1）しますか？'
        type: boolean
        default: false

jobs:
  sync-and-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      app_updated: ${{ steps.process-zip.outputs.app_updated }}
      app_version: ${{ steps.process-zip.outputs.app_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process ZIP and Update Repository
        id: process-zip
        # Push時、または site_sync_only 以外が選択された時に実行
        if: |
          github.event_name == 'push' || 
          github.event.inputs.run_mode == 'full_sync' || 
          github.event.inputs.run_mode == 'github_only' ||
          github.event.inputs.run_mode == 'push_notification_only'
        run: |
          # Web UI や API で追加された最新の ZIP をローカル環境に反映
          #git pull origin main

          # 2. その後、ディレクトリに移動して展開処理を行う
          cd acfinder
          # アルファベット順で一番最後（最新日付）のZIPを特定
          TARGET_ZIP=$(ls -1 acfinder[0-9]*.zip | tail -n 1)
          
          if [ -z "$TARGET_ZIP" ]; then
            echo "Error: ZIP file not found!"
            exit 1
          fi

          echo "Latest ZIP found: $TARGET_ZIP"
          VERSION=$(basename "$TARGET_ZIP" .zip | sed 's/^acfinder//')
          echo "app_version=$VERSION" >> $GITHUB_OUTPUT
          
          # プッシュ通知のみの場合は、展開・コミットをスキップして終了
          if [[ "${{ github.event.inputs.run_mode }}" == "push_notification_only" ]]; then
            echo "app_updated=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ZIPを解凍してリポジトリを展開
          unzip -o "$TARGET_ZIP" -d ./
          
          # GitHubにコミット
          cd ..
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Auto deploy from $TARGET_ZIP [skip ci]"
            git push
            echo "app_updated=true" >> $GITHUB_OUTPUT
          else
            echo "app_updated=false" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Remote Sync
        # Push時、または手動で full_sync か site_sync_only を選択した時のみ実行
        if: |
          github.event_name == 'push' ||
          github.event.inputs.run_mode == 'full_sync' ||
          github.event.inputs.run_mode == 'site_sync_only'
        run: |
          # GitHub CDN の反映待ち
          # push 時、または run_mode が 'full_sync' の場合のみ待機
          if [[ "${{ github.event_name }}" == "push" || "${{ github.event.inputs.run_mode }}" == "full_sync" ]]; then
            echo "Waiting 120 seconds for GitHub to reflect changes..."
            sleep 120
          fi

          # 強制更新オプションの判定
          OPT=""
          if [ "${{ github.event.inputs.force_update }}" == "true" ]; then
            OPT="?update=1"
          fi

          echo "Triggering sync with option: $OPT"

          CURL_OPTS=(
            -s 
            -u "${{ secrets.SYNC_USER }}:${{ secrets.SYNC_PASS }}" 
            -H "X-GitHub-Token: ${{ secrets.GITHUB_TOKEN }}"
          )

          # 各拠点を叩く
          curl "${CURL_OPTS[@]}" "https://macs.xii.jp/acfinder/.sync.acfinder.php$OPT"
          curl "${CURL_OPTS[@]}" "https://macs.kabe.info/acfinder/.sync.acfinder.php$OPT"
          curl "${CURL_OPTS[@]}" "https://noyaku.ebb.jp/acfinder/.sync.acfinder.php$OPT"
          curl "${CURL_OPTS[@]}" "https://macs.coresv.net/acfinder/.sync.acfinder.php$OPT"

  push-notification:
    needs: sync-and-notify
    # 成功かつアプリが更新された場合に通知を実行
    if: always() && (needs.sync-and-notify.result == 'success') && (needs.sync-and-notify.outputs.app_updated == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Send Web Push
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_CONTACT_EMAIL: ${{ secrets.VAPID_CONTACT_EMAIL }}
          # Vercel KV へのアクセス用
          KV_REST_API_URL: ${{ secrets.KV_REST_API_URL }}
          KV_REST_API_TOKEN: ${{ secrets.KV_REST_API_TOKEN }}
          APP_VERSION: ${{ needs.sync-and-notify.outputs.app_version }}
        run: |
          npm install web-push @vercel/kv
          node -e '
            const { createClient } = require("@vercel/kv");
            const webpush = require("web-push");
            
            async function run() {
              const kv = createClient({
                url: process.env.KV_REST_API_URL,
                token: process.env.KV_REST_API_TOKEN,
              });

              const subject = process.env.VAPID_CONTACT_EMAIL.startsWith("http") ? process.env.VAPID_CONTACT_EMAIL : `mailto:${process.env.VAPID_CONTACT_EMAIL}`;
              
              webpush.setVapidDetails(subject, process.env.VAPID_PUBLIC_KEY, process.env.VAPID_PRIVATE_KEY);
              
              const keys = await kv.keys("*");
              const subs = await Promise.all(keys.map(k => kv.get(k)));
              
              const payload = JSON.stringify({
                title: "ACFinder App Update",
                body: "アプリ本体が更新されました (" + process.env.APP_VERSION + ")",
                tag: "app-update",
                type: "app",
                data: { type: "app", version: process.env.APP_VERSION }
              });

              await Promise.all(subs.map(sub => 
                webpush.sendNotification(sub, payload).catch(err => console.error("Push Error:", err))
              ));
            }
            run();
          '
