name: MACS-labo Site Deploy (Manual)

on:
  # 手動実行のみに制限
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. コードをチェックアウト
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Vercel CLI をインストール
      - name: Install Vercel CLI
        run: npm install -g vercel

      # 3. 公式コマンドで直接プレビューデプロイを実行（--scope や --prod は不要）
      - name: Deploy to Vercel (Preview)
        run: |
          url="$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})"
          vercel alias --token=${{ secrets.VERCEL_TOKEN }} set "$url" macs-git-dev-macs-labo.vercel.app
