name: MACS-labo Site Deploy (Manual)

on:
  # 手動実行のみに制限
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. コードをチェックアウト
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Vercel CLI をインストール
      - name: Install Vercel CLI
        run: npm install -g vercel

      # 3. 公式コマンドで本番デプロイを実行
      - name: Deploy to Vercel (Production)
        run: vercel deploy --prod --yes --token=${{ secrets.VERCEL_TOKEN }} --scope=macs-labo
