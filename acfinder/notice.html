<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACFinderBE 更新通知詳細</title>
<link rel="stylesheet" href="common.css">
<style>
	body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
	.container { max-width: 500px; margin: 0 auto; background: var(--bg-color-header); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); }
	h1 { font-size: 1.2rem; margin-top: 0; color: var(--text-color-dark); border-bottom: 2px solid var(--accent-color); padding-bottom: 5px; }
	.info-item { margin: 15px 0; }
	.label { font-weight: bold; font-size: 0.9rem; color: var(--text-color); }
	.value { font-size: 1.1rem; }
	.btn-sync { display: block; width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; margin-top: 20px; }
	.btn-sync:disabled { background: #ccc; }
	.status { margin-top: 10px; font-size: 0.85rem; text-align: center; }
</style>
</head>
<body>
	<div class="container">
		<h1>データベース更新情報</h1>
		<div id="content">
			<div class="info-item">
				<div class="label">更新内容</div>
				<div id="body" class="value">読み込み中...</div>
			</div>
			<div id="file-info" class="info-item" style="display:none;">
				<div class="label">対象ファイル</div>
				<div id="fileName" class="value"></div>
			</div>
			<div id="update-info" class="info-item" style="display:none;">
				<div class="label">更新日</div>
				<div id="lastUpdate" class="value"></div>
			</div>
		</div>

		<button id="sync-btn" class="btn-sync">バックグラウンドでダウンロードを開始</button>
		<div id="status" class="status"></div>
	</div>

	<script>
		// テーマの適用
		const theme = localStorage.getItem('theme') || 'light';
		document.documentElement.setAttribute('data-theme', theme);

		// URLパラメータからデータを取得
		const params = new URLSearchParams(window.location.search);
		const p = params.get('p');
		if (p) {
			try {
				const data = JSON.parse(decodeURIComponent(escape(atob(p))));
				document.getElementById('body').textContent = data.body || '更新があります。';
				
				if (data.fileName) {
					document.getElementById('file-info').style.display = 'block';
					document.getElementById('fileName').textContent = data.fileName;
				}
				if (data.LastUpdate) {
					document.getElementById('update-info').style.display = 'block';
					document.getElementById('lastUpdate').textContent = data.LastUpdate;
				}
			} catch (e) {
				console.error('Failed to parse payload', e);
			}
		}

		// Sync 登録処理
		document.getElementById('sync-btn').addEventListener('click', async () => {
			const btn = document.getElementById('sync-btn');
			const status = document.getElementById('status');
			
			if (!('serviceWorker' in navigator) || !('SyncManager' in window)) {
				status.textContent = 'お使いのブラウザはバックグラウンド同期に対応していません。';
				return;
			}

			try {
				btn.disabled = true;
				status.textContent = '同期リクエストを送信中...';
				const registration = await navigator.serviceWorker.ready;
				await registration.sync.register('download-db-update');
				status.textContent = 'ダウンロードを予約しました。通信状況が良い時に自動で実行されます。この画面を閉じても大丈夫です。';
			} catch (err) {
				console.error(err);
				status.textContent = '登録に失敗しました。';
				btn.disabled = false;
			}
		});
	</script>
</body>
</html>
