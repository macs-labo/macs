<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="initFn" content="initPaRec">
<title>防除記録</title>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<!-- usagelimit ライブラリ / 防除計画(DT)タブ・防除記録(Moblie)タブ用成分使用回数内訳判定 -->
<script type="text/javascript" src="./pestplan.js"></script>
<link rel="stylesheet" type="text/css" href="./pestplan.css" />
<style>
/* ファイルバー設定 */
.filebar {	
	display: flex;
	align-items: center;
	margin-bottom: 10px;
}
.filebar h3 {
	display: flex;
	flex: 1;
	font-size: 14px;
	font-weight: normal;
	line-height: 1rem;
	color: var(--text-color-dark);
	padding: 4px 0.5rem;
	background-color: var(--bg-color-header);
	border: none;
	margin-bottom: 0;
}
.filebar .icon {
	width: 24px;
	height: 24px;
}
.filebar .icon:hover {
	color: var(--icon-color);
	background-color: var(--bg-color);
	outline: none;
}

/* Date Picker */
.date-picker {
	position:relative;
	width:100%;
	display:flex;
	align-items:center;
	justify-content:center;
	cursor:pointer;
}
.date-picker label {
	display: block;
	width: 100%;
	padding: 4px 2px;
	z-index: 2; /* input(z-index:1)より上に配置してクリックを確実に受け取る */
	position: relative;
	cursor: pointer;
	text-align: center;
}
.date-picker input {
	position:absolute;
	top: 0;
	left:0;
	width:100%;
	height:100%;
	opacity:0;
	z-index:1;
	font-size: 16px; /* iOSの自動ズーム防止 */
}

/* 標準テーブル形式（水平ヘッダー用） */
.std-data-table {
	width: 100%;
	border-collapse: collapse;
	border-spacing: 0;
	background-color: var(--bg-color);
	border: 1px solid var(--border-color-strong);
	line-height: 1.1;
	margin-bottom: 10px;
}
.std-data-table th:not(:last-child), .std-data-table td:not(:last-child) {
	font-size: 13px;
	/* line-height: 1.2; */
	padding: 3px;
	border-right: 1px solid var(--border-color-ht-common);
}
.std-data-table td {
	border-top:  1px solid var(--border-color-ht-common);
}
.std-data-table th {
	font-weight: bold;
	color: var(--text-color-dark);
	background-color: var(--bg-color-ht-header);
	height: 19px;
	text-align: center;
	white-space: nowrap;
}
.std-data-table td {
	color: var(--text-color);
	text-align: left;
}
div.row-data-table {
	margin-bottom: 10px;
}
.row-data-table .actions, .std-data-table .actions {
	display: flex;
	gap: 3px;
	white-space: nowrap;
	align-items: center;
}
.row-data-table .center, .std-data-table .center {
 text-align: center;
}
td .svg_button {
	width: 22px;
	height: 22px;
	cursor: pointer;
	vertical-align: middle;
	margin: 0;
	color: var(--text-color);
  position: relative; /* z-indexを効かせるため */
  z-index: 11000;      /* タップエリアより大きくする */
  pointer-events: auto; /* 自身のクリックイベントを優先し、背面への透過を防ぐ */
}
.row-title {
	font-size: 13px;
	font-weight: bold;
	line-height: 1.2;
	/* text-shadow: var(--bolder); */
	color: var(--text-color-dark);
	text-align: left;
	padding: 3px 5px;
	background-color: var(--bg-color-ht-header);
	border: 1px solid var(--border-color-strong);
	border-bottom: none;
	margin-top: 2px; /* 各カードを隙間なくくっ付けるなら -1px */
	white-space: nowrap;
	overflow-x: auto;
}
.row-title span {
	font-size: 12px;
	font-weight: normal;
}
.row-data-table .even-row, .std-data-table .even-row {
	background-color: var(--bg-color-even-row);
}
tr.missing-row {
	text-decoration: line-through;
	background-color: rgb(from var(--border-color-ht-common) r g b / 0.5);
}
.missing-row td small,
.missing-row td {
	color: var(--border-color-strong);
}
td small {
	font-size: 11px;
	color: var(--text-color-light);
}
td em {
	font-style: normal;
	font-weight: bold;
	color: var(--text-color-warn, red);
}

.clickable { cursor: pointer; }

/* 作物ツリーロック */
#planCropTree.locked {
	pointer-events: none;
	opacity: 0.6;
}

/* 復元キャッシュ選択ダイアログ（index.html の showThemeSelection と同系スタイル） */
#recCacheDialog {
	max-width: min(100%, 512px);
	width: 100%;
	padding: 0;
}
#recCacheDialog .menu-list {
	overflow-y: auto;
}
#recCacheDialog .menu-item {
	height: min-content;
	overflow-x: auto;
	overflow-y: hidden;
	white-space: nowrap;
}
/* 操作対象の選択ハイライト（チェックマークとは別表示。背景のみで示す） */
#recCacheDialog .menu-item.selected {
	background-color: var(--bg-color-icon-hover);
}
/* 現在表示キャッシュのチェックマーク（選択操作では付け替えない専用クラス） */
#recCacheDialog .menu-item.is-current {
	position: relative;
}
#recCacheDialog .menu-item.is-current::after {
	content: '';
	position: absolute;
	right: 15px;
	top: 50%;
	transform: translateY(-50%);
	width: 16px;
	height: 16px;
	background-color: var(--text-color-dark);
	-webkit-mask: var(--svg-checkmark) no-repeat center;
	mask: var(--svg-checkmark) no-repeat center;
	pointer-events: none;
}
#recCacheDialog .rec-cache-empty {
	padding: 20px;
	text-align: center;
	font-size: 13px;
}
#recCacheDialog form .rec-cache-buttons {
	display: flex;
	gap: 8px;
}
#recCacheDialog form .rec-cache-buttons button {
	min-width: 3.5em;
}
#recCacheDialog form .rec-cache-buttons button:disabled {
	opacity: 0.4;
	cursor: not-allowed;
}
</style>
</head>
<body>
<!-- 【防除記録タブ】 -->
<div class="tab-container">
	<!-- ステップバー -->
	<div class="step-bar no-swipe">
		<div class="prev-step" onclick="stepMove('prev')">◀</div>
		<div class="step-item active" onclick="stepJump(0)">1</div>
		<div class="step-item" onclick="stepJump(1)">2</div>
		<div class="step-item" onclick="stepJump(2)">3</div>
		<div class="step-item" onclick="stepJump(3)">4</div>
		<div class="next-step" onclick="stepMove('next')">▶</div>
	</div>

	<!-- 内部Swiper -->
	<div class="swiper plan-swiper">
		<div class="swiper-wrapper">

			<!-- ① 作物選択 -->
			<div class="swiper-slide no-swipe">
				<div class="step-fixed">
					<div class="filebar">
						<h3>防除計画／防除記録読込</h3>
						<svg id="btnRestoreRec" class="icon disabled" onclick="restoreRecData()">
							<title>自動保存データ読込</title>
							<use href="icons.svg?v=3#restore"></use>
						</svg>
						<svg class="icon" onclick="openFileApi()">
							<title>防除計画/防除記録ファイル読込</title>
							<use href="icons.svg?v=3#folder-open"></use>
						</svg>
						<input type="file" id="fallbackInput" accept=".json" class="hidden" onchange="openFileInput(event)">
					</div>
					<div id="planCropTree" class="flex-wrapper"></div>
				</div>
			</div>

			<!-- ② 農薬選択 -->
			<div class="swiper-slide no-swipe">
				<h2 id="planHead2"></h2>
				<div class="step-fixed">
					<div id="planChemWrapper" class="flex-wrapper"></div>
				</div>
			</div>

			<!-- ③ 記録画面 -->
			<div class="swiper-slide">
				<h2 id="planHead3" class="no-swipe"></h2>
				<div class="step-scrollable">
					<div class="filebar">
						<h3>防除記録保存</h3>
						<svg id="btnRowDelete" class="icon disabled" onclick="deleteMissingRows()">
							<title>登録が見つからない薬剤を一括削除</title>
							<use href="icons.svg?v=3#row-delete"></use>
						</svg>
						<svg id="btnSaveRec" class="icon" onclick="saveRecFile()">
							<title>防除記録を上書き保存</title>
							<use href="icons.svg?v=3#save"></use>
						</svg>
						<svg id="btnSaveRecAs" class="icon" onclick="saveRecFile(false)">
							<title>防除記録を名前を付けて保存</title>
							<use href="icons.svg?v=3#save-as"></use>
						</svg>
					</div>
					<div id="planRecordWrapper" class="flex-wrapper"></div>
				</div>
			</div>

			<!-- ④ 詳細表示 -->
			<div class="swiper-slide">
				<h2 id="planHead4" class="no-swipe"></h2>
				<div class="step-scrollable">
					<div id="planDetailWrapper" class="flex-wrapper"></div>
				</div>
			</div>

		</div>
	</div>
</div>
<script>
var planCropManager, planChemManager;
var planList = [];
var stages = {};
var dbUpdateText = '';
// 読み込んだ、または一度保存したファイルハンドル及びファイル名を保持する変数
var currentFileName = '';
var currentFileHandle = null;
// 防除記録タブの Swiper（初期化前に要素の .swiper を参照しないよう保持する）
var planSwiperInstance = null;
// step.1 作物ツリーの初期化完了 Promise（復元時の待ち合わせに使う）
var planCropReady = Promise.resolve();
// 使用予定薬剤表で .missing-row になった行の planList インデックス
var missingPlanIndexes = [];
// 集計（tsushoLimit）が取得できたか。未取得（SQL失敗・作物未選択など）の場合は全行が missing 扱いに
// なるため、削除ボタンは有効化しない（誤って全件削除するのを防ぐ）
var hasTsushoLimitResult = false;

function initPaRec() {
	// 薬剤マネージャ初期化
	planChemManager = new ChemListManager('#planChemWrapper', (selectedChemValue) => {
		console.log(selectedChemValue);
		const planSwiper = document.querySelector('.plan-swiper').swiper;
		if (selectedChemValue) {
			// Step 2 で選択された薬剤をリストに追加
			// selectedChemValue は "tusho;kjiki;hoho;kaisu" 形式の文字列
			const [tsusho, jiki, hoho, kaisu] = selectedChemValue.split(';');
			const chemObject = {
				yakuzai: tsusho,
				jiki: jiki,
				hoho: hoho,
				kaisu: kaisu,
				// 手動追加時にも防除時期の列が表示されるように初期値を設定
				timingMonth: '',
				timingPeriod: '',
				timing: '',
			};
			planList.push(chemObject);
			// Step 3 を解放して表示
			updateStepBar(planSwiper, Math.max(planSwiper.maxReachedStep, 2));
			setPlanRecord();
		}
	});
	planChemManager.init({ title: '薬剤選択', showCategory: true });

	planDetailManager = new ChemDetailManager('#planDetailWrapper');
	planDetailManager.init();

	// 防除記録タブ step.1 作成
	setupPlanCrop();

	// 内部Swiperの初期化
	planSwiperInstance = createZoomableSwiper('.plan-swiper', mainSwiper, function() {
		updateStepBar(this);
	});

	// 前回の未保存データがあれば復元ボタンを表示（自動復元はしない）
	if (getRecCacheEntries().length > 0) showRestoreButton();

	// Swiperインスタンスを返す
	return planSwiperInstance;
}

// Helper function to format YYYY-MM-DD to YY-MM-DD
function formatToYYMMDD(dateString) {
	if (!dateString || dateString.length !== 10) return '';
	return dateString.substring(2); // "YYYY-MM-DD" -> "YY-MM-DD"
}
// カレンダーピッカーの初期値（日付ならそのまま、○月×旬なら今年の中日）を取得
function getTimingPickerDefault(timing, periodStr) {
	if (timing && /^\d{4}-\d{2}-\d{2}$/.test(timing)) return timing;
	const match = String(periodStr || timing || '').match(/^(\d{1,2})月(上旬|中旬|下旬)$/);
	if (match) {
		const y = new Date().getFullYear();
		const m = String(match[1]).padStart(2, '0');
		const d = match[2] === '上旬' ? '05' : match[2] === '中旬' ? '15' : '25';
		return `${y}-${m}-${d}`;
	}
	return '';
}


// 防除記録タブ step.1: 作物選択
function setupPlanCrop() {
	try {
		const cropTreeSql = `
			select idsaku, class, toroku, sakumotsu, shukakubui, betsumei,
			':'||replace(n_concat('、', strconv(sakumotsu, 'k'), strconv(betsumei, 'k'), ruby), '、', ':')||':' as keywords
			from m_sakumotsu where sakumotsu not like '%除く%';
		`;
		planCropManager = new CropTreeManager('#planCropTree', onCheckPlanCrop, false);
		// init の完了 Promise を保持（復元時にチェック状態を復元するための待ち合わせに使う）
		planCropReady = planCropManager.init(cropTreeSql, { showSearchMethod: false }) || Promise.resolve();
		return planCropReady;
	} catch (e) {
		console.error("作物ツリーの生成に失敗しました:", e);
		planCropReady = Promise.resolve();
	}
}

function onCheckPlanCrop(selectedCrops) {
	const planSwiper = document.querySelector('.plan-swiper').swiper;
	if (selectedCrops.length > 0) {
		// 作物が選択されたら step.2 を解放し、薬剤リスト作成へ進む
		const nextMax = planList.length > 0 ? 2 : 1;
		updateStepBar(planSwiper, Math.max(planSwiper.maxReachedStep, nextMax));
		setupPlanChem();
	} else {
		// 選択がなければリセット
		planSwiper.slideTo(0);
		updateStepBar(planSwiper, 0);
	}
}

// 防除記録タブ step.2: 薬剤選択
async function setupPlanChem(moveThis = true) {
	const title = document.querySelector('#planHead2');
	const crops = planCropManager.checkedCrops.map(item => item.sakumotsu);
	title.innerHTML = crops.join(' & ');
	const cropQuery = makeCropCondition(crops);

	// step.2 作成
	await waiting(true, '薬剤リストを作成中...');
	try {
		const sql =`
			drop view if exists tv_tsushoTekiyo2;
			create temp view tv_tsushoTekiyo2 as
			select distinct
				tsusho, shurui, zaikei, seizaidokusei, sakumotsu, byochu, mokuteki, baisu, ekiryo,
				ifnull(jiki, '-') as jiki, ifnull(kaisu, '-') as kaisu, ifnull(hoho, '-') as hoho,
				iif(basho = '-', null, basho) as basho, iif(jikan = '-', null, jikan) as jikan, iif(ondo ='-', null, ondo) as ondo,
				iif(dojo = '-', null, dojo) as dojo, iif(chitai ='-', null, chitai) as chitai, tekiyaku,
				seibun1, yuko1, ifnull(kaisu1, '-') as kaisu1, mid1, keito1, rem1, risk1,
				seibun2, yuko2, ifnull(kaisu2, '-') as kaisu2, mid2, keito2, rem2, risk2,
				seibun3, yuko3, ifnull(kaisu3, '-') as kaisu3, mid3, keito3, rem3, risk3,
				seibun4, yuko4, ifnull(kaisu4, '-') as kaisu4, mid4, keito4, rem4, risk4,
				seibun5, yuko5, ifnull(kaisu5, '-') as kaisu5, mid5, keito5, rem5, risk5,
				kongo, seizaiyoto, seizaikoka, seizaiojas
			from t_tekiyo left join tsushoruby as t using (tsusho) left join m_sakumotsu as s using (sakumotsu) left join m_byochu as b using (byochu)
			order by t.ruby, s.ruby, idbyochu;
			drop table if exists t_planTekiyo;
			create temp table t_planTekiyo as select * from tv_tsushoTekiyo2 where sakumotsu in (${cropQuery});
			with t_tekiyo1 as (select tsusho, sakumotsu, jiki, kaisu, baisu, hoho, baisu, gn_concat(',', n_concat('&', byochu, mokuteki)) as byochu,
				n_concat('|', ifnull(seizaidokusei, '-'), shurui, n_concat('/', keito1, mid1, rem1), n_concat('/', keito2, mid2, rem2), n_concat('/', keito3, mid3, rem3), n_concat('/', keito4, mid4, rem4), n_concat('/', keito5, mid5, rem5), seizaiyoto, seizaikoka, ruby) as keywords
				from t_planTekiyo left join tsushoruby using(tsusho) group by tsusho, sakumotsu, jiki, kaisu, baisu, hoho order by ruby
			),
			t_tekiyo2 as (select tsusho, jiki, hoho, kaisu, gn_concat('|', n_concat('≫', sakumotsu, baisu, byochu)) as tekiyo, keywords from t_tekiyo1 group by tsusho, jiki, kaisu, hoho)
			select * from t_tekiyo2;
		`;
		console.log('${cropQuery} = {', cropQuery, '}');
		const sqlResult = db.exec(sql);

		if (sqlResult?.[0]?.values) {
			const chems = sqlResult[0].values.map(row => ({
				tsusho: row[0],
				jiki: row[1],
				hoho: row[2],
				kaisu: row[3],
				tekiyo: row[4],
				keywords: row[5]
			}));
			let group = '';
			const renderer = (row) => {
				const tsusho = row.tsusho;
				const info = row.keywords;
				let groupItem = '';
				if (group !== tsusho) {
					group = tsusho;
					groupItem = `
						<div class="checkListItem" data-group data-info="${tsusho}|${info}" title="${tsusho}"><em>${tsusho}</em> ${info}</div>
					`;
				}
				const jiki = row.jiki === '-' ? '時期無指定' : row.jiki;
				const hoho = row.hoho === '-' ? '方法無指定' : row.hoho;
				const kaisu = row.kaisu === '-' ? '回数無指定' : row.kaisu;
				const kubun = `${jiki};${hoho};${kaisu}`;
				const id = `${tsusho};${kubun}`;
				const tekiyo =`${kubun}|${row.tekiyo}`;
				//const bango = row.bango;
				//const name = `${bango} ${row.meisho}`;
				return `${groupItem}
					<div class="checkListItem" data-info="${tsusho}|${info}|${kubun}" title="${tsusho}">
						<input type="radio" name="chemSelect" value="${id}" id="${id}"><label for="${id}">${tekiyo}</label>
					</div>
				`;
			};
			await planChemManager.update(chems, renderer);
		} else {
			planChemManager.update([]);
		}
	} catch (e) {
		console.error(e);
	} finally {
		waiting(false);
	}

	// step.2 を開放して必要があれば移動
	const planSwiper = document.querySelector('.plan-swiper').swiper;
	if (planSwiper.maxReachedStep < 1) updateStepBar(planSwiper, 1);
	if (moveThis) planSwiper.slideTo(1);

}

// 現在時刻を YYYYMMDD-hhmmss にフォーマット
function formatDateTime(opt = '') {
	const now = new Date();
	let format = { year: 'numeric' };
	switch (opt.toLowerCase()) {
		case 'year': break;
		case 'date': format = {...format, month: '2-digit', day: '2-digit'}; break;
		default: format = {...format, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
	}
	const formattedDate = now.toLocaleString('ja-JP', format);
	return formattedDate.replace(/[\/:]/g, '').replace(' ', '-');
}

// ファイル名のプレフィックス（作物名）を取得
function getFilenamePrefix(id = 'planHead2') {
	const el = document.getElementById(id);
	if (el && el.textContent) {
		return el.textContent.replace(/[,/\?%*:|"<>]/g, '_') + '_';
	}
	return '';
}

// 防除記録をJSON形式に変換
function convRecToJson() {
	if (planList.length === 0) return '';
	const crops = planCropManager.checkedCrops.map(item => item.sakumotsu);

	const recData = {
		dataset: dbUpdateText,
		sakumotsu: makeCropCondition(crops),
		crops: planCropManager.checkedCrops,
		plan: planList,
		titleText: document.getElementById('planHead2').textContent
	};

	return JSON.stringify(recData, null, 2);
}

// 防除記録を localStorage に保存（システムダウン対策のキャッシュ＝復元候補）
// item 名は fileName 付き（'pestRecData:<fileName>'）で複数キャッシュできる
var REC_CACHE_PREFIX = 'pestRecData:';
var REC_CACHE_LEGACY_KEY = 'pestRecData';
var recCacheList = []; // 復元ダイアログ表示用の一覧（getRecCacheEntries の結果を保持）
var selectedRecCacheIndex = -1; // ダイアログで選択中のキャッシュ（一覧のインデックス。操作対象）
var dialogCurrentRecCacheKey = ''; // ダイアログ表示中の現在表示キャッシュ（チェックマーク用。選択では移動しない）

function getRecCacheKey(fileName) {
	return REC_CACHE_PREFIX + (fileName || '(無題)');
}

// 現在編集中データに対応するキャッシュキー。fileName が未確定の場合は
// タイトル（作物名）で代用して、無題同士の上書きをできるだけ避ける
function getCurrentRecCacheKey() {
	const titleText = document.getElementById('planHead2')?.textContent?.trim() || '';
	const cacheFileName = currentFileName || titleText || '(無題)';
	return getRecCacheKey(cacheFileName);
}

// 旧形式（単一キー 'pestRecData'）のキャッシュを新形式へ移行する（一度だけ）
function migrateLegacyRecCache() {
	let raw = null;
	try {
		raw = localStorage.getItem(REC_CACHE_LEGACY_KEY);
	} catch (err) {
		return;
	}
	if (!raw) return;
	// すでに新形式があれば旧キーは単に除去、なければ移行する
	try {
		const appData = JSON.parse(raw);
		let moveKey = null;
		if (appData && appData.planData) {
			let titleText = '';
			try {
				const planData = typeof appData.planData === 'string' ? JSON.parse(appData.planData) : appData.planData;
				titleText = planData?.titleText || '';
			} catch (e) {}
			const cacheFileName = appData.fileName || titleText || '(無題)';
			moveKey = getRecCacheKey(cacheFileName);
			if (!localStorage.getItem(moveKey)) {
				if (!appData.savedAt) appData.savedAt = Date.now();
				try {
					localStorage.setItem(moveKey, JSON.stringify(appData));
				} catch (e) {}
			}
		}
	} catch (err) {
		console.error('旧キャッシュの移行に失敗しました:', err);
	} finally {
		try {
			localStorage.removeItem(REC_CACHE_LEGACY_KEY);
		} catch (e) {}
	}
}

// 全キャッシュを取得（item 名から FileName を取り出した一覧用）
function getRecCacheEntries() {
	migrateLegacyRecCache();
	const entries = [];
	for (let i = 0; i < localStorage.length; i++) {
		const key = localStorage.key(i);
		if (!key || !key.startsWith(REC_CACHE_PREFIX)) continue;
		const fileName = key.substring(REC_CACHE_PREFIX.length) || '(無題)';
		let appData = null;
		let broken = false;
		try {
			appData = JSON.parse(localStorage.getItem(key));
		} catch (err) {
			broken = true;
		}
		if (!appData || !appData.planData) broken = true;
		let planCount = 0;
		let titleText = '';
		if (!broken) {
			try {
				const planData = typeof appData.planData === 'string' ? JSON.parse(appData.planData) : appData.planData;
				const loadedPlan = planData?.plan || planData?.planList || [];
				planCount = Array.isArray(loadedPlan) ? loadedPlan.length : 0;
				titleText = planData?.titleText || '';
			} catch (err) {
				broken = true;
			}
		}
		entries.push({
			key: key,
			fileName: fileName,
			appData: appData,
			broken: broken,
			planCount: planCount,
			titleText: titleText,
			savedAt: appData?.savedAt || 0
		});
	}
	// 新しいものから表示
	entries.sort((a, b) => (b.savedAt - a.savedAt) || a.fileName.localeCompare(b.fileName, 'ja'));
	return entries;
}

function saveRecDataToCache() {
	const planJson = convRecToJson();
	if (!planJson) return;
	const appData = {
		planData: planJson,
		fileName: currentFileName,
		savedAt: Date.now()
	};
	try {
		localStorage.setItem(getCurrentRecCacheKey(), JSON.stringify(appData));
	} catch (err) {
		console.error('キャッシュの保存に失敗しました:', err);
	}
	showRestoreButton(); // 編集/保存でキャッシュを更新したので復元ボタンを復活させる
}

// 復元ボタンの表示/非表示
function showRestoreButton() {
	document.getElementById('btnRestoreRec')?.classList.remove('disabled');
}

function hideRestoreButton() {
	document.getElementById('btnRestoreRec')?.classList.add('disabled');
}

// 復元候補（キャッシュ）を破棄する
// cacheKey 省略時は現在編集中データに対応するキャッシュのみ破棄する（他ファイルのキャッシュは残す）
function discardRecCache(cacheKey) {
	const key = cacheKey || getCurrentRecCacheKey();
	try {
		localStorage.removeItem(key);
	} catch (err) {}
	// 対応するファイルハンドルキャッシュも連動削除
	deleteCachedFileHandle(key);
	if (getRecCacheEntries().length === 0) hideRestoreButton();
}

// HTMLエスケープ（キャッシュ一覧の fileName 表示用）
function escapeRecCacheHtml(text) {
	return String(text ?? '')
		.replace(/&/g, '&amp;')
		.replace(/</g, '&lt;')
		.replace(/>/g, '&gt;')
		.replace(/"/g, '&quot;');
}

// 前回の未保存データを復元（自動復元はせず、ユーザ操作でのみ実行する）
// キャッシュ一覧ダイアログから使用するキャッシュを選択する
async function restoreRecData() {
	const entries = getRecCacheEntries();
	if (entries.length === 0) {
		showToast('復元できるデータがありません。');
		return;
	}
	openRecCacheDialog(entries);
}

// キャッシュ一覧ダイアログを開く（showThemeSelection と同様にリスト＋下部ボタン）
function openRecCacheDialog(entries) {
	recCacheList = entries || getRecCacheEntries();
	// ダイアログ表示中の現在表示キャッシュを固定（選択操作では移動しない）
	dialogCurrentRecCacheKey = getCurrentRecCacheKey();
	// デフォルト選択：現在使用しているキャッシュがあればそれ、無ければ先頭
	selectedRecCacheIndex = recCacheList.findIndex(entry => entry.key === dialogCurrentRecCacheKey);
	if (selectedRecCacheIndex < 0 && recCacheList.length > 0) selectedRecCacheIndex = 0;
	let dialog = document.getElementById('recCacheDialog');
	if (!dialog) {
		dialog = document.createElement('dialog');
		dialog.id = 'recCacheDialog';
		dialog.className = 'menu-dialog';
		document.body.appendChild(dialog);
		dialog.addEventListener('click', (e) => { if (e.target === dialog) dialog.close(); });
	}
	renderRecCacheDialog();
	if (typeof dialog.showModal === 'function') {
		if (!dialog.open) dialog.showModal();
	} else {
		dialog.setAttribute('open', '');
	}
}

// ダイアログ内のキャッシュ一覧を描画する
function renderRecCacheDialog() {
	const dialog = document.getElementById('recCacheDialog');
	if (!dialog) return;
	const prevSelectedKey = recCacheList[selectedRecCacheIndex]?.key || '';
	recCacheList = getRecCacheEntries();
	// 再描画後も操作対象の選択のみ維持する。
	// チェックマーク（dialogCurrentRecCacheKey）はダイアログ表示中は固定し、選択では移動しない
	let keepIndex = recCacheList.findIndex(entry => entry.key === prevSelectedKey);
	if (keepIndex < 0 && recCacheList.length > 0) keepIndex = 0;
	selectedRecCacheIndex = recCacheList.length > 0 ? keepIndex : -1;

	let listHtml = '';
	if (recCacheList.length === 0) {
		listHtml = '<div class="rec-cache-empty">復元できるデータがありません。</div>';
	} else {
		listHtml = recCacheList.map((entry, i) => {
			const savedText = entry.savedAt ? new Date(entry.savedAt).toLocaleString('ja-JP') : '-';
			const meta = entry.broken
				? 'データが壊れています（削除できます）'
				: `${escapeRecCacheHtml(savedText)} ／ ${escapeRecCacheHtml(entry.titleText || '')} ／ ${entry.planCount}件`;
			// is-current＝現在表示キャッシュのチェックマーク（固定）。selected＝操作対象の選択（背景のみ）
			const itemClass = `menu-item${entry.key === dialogCurrentRecCacheKey ? ' is-current' : ''}${i === selectedRecCacheIndex ? ' selected' : ''}`;
			return `<li class="${itemClass}" onclick="selectRecCache(${i})">` +
				`<div><div class="menu-item-name">${escapeRecCacheHtml(basename(entry.fileName))}</div>` +
				`<div class="menu-item-title">${meta}</div></div>` +
			`</li>`;
		}).join('');
	}

	dialog.innerHTML =
		`<div class="menu-container"><ul class="menu-list">${listHtml}</ul></div>` +
		`<form method="dialog"><span>自動保存データ選択</span>` +
			`<div class="rec-cache-buttons">` +
				`<button type="button" id="recCacheRestoreBtn" onclick="restoreSelectedRecCache()">読込</button>` +
				`<button type="button" id="recCacheDeleteBtn" onclick="deleteSelectedRecCache()">削除</button>` +
				`<button>閉じる</button>` +
			`</div>` +
		`</form>`;
	updateRecCacheButtons();
}

// 一覧の選択を切り替える（チェックマークは移動しない。操作対象の選択のみ変更）
function selectRecCache(index) {
	if (index < 0 || index >= recCacheList.length) return;
	selectedRecCacheIndex = index;
	document.querySelectorAll('#recCacheDialog .menu-item').forEach((el, i) => {
		el.classList.toggle('selected', i === selectedRecCacheIndex);
	});
	updateRecCacheButtons();
}

// 下部ボタンの有効／無効を更新する
function updateRecCacheButtons() {
	const entry = recCacheList[selectedRecCacheIndex];
	const restoreBtn = document.getElementById('recCacheRestoreBtn');
	const deleteBtn = document.getElementById('recCacheDeleteBtn');
	if (restoreBtn) restoreBtn.disabled = !entry || entry.broken;
	if (deleteBtn) deleteBtn.disabled = !entry;
}

// 選択中のキャッシュを取得する
function getSelectedRecCacheEntry() {
	if (selectedRecCacheIndex < 0 || selectedRecCacheIndex >= recCacheList.length) return null;
	const fresh = getRecCacheEntries();
	const selectedKey = recCacheList[selectedRecCacheIndex]?.key;
	const found = fresh.findIndex(entry => entry.key === selectedKey);
	if (found >= 0) {
		selectedRecCacheIndex = found;
		return fresh[found];
	}
	return recCacheList[selectedRecCacheIndex] || null;
}

// 選択中のキャッシュを復元する（復元時はそのままダイアログを抜ける）
async function restoreSelectedRecCache() {
	const entry = getSelectedRecCacheEntry();
	if (!entry) return;
	await restoreRecCacheByIndex(recCacheList.findIndex(item => item.key === entry.key));
}

// 選択中のキャッシュを削除する（ダイアログは維持して管理を続けられる）
function deleteSelectedRecCache() {
	const entry = getSelectedRecCacheEntry();
	if (!entry) return;
	deleteRecCacheByKey(entry.key);
}

// キー指定でキャッシュを削除する
function deleteRecCacheByKey(cacheKey) {
	const entries = getRecCacheEntries();
	const entry = entries.find(item => item.key === cacheKey) || recCacheList.find(item => item.key === cacheKey);
	if (!entry) return;
	if (!confirm(`キャッシュ「${entry.fileName}」を削除しますか？`)) return;
	try {
		localStorage.removeItem(entry.key);
	} catch (err) {}
	// 対応するファイルハンドルキャッシュも連動削除（ハンドルの無限増殖防止）
	deleteCachedFileHandle(entry.key);
	showToast(`キャッシュ「${entry.fileName}」を削除しました。`);
	if (getRecCacheEntries().length === 0) {
		hideRestoreButton();
		document.getElementById('recCacheDialog')?.close();
		return;
	}
	renderRecCacheDialog();
}

// 一覧から選択したキャッシュを復元する
async function restoreRecCacheByIndex(index) {
	const entry = getRecCacheEntries()[index] || recCacheList[index];
	if (!entry) return;
	if (entry.broken) {
		showToast('選択したキャッシュは壊れているため復元できません。');
		return;
	}
	if (planList.length > 0 && !confirm(`現在の防除計画/記録をクリアして、「${entry.fileName}」の未保存データを復元しますか？`)) return;

	let appData = entry.appData;
	if (!appData) {
		try {
			appData = JSON.parse(localStorage.getItem(entry.key));
		} catch (err) {
			console.error('復元データの解析に失敗しました:', err);
			showToast('選択したキャッシュが壊れているため復元できません。');
			discardRecCache(entry.key);
			renderRecCacheDialog();
			return;
		}
	}

	try {
		// planData は JSON 文字列で保存されている（読込系は JSON.parse 済みオブジェクトを渡す仕様のため、ここで parse する）
		const planData = typeof appData.planData === 'string' ? JSON.parse(appData.planData) : appData.planData;
		if (!planData || (!planData.plan && !planData.planList)) throw new Error('Invalid format');
		currentFileName = appData.fileName || '';
		// 対応するファイルハンドルも復元（次回保存を上書きにできる状態にする。許可確認は保存ボタン内で行う）
		currentFileHandle = await getCachedFileHandle(entry.key, currentFileName);
		// 作物ツリーの構築完了を待つ（チェック状態の見た目を復元するため）
		await planCropReady;
		// タブを開いた直後に押された場合に備えてレイアウトを再計算
		planSwiperInstance?.update();
		document.getElementById('recCacheDialog')?.close();
		await loadPlanFromJson(planData);
		// キャッシュは復元後も残す（システムダウン対策として有効なまま。ボタンも表示継続）
	} catch (err) {
		console.error('データの復元に失敗しました:', err);
		showToast('選択した未保存データの復元に失敗しました。');
	}
}

// 一覧から選択したキャッシュを削除する
function deleteRecCacheByIndex(index) {
	const entries = getRecCacheEntries();
	const entry = entries[index] || recCacheList[index];
	if (!entry) return;
	deleteRecCacheByKey(entry.key);
}

// 防除記録をJSON形式で保存
// overwrite のデフォルトは true（省略時 = 上書き保存ボタン）。未指定のまま呼び出すと
// 上書き分支が常に false になってピッカーが毎回表示されるため、必ずデフォルト値を付けること
async function saveRecFile(overwrite = true) {
	if (planList.length === 0) return;

	const saveData = convRecToJson();

	let filename;
	if (currentFileName && currentFileName.includes('防除記録')) {
		filename = currentFileName;
	} else if (currentFileName && currentFileName.includes('防除計画')) {
		filename = currentFileName.replace('防除計画', '防除記録');
	} else {
		const prefix = getFilenamePrefix();
		filename = `${prefix}防除記録_${formatDateTime('date')}.json`;
	}

	if (!isFileSystemAccessSupported) {
		const blob = new Blob([saveData], { type: 'application/json' });
		saveAs(blob, filename);
		saveRecDataToCache();
		return;
	}

	// セッション跨ぎ: メモリ上のハンドルが無ければ、localStorage キャッシュと同一キーで保存したハンドルを復元
	if (overwrite && !currentFileHandle) {
		currentFileHandle = await getCachedFileHandle(getRecCacheKey(filename), filename)
			|| await getCachedFileHandle(getCurrentRecCacheKey(), filename);
	}
	// overwrite = true でファイルハンドルがあり、filename が一致している場合は「上書き」
	if (overwrite && currentFileHandle && currentFileName === filename) {
		try {
			// 復元したハンドルは書き込み許可が失効している場合がある（拒否時は例外にして新規保存へフォールバック）
			if (!(await ensureFileHandleWritePermission(currentFileHandle))) throw new Error('書き込み許可が得られませんでした');
			const writable = await currentFileHandle.createWritable();
			await writable.write(saveData);
			await writable.close();
			showToast('ファイルを上書き保存しました。');
			saveRecDataToCache();
			return;
		} catch (err) {
			console.error('上書き失敗（新規保存に切り替えます）:', err);
		}
	}

	// overwrite = false またはハンドルがない、または filename が不一致、または上書きに失敗した場合は「名前を付けて保存」
	try {
		const fileHandle = await window.showSaveFilePicker({
			suggestedName: filename,
			types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }]
		});
		
		const writable = await fileHandle.createWritable();
		await writable.write(saveData);
		await writable.close();

		const oldCacheKey = getCurrentRecCacheKey();
		currentFileHandle = fileHandle; // 次回上書き用にハンドルを記憶
		currentFileName = fileHandle.name;
		saveRecDataToCache();
		// ハンドルも localStorage キャッシュと同一キーで永続化（次回セッションの上書き保存用）
		await putCachedFileHandle(getCurrentRecCacheKey(), fileHandle, currentFileName);
		// 無題（fileName 未確定時のタイトル代用キー）の孤児キャッシュが残らないよう除去（ハンドルも連動削除）
		try {
			const newCacheKey = getCurrentRecCacheKey();
			if (oldCacheKey !== newCacheKey) {
				localStorage.removeItem(oldCacheKey);
				deleteCachedFileHandle(oldCacheKey);
			}
		} catch (e) {}
		if (getRecCacheEntries().length > 0) showRestoreButton();
		alert('新しくファイルを保存しました。次回からは自動で上書きされます。');
		
	} catch (err) {
		if (err.name !== 'AbortError') {
			showToast('ファイルの保存に失敗しました。');
		}
	}

}

// 防除記録 行操作関数
// 使用予定薬剤表に .missing-row があり、かつ集計結果が取得できている場合のみ #btnRowDelete を有効化

	const hasMissingRows = !!document.querySelector('#planRecordWrapper tr.missing-row');
	document.getElementById('btnRowDelete')?.classList.toggle('disabled', !(hasTsushoLimitResult && hasMissingRows));
	if (!hasMissingRows) dbUpdateText = currentDbUpdate; // tr.missing-row がなくなったら、現在の DB 登録更新日を設定
}

// 使用予定薬剤表の .missing-row（現在の農薬登録情報で登録が見つからない薬剤）を計画から一括削除
async function deleteMissingRows() {
	if (!hasTsushoLimitResult) return; // 集計が取得できていない場合は削除しない（安全弁）
	if (missingPlanIndexes.length === 0) return;
	if (!confirm(`現在の農薬登録情報で登録が見つからない薬剤を ${missingPlanIndexes.length} 件削除します。よろしいですか？`)) return;

	// インデックスの大きい方から削除して位置ズレを防ぐ
	[...missingPlanIndexes].sort((a, b) => b - a).forEach(i => planList.splice(i, 1));
	missingPlanIndexes = [];
	await setPlanRecord(); // 表・薬剤別使用回数・キャッシュ・保存内容すべてに反映される
	updateRowDeleteButton();
}

async function deletePlanRow(index) {
	planList.splice(index, 1);
	await setPlanRecord();
	updateRowDeleteButton(); // 削除で .missing-row が無くなった場合は無効化する
}

function movePlanRow(index, direction) {

		[planList[index - 1], planList[index]] = [planList[index], planList[index - 1]];
	} else if (direction === 'down' && index < planList.length - 1) {

async function openFileApi() {
	if (planList.length > 0 && !confirm('現在の防除計画/記録をクリアして、新しいファイルを読み込みますか？？')) {
		return;
	}

	if (!isFileSystemAccessSupported) {
		document.getElementById('fallbackInput')?.click();
		return;
	}

	try {
		//let fileHandle = null;
		const [fileHandle] = await window.showOpenFilePicker({
			types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }],
			multiple: false
		});
		const file = await fileHandle.getFile();
		currentFileHandle = fileHandle; // ハンドルを記憶
		loadPlanFile(file); // データ読み込み共通関数へ
		// ハンドルも localStorage キャッシュと同一キーで永続化（次回セッションの上書き保存用）
		await putCachedFileHandle(getRecCacheKey(currentFileName), fileHandle, currentFileName);
	} catch (err) {
		if (err.name !== 'AbortError') {
			console.error(err);
			showToast('ファイルの読み込みに失敗しました。');

// fallbackInput の場合の読込
function openFileInput(event) {
	const file = event.target.files[0];
	event.target.value = ''; // 連続で同じファイルを選んでもイベントが走るように値をリセット
	if (!file) return;
	currentFileHandle = null;
	loadPlanFile(file);
}

function loadPlanFile(file) {
	if (!file) return;
	currentFileName = file.name; // ファイル名を保存
	console.log('filename: ', currentFileName);
	const reader = new FileReader();
	reader.onload = async function(e) {
		try {
			const data = JSON.parse(e.target.result);
			loadPlanFromJson(data);
		} catch (err) {
			console.error(err);
			showToast('ファイルの読み込みに失敗しました。有効なJSONファイルを選択してください。');
			currentFileHandle = null;
			currentFileName = '';
		}
	};
	reader.readAsText(file);
}

// JSONファイルを読み込んで計画を復元
async function loadPlanFromJson(data) {
	try {
		const loadedPlan = data.plan || data.planList;
		if (!loadedPlan) throw new Error('Invalid format');

		// 前回のDB登録更新日取得
		dbUpdateText = data.dataset;
		// 選択作物の初期化と再設定
		planCropManager.checkedCrops = data.crops || [];
		planList = loadedPlan;

		stages = data.stages || {};
		delete stages['収穫開始'];
		console.log('stages:', stages)

		// 作物ツリーのチェック状態を視覚的に復元
		if (typeof planCropManager.syncCheckState === 'function') {
			planCropManager.syncCheckState();
		}
		// step.2 のリストを現在の作物に合わせて更新
		await setupPlanChem(false);
		// step.3 を作成
		await setPlanRecord();
		//saveRecDataToCache();
		const fileType = currentFileName.includes('防除記録') ? '防除記録' : '防除計画';
		showToast(fileType + 'を読み込みました。');

		const planSwiper = document.querySelector('.plan-swiper').swiper;
		// step.3 を開放して移動
		updateStepBar(planSwiper, 2);
		planSwiper.slideTo(2); 
	} catch (err) {
		console.error(err);
		showToast('ファイルの読み込みに失敗しました。有効なJSONファイルを選択してください。');
		currentFileHandle = null;
		currentFileName = '';
	}
}

}

function dispHoho(hoho) {
	return hoho.length > 15 ? hoho.slice(0, 15) + '…' : hoho;
}

function makeTimingCell(month, period, date, onchange, idPrefix, idSuffix) {
	const periodStr = (month && period) ? `${month}月${period}` : '';
	const isDate = date && /^\d{4}-\d{2}-\d{2}$/.test(date);
	// Display YY-MM-DD format, but keep full date in input value and data-fulldate
	const displayVal = isDate ? formatToYYMMDD(date) : periodStr || '';
	const defaultDate = getTimingPickerDefault(date, periodStr);
	const uniqueId = idPrefix + Math.random().toString(36).substring(2, 7) + '_' + Date.now() + '_' + idSuffix;

	return `<td>` +
		`<div class="date-picker" onclick="openTimingCalendar(this.querySelector('label'), defaultValue, onchange)">` +
			`<label for="${uniqueId}" data-fulldate="${isDate ? date : ''}">${displayVal}</label>` +
			`<input type="date" id="${uniqueId}" value="${defaultDate}" hidden>` +
			//`onchange="${onchange}" ` +
			//`onclick="event.stopPropagation()">` +
		`</div>` +
		`</td>`;
}

// 防除記録タブ step.3: 使用予定薬剤及び使用回数集計表示
async function setPlanRecord() {
	const title = document.querySelector('#planHead3');
	title.innerHTML = "使用予定薬剤及び使用回数集計";

	const wrapper = document.querySelector('#planRecordWrapper');
	wrapper.innerHTML = '';

	document.querySelector('#planCropTree')?.classList.toggle('locked', planList.length > 0);

	if (planList.length > 0) {
		saveRecDataToCache();
	} else {
		discardRecCache(); // 計画が空になったので復元候補も破棄する
		updateRowDeleteButton(); // 表が無いので削除ボタンも無効化する
		const planSwiper = document.querySelector('.plan-swiper').swiper;
		//planSwiper.maxReachedStep = 1; // Step 2 まで解放
		updateStepBar(planSwiper, 1);
		planSwiper.slideTo(1);
		return;
	}

	await waiting(true, '使用回数集計表を作成中...');
	try {
		// 選択された薬剤の成分を集計
		const showTiming = planList.length > 0; // planListに項目があれば常に防除時期列を表示
		
		const tsushoCounts = {};
		planList.forEach(item => {
			const getTsusho = (val) => (val && val.includes(' ')) ? val.split(' ').slice(1).join(' ') : val;
			const tsusho = typeof item === 'string' ? getTsusho(item) : (item.yakuzai ? getTsusho(item.yakuzai) : item.meisho);
			tsushoCounts[tsusho] = (tsushoCounts[tsusho] || 0) + 1; // Use tsusho for counting
		});
		const uniqueKeys = Object.keys(tsushoCounts).map(item => `'${item}'`).join(',');
		const crops = planCropManager.checkedCrops.map(item => item.sakumotsu);

		let res = null;
		if (crops.length > 0 && uniqueKeys) {
			const sql = `
				select yuko1 as seibun, max(kaisu1) as seibunkaisu, mid1 as rac, iif(instr(mid1, 'F:'), replace(rem1, 'FRAC系統名: ', ''), keito1) as keito, risk1 as rem, jiki, hoho, kaisu, tsusho FROM t_planTekiyo WHERE tsusho IN (${uniqueKeys}) AND yuko1 IS NOT NULL group by tsusho, jiki, hoho, kaisu
				UNION select yuko2 as seibun, max(kaisu2) as seibunkaisu, mid2 as rac, iif(instr(mid2, 'F:'), replace(rem2, 'FRAC系統名: ', ''), keito2) as keito, risk2 as rem, jiki, hoho, kaisu, tsusho FROM t_planTekiyo WHERE tsusho IN (${uniqueKeys}) AND yuko2 IS NOT NULL group by tsusho, jiki, hoho, kaisu
				UNION select yuko3 as seibun, max(kaisu3) as seibunkaisu, mid3 as rac, iif(instr(mid3, 'F:'), replace(rem3, 'FRAC系統名: ', ''), keito3) as keito, risk3 as rem, jiki, hoho, kaisu, tsusho FROM t_planTekiyo WHERE tsusho IN (${uniqueKeys}) AND yuko3 IS NOT NULL group by tsusho, jiki, hoho, kaisu
				UNION select yuko4 as seibun, max(kaisu4) as seibunkaisu, mid4 as rac, iif(instr(mid4, 'F:'), replace(rem4, 'FRAC系統名: ', ''), keito4) as keito, risk4 as rem, jiki, hoho, kaisu, tsusho FROM t_planTekiyo WHERE tsusho IN (${uniqueKeys}) AND yuko4 IS NOT NULL group by tsusho, jiki, hoho, kaisu
				UNION select yuko5 as seibun, max(kaisu5) as seibunkaisu, mid5 as rac, iif(instr(mid5, 'F:'), replace(rem5, 'FRAC系統名: ', ''), keito5) as keito, risk5 as rem, jiki, hoho, kaisu, tsusho FROM t_planTekiyo WHERE tsusho IN (${uniqueKeys}) AND yuko5 IS NOT NULL group by tsusho, jiki, hoho, kaisu;
			`;
			console.log('${uniqueKeys} = {', uniqueKeys, '}');
			res = db.exec(sql);
		}

		// 集計結果が取得できたか（未取得時は全行 missing 扱いになるので削除ボタンの安全弁にする）
		hasTsushoLimitResult = !!res?.[0];
		const tsushoLimit = new Map();
		const tsushoSeibun = {};
		const seibunInfo = {};
		const seibunRac = {};
		missingPlanIndexes = []; // 描画ごとに再計算
		if (hasTsushoLimitResult) {
			res[0].values.forEach(row => {
				const [seibun, seibunkaisu, rac, keito, rem, jiki, hoho, kaisu, tsusho] = row;
				const keyTsusho = JSON.stringify([tsusho, jiki, hoho, kaisu]);
				const matches = kaisu.match(/(?<=^|:)\d+/g);
				let limit = 0;
				if (matches) {
					matches.forEach(d => limit += parseInt(d, 10));
				} else {
					limit = 999;
				}
				const dataTsusho = {
					tsusho: tsusho,
					jiki: jiki,
					hoho: hoho,
					kaisu: kaisu,
					limit: limit
				};
				tsushoLimit.set(keyTsusho, dataTsusho);
				if (!tsushoSeibun[tsusho]) tsushoSeibun[tsusho] = [];
				if (!tsushoSeibun[tsusho].includes(seibun)) tsushoSeibun[tsusho].push(seibun);
				const dataSeibun = {
						rac: rac || '-',
						keito: keito,
						rem: rem,
						kaisu: seibunkaisu,
						limit: parseInt(seibunkaisu.match(/^\d+/)?.[0] || '999', 10)
				};
				if (!seibunInfo[seibun] || seibunInfo[seibun].limit < dataSeibun.limit) {
					seibunInfo[seibun] = dataSeibun;
				}
				if (rac) {
					if (!seibunRac[seibun]) seibunRac[seibun] = [];
					if (!seibunRac[seibun].includes(rac)) seibunRac[seibun].push(rac);
				}
			});
		}

		const div = document.createElement('div');
		div.className = 'step-zoom-target';
		let tableHeaders = `<th>操作</th><th>No</th>`;
		if (showTiming) {
			tableHeaders += `<th>防除時期</th>`;
		}
		tableHeaders += `<th>薬剤名</th>`;

		let html = `<h3>使用予定薬剤</h3><table class="std-data-table"><thead><tr>${tableHeaders}</tr></thead><tbody>`;
		planList.forEach((chem, i) => {
			const isFirst = i === 0;
			const isLast = i === planList.length - 1;
			const { yakuzai, jiki, hoho, kaisu } = chem;
			const timingCell = showTiming ? makeTimingCell(chem.timingMonth, chem.timingPeriod, chem.timing, `updatePlanDate(${i}, this.value)`, 'mob_plan_date_', i) : '';

			// 現在の農薬登録情報で登録が見つからない薬剤（.missing-row と同じ条件でインデックスを収集）
			const keyTsusho = JSON.stringify([yakuzai, jiki, hoho, kaisu]);
			const isMissing = !tsushoLimit.get(keyTsusho);
			if (isMissing) missingPlanIndexes.push(i);

			html += `<tr class="${i % 2 === 0 ? '' : 'even-row'}${isMissing ? ' missing-row' : ''}">` +
				`<td><div class="actions">` +
				`<svg class="svg_button" onclick="deletePlanRow(${i})"><use href="icons.svg?v=3#trash-x"></use></svg>` +
				`<svg class="svg_button ${isFirst ? 'disabled' : ''}" onclick="movePlanRow(${i}, 'up')"><use href="icons.svg?v=3#arrow-up"></use></svg>` +
				`<svg class="svg_button ${isLast ? 'disabled' : ''}" onclick="movePlanRow(${i}, 'down')"><use href="icons.svg?v=3#arrow-down"></use></svg></div></td>` +
				`<td class="center">${i+1}</td>` +
				timingCell +
				`<td class="clickable" onclick="setPlanDetail('${yakuzai}')">${yakuzai}<br><small>${dispJiki(jiki)}/${dispHoho(hoho)}</small></td></tr>`;
		});
		html += '</tbody></table>';

		const stageKeys = Object.keys(stages);
		if (stageKeys.length > 0) {
			html += '<h3>生育ステージ</h3><table class="std-data-table"><thead><tr><th>ステージ</th><th>時期<th></tr></thead><tbody>';
			stageKeys.forEach((key, i) => {
				const {month, period, date } = stages[key];
				const timingCell = makeTimingCell(month, period, date, `updateStageDate('${key}', this)`, 'mob_stage_date_', i);
				html += `<tr class="${i % 2 === 0 ? '' : 'even-row'}"><td>${key}</td>${timingCell}</tr>`;
			});
			html += '</dbody></table>';
		}

		const yakuzaiCounts = new Map();
		const seibunCounts= {};
		const racCounts = {};
		planList.forEach(chem => {
			const { yakuzai, jiki, hoho, kaisu } = chem;
			const keyTsusho = JSON.stringify([yakuzai, jiki, hoho, kaisu]);
			const dataLimit = tsushoLimit.get(keyTsusho);
			const isMissing = !dataLimit;
			if (isMissing) return;
			const dataTsusho = yakuzaiCounts.get(keyTsusho) || {
				tsusho: yakuzai,
				jiki: jiki,
				hoho: hoho,
				kaisu: kaisu,
				count: 0,
				isMissing: isMissing,
				limit: isMissing ? '×' : dataLimit.limit
			};
			dataTsusho.count += 1;
			yakuzaiCounts.set(keyTsusho, dataTsusho);
			const seibuns = tsushoSeibun[yakuzai];
			seibuns.forEach(seibun => {
				const { rac, keito, rem, kaisu, limit } = seibunInfo[seibun];
				const dataSeibun = seibunCounts[seibun] || {
					count: 0,
					rac: rac,
					keito: keito,
					rem: rem,
					kaisu: kaisu,
					limit: limit,
					tsusho: []
				};
				dataSeibun.count += 1;
				if (!dataSeibun.tsusho.includes(yakuzai)) dataSeibun.tsusho.push(yakuzai);
				seibunCounts[seibun] = dataSeibun;
				seibunRac[seibun].forEach(rac => {
					const dataRac = racCounts[rac] || {
						count: 0,
						rem: rem,
						keito: [],
						seibun: [],
						tsusho: []
					}
					dataRac.count += 1;
					if (!dataRac.keito.includes(keito)) dataRac.keito.push(keito);
					if (!dataRac.seibun.includes(seibun)) dataRac.seibun.push(seibun);
					if (!dataRac.tsusho.includes(yakuzai)) dataRac.tsusho.push(yakuzai);
					racCounts[rac] = dataRac;
				});
			});
		});

		const yakuzaiRows = Array.from(yakuzaiCounts.values())
			.sort((a, b) => a.tsusho.localeCompare(b.tsusho, 'ja'))
			.map((o, i) => {
				let classList = [];
				if (o.isMissing) classList.push('missing-row');
				if (i % 2 === 1) classList.push('even-row');
				const count = o.count > o.limit ? `<em>${o.count}</em>` : o.count;
				return `<tr class="${classList.join(' ')}"><td>${o.tsusho}<br><small>${dispJiki(o.jiki)}/${dispHoho(o.hoho)}</small></td><td>${count}</td><td>${o.kaisu}</td></tr>`;
			})
			.join('');

		if (yakuzaiRows) {
			html += '<h3>薬剤別使用回数</h3>';
			html += `<table class="std-data-table"><thead><tr><th>薬剤名</th><th>回数</th><th>上限</th></tr></thead><tbody>${yakuzaiRows}</tbody></table>`;
		}

		const seibunRows = Object.entries(seibunCounts).map(([name, data]) => ({
			name,
			rac: data.rac,
			keito: data.keito,
			rem: data.rem,
			count: data.count,
			kaisu: data.kaisu,
			limit: data.limit,
			tsusho: data.tsusho
		})).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'ja'));

		if (seibunRows.length > 0) {
			html += '<h3>成分別使用回数</h3>';
			seibunRows.forEach(data => {
				const { name, rac, keito, rem, count, kaisu, limit, tsusho } = data;
				html += `<div class="row-title">${name}</div>` +
					`<table class="row-data-table"><tbody>` +
					`<tr><th>回数</th><td>${count > limit ? '<em>' + count + '</em>' : count}</td></tr>` +
					`<tr class="even-row"><th>上限</th><td>${kaisu}</td></tr>` +
					`<tr><th>薬剤</th><td>${tsusho.join(',')}</td></tr>` +
					`<tr class="even-row"><th>RAC</th><td>${rac}${keito ? ' / ' + keito : ''}${rem ? '<br><small>' + rem + '</small>' : ''}</td></tr>` +
					`</tbody></table>`;
			});
		}
		html += '<div class="row-data-table"></div>';

		const racRows = Object.entries(racCounts).map(([name, data]) => ({
			name,
			count: data.count,
			rem: data.rem,
			keito: data.keito,
			seibun: data.seibun,
			tsusho: data.tsusho
		})).sort((a, b) => a.name.localeCompare(b.name, 'ja'));

		if (racRows.length > 0) {
			html += '<h3>RAC別使用回数</h3>';
			racRows.forEach(data => {
				const { name, count, rem, keito, seibun, tsusho } = data;
				html += `<div class="row-title">${name}<span>${keito.join(',')}</span></div>` +
					`<table class="row-data-table"><tbody>` +
					`<tr><th>回数</th><td>${count}${rem ? '<small>　' + rem + '</small>' : ''}</td></tr>` +
					`<tr class="even-row"><th>成分</th><td>${seibun.join(',')}</td></tr>` +
					`<tr><th>薬剤</th><td>${tsusho.join(',')}</td></tr>` +
					`</tbody></table>`;
			});
		}

		div.innerHTML = html;
		wrapper.appendChild(div);
	} catch (e) {
		console.error(e);
	} finally {
		waiting(false);
	}

	// 表の再描画に合わせて削除ボタンの有効/無効を更新
	updateRowDeleteButton();

	if (!isFileSystemAccessSupported) {
		document.querySelector('#btnSaveRec title').textContent = '防除記録を保存';
		document.querySelector('#btnSaveRecAs')?.classList.add('hidden');
	}
	const planSwiper = document.querySelector('.plan-swiper').swiper;
	if (planSwiper.activeIndex !== 2) planSwiper.slideTo(2);

}

// 防除記録タブ step.4: 薬剤適用詳細表示
async function setPlanDetail(chem) {
	const title = document.querySelector('#planHead4');
	title.textContent = chem;

	const planSwiper = document.querySelector('.plan-swiper').swiper;
	// Step 4 を解放・作成
	updateStepBar(planSwiper, 3);
	await planDetailManager.update(chem, 't_planTekiyo');
	if (planSwiper.activeIndex !== 3) planSwiper.slideTo(3);
}
</script>
