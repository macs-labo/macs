<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="initFn" content="initPaRec">
<title>防除記録</title>
<style>
/* ファイルバー設定 */
.filebar {	
	display: flex;
	align-items: center;
	margin-bottom: 10px;
}
.filebar h3 {
	display: flex;
	flex: 1;
	font-size: 14px;
	font-weight: normal;
	line-height: 1rem;
	color: var(--text-color-dark);
	padding: 4px 0.5rem;
	background-color: var(--bg-color-header);
	border: none;
	margin-bottom: 0;
}
.filebar .icon {
	width: 24px;
	height: 24px;
}
.filebar .icon:hover {
	color: var(--icon-color);
	background-color: var(--bg-color);
	outline: none;
}

/* 標準テーブル形式（水平ヘッダー用） */
.std-data-table {
	width: 100%;
	border-collapse: collapse;
	border-spacing: 0;
	background-color: var(--bg-color);
	border: 1px solid var(--border-color-strong);
	line-height: 1.2;
}
.std-data-table th, .std-data-table td {
	font-size: 13px;
	padding: 3px 5px;
	border: 1px solid var(--border-color-ht-common);
	border-bottom: none;
}
.std-data-table th:first-child, .std-data-table td:first-child {
	border-left: none;
}
.std-data-table th:last-child, .std-data-table td:last-child {
	border-right: none;
}
.std-data-table th {
	font-weight: bold;
	color: var(--text-color-dark);
	background-color: var(--bg-color-ht-header);
	text-align: center;
	white-space: nowrap;
}
.std-data-table td {
	color: var(--text-color);
	text-align: left;
}
.row-data-table .actions, .std-data-table .actions {
	width: 1px;
	white-space: nowrap;
	padding: 2px 4px;
	text-align: center;
	vertical-align: middle;
}
td .svg_button {
	width: 22px;
	height: 22px;
	cursor: pointer;
	vertical-align: middle;
	margin: 0 4px;
	color: var(--text-color);
}
.row-title {
	font-size: 13px;
	font-weight: bold;
	line-height: 1.2;
	/* text-shadow: var(--bolder); */
	color: var(--text-color-dark);
	text-align: left;
	padding: 3px 5px;
	background-color: var(--bg-color-ht-header);
	border: 1px solid var(--border-color-strong);
	border-bottom: none;
	margin-top: 2px; /* 各カードを隙間なくくっ付けるなら -1px */
	white-space: nowrap;
	overflow-x: auto;
}
.row-data-table .even-row, .std-data-table .even-row {
	background-color: var(--bg-color-even-row);
}
</style>
</head>
<body>
<!-- 【防除記録タブ】 -->
<div class="tab-container">
	<!-- ステップバー -->
	<div class="step-bar no-swipe">
		<div class="prev-step" onclick="stepMove('prev')">◀</div>
		<div class="step-item active" onclick="stepJump(0)">1</div>
		<div class="step-item" onclick="stepJump(1)">2</div>
		<div class="step-item" onclick="stepJump(2)">3</div>
		<div class="next-step" onclick="stepMove('next')">▶</div>
	</div>

	<!-- 内部Swiper -->
	<div class="swiper plan-swiper">
		<div class="swiper-wrapper">

			<!-- ① 作物選択 -->
			<div class="swiper-slide no-swipe">
				<div class="step-fixed">
					<div class="filebar">
						<h3>防除計画／防除記録読込</h3>
						<svg class="icon" onclick="document.getElementById('planJsonInput').click()">
							<title>JSONファイル読込</title>
							<use href="icons.svg?v=3#folder-open"></use>
						</svg>
						<input type="file" id="planJsonInput" accept=".json" class="hidden" onchange="loadPlanFromJson(event)">
					</div>
					<div id="planCropTree" class="flex-wrapper"></div>
				</div>
			</div>

			<!-- ② 農薬選択 -->
			<div class="swiper-slide no-swipe">
				<h2 id="planHead2"></h2>
				<div class="step-fixed">
					<div id="planChemWrapper" class="flex-wrapper"></div>
				</div>
			</div>

			<!-- ③ 記録画面 -->
			<div class="swiper-slide">
				<h2 id="planHead3" class="no-swipe"></h2>
				<div class="step-scrollable">
					<div class="filebar">
						<h3>防除記録保存</h3>
						<svg class="icon" onclick="savePlanAsJson()">
							<title>JSON形式で保存</title>
							<use href="icons.svg?v=3#floppy-disk"></use>
						</svg>
					</div>
					<div id="planDetailWrapper" class="flex-wrapper"></div>
				</div>
			</div>
		</div>
	</div>
</div>
<script>
var planCropManager, planChemManager;
var planList = [];
var currentLoadedFileName = '';

function initPaRec() {
	// 薬剤マネージャ初期化
	planChemManager = new ChemListManager('#planChemWrapper', (chem) => {
		const planSwiper = document.querySelector('.plan-swiper').swiper;
		if (chem) {
			// Step 2 で選択された薬剤をリストに追加
			planList.push(chem);
			// Step 3 を解放して表示
			updateStepBar(planSwiper, Math.max(planSwiper.maxReachedStep, 2));
			setupPlanDetail();
		}
	});
	planChemManager.init({ title: '薬剤選択', showCategory: true });

	// 防除記録タブ step.1 作成
	setupPlanCrop();

	// 内部Swiperの初期化と返却
	const planSwiperInstance = createZoomableSwiper('.plan-swiper', mainSwiper, function() {
		updateStepBar(this);
	});
	return planSwiperInstance; // Swiperインスタンスを返す
}

// 防除記録タブ step.1: 作物選択
function setupPlanCrop() {
	try {
		const cropTreeSql = `
			select idsaku, class, toroku, sakumotsu, shukakubui, betsumei,
			':'||replace(n_concat('、', strconv(sakumotsu, 'k'), strconv(betsumei, 'k'), ruby), '、', ':')||':' as keywords
			from m_sakumotsu where sakumotsu not like '%除く%';
		`;
		planCropManager = new CropTreeManager('#planCropTree', onCheckPlanCrop, false);
		planCropManager.init(cropTreeSql, { showSearchMethod: false });
	} catch (e) {
		console.error("作物ツリーの生成に失敗しました:", e);
	}
}

function onCheckPlanCrop(selectedCrops) {
	const planSwiper = document.querySelector('.plan-swiper').swiper;
	if (selectedCrops.length > 0) {
		// 作物が選択されたら step.2 を解放し、薬剤リスト作成へ進む
		const nextMax = planList.length > 0 ? 2 : 1;
		updateStepBar(planSwiper, Math.max(planSwiper.maxReachedStep, nextMax));
		setupPlanChem();
	} else {
		// 選択がなければリセット
		planSwiper.slideTo(0);
		updateStepBar(planSwiper, 0);
	}
}

// 防除記録タブ step.2: 薬剤選択
async function setupPlanChem() {
	const title = document.querySelector('#planHead2');
	const crops = planCropManager.checkedCrops.map(item => item.sakumotsu);
	title.innerHTML = crops.join(' & ');

	await waiting(true, '薬剤リストを作成中...');
	const planSwiper = document.querySelector('.plan-swiper').swiper;

	const executeUpdate = async () => {
		try {
			await new Promise(resolve => setTimeout(resolve, 0));
			// 薬剤タブの step.2 と同様に、登録番号と名称を取得し通称でグループ化
			const sql =`
				with t_tekiyo1 as (select tsusho, ruby, sakumotsu,
					gn_concat(',', iif(ifnull(jiki,'-')='-','時期無指定',jiki)) as jiki, gn_concat(',', iif(ifnull(kaisu,'-')='-','回数無指定',kaisu)) as kaisu, gn_concat(',', iif(ifnull(hoho,'-')='-','方法無指定',hoho)) as hoho,
					n_concat('|', ifnull(seizaidokusei, '-'), shurui, n_concat('/', keito1, mid1, rem1), n_concat('/', keito2, mid2, rem2), n_concat('/', keito3, mid3, rem3), n_concat('/', keito4, mid4, rem4), n_concat('/', keito5, mid5, rem5), seizaiyoto, seizaikoka, ruby) as keywords
					from tv_tsushoTekiyo left join tsushoruby using(tsusho) where sakumotsu in (${makeCropCondition(crops)}) group by tsusho, sakumotsu
				),
				t_tekiyo2 as (select tsusho, gn_concat('|', format('%s:%s/%s/%s', sakumotsu, jiki, kaisu, hoho)) as tekiyo, keywords from t_tekiyo1 group by tsusho order by ruby)
				select * from t_tekiyo2;
			`;
			const sqlResult = db.exec(sql);
			await new Promise(resolve => setTimeout(resolve, 0));

			if (sqlResult?.[0]?.values) {
				const chems = sqlResult[0].values.map(row => ({
					tsusho: row[0],
					tekiyo: row[1],
					keywords: row[2]
				}));
				planChemManager.update(chems);
				updateStepBar(planSwiper, 1);
			} else {
				planChemManager.update([]);
			}
		} catch (e) {
			console.error(e);
		} finally {
			const nextMax = planList.length > 0 ? 2 : 1;
			updateStepBar(planSwiper, Math.max(planSwiper.maxReachedStep, nextMax));
			waiting(false);
		}
	};

	// まだ step.2 (index 1) にいない場合はスライド移動
	if (planSwiper.activeIndex === 1) {
		setTimeout(executeUpdate, 50);
	} else {
		// スライド移動完了後にリスト作成を実行
		planSwiper.once('transitionEnd', () => { setTimeout(executeUpdate, 50); });
		planSwiper.slideTo(1);
	}
}

// 現在時刻を YYYYMMDD-hhmmss にフォーマット
function formatDateTime() {
	const now = new Date();
	const formattedDate = now.toLocaleString('ja-JP', {
		year: 'numeric',
		month: '2-digit',
		day: '2-digit',
		hour: '2-digit',
		minute: '2-digit',
		second: '2-digit',
		hour12: false
	});
	return formattedDate.replace(/[\/:]/g, '').replace(' ', '-');
}

// ファイル名のプレフィックス（作物名）を取得
function getFilenamePrefix(id = 'planHead2') {
	const el = document.getElementById(id);
	if (el && el.textContent) {
		return el.textContent.replace(/[,/\?%*:|"<>]/g, '_') + '_';
	}
	return '';
}

// 防除記録をJSON形式で保存
async function savePlanAsJson() {
	if (planList.length === 0) return;
	const saveData = {
		crops: planCropManager.checkedCrops,
		planList: planList,
		titleText: document.getElementById('planHead2').textContent
	};

	const jsonString = JSON.stringify(saveData, null, 2);
	const blob = new Blob([jsonString], { type: 'application/json' });

	let filename;
	if (currentLoadedFileName && currentLoadedFileName.includes('防除記録')) {
		filename = currentLoadedFileName;
	} else if (currentLoadedFileName && currentLoadedFileName.includes('防除計画')) {
		filename = currentLoadedFileName.replace('防除計画', '防除記録');
	} else {
		const prefix = getFilenamePrefix();
		filename = `${prefix}防除記録_${formatDateTime()}.json`;
	}

	const a = document.createElement('a');
	a.href = URL.createObjectURL(blob);
	a.download = filename;
	a.click();
	setTimeout(() => URL.revokeObjectURL(a.href), 1000);
	showToast(`'${filename}' を保存しました。`);
	// document.activeElement.blur();
}

// 防除記録 行操作関数
function deletePlanRow(index) {
	planList.splice(index, 1);
	setupPlanDetail();
}

function movePlanRow(index, direction) {
	if (direction === 'up' && index > 0) {
		[planList[index - 1], planList[index]] = [planList[index], planList[index - 1]];
	} else if (direction === 'down' && index < planList.length - 1) {
		[planList[index], planList[index + 1]] = [planList[index + 1], planList[index]];
	}
	setupPlanDetail();
}

// JSONファイルを読み込んで計画を復元
async function loadPlanFromJson(event) {
	const file = event.target.files[0];
	if (!file) return;

	const reader = new FileReader();
	reader.onload = async function(e) {
		try {
			const data = JSON.parse(e.target.result);
			if (!data.crops || !data.planList) throw new Error('Invalid format');

			if (planList.length > 0 && !confirm('現在の計画をクリアして読み込みますか？')) {
				event.target.value = '';
				return;
			}

			currentLoadedFileName = file.name;

			// 選択作物の初期化と再設定
			planCropManager.checkedCrops = [];
			planCropManager.checkedCrops = data.crops;

			// 作物ツリーのチェック状態を視覚的に復元
			if (typeof planCropManager.syncCheckState === 'function') {
				planCropManager.syncCheckState();
			}

			// Step 2 のリスト（依頼文の「病害虫リスト」相当）を現在の作物に合わせて更新
			await setupPlanChem();

			planList = data.planList;

			const planSwiper = document.querySelector('.plan-swiper').swiper;
			planSwiper.maxReachedStep = 2; // Step 3 まで解放
			setupPlanDetail();
			updateStepBar(planSwiper);
			planSwiper.slideTo(2); // 選択済み薬剤一覧(Step 3)へジャンプ
			alert('防除計画を読み込みました。');
		} catch (err) {
			console.error(err);
			alert('ファイルの読み込みに失敗しました。有効なJSONファイルを選択してください。');
		}
	};
	reader.readAsText(file);
	event.target.value = '';
}

// 防除記録タブ step.3: リスト追加表示
async function setupPlanDetail() {
	const title = document.querySelector('#planHead3');
	title.innerHTML = "選択済み薬剤一覧";

	const wrapper = document.querySelector('#planDetailWrapper');
	wrapper.innerHTML = '';
	
	if (planList.length === 0) {
		//wrapper.innerHTML = '<p style="padding:10px;">薬剤が選択されていません。</p>';
		const planSwiper = document.querySelector('.plan-swiper').swiper;
		planSwiper.maxReachedStep = 1; // Step 2 まで解放
		planSwiper.slideTo(1);
		return;
	}

	await waiting(true, '使用回数集計表を作成中...');
	try {
		// 選択された薬剤の成分を集計
		const tsushoCounts = {};
		planList.forEach(item => {
			tsushoCounts[item] = (tsushoCounts[item] || 0) + 1;
		});
		const uniqueKeys = Object.keys(tsushoCounts).map(item => `'${item}'`).join(',');
		const crops = planCropManager.checkedCrops.map(item => item.sakumotsu);
		const cropCond = makeCropCondition(crops);
		const sql = `
			select yuko1 as seibun, kaisu1 as kaisu, d_concat('/', mid1, keito1, replace(rem1, 'FRAC系統名: ', '')) as rac, tsusho FROM tv_tsushoTekiyo WHERE tsusho IN (${uniqueKeys}) AND sakumotsu IN (${cropCond}) AND yuko1 IS NOT NULL
			UNION select yuko2 as seibun, kaisu2 as kaisu, d_concat('/', mid2, keito2, replace(rem2, 'FRAC系統名: ', '')) as rac, tsusho FROM tv_tsushoTekiyo WHERE tsusho IN (${uniqueKeys}) AND sakumotsu IN (${cropCond}) AND yuko2 IS NOT NULL
			UNION select yuko3 as seibun, kaisu3 as kaisu, d_concat('/', mid3, keito3, replace(rem3, 'FRAC系統名: ', '')) as rac, tsusho FROM tv_tsushoTekiyo WHERE tsusho IN (${uniqueKeys}) AND sakumotsu IN (${cropCond}) AND yuko3 IS NOT NULL
			UNION select yuko4 as seibun, kaisu4 as kaisu, d_concat('/', mid4, keito4, replace(rem4, 'FRAC系統名: ', '')) as rac, tsusho FROM tv_tsushoTekiyo WHERE tsusho IN (${uniqueKeys}) AND sakumotsu IN (${cropCond}) AND yuko4 IS NOT NULL
			UNION select yuko5 as seibun, kaisu5 as kaisu, d_concat('/', mid5, keito5, replace(rem5, 'FRAC系統名: ', '')) as rac, tsusho FROM tv_tsushoTekiyo WHERE tsusho IN (${uniqueKeys}) AND sakumotsu IN (${cropCond}) AND yuko5 IS NOT NULL
		`;
		console.log(sql);
		const res = db.exec(sql);
		
		const ingredientInfo = {};
		if (res?.[0]) {
			res[0].values.forEach(row => {
				const [seibun, kaisu, rac, tsusho] = row;
				if (!ingredientInfo[seibun]) {
					ingredientInfo[seibun] = {
						count: 0,
						limit: kaisu || '-',
						rac: rac || '-',
					};
				}
				ingredientInfo[seibun].count += tsushoCounts[tsusho];
			});
		}
		const summary = Object.entries(ingredientInfo).map(([name, data]) => ({
			name,
			count: data.count,
			limit: data.limit,
			rac: data.rac
		})).sort((a, b) => b.count - a.count || a.name.localeCompare(b.name, 'ja'));

		const div = document.createElement('div');
		div.className = 'step-zoom-target';
		let html = `
			<div class="row-title">選択薬剤一覧</div>
			<table class="std-data-table"><thead><tr><th class="actions">操作</th><th style="text-align:center">No</th><th>薬剤名</th></tr></thead><tbody>`;
		planList.forEach((chem, i) => {
			const isFirst = i === 0;
			const isLast = i === planList.length - 1;
			const chemName = typeof chem === 'string' ? chem : (chem.yakuzai || chem.meisho || '不明な薬剤');
			html += `<tr class="${i % 2 === 0 ? '' : 'even-row'}">` +
				`<td class="actions">` +
				`<svg class="svg_button" onclick="deletePlanRow(${i})"><use href="icons.svg?v=3#trash-x"></use></svg>` +
				`<svg class="svg_button ${isFirst ? 'disabled' : ''}" onclick="movePlanRow(${i}, 'up')"><use href="icons.svg?v=3#arrow-up"></use></svg>` +
				`<svg class="svg_button ${isLast ? 'disabled' : ''}" onclick="movePlanRow(${i}, 'down')"><use href="icons.svg?v=3#arrow-down"></use></svg></td>` +
				`<th style="text-align:center">${i+1}</th><td>${chemName}</td></tr>`;
		});
		html += '</tbody></table>';

		if (summary.length > 0) {
			html += '<h3 style="margin-top:20px;">成分別使用回数</h3>';
			summary.forEach((data) => {
				html += `<div class="row-title">${data.name}</div>` +
					`<table class="row-data-table"><tbody>` +
					`<tr><th>RAC</th><td>${data.rac}</td></tr>` +
					`<tr class="even-row"><th>使用回数</th><td>${data.count}回</td></tr>` +
					`<tr><th>使用上限</th><td>${data.limit}</td></tr>` +
					`</tbody></table>`;
			});
		}

		html += '<div class="bottom-spacer"></div>';
		div.innerHTML = html;
		wrapper.appendChild(div);
	} catch (e) {
		console.error(e);
	} finally {
		waiting(false);
	}

	const planSwiper = document.querySelector('.plan-swiper').swiper;
	if (planSwiper.activeIndex !== 2) {
		planSwiper.slideTo(2);
	}

}
</script>
</body>
</html>
