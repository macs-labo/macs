<!--	タブ専用の script -->
<script>
let byochuManager;

// 病害虫選択リストと結果リセット
function resetByochuSelection() {
	// テーブルインスタンスを破棄
	tables = resetTables(tables);
	resetCropTree(true);
	const resultTitle = document.getElementById("resultTitle");
	resultTitle.textContent = "";
	resultTitle.classList.add("hidden");
}

// handleByochuSelection のデバウンス用タイマー
let byochuSelectionTimer = null;

function pestCond(selectedNames) {
	if (selectedNames === '') return '';
	const selectedPestCsv = selectedNames.map(item => `'${item}'`).join(',');
	return `
		like_in(':'||concat_ws(':', byochu, mokuteki)||':', (select json_group_array('%:'||byochu||'%') from m_byochu where byochu in (${selectedPestCsv})))
	`;
}

async function handleByochuSelection(selected) {
	const display = document.getElementById("resultTitle");
	if (selected.length > 0) {
		// 連続クリックをまとめるためのデバウンス処理
		clearTimeout(byochuSelectionTimer);
		byochuSelectionTimer = setTimeout(async () => {
			await waiting(true, '病害虫選択を反映中...');
			// UIスレッドを解放してLoading表示を確実にする
			await new Promise(resolve => setTimeout(resolve, 0));

			const selectedNames = selected.map(item => item.byochu);
			display.textContent = `${selectedNames.join(' | ')}`;
			display.classList.remove("hidden");

			// sql 実行
			// tByochu, ttTekiyoByochu 作成
			let sql = `
				DROP TABLE IF EXISTS ttTekiyoByochu;
				CREATE TEMP TABLE ttTekiyoByochu AS
				select * from tv_tsushoTekiyo where tsusho in (select distinct tsusho from t_tekiyo where ${pestCond(selectedNames)});
			`;
			console.log(sql);
			try {
				db.exec(sql);
				// SQL実行後に一度スレッドを解放
				await new Promise(resolve => setTimeout(resolve, 0));

				// 作物ツリーを更新
				await setSakumotsuTree();
				
				// テーブルリセット
				tables = resetTables(tables);

				// 病害虫適用テーブル表示
				let option = {
					caption: `「${selectedNames.join('」「')}」に登録がある薬剤の当該病害虫に対する適用`,
					query: `SELECT * FROM ttTekiyoByochu where ${pestCond(selectedNames)};`
				};
				await executeSQLsetGrid(option);

				// 全適用テーブル表示
				option = {
					caption: `「${selectedNames.join('」「')}」に登録がある薬剤の全適用`,
					query: 'SELECT * FROM ttTekiyoByochu;'
				};
				await executeSQLsetGrid(option);
			} finally {
				await waiting(false);
			}
		}, 100);
	} else {
		// チェックが0になった場合は即時実行
		clearTimeout(byochuSelectionTimer);
		resetByochuSelection();
	}
}

// 作物ツリーのチェック状態が変更されたときに呼び出される関数
async function searchCrop() {
	const display = document.getElementById("resultTitle");
	const selectedNames = byochuManager.checkedPests.map(p => p.byochu);

	if (checkedCrops.length > 0) {
		const crops = checkedCrops.map(item => item.sakumotsu);
		display.textContent = `${selectedNames.join(' | ')} ／ ${crops.join(' & ')}`;
		const expandCropFlags = crops.map(crop => `(${expandCrops(crop)}) as ${normalizeColName(crop)}`).join(', ');
		const cropFlags = crops.map(crop => `max(${normalizeColName(crop)}) as ${normalizeColName(crop)}`).join(', ');
		const cropCte = `
			with t_sakumotsu as (
				select sakumotsu, ${expandCropFlags} from m_sakumotsu left join sakuhojo using(idsaku) where sakumotsu in (${makeCropCondition(crops)})
			)
		`;

		// テーブルリセット
		tables = resetTables(tables);
		// 病害虫適用テーブル表示
		let option = {
			caption: `「${selectedNames.join('」「')}」に登録があり、「${crops.join('」「')}」及びその上位作物群で使用可能な薬剤の当該病害虫に対する適用`,
			query: `
				${cropCte},
				t_tsusho as (select distinct tsusho from ttTekiyoByochu left join t_sakumotsu using(sakumotsu) where (${normalizeColName(crops.join(' and '))}))
				select * from ttTekiyoByochu where tsusho in (select tsusho from t_tsusho) and ${pestCond(selectedNames)};
			`
		};
		await executeSQLsetGrid(option);

		// 全適用テーブル表示
		option = {
			caption: `「${selectedNames.join('」「')}」に登録がある薬剤の「${crops.join('」「')}」及びその上位作物群に対する適用`,
			query: `
				${cropCte}
				select * from ttTekiyoByochu left join t_sakumotsu using(sakumotsu) where (${normalizeColName(crops.join(' and '))});
			`
		};
		await executeSQLsetGrid(option);

	} else {
		// 作物選択がクリアされた場合
		handleByochuSelection(byochuManager.checkedPests);
	}
}

// 作物ツリー作成
async function setSakumotsuTree() {
	// 既存作物ツリー全解除
	clearAllReset();
	// 作物ツリー作成
	sql = `
		with t_idsaku as (select distinct idsaku, 1 as registered from ttTekiyoByochu left join m_sakumotsu using(sakumotsu) where sakumotsu not like '%除く%' order by idsaku),
		t_idlist as (select n_concat(',','"'||substr(idsaku,1,2)||'00000000000000"','"'||substr(idsaku,1,4)||'000000000000"','"'||substr(idsaku,1,6)||'0000000000"','"'||substr(idsaku,1,8)||'00000000"','"'||substr(idsaku,1,12)||'0000"','"'||idsaku||'"') as idlist from t_idsaku)
		select idsaku, class, ifnull(registered, 0) as toroku, sakumotsu, shukakubui, betsumei, ':'||replace(n_concat('、', strconv(sakumotsu, 'k'), strconv(betsumei, 'k'), ruby), '、', ':')||':' as keywords from m_sakumotsu left join t_idsaku using(idsaku) where like_in(idsaku, (select '['||gn_concat(',',idlist)||']' from t_idlist));
	`;
	await makeCropTree('#cropTree', sql, searchCrop);
}

// sql 実行 結果グリッド作成
async function executeSQLsetGrid(option) {
	await waiting(true, 'データベース検索中');
	try {
		// クエリを実行
		console.log(option.query);
		let searchTime = -performance.now();
		const result = db.exec(option.query);
		searchTime += performance.now();
		// 結果を表示
		const table = outputTable('#result', result, { caption: option.caption, hideFooterU20: false });
		if (table) tables.push(table);
	} catch (error) {
		throw error;
	} finally {
		await waiting(false);
	}
}

// DOM読込完了時の初期設定
window.addEventListener('DOMContentLoaded', async function() {
	//データベース読込
	if (db === null) await fetchDB();

	// 病害虫マネージャ初期化
	byochuManager = new PestListManager('#selectPest', (selected) => {
		handleByochuSelection(selected);
	});

	byochuManager.init({
		title: '病害虫名等選択',
		showCategory: true,
		onSearch: async () => {
			const sql = `select idbyochu, byochu, betsumei from m_byochu where byochu not like '%(%' or byochu regexp '菌(\\)|による)' order by idbyochu;`;
			
			await waiting(true, '病害虫名等を検索中...');
			const res = db.exec(sql);
			if (res?.[0]) {
				byochuManager.update(res[0].values.map(r => ({ idbyochu: r[0], byochu: r[1], betsumei: r[2] })));
			} else {
				byochuManager.update([]);
			}
			waiting(false);
		}
	});
});

</script>
