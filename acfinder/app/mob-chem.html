<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="initFn" content="initChemTab">
<title>薬剤</title>
</head>
<body>
<!-- 【薬剤タブ】 -->
<div class="tab-container">
	<!-- ステップバー -->
	<div class="step-bar">
		<div class="prev-step" onclick="stepMove('prev')">◀</div>
		<div class="step-item active" onclick="stepJump(0)">1</div>
		<div class="step-item" onclick="stepJump(1)">2</div>
		<div class="step-item" onclick="stepJump(2)">3</div>
		<div class="next-step" onclick="stepMove('next')">▶</div>
	</div>

	<!-- 内部Swiper -->
	<div class="swiper chem-swiper">
		<div class="swiper-wrapper">

			<!-- ① 作物選択 -->
			<div class="swiper-slide no-swipe">
				<div class="step-fixed">
					<div id="chemCropTree" class="flex-wrapper"></div>
				</div>
			</div>

			<!-- ② 農薬選択 -->
			<div class="swiper-slide no-swipe">
				<h2 id="chemHead2"></h2>
				<div class="step-fixed">
					<div id="chemChemWrapper" class="flex-wrapper"></div>
				</div>
			</div>

			<!-- ③ 詳細表示 -->
			<div class="swiper-slide">
				<h2 id="chemHead3" class="no-swipe"></h2>
				<div class="step-scrollable">
					<div id="chemDetailWrapper" class="flex-wrapper"></div>
				</div>
			</div>

		</div>
	</div>
</div>

<script>
var chemChemManager, chemCropManager, chemDetailManager; // 薬剤タブ用

// 薬剤タブ初期化： ナビゲーションでこのタブが選ばれた時に index.html から一度だけ呼ばれる
function initChemTab() {
	// 薬剤タブ用 Managers
	chemChemManager = new ChemListManager('#chemChemWrapper', (chem) => {
		const chemSwiper = document.querySelector('.chem-swiper').swiper;
		if (chem) {
			updateStepBar(chemSwiper, Math.max(chemSwiper.maxReachedStep, 2));
			setupChemDetail();
		}
	});

	chemChemManager.init({ title: '薬剤選択', showCategory: true });

	// 薬剤詳細マネージャ初期化
	chemDetailManager = new ChemDetailManager('#chemDetailWrapper');
	chemDetailManager.init();

	// 薬剤タブ step.1 作成
	setupChemCrop();

	// 内部Swiperの初期化と返却
	const chemSwiperInstance = createZoomableSwiper('.chem-swiper', mainSwiper, function() {
		updateStepBar(this);
	});
	addSwipeHandler(document.querySelector('.chem-swiper')?.closest('.tab-container')?.querySelector('.step-bar'), chemSwiperInstance, false);
	return chemSwiperInstance; // Swiperインスタンスを返す

}

// 薬剤タブ setp.1: 作物選択
async function setupChemCrop() {
	// 作物ツリーの生成
	try {
		const cropTreeSql = `
			select idsaku, class, toroku, sakumotsu, shukakubui, betsumei,
			':'||replace(n_concat('、', strconv(sakumotsu, 'k'), strconv(betsumei, 'k'), ruby), '、', ':')||':' as keywords
			from m_sakumotsu where sakumotsu not like '%除く%';
		`;
		chemCropManager = new CropTreeManager('#chemCropTree', onCheckChemCrop, false);
		await chemCropManager.init(cropTreeSql, {
			showSearchMethod: true,
			onSearchMethodChange: () => {
				if (chemCropManager.checkedCrops.length > 1) setupChemChem();
			}
		});

		// urlParams に crops があれば、選択作物を設定
		const crops = urlParams.get('crops');
		if (crops && typeof chemCropManager.syncCheckState === 'function') {
			chemCropManager.syncCheckState(crops);
			onCheckChemCrop(chemCropManager.checkedCrops);
		}
	} catch (e) {
		console.error("作物ツリーの生成に失敗しました:", e);
		// データベースが未ロードでもフレームだけは見せるためにエラーをキャッチ
		document.querySelector('#chemCropTree').innerHTML = '<p style="padding:10px; color:red;">データベース読込待機中またはエラー</p>';
	}
}

// 薬剤タブ step.1 の作物ツリーチェック時のコールバック関数
function onCheckChemCrop(selectedCrops) {
	const chemSwiper = document.querySelector('.chem-swiper').swiper;
	if (selectedCrops.length > 0) {
		// 選択があれば step.2 (薬剤)を解放
		const newMax = Math.max(chemSwiper.maxReachedStep, 1);
		updateStepBar(chemSwiper, newMax);
		// step.2 作成
		setupChemChem();
	} else {
		// 選択がなければリセット
		if (chemSwiper.activeIndex > 0) chemSwiper.slideTo(0);
		updateStepBar(chemSwiper, 0);
	}
}

// 薬剤タブ step.2: 薬剤選択
async function setupChemChem() {
	// ヘッダ設定
	const title = document.querySelector('#chemHead2');
	const crops = chemCropManager.checkedCrops.map(item => item.sakumotsu); // checkedCrops から作物だけの配列を取り出し
	title.innerHTML = crops.join(chemCropManager.searchMethod.includes('or') ? ' | ' : ' & ');

	await waiting(true, '薬剤リストを作成中...');
	try {
		const chemSwiper = document.querySelector('.chem-swiper').swiper;
		const chemListbox = document.getElementById("chemChemList");
		const expandCropCondition = crops.map(crop => `(${expandCrops(crop)})`).join(' or ');
		const expandCropFlags = crops.map(crop => `(${expandCrops(crop)}) as ${normalizeColName(crop)}`).join(', ');
		const cropFlags = crops.map(crop => `max(${normalizeColName(crop)}) as ${normalizeColName(crop)}`).join(', ');
		const sql =`
			drop table if exists t_chemTekiyo;
			create temp table t_chemTekiyo as
			with t_sakumotsu as (select sakumotsu, ${expandCropFlags} from m_sakumotsu left join sakuhojo using(idsaku)),
			t_tekiyo as (select * from tv_meishoTekiyo where sakumotsu in (${makeCropCondition(crops)}))
			select * from t_tekiyo left join t_sakumotsu using(sakumotsu) where (${normalizeColName(crops.join(' or '))});
			delete from t_chemTekiyo where bango not in (
				with t_bango as (select bango, ${cropFlags} from t_chemTekiyo group by bango)
				select bango from t_bango where (${normalizeColName(crops.join(cropCropManager.searchMethod))})
			);
			with t_tekiyo1 as (select bango, meisho, tsusho, ruby, sakumotsu,
				gn_concat(',', iif(ifnull(jiki,'-')='-','時期無指定',jiki)) as jiki, gn_concat(',', iif(ifnull(kaisu,'-')='-','回数無指定',kaisu)) as kaisu, gn_concat(',', iif(ifnull(hoho,'-')='-','方法無指定',hoho)) as hoho,
				n_concat('|', ifnull(seizaidokusei, '-'), shurui, n_concat('/', keito1, mid1, rem1), n_concat('/', keito2, mid2, rem2), n_concat('/', keito3, mid3, rem3), n_concat('/', keito4, mid4, rem4), n_concat('/', keito5, mid5, rem5), seizaiyoto, seizaikoka, ruby) as keywords
				from t_chemTekiyo left join tsushoruby using(tsusho) group by bango, sakumotsu
			),
			t_tekiyo2 as (select bango, meisho, tsusho, gn_concat('|', format('%s:%s/%s/%s', sakumotsu, jiki, kaisu, hoho)) as tekiyo, keywords from t_tekiyo1 group by bango order by ruby, bango)
			select * from t_tekiyo2;
		`;
		if (debug) console.log(sql.replace(/^\t+/gm, ''));

		let group = '';
		const renderer = (row) => {
			const tsusho = row.tsusho;
			const info = `${row.tekiyo}|${row.keywords}`;
			let groupItem = '';
			if (group !== tsusho) {
				group = tsusho;
				groupItem = `
					<div class="checkListItem" data-group data-info="${tsusho}|${info}" title="${tsusho}">
						<span><em>${tsusho}</em></span><!--&nbsp;--><span><small>${info}</small></span>
					</div>
				`;
			}
			const bango = row.bango;
			const name = `${bango} ${row.meisho}`;
			const inputId = `chem_${chemChemManager.idSuffix}_${bango}`;
			return `${groupItem}
				<div class="checkListItem" data-info="${bango}|${tsusho}|${info}" title="${name}">
					<input type="radio" name="chemSelect" value="${name}" id="${inputId}"><label for="${inputId}">${name}</label>
				</div>
			`;
		};
		const sqlResult = db.exec(sql);
		if (sqlResult?.[0]?.values) {
			const chems = sqlResult[0].values.map(row => ({
				bango: row[0],
				meisho: row[1],
				tsusho: row[2],
				tekiyo: row[3],
				keywords: row[4]
			}));
			await chemChemManager.update(chems, renderer);

			// urlParams に keyword があれば、薬剤詳細選択病害虫を設定
			const keyword = urlParams.get('keyword');
			if (keyword && typeof chemChemManager.filter === 'function') {
				chemChemManager.filterInput.value = keyword.replaceAll(',', ' ');
				await chemChemManager._handleFilter(); // Manually trigger filter
				//chemChemManager.filter(keyword.replaceAll(',', ' '));
			}

			// スライドを薬剤選択まで開放（次以降は未開放にする）
			updateStepBar(chemSwiper, 1);
		} else {
			await chemChemManager.update([]);
			updateStepBar(chemSwiper, 0);
		}
		if (chemSwiper.activeIndex !== 1) chemSwiper.slideTo(1);
	} catch (e) {
		console.error("薬剤リスト作成エラー:", e);
	} finally {
		waiting(false);
	}

}

// 薬剤タブ step.3: 詳細表示
async function setupChemDetail() {
	const title = document.querySelector('#chemHead3');
	const chem = chemChemManager.selectedChem;
	title.innerHTML = chem;

	const tableName = 't_chemTekiyo';
	const bango = chem.split(' ')[0];
	const sqls = [
		{
			target: 'summary',
			query: `
				with
					t_meisho as (select bango, meisho, tsusho from m_kihon where bango = ${bango}),
					t_bangoAll as (select bango from m_kihon where tsusho = (select tsusho from t_meisho group by tsusho)),
					t_tazai as (select tsusho, gn_concat('<br>', format('%d %s', bango, meisho)) as tazai from m_kihon where bango in (select bango from t_bangoAll where bango != ${bango})),
					t_ojas as (select bango, ojas from t_tokusai)
				select format('%d %s', bango, meisho) as meisho,
					iif(shurui like '%'||zaikei||'%', shurui, format('%s [剤型: %s]',shurui,zaikei)) as 種類, dokusei,
					iif(yoto like '%'||koka||'%', yoto, format('%s [効果: %s]', yoto, koka)) as yoto, ojas, torokubi, ryakusho,
					tazai as 同名他剤, replace(chuijiko, '#', '<br>') as 注意事項
				from m_kihon left join suisan using(bango) left join t_tazai using(tsusho) left join t_ojas using(bango) left join seizai using(bango)
				where bango = ${bango};
			`
		},
		{
			target: 'ingredients',
			query: `
				select distinct row_number() over(order by (ippanmei)) as idx, ippanmei, nodo, seibun, iso,dokusei, jogai, keito, mid, rackeito, sayoten, sayokiko, fgroup, risk, ojas
				from kihon left join ${tableName} using(bango)
				where bango = ${bango} group by ippanmei
			`
		},
		{
			target: 'usage',
			query: `
				SELECT
					row_number() over(order by (select null)) as idx, sakumotsu, gn_concat(',', ifnull(byochu, mokuteki)) as 病害虫等,
					jiki, kaisu, baisu, ekiryo, hoho, basho, jikan, ondo, dojo, chitai, tekiyaku
				FROM ${tableName} WHERE bango = ${bango}
				group by sakumotsu, jiki, kaisu, baisu, ekiryo, hoho, basho, jikan, ondo, dojo, chitai, tekiyaku
			`
		}
	];
	await chemDetailManager.update(chem, 't_chemTekiyo', sqls);

	const chemSwiper = document.querySelector('.chem-swiper').swiper;
	if (chemSwiper.activeIndex !== 2) chemSwiper.slideTo(2);
}
</script>
</body>
</html>
