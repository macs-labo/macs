<!DOCTYPE html>
<html lang="ja" data-mode="mobile">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="../../apple-touch-icon-180x180.png" sizes="180x180">
<link rel="icon" type="image/png" href="../../android-chrome-192x192.png" sizes="192x192">
<link rel="manifest" href="../manifest.json">
<title>ACFinderBE Mobile</title>
<script>
var initTab = 0;
const urlParams = new URLSearchParams(window.location.search);
(function() {
	// `tab` URL パラメータ取得
	const pTab = urlParams.get('tab')?.toLocaleLowerCase();
	urlParams.delete('tab');
	if (pTab === 'pest' || pTab === 1) initTab = 1;
	if (pTab === 'chem' || pTab === 2) initTab = 2;

	// ディスプレイの論理幅が 1280px 以上ならデスクトップ版にリダイレクト
	const isDesktopSize = window.screen.width >= 1280;
	if (isDesktopSize) {
		// URLパラメータでデバッグ用に回避できるようにしておく
		const mode = urlParams.get('mode')?.toLocaleLowerCase();
		urlParams.delete('mode');
		if (mode !== 'mobile') {
			const tabs = ['crop.html', 'pest.html', 'chem.html'];
			let url = '../' + tabs[initTab];
			if (urlParams.size > 0) url += '?' + urlParams.toString();
			window.location.href = url;
			setTimeout(() => {
				window.close();
			}, 300);
		}
	}

	// タッチデバイスでない場合はここで終了
	if (!('ontouchstart' in window)) return;
	// --- グローバル・一時的ピンチズームの実装 ---
	(function initGlobalPinchZoom() {
		let startDist = 0;
		let startZoom = 1;
		let isPinching = false;
		let targetEl = null;

		// 現在表示中のアクティブなコンテンツ要素を取得する
		const getActiveContent = () => {
			const activeMain = document.querySelector('.main-swiper > .swiper-wrapper > .swiper-slide-active');
			if (!activeMain) return null;
			const nested = activeMain.querySelector('.swiper-wrapper > .swiper-slide-active');
			const targetSlide = nested || activeMain;
			// Swiperのレイアウト崩れを防ぐため、スライド内部のコンテナを対象にする
			return targetSlide.querySelector('.step-fixed, .step-scrollable') || targetSlide;
		};

		window.addEventListener('touchstart', (e) => {
			if (e.touches.length === 2) {
				isPinching = true;
				targetEl = getActiveContent();
				if (!targetEl) return;

				startDist = Math.hypot(
					e.touches[0].pageX - e.touches[1].pageX,
					e.touches[0].pageY - e.touches[1].pageY
				);
				// コンテンツの現在の相対ズーム値を取得
				startZoom = parseFloat(targetEl.style.zoom) || 1.0;
				// コンテンツの現在の相対ズーム値を取得 (computed style から取得)
				//startZoom = parseFloat(getComputedStyle(targetEl).zoom) || 1.0;
			}
		}, { passive: false });

		window.addEventListener('touchmove', (e) => {
			if (isPinching && e.touches.length === 2 && targetEl) {
				e.preventDefault(); // ネイティブのズームやスクロールを防止
				const dist = Math.hypot(
					e.touches[0].pageX - e.touches[1].pageX,
					e.touches[0].pageY - e.touches[1].pageY
				);
				const ratio = (dist * 0.6) / startDist; 

				let newZoom = startZoom * ratio;
				// 1.0未満（appZoom相当）にならないよう制限
				if (newZoom < 1.0) newZoom = 1.0;
				if (newZoom > 2) newZoom = 2; // 最大ズーム制限（任意）

				targetEl.style.zoom = newZoom;
				// ズーム中はスクロール可能にする
				if (newZoom > 1.0) {
					targetEl.style.overflow = 'auto';
				} else {
					targetEl.style.overflow = '';
				}
			}
		}, { passive: false });

		window.addEventListener('touchend', () => { 
			isPinching = false; 
			targetEl = null;
		});
	})();

	// 公開ディレクトリの場合ここで終了
	if (window.location.href.includes('/acfinder/')) return;
	// 開発版はデバッガーを画面の真ん中に巨大なログ画面を出す（タッチスクロール可能）
	// 既存のデバッガーがあれば消す
	document.getElementById('pwa-logger-v2')?.remove();

	const div = document.createElement('div');
	div.id = 'pwa-logger-v2';
	// 画面中央に配置、背景を濃くして文字を大きく（16px）、タッチ操作を100%許可
	div.style.cssText = 'position:fixed;top:10%;left:5%;width:90%;height:70%;overflow-y:scroll;background:rgba(10,10,10,0.95);color:#00ff00;font-family:monospace;font-size:16px;z-index:999999;padding:15px;box-sizing:border-box;border:3px solid #ff5555;pointer-events:auto;user-select:text;-webkit-overflow-scrolling:touch;';
	div.style.display = 'none';

	// 閉じるボタンを上部に配置
	const closeBtn = document.createElement('button');
	closeBtn.textContent = '【ログを閉じる】';
	closeBtn.style.cssText = 'width:100%;padding:10px;background:#333;color:#fff;font-size:16px;font-weight:bold;margin-bottom:15px;border:none;';
	closeBtn.onclick = () => div.style.display = 'none';
	div.appendChild(closeBtn);

	document.documentElement.appendChild(div);

	const originalLog = console.log;
	console.log = function(...args) {
		originalLog.apply(console, args);
		const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
		const logLine = document.createElement('div');
		logLine.style.cssText = 'border-bottom:1px solid #333;padding:5px 0;white-space:pre-wrap;word-break:break-all;';
		logLine.textContent = `[LOG] ${msg}`;
		div.appendChild(logLine);
		div.scrollTop = div.scrollHeight;
	};

	// エラーを検知したら、一番目立つように赤文字で大きく追加
	window.addEventListener('error', function(e) {
		const logLine = document.createElement('div');
		logLine.style.cssText = 'color:#ff3333;font-weight:bold;border:2px solid #ff3333;padding:10px;margin:10px 0;background:rgba(255,0,0,0.1);white-space:pre-wrap;word-break:break-all;';
		logLine.textContent = `🚨 [ERR] ${e.message}\n📍 at ${e.filename}\n🔢 line: ${e.lineno}:${e.colno}`;
		div.insertBefore(logLine, div.firstChild); // 最新のエラーを一番上に表示
		div.style.display = 'block'; // 隠れていても強制表示
	});

	// 👈 【追加】画面を「3本指でタップ」するたびに、ログ画面を表示・非表示にする
	window.addEventListener('touchstart', function(e) {
		if (e.touches.length === 3) { // 3本指タッチを検知
			if (div.style.display === 'none') {
				div.style.display = 'block';
				// 開いた瞬間に、通常ログの最下部（最新）へスクロールさせる
				div.scrollTop = div.scrollHeight;
			} else {
				div.style.display = 'none';
			}
		}
	});

	// ブラウザのタッチエミュレータの場合はマウス右ボタンででログ表示
	window.addEventListener('contextmenu', function(e) {
		e.preventDefault();
		if (div.style.display === 'none') {
			div.style.display = 'block';
		} else {
			div.style.display = 'none';
		}
	});
})();
</script>

<script>
isMobile = true;

// --- 共通の簡易スワイプ検知関数 ---

function addSwipeHandler(element, swiper, loop = true) {
	let touchStartX = 0;
	let touchEndX = 0;

	element.addEventListener('touchstart', (e) => {
		touchStartX = e.changedTouches[0].screenX;
	}, { passive: true });

	element.addEventListener('touchend', (e) => {
		// 自身、または現在表示中のスライド内にある Swiper がズーム中ならスワイプを無視
		const isZooming = (s) => s && s.zoom && s.zoom.scale > 1 && !s.isReturningToSingleScale;

		if (isZooming(swiper)) return;

		// mainSwiper の場合、中にある cropSwiper 等のズーム状態もチェック
		const activeSlide = swiper.slides[swiper.activeIndex];
		if (activeSlide) {
			const nestedSwiperEl = activeSlide.querySelector('.swiper-initialized');
			if (nestedSwiperEl && nestedSwiperEl.swiper && isZooming(nestedSwiperEl.swiper)) return;
		}

		touchEndX = e.changedTouches[0].screenX;
		const threshold = 40; // Minimum distance for a swipe to be recognized
		
		// 左フリック（指を左へ動かす） -> 次のスライドへ（右端なら左端へ）
		if (touchEndX < touchStartX - threshold) {
			if (loop && swiper.activeIndex === swiper.slides.length - 1) {
				swiper.slideTo(0);
			} else if (swiper.activeIndex < swiper.slides.length - 1) {
				// 解放済みのステップ（インスタンス保持）を超えてのスワイプを禁止
				if (!loop && swiper.maxReachedStep !== undefined && swiper.activeIndex >= swiper.maxReachedStep) return;
				swiper.slideTo(swiper.activeIndex + 1);
			}
		}
		// 右フリック（指を右へ動かす） -> 前のスライドへ（左端なら右端へ）
		if (touchEndX > touchStartX + threshold) {
			if (loop && swiper.activeIndex === 0) {
				swiper.slideTo(swiper.slides.length - 1);
			} else if (swiper.activeIndex > 0) {
				swiper.slideTo(swiper.activeIndex - 1);
			}
		}
	}, { passive: true });
}

// ステップバーの更新
function updateStepBar(swiperInstance, maxStep) {
	if (!swiperInstance) return;

	// 一時ズーム中ならリセット
	if (swiperInstance.zoom && swiperInstance.zoom.scale > 1) swiperInstance.zoom.out();

	// maxStep が指定された場合は更新する
	if (maxStep !== undefined) swiperInstance.maxReachedStep = maxStep;

	const index = swiperInstance.activeIndex;
	const currentMax = swiperInstance.maxReachedStep;

	// 現在アクティブなメインタブ（スライド）内にあるステップ項目のみを対象にする
	const activeMainSlide = document.querySelector('.main-swiper > .swiper-wrapper > .swiper-slide-active');
	if (!activeMainSlide) return;

	// ステップアイテム (1, 2, 3...) の表示更新
	activeMainSlide.querySelectorAll('.step-item').forEach((item, i) => {
		item.classList.remove('active', 'completed', 'locked'); // 既存のクラスを全て削除
		if (i === index) {
			item.classList.add('active');
		} else if (i < index) {
			item.classList.add('completed');
		}
		if (i > currentMax) {
			item.classList.add('locked');
		}
	});

	// ナビゲーションボタンとタッチバーの更新
	const isFirstStep = index === 0;
	const isLastStep = index === currentMax;

	// アイコン（◀ ▶）と画面端のタッチバー（« »）の両方を更新
	activeMainSlide.querySelectorAll('.prev-step').forEach(el => el.classList.toggle('disabled', isFirstStep));
	activeMainSlide.querySelectorAll('.next-step').forEach(el => el.classList.toggle('disabled', isLastStep));
	document.querySelectorAll('.prev-touch-bar').forEach(el => el.classList.toggle('disabled', isFirstStep));
	document.querySelectorAll('.next-touch-bar').forEach(el => el.classList.toggle('disabled', isLastStep));
}

// ズーム可能なSwiperインスタンスを作成するヘルパー関数
function createZoomableSwiper(selector, mainSwiperInstance, slideChangeCallback = null) {
	const swiperInstance = new Swiper(selector, {
		observer: true,
		observeParents: true,
		nested: true,
		allowTouchMove: true,
		allowSlideNext: true,
		allowSlidePrev: true,
		noSwiping: true,
		noSwipingClass: 'no-swipe',
		speed: 300,
		on: {
			slideChange: function() {
				clearAllSlideZoom();
				// 未開放ステップへのスワイプを制限
				if (this.maxReachedStep !== undefined && this.activeIndex > this.maxReachedStep) {
					this.slideTo(this.maxReachedStep);
					return;
				}
				if (slideChangeCallback) {
					slideChangeCallback.call(this); // Swiperインスタンスのコンテキストでコールバックを呼び出す
				}
			}
		}
	});

	swiperInstance.maxReachedStep = 0; // 最大到達ステップを 0 で初期化
	return swiperInstance;
}

let mainJump, stepJump, stepMove, addDynamicTab;
let mainSwiper; // mainSwiper をグローバル変数として宣言
let initializedTabs = []; // 全てのタブは初期ロード時に未初期化状態
let tabSwiperInstances = []; // 各タブの Swiper インスタンスを格納する配列
const tabTitles = tabs.slice(0, 3).map(tab => tab.name); // タブの表示名管理 (header.js の tabs から初期化)
const tabSources = tabs.slice(0, 3).map(tab => `mob-${tab.file}`); // タブのソース管理 (header.js の tabs から初期化)
let tabInits = []; // タブごとの初期化関数名

/**
 * 外部HTMLファイルを読み込んで要素に注入し、スタイルとスクリプトを適用する
 */
async function loadTabContent(selector, source, isContent = false) { // isContent パラメータを追加
	let html;
	if (isContent) {
		html = source;
	} else {
		const response = await fetch(source); // url ではなく source を使用
		if (!response.ok) throw new Error(`Failed to load ${source}`); // url ではなく source を使用
		html = await response.text();
	}
	const parser = new DOMParser();
	const doc = parser.parseFromString(html, 'text/html');
	const target = document.querySelector(selector);
	
	// メタタグから初期化関数名を取得
	const initFnMeta = doc.querySelector('meta[name="initFn"]');
	const initFnName = initFnMeta ? initFnMeta.getAttribute('content') : null;

	// スタイルの注入
	doc.querySelectorAll('style, link[rel="stylesheet"]').forEach(el => {
		if (el.tagName === 'STYLE') {
			const newStyle = document.createElement('style');
			newStyle.textContent = el.textContent;
			document.head.appendChild(newStyle);
		} else { // link[rel="stylesheet"]
			document.head.appendChild(el.cloneNode(true));
		}
	});
	
	// コンテンツの注入
	target.innerHTML = doc.body.innerHTML;

	// スクリプトの順次実行
	const scripts = Array.from(doc.querySelectorAll('script'));
	for (const oldScript of scripts) {
		await new Promise((resolve) => {
			const newScript = document.createElement('script');
			Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
			newScript.textContent = oldScript.textContent;
			if (newScript.src) {
				newScript.onload = resolve;
				newScript.onerror = resolve;
				document.head.appendChild(newScript);
			} else {
				target.appendChild(newScript);
				resolve();
			}
		});
	}
	return initFnName;
}

/**
 * メニューから動的にタブを追加し、表示・初期化する
 * @param {string} title タブの表示名
 * @param {string} source タブコンテンツのURLまたはHTML文字列
 * @param {boolean} isContent sourceがHTML文字列であるか
 */
addDynamicTab = async function(title, source, isContent = false) {
	document.getElementById('main-menu-dialog')?.close();
	document.getElementById('add-tab-menu-dialog')?.close(); // オプションタブメニューも閉じる
	await waiting(true, `${title}を読み込み中...`);
	try {
		// 2重起動防止: 同じ名前（タイトル）または同じソースのタブが既に開かれているかチェック
		const existingIndex = (tabTitles.indexOf(title) !== -1) ? tabTitles.indexOf(title) : tabSources.indexOf(source);
		if (existingIndex !== -1) {
			mainJump(existingIndex);
			showToast(`「${title}」は既に開いています`);
			waiting(false);
			return;
		}

		const nav = document.querySelector('.main-nav');
		const wrapper = document.querySelector('.main-swiper > .swiper-wrapper');
		const index = nav.querySelectorAll('.main-btn').length; // 現在のタブ数 = 新しいタブのインデックス
		const placeholderId = `dynamic-tab-${index}`;

		// 1. ナビボタン追加
		const newBtn = document.createElement('button');
		newBtn.className = 'main-btn dynamic-tab-btn';
		newBtn.innerHTML = `<span>${title}</span><span class="close-tab-btn">✖</span>`;
		newBtn.onclick = (e) => {
			if (e.target.classList.contains('close-tab-btn')) {
				e.stopPropagation();
				closeTab(index);
			} else {
				mainJump(index);
			}
		};
		nav.appendChild(newBtn);

		// 2. スライド追加
		mainSwiper.appendSlide(`<div class="swiper-slide" id="${placeholderId}"></div>`);
		// 3. Swiper更新
		mainSwiper.update();
		// 4. コンテンツ読み込み
		const initFnName = await loadTabContent(`#${placeholderId}`, source, isContent);

		// 5. 初期化関数の登録
		tabInits.push(initFnName);
		tabSources.push(source);
		tabTitles.push(title);
		initializedTabs[index] = false; // 動的に追加されたタブは未初期化状態

		// 6. 移動
		mainJump(index);
	} catch (e) {
		console.error("タブの追加に失敗しました:", e);
		alert("タブの追加に失敗しました。");
	} finally {
		waiting(false);
	}
};

/**
 * ローカルHTMLファイルを読み込んで動的タブとして追加する
 */
async function loadLocalTabFile(event) {
	const file = event.target.files[0];
	if (!file) return;

	const reader = new FileReader();
	reader.onload = async (e) => {
		const htmlContent = e.target.result;
		let tabName = file.name.replace(/\.html$/, '');
		const parser = new DOMParser();
		const doc = parser.parseFromString(htmlContent, 'text/html');
		const titleElement = doc.querySelector('title');
		if (titleElement && titleElement.textContent.trim() !== '') {
			tabName = titleElement.textContent.trim();
		}
		await addDynamicTab(tabName, htmlContent, true); // isContent = true を追加
	};
	reader.readAsText(file);
	event.target.value = ''; // 同じファイルを再度選択できるように、inputの値をクリアする
}


/**
 * 動的に追加されたタブを閉じる
 * @param {number} indexToClose 閉じるタブのインデックス
 */
function closeTab(indexToClose) {
	const nav = document.querySelector('.main-nav');
	const mainSwiper = document.querySelector('.main-swiper').swiper;

	// 1. ナビボタンを削除
	const btnToRemove = nav.children[indexToClose];
	if (btnToRemove) btnToRemove.remove();

	// 2. Swiperスライドを削除
	mainSwiper.removeSlide(indexToClose);

	// 3. tabInits と initializedTabs を更新
	const swiperToDestroy = tabSwiperInstances[indexToClose];
	tabInits.splice(indexToClose, 1);
	tabSources.splice(indexToClose, 1);
	tabTitles.splice(indexToClose, 1);
	initializedTabs.splice(indexToClose, 1);
	tabSwiperInstances.splice(indexToClose, 1); // Swiperインスタンスも削除

	// 4. Swiperを更新し、必要に応じてアクティブなタブを調整 & 閉じるSwiperを破棄
	mainSwiper.update();

	// 閉じたタブがアクティブだった場合、または最後のタブだった場合、有効なタブに移動
	if (mainSwiper.activeIndex >= mainSwiper.slides.length) {
		mainJump(Math.max(0, mainSwiper.slides.length - 1));
	} else {
		// 閉じたタブより前のタブがアクティブだった場合、Swiperは自動でインデックスを調整するが、
		// UIの状態を確実に同期するため、現在のactiveIndexに再度slideToを呼び出す
		mainSwiper.slideTo(mainSwiper.activeIndex);
	}
	// Swiperインスタンスを破棄
	if (swiperToDestroy && typeof swiperToDestroy.destroy === 'function') {
		swiperToDestroy.destroy(true, true); // true, true でDOM要素とイベントリスナーを完全にクリーンアップ
	}

	// ナビボタンのインデックスを再調整 (onclickハンドラ内のindexがずれるため)
	nav.querySelectorAll('.main-btn').forEach((btn, i) => {
		btn.onclick = (e) => {
			if (e.target.classList.contains('close-tab-btn')) {
				e.stopPropagation();
				closeTab(i);
			} else {
				mainJump(i);
			}
		};
	});
}

	// 初期ズーム適用
	applyZoom(parseFloat(localStorage.getItem('appZoom')) || 1.0);

	// 既存のメインタブボタンのテキストを更新
	const mainNavButtons = document.querySelectorAll('.main-nav .main-btn');
	mainNavButtons.forEach((button, index) => {
		if (tabTitles[index]) {
			button.textContent = tabTitles[index];
		}
	});

	// 3. メインタブ Swiper の初期化
	mainSwiper = new Swiper('.main-swiper', {
		observer: true,
		observeParents: true,
		allowTouchMove: true,
		allowSlideNext: true, 
		allowSlidePrev: true,
		noSwiping: true,
		noSwipingClass: 'tab-container', // スライド自体ではなく、中身のコンテナを指定
		speed: 300,
		on: {
			slideChange: function() {
				clearAllSlideZoom();
				updateMainTabs(this.activeIndex);
				// 該当タブの初期化関数が未実行なら呼び出す
				const initFn = tabInits[this.activeIndex];
				if (initFn && !initializedTabs[this.activeIndex]) {
					if (typeof window[initFn] === 'function') {
						tabSwiperInstances[this.activeIndex] = window[initFn](); // Swiperインスタンスを格納
						initializedTabs[this.activeIndex] = true;
					}
				}
			},
			// After main tab changes, update the step navigation buttons for the new active nested Swiper
			transitionEnd: function() { // transitionEnd を使用して、スライドが完全に切り替わってから実行
				const nestedSwiperEl = this.slides[this.activeIndex].querySelector('.swiper-initialized');
				if (nestedSwiperEl && nestedSwiperEl.swiper) updateStepBar(nestedSwiperEl.swiper);
			}
		}
	});

	// 4. 作物タブの初期化 (db と mainSwiper が利用可能になった後)
	const initFn = tabInits[0];
	if (initFn && typeof window[initFn] === 'function') {
		tabSwiperInstances[0] = window[initFn](); // Swiperインスタンスを格納
		initializedTabs[0] = true;
	}

	// 5. グローバル関数の定義
	// クリック時のジャンプ
	mainJump = function(index) {
		mainSwiper.slideTo(index);
	};

	// ステップのジャンプ
	stepJump = function(index) {
		// 現在のメインタブにある「中身（内側）のSwiper」を動的に取得する
		const activeMainSlide = mainSwiper.slides[mainSwiper.activeIndex];
		const nestedSwiperEl = activeMainSlide.querySelector('.swiper-initialized');

		if (nestedSwiperEl && nestedSwiperEl.swiper) {
			const targetSwiper = nestedSwiperEl.swiper;
			// 未解放ステップは pointer-events: none になっているため、
			// ここに到達した時点でジャンプ可能なステップであることが保証される
			targetSwiper.slideTo(index);

		}
	};

	// ステップの前後移動
	stepMove = function(direction) {
		const activeMainSlide = mainSwiper.slides[mainSwiper.activeIndex];
		const nestedSwiperEl = activeMainSlide.querySelector('.swiper-initialized');
		if (nestedSwiperEl && nestedSwiperEl.swiper) {
			const targetSwiper = nestedSwiperEl.swiper; // Get the nested Swiper instance

			// 移動できないステップへの前後移動タッチエリアは pointer-events: none になっているため、
			// ここに到達した時点で前後移動可能であることが保証される
			if (direction === 'prev') {
				targetSwiper.slidePrev();
			} else {
				targetSwiper.slideNext();
			}
		}
	}

	// タブバーのスワイプ
	addSwipeHandler(document.querySelector('.main-nav'), mainSwiper, true);

	// 各タブのステップバーのスワイプハンドラは、それぞれのタブの init 関数内で設定される
	// (Swiper インスタンスがそのスコープ内で利用可能になるため)

	// 初期状態のインジケータをセット
	updateMainTabs(0);
	updateStepBar(tabSwiperInstances[0], 0); // Initial step bar and navigation update
	mainJump(initTab);

});

let backTapCount = 0;
let backTimer = null;
console.log('arg: ', urlParams.toString());

// 1. 起動時（最初のタップが必要）
window.addEventListener('load', () => {
	const initHistory = () => {
		// Entry 0 (境界線)
		history.replaceState({ isBottom: false }, ''); 
		// Entry 1 (アプリ本体)
		history.pushState({ isBottom: true }, ''); 
		
		window.removeEventListener('click', initHistory);
	};
	window.addEventListener('click', initHistory);
});

// 2. 戻るボタンの監視
window.addEventListener('popstate', (event) => {
	if (!event.state || !event.state.isBottom) {
		// 💡 境界線に触れた
		backTapCount++;

		if (backTapCount >= 2) {
			// 2回連続で戻ったなら、そのままアプリ終了（前のサイトへ戻る）
			// ここで何もしなければ、ブラウザの自然な挙動で終了します
		} else {
			// 1回目の「戻る」：即座に履歴を Entry 1 に復帰させて、メッセージを出す
			history.pushState({ isBottom: true }, '');
			
			showToast("もう一度戻るをタップすると終了します"); // 自作の通知

			// 一定時間（例: 2秒）経ったらカウントをリセット
			clearTimeout(backTimer);
			backTimer = setTimeout(() => {
				backTapCount = 0;
			}, 2000);
		}
	}
});

function showToast(message) {
	const toast = document.getElementById("toast");
	
	// メッセージをセット
	toast.innerText = message;
	
	// クラスを付与して表示
	toast.classList.add("show");

	// 2秒後にクラスを外して隠す
	setTimeout(() => {
		toast.classList.remove("show");
	}, 2000);
}
