<!--	タブ専用スタイル -->
<style>

#cropTree {
	flex: none;
	height: calc(50% + 21px);
	min-height: 280px;
	margin-bottom: 14px;
}

#selectPest {
	position: relative;
	display: flex;
	flex-direction: column;
	flex: 1;
	min-height: 220px;
	margin-top: 0px;
}

#selectPest.hidden {
	display: none;
}

</style>
<!--	タブ専用の view や table の設定 -->
<script type="text/plain" id="views_or_tables">
</script>
<!--	タブ専用の script -->
<script>

var currentListing, cropManager, pestManager;

async function searchCrop(skipPestUpdate = false) {
	tables = resetTables(tables);

	const title = document.querySelector('#title');
	if (checkedCrops.length === 0) {
		pestManager.reset(true);
		title.innerHTML = '';
		title.classList.add('hidden');
		if (excluderChanged) cropManager = await setupCropTree('#cropTree', (checked) => searchCrop(pestManager && pestManager.checkedPests.length > 0), {
			showSearchMethod: true,
			showExcluder: true,
			onSearchMethodChange: () => { if (tables) searchCrop(pestManager && pestManager.checkedPests.length > 0); }
		});
		return;
	}

	const skip = skipPestUpdate === true;
	if (!skip) await pestManager.update([], true); // クリア（再帰呼び出し防止のため silent）

	const checkedPests = pestManager.checkedPests.sort((a, b) => a.id.localeCompare(b.id)); // id 順にソートした配列
	let normalizedPests = [];
	let currentId = '';
	let byochu = [];
	checkedPests.forEach(pest => {
		if (pest.id.slice(0, 4) !== currentId) {
			if (byochu.length > 0) {
				normalizedPests.push(`(${byochu.join(' or ')})`);
				byochu = [];
			}
		}
		const colName = normalizeColName(pest.byochu);
		if ('15'.includes(pest.id[0]) || pest.id.endsWith('%')) {
			currentId = pest.id;
			normalizedPests.push(colName);
		} else {
			currentId = pest.id.slice(0, 4);
			byochu.push(colName);
		}
	});
	if (byochu.length > 0) normalizedPests.push(`(${byochu.join(' or ')})`);
	const pestFlags = normalizedPests.join(' and ');
	const pests = pestFlags.replaceAll('(', '{').replaceAll(')', '}').replaceAll('or', '|').replaceAll('and', '&').toHan();

	const searchMethod = cropManager.searchMethod;
	const crops = checkedCrops.map(item => item.sakumotsu);
	let titleHtml = crops.join(searchMethod === ' or ' ? ' | ' : ' & ');
	if (checkedPests.length > 0) {
		titleHtml += ' ／ ' + pests;
	}
	title.innerHTML = titleHtml;
	title.classList.remove('hidden');

	const expandCropFlags = crops.map(crop => `(${expandCrops(crop)}) as ${normalizeColName(crop)}`);
	const cropFlags = crops.map(crop => `max(${normalizeColName(crop)}) as ${normalizeColName(crop)}`).join(',');
	const excluder = excludeCondition.replace(/^and/i, 'where');
	const cropMethodFlags = normalizeColName(crops.join(searchMethod));
	let sql = skip ? '' :`
		drop table if exists t_cropTekiyo;
		create temp table t_cropTekiyo as
		with t_sakumotsu as (select sakumotsu, ${expandCropFlags.join(',')} from m_sakumotsu left join sakuhojo using(idsaku)),
		t_tekiyo as (select * from tv_tsushoTekiyo where sakumotsu in (${makeCropCondition(crops)})),
		t_byochu1 as (select idbyochu, byochu as byochu2, betsumei as byochuruby from m_byochu),
		t_byochu2 as (select distinct ifnull(byochu, ifnull(mokuteki, hoho)) as byochu2 from m_tekiyo),
		t_byochu3 as (select ifnull(idbyochu, '59999999') as idbyochu, byochu2, iif(byochu2 = '添加', 'てんか', byochuruby) as byochuruby from t_byochu2 left join t_byochu1 using(byochu2) order by idbyochu)
		select * from t_tekiyo left join t_sakumotsu using(sakumotsu) left join  t_byochu3 on ifnull(byochu, ifnull(mokuteki, hoho)) = byochu2 ${excluder};
		delete from t_cropTekiyo where tsusho not in (
			with t_tsusho1 as (select tsusho, ${cropFlags} from t_cropTekiyo group by tsusho)
			select tsusho from t_tsusho1 where ${cropMethodFlags}
		);
	`;

	// 病害虫フィルタ条件の構築
	let pestCte = '';
	if (checkedPests.length > 0) {
		const results = checkedPests.map(pest => {
			const cond = pest.id.includes('%') ? `idbyochu like '${pest.id}'` : `byochu2 = '${pest.byochu}'`;
			return { cond, col: `max(${cond}) as ${normalizeColName(pest.byochu)}` };
		});
		const pestCondition = results.map(r => r.cond).join(' or ');
		const pestColumns = results.map(r => r.col).join(', ');
		pestCte = `
			with t_tekiyo as (select * from t_cropTekiyo where (${pestCondition})),
			t_tsusho as (select tsusho, ${pestColumns} from t_tekiyo group by tsusho),
			t_filtered_tekiyo as (select * from t_tekiyo left join t_tsusho using(tsusho) where (${pestFlags}))
		`;
	} else {
		pestCte = `with t_filtered_tekiyo as (select * from t_cropTekiyo)`;
	}
	console.log(pestCte);

	switch(currentListing) {
		case 1: // 使用方法毎に集約
			sql += `
				${pestCte}
				select 
					tsusho, seizaidokusei, zaikei, seizaiyoto, sakumotsu,
					gn_concat(', ', n_concat('/', byochu, mokuteki)||' '||baisu) as 対象病害虫等,
					count(distinct n_concat('/', byochu, mokuteki)) as 対象病害虫数,
					jiki, kaisu, ekiryo, hoho, basho, jikan, ondo, dojo, chitai, tekiyaku,
					seibun1, kaisu1, mid1, keito1, rem1, risk1,
					seibun2, kaisu2, mid2, keito2, rem2, risk2,
					seibun3, kaisu3, mid3, keito3, rem3, risk3,
					seibun4, kaisu4, mid4, keito4, rem4, risk4,
					seibun5, kaisu5, mid5, keito5, rem5, risk5,
					shurui, kongo, seizaikoka
				from t_filtered_tekiyo
				group by tsusho, sakumotsu, kaisu, jiki, hoho, ekiryo, basho, jikan, ondo, chitai, tekiyaku
				order by seizaiyoto, tsusho;
			`;
			break;
		case 2: // 防除記録様式
			sql += `
				${pestCte}
				select
					seizaiyoto, sakumotsu, tsusho, seizaidokusei, jiki,
					gn_concat(', ', n_concat('/', byochu, mokuteki)||' '||baisu) as 対象病害虫等,
					count(distinct n_concat('/', byochu, mokuteki)) as 対象病害虫数,
					kaisu, ' ' as 使用日1,
					iif(extnum('回', kaisu, 10) < 2, '*', ' ') as 使用日2,
					iif(extnum('回', kaisu, 10) < 3, '*', ' ') as 使用日3,
					iif(extnum('回', kaisu, 10) < 4, '*', ' ') as 使用日4,
					iif(extnum('回', kaisu, 10) < 5, '*', ' ') as 使用日5,
					iif(extnum('回', kaisu, 10) < 6, '*', ' ') as 使用日6,
					iif(extnum('回', kaisu, 10) < 7, '*', ' ') as 使用日7,
					iif(extnum('回', kaisu, 10) < 8, '*', ' ') as 使用日8,
					hoho,	max(ekiryo) as ekiryo,
					seibun1, kaisu1, mid1, keito1, rem1, risk1,
					seibun2, kaisu2, mid2, keito2, rem2, risk2,
					seibun3, kaisu3, mid3, keito3, rem3, risk3,
					seibun4, kaisu4, mid4, keito4, rem4, risk4,
					seibun5, kaisu5, mid5, keito5, rem5, risk5,
					shurui, kongo, zaikei, seizaikoka
				from t_filtered_tekiyo
				group by sakumotsu, tsusho, kaisu, jiki, hoho, basho, jikan, ondo, chitai, tekiyaku
				order by seizaiyoto, tsusho;
			`;
			break;
		default: // 標準(集約無し)
			sql += `
				${pestCte}
				select 
					tsusho, seizaidokusei, zaikei, seizaiyoto, sakumotsu, byochu, mokuteki,baisu,
					jiki, kaisu, ekiryo, hoho, basho, jikan, ondo, dojo, chitai, tekiyaku,
					seibun1, kaisu1, mid1, keito1, rem1, risk1,
					seibun2, kaisu2, mid2, keito2, rem2, risk2,
					seibun3, kaisu3, mid3, keito3, rem3, risk3,
					seibun4, kaisu4, mid4, keito4, rem4, risk4,
					seibun5, kaisu5, mid5, keito5, rem5, risk5,
					shurui, kongo, seizaikoka
				from t_filtered_tekiyo
			`;
	}
	if (debug) console.log(sql);
	await waiting(true, 'データベース検索中');
	try {
		let searchTime = -performance.now();
		let result = db.exec(sql);
		searchTime += performance.now();
		const pest = pests === '' ? '' : `の「${pests.replace(/[{}]/g, '').replaceAll(' & ', '」「').replaceAll(' | ', '、')}」`;
		const common = cropManager.searchMethod === ' and ' && checkedCrops.length > 1 ? '共通して' : '';
		tables = outputTable('#result', result, { caption: `「${crops.join('」「')}」${pest}に${common}使用可能な薬剤の適用`, hideFooterU20: false });

		if (!skip) {
			sql = `
				with t_byochu as (select distinct byochu2 as byochu from t_cropTekiyo),
				t_gByochu as (select cid, gid, format('%d%03d%', cid, gid) as idbyochu, gname as byochu, strconv(gname) as byochuruby
				from t_byochu left join m_byochu using(byochu) left join gbyochu using(cid, gid) where gname is not null)
				select distinct idbyochu, byochu2, byochuruby from t_cropTekiyo where byochu not regexp '菌(\\)|による)'
				union select idbyochu, byochu, byochuruby from t_gByochu order by idbyochu;
			`;
			if (debug) console.log(sql);
			result = db.exec(sql);
			if (result?.[0]?.values) {
				const pests = result[0].values.map(row => ({
					idbyochu: row[0],
					byochu: row[1],
					betsumei: row[2]
				}));
				await pestManager.update(pests, true); // リスト更新（再帰呼び出し防止のため silent）
				document.querySelector('#selectPest').classList.remove('hidden');
			}
		}

	} catch (error) {
		console.error(`エラー: ${error.message}`);
	} finally {
		await waiting(false);
	}

}

function handleListingChange(event) {
	currentListing = parseInt(event.target.value);
	if (tables) searchCrop(true);
}

// DOM読込完了時の初期設定
window.addEventListener('DOMContentLoaded', async function() {
	//データベース読込
	if (db === null) await fetchDB();

	// currentListing を表示形式セレクタから取得
	const listingEl = document.getElementById('listing');
	currentListing = listingEl ? parseInt(listingEl.value) : 0;

	// 作物ツリーの生成とイベントハンドラ設定
	cropManager = await setupCropTree('#cropTree', (checked) => searchCrop(pestManager && pestManager.checkedPests.length > 0), {
		showSearchMethod: true,
		showExcluder: true,
		onSearchMethodChange: () => { if (tables) searchCrop(pestManager && pestManager.checkedPests.length > 0); }
	});

	// firefox のリロード時 checkbox 状態復元対策
	clearAllReset();

	// 病害虫リストマネージャ初期化
	pestManager = new PestListManager('#selectPest', () => { searchCrop(true); });
	pestManager.init({ title: '病害虫名等選択', showCategory: true });
	pestManager.reset(true);

	// urlParams に crops があれば、選択作物を設定
	const urlParams = new URLSearchParams(window.location.search);
	const crops = urlParams.get('crops');
	if (crops && typeof cropManager.syncCheckState === 'function') {
		await cropManager.syncCheckState(crops);
		await searchCrop();
	}

	// urlParams に pests があれば、選択病害虫を設定
	const pests = urlParams.get('pests');
	if (pests && typeof pestManager.syncCheckState === 'function') {
		await pestManager.syncCheckState(pests);
		await searchCrop(true);
	}

});
</script>
</head>
<body>
<!--	全タブ共通ヘッダ -->
<div id="loading"></div><!-- loading メッセージ表示領域確保 -->
<div id="title-bar"></div><!--	タイトル表示領域確保 -->
<!--	このタブの表示内容 -->
<div class="tab_content">
	<div class="flex_container">
		<div id="conditionPane">
			<div class="selector">
				<h3>表示形式</h3>
				<select id="listing" onchange="handleListingChange(event)">
					<option value="0" selected>標準(集約無し)</option>
					<option value="1">病害虫・希釈倍数を集約</option>
					<option value="2">防除記録様式</option>
				</select>
			</div>
			<div id="cropTree"></div>
			<div id="h-splitter" class="splitter"></div>
			<div id="selectPest"></div>
		</div>
		<div id="resultPane">
			<h3 id="title" class="hidden"></h3>
			<div id="result"></div>
		</div>
	</div>
</div><!-- End of tab-content -->
<!--  タブ内容読込後に実行する script -->
<script>
</script>
</body>
