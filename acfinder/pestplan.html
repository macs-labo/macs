// 現在時刻を YYYYMMDD-hhmmss にフォーマット
function formatDateTime(opt = '') {
	const now = new Date();
	let format = { year: 'numeric' };
	switch (opt.toLowerCase()) {
		case 'year': break;
		case 'date': format = {...format, month: '2-digit', day: '2-digit'}; break;
		default: format = {...format, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
	}
	const formattedDate = now.toLocaleString('ja-JP', format);
	return formattedDate.replace(/[\/:]/g, '').replace(' ', '-');
}

// ファイル名のプレフィックス（作物名）を取得する関数
function getFilenamePrefix() {
	const titleElement = document.getElementById('title');
	if (titleElement && titleElement.textContent) {
		// ファイル名として不適切な文字をアンダースコアに置換
		const cropName = titleElement.textContent.replace(/[,/\?%*:|"<>]/g, '_');
		return cropName + '_';
	}
	return '';
}

function parseTiming(timingText) {
	let timingMonth = '', timingPeriod = '';
	if (timingText) {
		if (/^\d{4}-\d{2}-\d{2}$/.test(timingText)) {
			const [year, month, day] = timingText.split('-');
			timingMonth = (+month).toString();
			timingPeriod = day > 20 ? '下旬' : day > 10 ? '中旬' : '上旬';
		} else {
			if (timingText === '日付選択' || timingText === '') {
				[timingText, timingMonth, timingPeriod] = ['', '', ''];
			} else {
				[timingMonth, timingPeriod] = timingText.split('月');
			}
		}
	}
	return [timingText, timingMonth, timingPeriod];
}

function getMonthPeriod(td, timingOnly = false) {
	let timing = '', month = '', period = '';
	const monthSelect = td.querySelector('.timing-month');
	if (monthSelect) {
		month = monthSelect.value || '';
		period = td.querySelector('.timing-period')?.value || '';
		timing = (month && period) ? `${month}月${period}` : ''; // 防除記録用にこのデータは必須
	} else {
		const timingText = td.querySelector('.timing')?.textContent || '';
		[timing, month, period] = parseTiming(timingText);
	}
	if (timingOnly) return timing;
	return [timing, month, period];
}

function getTimingText(td) {
	let timingText;
	if (isRecordMode) {
		timingText = td.querySelector('label')?.textContent || '';
	} else {
		timingText = getMonthPeriod(td, true);
		//if (!timingText) {
		//	timingText = td.querySelector('.timing')?.textContent || '';
		//}
	}
	return timingText;
}

function getTimingArray(mode, td) {
	let timing, timingMonth, timingPeriod;
	if (mode) {
		const timingText = td.querySelector('label')?.textContent || '';
		[timing, timingMonth, timingPeriod] = parseTiming(timingText);
	} else {
		[timing, timingMonth, timingPeriod] = getMonthPeriod(td);
		//if (!timing) {
		//	const timingText = td.querySelector('.timing')?.textContent || '';
		//	[timing, timingMonth, timingPeriod] = parseTiming(timingText);
		//}
	}
	return [timing, timingMonth, timingPeriod];
}

// planTable の内容を json 形式にする関数
function convPlanToJson() {
	const table = document.getElementById('planTable');
	if (!table) return '';

	const planData = [];

	const saveData = {
		dataset: currentDbUpdate, // 保存時点の農薬登録情報DBの登録更新日
		sakumotsu: currentSakumotsu, // 作物条件のSQL文字列
		crops: checkedCrops, // 選択作物オブジェクトの配列(モバイル版互換用)
		titleText: document.getElementById('title').textContent, // #title のテキスト内容
		plan: planData
	};

	const headers = ['no', 'timing', 'sakumotsu','yakuzai','byochu','jiki', 'kaisu', 'baisu', 'ekiryo','hoho', 'seibun', 'seibunkaisu', 'mid'];

	table.querySelectorAll('tbody tr').forEach(tr => {
		const rowData = {};
		tr.querySelectorAll('td').forEach((td, index) => {
			if (index > 0) { // 「操作」列をスキップ
				const key = headers[index - 1];
				if (index === 2) { // 防除時期セル
					[rowData.timing, rowData.timingMonth, rowData.timingPeriod] = getTimingArray(isRecordMode, td);
				} else {
					rowData[key] = td.innerHTML; // innerHTMLを使用して<br>タグを保持
				}
			}
		});
		planData.push(rowData);
	});

	return JSON.stringify(saveData, null, 2);
}

// planTable の内容を JSON 形式で保存する関数
async function savePlanFile(overwrite = true) {
	// 登録日の古い旧データ行(olddata)が残っている場合は、保存前に確認する
	const planTableBodyForCheck = document.querySelector('#planTable tbody');
	const hasOldDataRowsForSave = planTableBodyForCheck
		? Array.from(planTableBodyForCheck.rows).some(row => row.hasAttribute('hidden'))
		: false;
	if (hasOldDataRowsForSave) {
		const proceedWithSave = confirm(
			'登録日の古いデータ行が残っています。保存すると現在開いているDBの登録更新日が保存されますので、古いデータ行を削除してから保存することをおすすめします。このまま保存する場合は、次回読み込み時に古いデータ行が残った状態で表示されることをご承知ください。'
		);
		if (!proceedWithSave) return;
	}

	const saveData = convPlanToJson();

	// デフォルトファイル名
	const prefix = getFilenamePrefix(); // 作物名プレフィックス
	const baseName = isRecordMode ? '防除記録' : '防除計画';
	let filename = currentFilename ? currentFilename : `${prefix}${baseName}_${formatDateTime('year')}.json`;
	if (currentFilename) {
		if (isRecordMode) {
			filename = filename.replace('計画', '記録');
		} else {
			filename = filename.replace('記録', '計画');
		}
	}

	// API 非対応ブラウザの場合はダウンロード型保存
	if (!isFileSystemAccessSupported) {
		const blob = new Blob([saveData], { type: 'application/json' });
		saveAs(blob, filename);
		isDirty = false;
		alert(
			`「${filename}」をダウンロードしました。\n\n` +
			"【便利なヒント】\n" +
			"Google Chrome や Microsoft Edge などのブラウザでお使いいただくと、" +
			"同じファイルへの「上書き保存」や「名前を付けて保存」ができるようになり、ファイルがたまらず便利です！"
		);
		return;
	}

	// overwrite = true でファイルハンドルがあり、basename が一致している場合は「上書き」
	if (overwrite && currentFileHandle && currentFilename.includes(baseName)) {
		try {
			const writable = await currentFileHandle.createWritable();
			await writable.write(saveData);
			await writable.close();
			isDirty = false;
			alert('ファイルを上書き保存しました。');
			return;
		} catch (err) {
			console.error('上書き失敗（新規保存に切り替えます）:', err);
		}
	}

	// overwrite = false またはハンドルがない、または basename が不一致、または上書きに失敗した場合は「名前を付けて保存」
	try {
		const fileHandle = await window.showSaveFilePicker({
			suggestedName: filename,
			types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }]
		});
		
		
		const writable = await fileHandle.createWritable();
		await writable.write(saveData);
		await writable.close();

		currentFileHandle = fileHandle; // 次回上書き用にハンドルを記憶
		currentFilename = fileHandle.name;
		isDirty = false;
		alert('新しくファイルを保存しました。次回からは自動で上書きされます。');
		
	} catch (err) {
		if (err.name !== 'AbortError') {
			alert('ファイルの保存に失敗しました。');
		}
	}

}

// 防除計画ファイルを開く
async function openPlanFile(item = null) {

	const planTableBody = document.querySelector('#planTable tbody');
	if (planTableBody && planTableBody.rows.length > 0) {
		if (!confirm('現在の防除計画/記録をクリアして、新しいファイルを読み込みますか？')) {
			return;
		}
	}

	// 【パターンB】Firefox / Safari など（隠しinputを代わりにクリック）
	if (!isFileSystemAccessSupported) {
		document.getElementById('fallbackFileInput')?.click();
		return;
	}

	// 【パターンA】Chrome / Edge など（上書き保存のルートに乗せる）
	try {
		let fileHandle = null;
		if (item) {
			fileHandle = await item.getAsFileSystemHandle();
		} else {
			[fileHandle] = await window.showOpenFilePicker({
				types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }],
				multiple: false
			});
		}
		const file = await fileHandle.getFile();
		const text = await file.text();
		currentFileHandle = fileHandle; // ハンドルを記憶
		currentFilename = fileHandle.name; // ファイル名を保存
		loadPlanFromJson(text); // データ読み込み共通関数へ
	} catch (err) {
		if (err.name !== 'AbortError') alert('ファイルの読み込みに失敗しました。');
	}

}

// fallbackFileInput の場合の読込
function readFile(file) {
	if (!file) return;
	if (!file.name.toLowerCase().endsWith('.json')) {
		alert('対応していないファイル形式です。');
	}

	currentFileHandle = null; // ハンドルは取れないのでnull

	const reader = new FileReader();
	reader.onload = (e) => {
		try {
			loadPlanFromJson(e.target.result); // データ読み込み共通関数へ
		} catch (err) {
			alert('ファイルの解析に失敗しました。正しいJSONファイルか確認してください。');
		}
	};
	reader.onerror = () => {
		alert('ファイルの読み込み中にエラーが発生しました。');
	};
	reader.readAsText(file); // テキストとして読み込み開始
	currentFilename = file.name; // ファイル名保存
}

// JSONファイルを読み込んでplanTableを復元する関数
async function loadPlanFromJson(jsonText, msg) {

	try {
		const loadedData = JSON.parse(jsonText);
		const planData = loadedData.plan;

		// 先頭行が日付形式なら記録モードを自動有効化
		const firstRow = planData[0];
		isRecordMode = !!(firstRow && firstRow.timing && /^\d{4}-\d{2}-\d{2}$/.test(firstRow.timing));
		const modeCheck = document.getElementById('checkRecordMode');
		if (modeCheck) modeCheck.checked = isRecordMode;

		// 'plan', 'titleText', 'crops' の存在をチェック
		if (!Array.isArray(planData) || loadedData.titleText === undefined) { // loadedData.crops はオプションなのでチェックしない
			throw new Error('Invalid JSON format: missing plan, titleText, or crops.');
		}

		// 作物情報の復元
		window.checkedCrops = loadedData.crops || []; // crops がない場合は空配列で初期化

		// currentSakumotsu を checkedCrops から再構築、または古い形式のsakumotsuから復元
		currentSakumotsu = null; // まず初期化
		if (window.checkedCrops.length > 0) {
			currentSakumotsu = makeCropCondition(window.checkedCrops.map(item => item.sakumotsu));
		} else if (loadedData.sakumotsu) { // 古い形式のJSONでcropsがない場合
			currentSakumotsu = loadedData.sakumotsu;
		}

		// 作物ツリーのチェック状態を視覚的に復元
		if (_defaultCropTreeManager && typeof _defaultCropTreeManager.syncCheckState === 'function') {
			_defaultCropTreeManager.syncCheckState();
		}

		// searchCrop を呼び出して、UIと関連リストを更新
		await searchCrop(); // searchCrop が null currentSakumotsu を処理するように変更

		// テーブルを復元
		const planTableBody = document.querySelector('#planTable tbody');
		if (!planTableBody) return;

		// #title のテキスト内容を復元
		const titleElement = document.getElementById('title');
		if (titleElement) {
			titleElement.textContent = loadedData.titleText;
			titleElement.classList.remove('hidden'); // タイトルを表示状態にする
		}

		// 既存のテーブル内容と候補テーブルをクリア
		planTableBody?.clearContent();
		document.getElementById('yakuzaiTekiyo')?.clearContent();

		// JSONデータからテーブルを再構築
		planData.forEach(rowData => {
			const newRow = planTableBody.insertRow();
			const yakuzaiName = rowData.yakuzai || '';
			const data = {
				timing: rowData.timing || '', // Add timing property
				// 日付形式(YYYY-MM-DD)から月と旬を計算するフォールバック
				timingMonth: rowData.timingMonth || (rowData.timing && /^\d{4}-\d{2}-\d{2}$/.test(rowData.timing) ? String(new Date(rowData.timing).getMonth() + 1) : ''),
				timingPeriod: rowData.timingPeriod || (rowData.timing && /^\d{4}-\d{2}-\d{2}$/.test(rowData.timing) ? (new Date(rowData.timing).getDate() <= 10 ? '上旬' : new Date(rowData.timing).getDate() <= 20 ? '中旬' : '下旬') : ''),
				sakumotsu: rowData.sakumotsu || '',
				yakuzai: rowData.yakuzai || '',
				byochu: rowData.byochu || '',
				jiki: rowData.jiki || '',
				kaisu: rowData.kaisu || '-',
				baisu: rowData.baisu || '',
				ekiryo: rowData.ekiryo || '',
				hoho: rowData.hoho || '',
				//yukoseibun: rowData.yukoseibun || '',
				seibun: rowData.seibun || '',
				seibunkaisu: rowData.seibunkaisu || '',
				mid: rowData.mid || ''
			};
			addYakuzaiToPlanRow(newRow, yakuzaiName, data);
		});

		updateRowNumbers(); // 行番号の再採番と成分別使用回数の更新
		isDirty = false;

		// 保存時点の農薬登録情報DB登録更新日(dataset)を表示する
		const dataset = loadedData.dataset ? `作成時DB登録日: ${loadedData.dataset}` : '';
		setDatasetInfo(dataset);

		// jsonファイルを読み込んだので、登録内容更新（refresh）アイコンを有効化する
		document.getElementById('btnRefreshPlan')?.classList.remove('disabled');

		if (!msg) msg = '防除計画/防除記録を読み込みました。';
		alert(msg);

	} catch(err) {
		console.error('JSONファイルの解析に失敗しました:', err);
		alert('ファイルの読み込みに失敗しました。有効なJSONファイルを選択してください。');
	}
}

// planTableの内容をExcelファイルとして保存する関数
async function savePlanTableAsExcel() { // 関数名を savePlanTableExcel から savePlanTableAsExcel に変更
	const table = document.getElementById('planTable');
	if (!table) return;

	const baseName = isRecordMode ? '防除記録' : '防除計画';
	const workbook = new ExcelJS.Workbook();
	const planWorksheet = workbook.addWorksheet(baseName);

	// ヘッダー行を追加 (「操作」列を除く)
	const headers = [];
	table.querySelectorAll('thead th').forEach((th, index) => {
		if (index > 0) headers.push(th.textContent);
	});
	planWorksheet.addRow(headers);

	// データ行を追加 (「操作」列を除く)
	table.querySelectorAll('tbody tr').forEach(tr => {
		const rowData = [];
		tr.querySelectorAll('td').forEach((td, index) => {
			if (index > 0) {
				let cellText;
				if (index === 2) { // 防除時期セル
					cellText = getTimingText(td);
				} else {
					// <br> を改行文字 \n に変換
					cellText = td.innerHTML.replace(/<br\s*\/?>/gi, '\n');
				}
				rowData.push(cellText);
			}
		});
		planWorksheet.addRow(rowData);
	});

	// すべてのセルでテキストの折り返しを有効にする
	planWorksheet.eachRow({ includeEmpty: true }, function(row, rowNumber) {
		row.eachCell({ includeEmpty: true }, function(cell, colNumber) {
			cell.alignment = { wrapText: true, vertical: 'top' };
		});
	});

	// --- 成分別使用回数テーブルを別シートに追加 ---
	const seibunTable = document.getElementById('seibunCountTable');
	if (seibunTable) {
		const seibunWorksheet = workbook.addWorksheet('成分別使用回数');
		const seibunHeaders = [];
		seibunTable.querySelectorAll('thead th').forEach(th => {
			seibunHeaders.push(th.textContent);
		});
		seibunWorksheet.addRow(seibunHeaders);

		// データ行
		seibunTable.querySelectorAll('tbody tr').forEach(tr => {
			const rowData = [];
			tr.querySelectorAll('td').forEach(td => {
				rowData.push(td.textContent);
			});
			seibunWorksheet.addRow(rowData);
		});

		// 合計行 (フッター)
		const tfoot = seibunTable.querySelector('tfoot');
		if (tfoot) {
			tfoot.querySelectorAll('tr').forEach(tr => {
				const rowData = [];
				tr.querySelectorAll('td').forEach(td => {
					rowData.push(td.textContent);
				});
				seibunWorksheet.addRow(rowData);
			});
		}
	}

	// Excel ファイルを生成して保存
	const buffer = await workbook.xlsx.writeBuffer();
	const prefix = getFilenamePrefix(); // 作物名プレフィックス
	const filename = `${prefix}${baseName}_${formatDateTime('date')}.xlsx`;

	// API 非対応ブラウザの場合はダウンロード型保存
	if (!isFileSystemAccessSupported) {
		const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
		saveAs(blob, filename);
		alert('Exelファイルをダウンロードしました。');
		return;
	}

	try {
		const fileHandle = await window.showSaveFilePicker({
			suggestedName: filename,
			types: [{ description: 'JSON Files', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }]
		});
		
		const writable = await fileHandle.createWritable();
		await writable.write(buffer);
		await writable.close();
		alert('ファイルを保存しました');
		
	} catch (err) {
		if (err.name !== 'AbortError') {
			alert('ファイルの保存に失敗しました。');
		}
	}
}

// planTableの内容をクリップボードにコピーする関数
async function copyPlanTableToClipboard() {
	const table = document.getElementById('planTable');
	if (!table) return;

	let data = '';
	const headers = [];
	// ヘッダーを取得（「操作」列を除く）
	table.querySelectorAll('thead th').forEach((th, index) => {
		if (index > 0) { // 0番目の「操作」列をスキップ
			headers.push(th.textContent);
		}
	});
	data += headers.join('\t') + '\n';

	// ボディの各行を取得
	table.querySelectorAll('tbody tr').forEach(row => {
		const rowData = [];
		row.querySelectorAll('td').forEach((td, index) => {
			if (index > 0) { // 0番目の「操作」列をスキップ
				let cellText;
				if (index === 2) { // 防除時期セル
					cellText = getTimingText(td);
				} else {
					cellText = td.textContent.replace(/\n/g, ' '); // セル内の改行はスペースに置換
				}
				rowData.push(cellText);
			}
		});
		data += rowData.join('\t') + '\n';
	});

	try {
		await navigator.clipboard.writeText(data);
		alert('計画をクリップボードにコピーしました。');
	} catch (err) {
		console.error('クリップボードへのコピーに失敗しました: ', err);
		alert('コピーに失敗しました。');
	}
}

// 指定したテーブルの内容をクリップボードにコピーする関数
async function copyTableToClipboard(tableId) {
	const table = document.getElementById(tableId);
	if (!table) return;

	let data = '';
	const headers = [];
	table.querySelectorAll('thead th').forEach(th => headers.push(th.textContent));
	data += headers.join('\t') + '\n';

	table.querySelectorAll('tbody tr').forEach(row => {
		const rowData = [];
		row.querySelectorAll('td').forEach(td => rowData.push(td.textContent));
		data += rowData.join('\t') + '\n';
	});

	const tfoot = table.querySelector('tfoot');
	if (tfoot) {
		tfoot.querySelectorAll('tr').forEach(row => {
			const rowData = [];
			row.querySelectorAll('td').forEach(td => rowData.push(td.textContent));
			data += rowData.join('\t') + '\n';
		});
	}

	try {
		await navigator.clipboard.writeText(data);
		alert('クリップボードにコピーしました。');
	} catch (err) {
		console.error('クリップボードへのコピーに失敗しました: ', err);
		alert('コピーに失敗しました。');
	}
}

// 候補テーブルの行を防除計画テーブルに追加する関数
function addCandidateToPlan(button) {
	const candidateRow = button.closest('tr');
	const cells = candidateRow.cells;

	// 候補テーブルの列インデックス: 1:作物名, 2:薬剤名, 3:対象病害虫, ... 8:使用方法
	const yakuzaiName = cells[2].textContent;
	const rowData = {
		sakumotsu: cells[1].textContent,
		byochu: cells[3].innerHTML,
		jiki: cells[4].textContent,
		kaisu: cells[5].textContent,
		baisu: cells[6].textContent,
		ekiryo: cells[7].textContent,
		hoho: cells[8].textContent,
		//yukoseibun: cells[9].innerHTML,
		seibun: cells[9].innerHTML,
		seibunkaisu: cells[10].innerHTML,
		mid: cells[11].innerHTML
	};

	const planTableBody = document.querySelector('#planTable tbody');
	if (planTableBody) {
		const newRow = planTableBody.insertRow();
		addYakuzaiToPlanRow(newRow, yakuzaiName, rowData);
		updateRowNumbers();
	}
}

// テーブルに行を追加し、ボタンを設定する
function addYakuzaiToPlanRow(row, yakuzaiName, data) {
	// 操作ボタンのセル
	const actionCell = row.insertCell(0);
	actionCell.classList.add('actions');

	actionCell.innerHTML = 
		`<svg class="svg_button" onclick="deleteRow(this)"><title>削除</title><use href="icons.svg?v=3#trash-x"></use></svg>` +
		`<svg class="svg_button" onclick="moveRow(this, 'up')"><title>上へ移動</title><use href="icons.svg?v=3#arrow-up"></use></svg>` +
		`<svg class="svg_button" onclick="moveRow(this, 'down')"><title>下へ移動</title><use href="icons.svg?v=3#arrow-down"></use></svg>`;

	// No, 薬剤名, ... 他の空セル
	row.insertCell(1); // No
	
	const timingCell = row.insertCell(2);
	renderTimingCell(timingCell, data);

	row.insertCell(3).textContent = data.sakumotsu || ''; // 作物名
	row.insertCell(4).textContent = yakuzaiName; // 薬剤名
	row.insertCell(5).innerHTML = data.byochu || ''; // 対象病害虫
	row.insertCell(6).textContent = data.jiki || ''; // 使用時期
	row.insertCell(7).textContent = data.kaisu || ''; // 回数
	row.insertCell(8).textContent = data.baisu || ''; // 希釈倍率
	row.insertCell(9).textContent = data.ekiryo || ''; // 使用量
	row.insertCell(10).textContent = data.hoho || ''; // 使用方法
	row.insertCell(11).innerHTML = data.seibun || ''; // 成分
	row.insertCell(12).innerHTML = data.seibunkaisu || ''; // 成分回数
	row.insertCell(13).innerHTML = data.mid || ''; // RAC
}

// タイミングセルの内容を描画・更新するヘルパー
function renderTimingCell(cell, data) {
	cell.innerHTML = '';
	cell.classList.add('timing-cell');

	if (isRecordMode) {
		// 日付入力フィールド
		const dateDisplayWrapper = document.createElement('div'); // This is the wrapper for the display span and hidden input
		dateDisplayWrapper.classList.add('date-display-wrapper');

		const displayLabel = document.createElement('label'); // labelに変更
		// inputと紐付けるための一意なIDを生成
		const uniqueId = 'plan_date_' + Math.random().toString(36).substring(2, 7) + '_' + Date.now();
		displayLabel.htmlFor = uniqueId;

		let displayText = '';
		if (data.timing) {
			displayText = data.timing;
		} else if (data.timingMonth && data.timingPeriod) {
			displayText = `${data.timingMonth}月${data.timingPeriod}`;
		} else {
			displayText = '日付選択';
		}
		displayLabel.textContent = displayText;

		const dateInput = document.createElement('input');
		dateInput.type = 'date';
		dateInput.id = uniqueId;
		dateInput.value = data.timing && /^\d{4}-\d{2}-\d{2}$/.test(data.timing) ? data.timing : '';

		dateInput.onchange = function() {
			displayLabel.textContent = this.value;
			// 先頭行が日付になったら、他の行も（もし未設定なら）自動で合わせるためのフックポイント
			updateRowNumbers();
		};
		dateInput.onclick = function(e) { e.stopPropagation(); };

		dateDisplayWrapper.onclick = function() {
			// labelクリックによりinputが反応するが、ブラウザ互換性のためにshowPickerも維持
			if (typeof dateInput.showPicker === 'function') {
				try { dateInput.showPicker(); } catch (e) {}
			}
		};

		dateDisplayWrapper.appendChild(displayLabel);
		dateDisplayWrapper.appendChild(dateInput);
		cell.appendChild(dateDisplayWrapper);
	} else {
		// 月旬セレクタ
		const timingDiv = document.createElement('div');
		timingDiv.classList.add('timing');
		// data.timing が YYYY-MM-DD 形式ならそのまま表示
		if (data.timing && /^\d{4}-\d{2}-\d{2}$/.test(data.timing)) {
			//timingDiv.textContent = formatToYYMMDD(data.timing);
			timingDiv.textContent = data.timing;
		} else {
			const monthSelect = document.createElement('select');
			monthSelect.className = 'timing-month';
			monthSelect.innerHTML = '<option value="">月</option>' + Array.from({length: 12}, (_, i) => `<option value="${i+1}">${i+1}月</option>`).join('');
			monthSelect.value = data.timingMonth || '';
			const periodSelect = document.createElement('select');
			periodSelect.className = 'timing-period';
			const periods = ['上旬', '中旬', '下旬'];
			periodSelect.innerHTML = '<option value="">旬</option>' + periods.map(p => `<option value="${p}">${p}</option>`).join(''); // Option for period
			periodSelect.value = data.timingPeriod || '';

			monthSelect.onchange = updateRowNumbers;
			periodSelect.onchange = updateRowNumbers;

			timingDiv.appendChild(monthSelect);
			timingDiv.appendChild(periodSelect);
		}
		cell.appendChild(timingDiv);
	}
}

// モード切り替え
function toggleRecordMode(checked) {
	isRecordMode = checked;
	const planTableBody = document.querySelector('#planTable tbody');
	if (!planTableBody) return;

	Array.from(planTableBody.rows).forEach(row => {
		const timingCell = row.cells[2];
		const	[currentTiming, currentMonth, currentPeriod] = getTimingArray(!isRecordMode, timingCell);

		renderTimingCell(timingCell, {
			timing: currentTiming,
			timingMonth: currentMonth,
			timingPeriod: currentPeriod
		});
	});
	updateRowNumbers();
}

// 行を削除する
function deleteRow(button) {
	const row = button.closest('tr');
	row.parentNode.removeChild(row);
	updateRowNumbers();
}

// 行を移動する
function moveRow(button, direction) {
	const row = button.closest('tr');
	const tbody = row.parentNode;
	if (direction === 'up' && row.previousElementSibling) {
		tbody.insertBefore(row, row.previousElementSibling);
	} else if (direction === 'down' && row.nextElementSibling) {
		tbody.insertBefore(row.nextElementSibling, row);
	}
	updateRowNumbers();
}

// 防除時期で計画をソートする関数
function sortPlanByTiming() {
	const planTableBody = document.querySelector('#planTable tbody');
	if (!planTableBody) return;
	const rows = Array.from(planTableBody.rows);
	const periodMap = { '上旬': 1, '中旬': 2, '下旬': 3, '': 0 }; // 0 for unspecified period

	rows.sort((a, b) => {
		// Row A の値を取得
		const dateInputA = a.querySelector('.timing-cell input[type="date"]');
		const monthSelectA = a.querySelector('.timing-cell .timing-month');
		const periodSelectA = a.querySelector('.timing-cell .timing-period');

		let valA = null;
		if (dateInputA && dateInputA.value) {
			valA = new Date(dateInputA.value).getTime(); // Convert to timestamp for sorting
		} else if (monthSelectA && monthSelectA.value && periodSelectA && periodSelectA.value) {
			const m = parseInt(monthSelectA.value, 10);
			const p = periodMap[periodSelectA.value] || 0;
			valA = m * 10 + p; // Numeric representation for month/period
		}

		// Row B の値を取得
		// Row B values
		const dateInputB = b.querySelector('.timing-cell input[type="date"]');
		const monthSelectB = b.querySelector('.timing-cell .timing-month');
		const periodSelectB = b.querySelector('.timing-cell .timing-period');

		let valB = null;
		if (dateInputB && dateInputB.value) {
			valB = new Date(dateInputB.value).getTime();
		} else if (monthSelectB && monthSelectB.value && periodSelectB && periodSelectB.value) {
			const m = parseInt(monthSelectB.value, 10);
			const p = periodMap[periodSelectB.value] || 0;
			valB = m * 10 + p;
		}

		// Handle null/undefined values (unspecified timing) by pushing them to the end
		if (valA === null && valB === null) return 0;
		if (valA === null) return 1; // A is unspecified, push to end
		if (valB === null) return -1; // B is unspecified, push to end

		return valA - valB;
	});

	rows.forEach(row => planTableBody.appendChild(row));
	updateRowNumbers();
}

// No. の再採番とボタンの状態更新
function updateRowNumbers() {
	const planTableBody = document.querySelector('#planTable tbody');
	if (!planTableBody) return;

	// 事故防止のため、ここに来た段階で自動保存データを削除して復元ボタンを隠す
	if (localStorage.getItem('unsavedPlan')) {
		localStorage.removeItem('unsavedPlan');
		document.getElementById('btnRestorePlan')?.classList.add('hidden');
	}

	const rows = planTableBody.rows;
	const hasRows = rows.length > 0;
	isDirty = hasRows;

	// 行がない場合は記録モード解除
	if (!hasRows) {
		isRecordMode = false;
		const checkRecordMode = document.getElementById('checkRecordMode');
		if (checkRecordMode) checkRecordMode.checked = false;
	}

	// 作物ツリーのロック制御
	const cropTree = document.getElementById('cropTree');
	if (cropTree) {
		cropTree.classList.toggle('locked', hasRows);
		cropTree.title = hasRows ? '計画にデータがあるため作物の変更はできません。' : '';
	}

	tabExecuted = hasRows; // 防除計画に行があれば実行済み
	['btnSortPlan', 'btnCopyPlan', 'btnExcelPlan', 'btnSavePlan', 'btnSavePlanAs'].forEach(id => {
		const btn = document.getElementById(id);
		if (btn) {
			btn.classList.toggle('disabled', !hasRows);
		}
	});

	let noCounter = 0;
	for (let i = 0; i < rows.length; i++) {
		const row = rows[i];
		// 変更候補行とペアになっている旧データ行（row-not-found ではない hidden 行）だけを連番から除外する。
		// notFoundYakuzai行（row-not-found）はペアの新しい行を持たないため、通常どおり自分自身の番号を持つ。
		const isPairedOldRow = row.hasAttribute('hidden') && !row.classList.contains('row-not-found');

		// No. を更新
		if (!isPairedOldRow) {
			row.cells[1].textContent = ++noCounter;
		}
		row.cells[1].className = 'No';

		// ボタンの状態を更新
		const icons = row.cells[0].querySelectorAll('svg');
		const upIcon = icons[1];
		const downIcon = icons[2];
		
		if (upIcon) {
			upIcon.classList.toggle('disabled', i === 0);
		}
		if (downIcon) {
			downIcon.classList.toggle('disabled', i === rows.length - 1);
		}
	}

	// 変更候補行とペアになっている旧データ行には、対応する行（直後の行。なければ直前の行）と同じNoを表示する
	for (let i = 0; i < rows.length; i++) {
		const row = rows[i];
		if (!row.hasAttribute('hidden') || row.classList.contains('row-not-found')) continue;
		const refRow = rows[i + 1] || rows[i - 1];
		if (refRow && row.cells[1] && refRow.cells[1]) {
			row.cells[1].textContent = refRow.cells[1].textContent;
		}
	}

	// 各カウントテーブルを更新
	updateYakuzaiCountTable();
	updateSeibunCountTable();

	// hidden属性の旧データ行（refreshPlanで作成）が1件でもあれば「旧データ一括削除」ボタンを表示する
	const hasOldDataRows = Array.from(rows).some(row => row.hasAttribute('hidden'));
	document.getElementById('btnDeleteOldRows')?.classList.toggle('hidden', !hasOldDataRows);

	// 旧データ行(olddata)が発生したことがある状態から、すべて削除されて0件になったら、
	// 「作成時DB登録日」の表示を「更新時DB登録日」に変更
	if (hasOldDataRows) {
		hasHadOldDataRows = true;
	} else if (hasHadOldDataRows) {
		setDatasetInfo('更新時DB登録日: ' + currentDbUpdate);
		hasHadOldDataRows = false;
	}
}

// refreshPlan によって hidden 属性が付いた旧データ行（変更候補あり／notFoundYakuzai）を一括削除する
function deleteOldDataRows() {
	const planTableBody = document.querySelector('#planTable tbody');
	if (!planTableBody) return;

	const oldRows = Array.from(planTableBody.rows).filter(row => row.hasAttribute('hidden'));
	if (oldRows.length === 0) return;

	if (!confirm(`旧データ行（変更候補のある行、または現在の作物条件で登録が見つからない行）を ${oldRows.length} 件削除します。よろしいですか？`)) {
		return;
	}

	oldRows.forEach(row => row.remove());
	updateRowNumbers();
}

// ==== 使用回数上限の超過判定 (成分別・内訳枠): 時期/方法/対象の3軸で規定文を解釈する ====
/*
 * 【全体像】
 *  入力  : 計画表の使用行(1行 = 1回の使用。「使用回数」列の値は使わない)と、有効成分ごとの成分回数(seibunkaisu)の規定文
 *  規定文: 「4回以内(は種時の土壌混和は1回以内、生育期の株元灌注は1回以内、散布は合計2回以内)」のように、
 *          先頭が総量、括弧内が「使用時期・使用方法・対象(剤型など)ごとの内訳上限」
 *  処理  : ①規定文を「枠(slot)」と「条件(atom)」に分解する(parseRule)
 *          ②使用行を 時期(positions) / 方法(methods) / 対象(targets・form) に分解する(normalizeRow)
 *          ③行と条件を 3値(yes/maybe/no)で照合し、行を1つの枠に割り当てる(assign)
 *          ④枠ごとに使用回数を数え、上限超過を NG、確定できない使用を含めて超えるなら 要確認 とする(judge)
 *  方針  : 解釈できないものを黙って OK にしない。確定した使用だけで超えたときだけ NG、それ以外の不明は 要確認。
 *
 *  【用語】
 *   枠(slot)   : 「Xは合計N回以内」1つ分の上限。{ id, label, limit, overlay, parentAtoms }。
 *                「合計」または条件が1つなら複数条件で1枠を共有、「合計」なしの列挙は条件ごとに別枠になる。
 *   条件(atom) : 枠に属する1つの条件(例: 「は種時の土壌混和」)。時期・方法・対象のうち書かれた軸だけを持つ。
 *   overlay    : 入れ子の括弧(内数)。親の条件と自分の条件の両方に当てはまる行を数える追加の枠。
 *   位置(P)    : 作業時期を時間軸上の位置に置き換えた番号(下の P)。
 *   3値照合    : yes=確実に該当 / maybe=該当するかもしれない(情報不足) / no=該当しない。
 *                枠を1つに確定できた行だけを「確定」として数え、確定できない行は「可能性」として別に数える。
 *
 *  【公開】 UsageLimit.judge(items) だけ。ほかはすべてこの関数の内部用。
 */
const UsageLimit = (() => {

// ============================================================ メモ化(計画表の更新ごとに再計算しない)
const jikiCache = new Map();   // 使用時期の文字列 → parseJikiRaw の結果
const ruleCache = new Map();   // 規定文(作物別規定は作物名も含む) → parseRuleRaw の結果
const rowCache = new Map();    // 「時期・方法・液量・薬剤名・剤型」の組 → normalizeRowRaw の結果
/** cache から key の値を返す。無ければ make() で作って保存する(結果は変更しない前提で共有する) */
function memo(cache, key, make) {
  let v = cache.get(key);
  if (v === undefined) { v = make(); cache.set(key, v); }
  return v;
}
/** 使用時期の文字列を解析する(メモ化)。戻り値は parseJikiRaw を参照 */
const parseJiki = (t) => memo(jikiCache, String(t == null ? '' : t), () => parseJikiRaw(t));
/**
 * 規定文を解析する(メモ化)。t: 規定文、sakumotsu: 行の作物名。
 * 作物別の規定(数字で始まらない文)だけが作物名で結果が変わるので、そのときだけキャッシュのキーに作物名を含める
 */
const parseRule = (t, sakumotsu) => {
  const text = String(t == null ? '' : t);
  const key = /^\s*\d/.test(text) ? text : text + '\u0000' + (sakumotsu || '');
  return memo(ruleCache, key, () => parseRuleRaw(text, { sakumotsu }));
};
/** 使用行 r = { jiki, hoho, ekiryo, yakuzai, zaikei } を照合用の形に正規化する(メモ化)。戻り値は normalizeRowRaw を参照 */
const normalizeRow = (r) => memo(rowCache, [r.jiki, r.hoho, r.ekiryo, r.yakuzai, r.zaikei].join('\u0001'), () => normalizeRowRaw(r));

// ============================================================ 時期の語彙
// 作業時期を1本の時間軸(年内の作業順)上の位置に置き換える。範囲(A～B)は両端の間の位置をすべて含めて扱う
//   PRE  =0 作付前・耕起前・前作(土壌消毒など)   SOWB =1 は種前(浸種・催芽を含む)   SOW  =2 は種時・直播時
//   RAISE=3 育苗期(は種後～移植前)               PLB  =4 移植・定植・植付の前       PL   =5 移植時・定植時(当日・同時)
//   PLA  =6 移植・定植の直後(植付後萌芽前を含む) GROW =7 生育期・本田・発生期など   HILL =8 土寄せ時・土寄せ後(生育期の後半)
//   HARV =9 収穫期                               AFTER=10 収穫後・剪定後(次作までの休閑期)
const P = { PRE: 0, SOWB: 1, SOW: 2, RAISE: 3, PLB: 4, PL: 5, PLA: 6, GROW: 7, HILL: 8, HARV: 9, AFTER: 10 };
const P_MAX = 10;   // 位置の最大値(AFTER)
/** a から b までの整数配列(両端を含む)。範囲の間を埋めるのに使う */
const range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };

/** 文字列の正規化: 全角→半角(NFKC)、波ダッシュ類(~〜～)を「~」に統一、空白を除去。比較・解析の前に必ず通す */
function norm(s) {
  return String(s == null ? '' : s).normalize('NFKC').replace(/[~〜～]/g, '~').replace(/\s+/g, '');
}

/** 時期の比較キー: 括弧書き・但し書き・語尾(まで/までの処理)を除いた文字列。行の時期と規定文の枠条件が同じ表現かの判定に使う */
function timeKeyOf(t) {
  return norm(t).replace(/\([^)]*\)/g, '').replace(/^[^:、~]{1,12}:/, '').replace(/(但し|ただし|但).*$/, '').replace(/までの処理$|まで$|の処理$|処理$/, '');
}

/**
 * 1つの語(「移植3日前」「定植直後」等)を 作業基準 + 相対位置 に分解する。戻り値 { term, anchor, rel, lit }
 *   anchor: 基準となる作業。'PLANT'(移植・定植・植付) / 'SOW'(は種) / 'RAISE'(育苗) / 'AFTER'(収穫後・剪定後) /
 *           'PRE'(作付前・耕起) / 'GROW'(生育期・発生期などの生育の語) / null(基準なし)
 *   rel   : 基準に対する相対位置。'before'(前) / 'at'(時・当日・同時) / 'just_after'(直後) / 'after'(後) / 'during'(期間中) / null
 *   lit   : 位置に置けない季節・月の語(休眠期・夏・6月・融雪後 など)をそのままの文字列で保持する。これは文字列の一致で照合する
 * 上から順に最初に当たった分類を採用する(順序が意味を持つ。例: 「育苗トレイ」は時期でなく対象なので育苗の分類から除外している)
 */
function scanTerm(t) {
  let anchor = null;   // 基準となる作業(上記)
  let lit = null;      // 位置に置けない語(季節・月)
  let rel = null;      // 基準との前後関係(上記)
  if (/移植|定植|植付|植え付け|田植|植栽|挿苗/.test(t)) anchor = 'PLANT';   // 挿苗(かんしょ等)は定植と同じ
  else if (/浸種|催芽/.test(t)) { anchor = 'SOW'; rel = 'before'; }
  else if (/は種|播種|直播|種まき/.test(t)) anchor = 'SOW';
  else if (/育苗(?!箱|トレイ|ポット|培土)/.test(t)) anchor = 'RAISE';   // 「育苗トレイ」は時期ではなく対象
  else if (/(収穫|摘採|剪定|刈取)(直|終了|約\d+[カケヶ]?月)?後/.test(t)) anchor = 'AFTER';
  else if (/作付|耕起|前作|地ごしらえ|整地|残渣|土壌消毒/.test(t)) anchor = 'PRE';
  else if (/休眠|根雪|夏期|冬期|秋期|春期|積雪|落葉|萌芽前|夏|冬/.test(t)) lit = (t.match(/休眠期?|根雪前?|夏期?|冬期?|秋期?|春期?|積雪期?|落葉期?|萌芽前|夏|冬/) || [t])[0];
  else if (/発芽前|出芽前|緑化|鉢上げ|苗床/.test(t)) { anchor = 'RAISE'; rel = 'during'; }
  else if (/植代|しろかき|代かき/.test(t)) { anchor = 'PLANT'; rel = 'before'; }   // 植代 = 移植の少し前
  else if (/融雪後/.test(t)) lit = '融雪後';
  else if (/\d+月/.test(t)) lit = t.match(/\d+月/)[0];
  else if (/土寄/.test(t)) anchor = 'HILL';   // 土寄せ(培土)は生育期の途中の作業。「土寄せ後」は萌芽前・生育初期を含まない
  else if (/本田|本圃|生育|発生|発病|雑草(?!茎葉)|萌芽|葉期|出穂|穂|幼虫|成虫|着色|結実|展葉|伸長|培土|出蕾|成熟|新梢|開花|満開|発芽|抽苔|果実|肥大|落花|株元|収穫期|収穫始|収穫直前|果|苗立|病斑|若齢|初期|終期|盛期|始期|期/.test(t)) anchor = 'GROW';
  if (rel == null) {
    if (/直後/.test(t)) rel = 'just_after';
    else if (/後/.test(t)) rel = 'after';
    else if (/前/.test(t)) rel = 'before';
    else if (/当日|同時|時/.test(t)) rel = 'at';
  }
  return { term: t, anchor, rel, lit };
}

/**
 * 行(使用時期)側: scanTerm の結果が指す位置の集合(P の値の配列)を返す。行は「実際にいつ使ったか」なので点に近い。
 * 例: 「移植前」→[PLB]、「移植後」→[PLA, GROW]、「は種後」→[RAISE]、「定植時」→[PL]
 */
function rowPositions(sc) {
  const a = sc.anchor;   // 基準の作業
  if (a === 'PLANT') return sc.rel === 'before' ? [P.PLB] : sc.rel === 'after' ? [P.PLA, P.GROW] : sc.rel === 'just_after' ? [P.PLA] : [P.PL];
  if (a === 'SOW') return sc.rel === 'before' ? [P.SOWB] : sc.rel === 'just_after' || sc.rel === 'after' ? [P.RAISE] : [P.SOW];
  if (a === 'RAISE') return [P.RAISE];
  if (a === 'PRE') return [P.PRE];
  if (a === 'AFTER') return [P.AFTER];
  if (a === 'GROW') return [P.GROW];
  if (a === 'HILL') return sc.rel === 'before' ? [P.GROW] : [P.HILL];
  return [];
}

/**
 * 規定文(atom)側: 「までの処理」「〜後」「〜前」の意味を区間に展開した位置の配列を返す。規定は「その時期の使用すべて」を指すので区間になる。
 * upto: 「定植時までの処理」のように「まで」で終わる条件(=その時点までの全期間)のとき true
 * 例: 「定植時までの処理」→ PRE～PL、「定植後」→ PLA～AFTERの手前、「本田」→ PLA～AFTERの手前
 */
function atomPositions(sc, upto) {
  const a = sc.anchor;   // 基準の作業
  // 以降の at/bef/aft は、基準が定植か は種かで決まる「その時・その前・その直後」の位置
  if (!a) return [];
  if (a === 'GROW') return /本田|本圃/.test(sc.term) ? range(P.PLA, P_MAX - 1) : [P.PLA, P.GROW, P.HILL, P.HARV];
  if (a === 'HILL') return upto ? [P.PLA, P.GROW, P.HILL] : sc.rel === 'before' ? [P.PLA, P.GROW] : [P.HILL, P.HARV];
  if (a === 'AFTER') return [P.AFTER];
  if (a === 'PRE') return sc.rel === 'before' || upto ? range(P.PRE, P.PRE) : [P.PRE];
  if (a === 'RAISE') return [P.RAISE];
  const at = a === 'PLANT' ? P.PL : P.SOW;
  const bef = a === 'PLANT' ? P.PLB : P.SOWB;
  const aft = a === 'PLANT' ? P.PLA : P.RAISE;
  if (upto) return range(P.PRE, at);
  if (sc.rel === 'before') return range(P.PRE, bef);
  if (sc.rel === 'just_after') return [aft];
  if (sc.rel === 'after') return range(aft, P_MAX - 1);
  return [at];
}

/** 「は種又は定植21日前まで」のように、後ろの語だけが持つ相対位置(前・後など)を、相対位置を持たない前の語に引き継ぐ。scans を直接書き換える */
function inheritRel(scans) {
  for (let i = scans.length - 2; i >= 0; i--) {
    if (scans[i].anchor && scans[i].rel == null && scans[i + 1].rel != null) scans[i].rel = scans[i + 1].rel;
  }
}

const LIST_SEP = /又は|または|もしくは|及び|並びに|かつ|、|,/;   // 語の列挙の区切り(時期・方法・条件の列挙で共通)
// 「収穫前日まで」「14日前まで」のように、時期語を含まず収穫前日数(PHI)だけを表す文字列
const PHI_ONLY = /^(?:収穫|摘採|出荷|摘心)?(?:\d+日)?前(?:日)?まで$/;

/**
 * 使用時期文字列 → { positions, literals, phi, empty, implied, unresolved }
 *   phi: 収穫前日数(「収穫前日まで」=1)。時期語ではない
 *   implied: 時期語が無く収穫前日数だけ → 圃場に作物がある期間とみなす
 */
function parseJikiRaw(text) {
  // res: 戻り値。timeKey=比較キー、phi=収穫前日数、positions=時間軸上の位置(P)の集合、literals=季節・月の語の集合、
  //      empty=時期の記載なし、implied=収穫前日数だけなので「作物が圃場にある期間」とみなした、unresolved=解釈できなかった語
  const res = { raw: String(text == null ? '' : text), timeKey: timeKeyOf(text), phi: null, positions: new Set(), literals: new Set(), empty: false, implied: false, unresolved: [] };
  const s = norm(text);   // 正規化した時期文字列
  if (s === '' || s === '-') { res.empty = true; return res; }

  const m = s.match(/(?:収穫開始|収穫|摘採|出荷|摘心)(?:(\d+)日)?前(日)?まで/);
  if (m) res.phi = m[1] ? Number(m[1]) : 1;

  // main: 括弧書き・「1回目:」のような見出し・但し書き(収穫前日数など)を除いた、時期語だけの文字列
  let main = s.replace(/\([^)]*\)/g, '').replace(/^[^:、~]{1,12}:/, '').replace(/(但し|ただし|但).*$/, '');
  // 範囲の終点に付く「収穫N日前まで」は時期語ではないので取り除く(phiとして保持済み)
  main = main.replace(/(?:~|から)?(?:[^、~]*?の)?(?:収穫開始|収穫|摘採|出荷|摘心)(?:\d+日)?前(?:日)?まで/g, '');
  if (main === '' || PHI_ONLY.test(main)) {
    if (res.phi != null) {
      res.implied = true;
      [P.PLA, P.GROW, P.HILL, P.HARV].forEach((p) => res.positions.add(p));
    } else res.empty = true;
    return res;
  }

  parsePeriod(main, res);
  return res;
}

/**
 * 時期の文字列(「A～B」「AからB」「A又はB」)を positions/literals/unresolved に解釈して res に足す。
 * 使用行の時期と、規定文の内訳条件(「収穫終了後～落葉期までは3回以内」など)で同じ関数を使い、
 * 同じ文字列なら必ず同じ結果になるようにする。
 */
function parsePeriod(main, res) {
  // parts: 「~」「から」で分けた範囲の各端(1つなら範囲ではない)。partScans: 各端を「又は・及び」でさらに分けた語の scanTerm 結果
  const parts = main.split(/(?<!\d)~|~(?!\d)|から/).filter(Boolean);
  const partScans = parts.map((part) => {
    const scans = part.split(LIST_SEP).filter(Boolean).map(scanTerm);
    inheritRel(scans);
    return scans;
  });
  // 「移植3日前～当日」の「当日」のように基準語を持たない終点は、もう一方の基準語を借りる
  const anchors = partScans.flat().filter((sc) => sc.anchor);
  if (anchors.length) {
    partScans.flat().forEach((sc) => {
      if (!sc.anchor && !sc.lit && (sc.rel === 'at' || sc.rel === 'after' || sc.rel === 'before')) sc.anchor = anchors[0].anchor;
    });
  }
  // 「移植直後～15日」「移植後3日～10日」の「15日」「10日」のように、日数だけの終点は、直前の端の基準を引き継ぐ
  // (直前が「前」なら前、それ以外は後。「移植前3日～1日」なら移植前、「移植後3日～10日」なら移植後)
  partScans.forEach((scans, pi) => {
    if (pi === 0 || scans.length !== 1 || !/^\d+日(間)?$/.test(scans[0].term)) return;
    const prev = partScans[pi - 1].filter((sc) => sc.anchor).pop();
    if (prev) { scans[0].anchor = prev.anchor; scans[0].rel = prev.rel === 'before' ? 'before' : 'after'; }
  });
  const partPos = [];   // 各端が指す位置の集合(範囲の端どうしの前後関係を見るため、端ごとに保持する)
  partScans.forEach((scans) => {
    const pos = new Set();
    scans.forEach((sc) => {
      const ps = rowPositions(sc);
      if (ps.length) ps.forEach((p) => pos.add(p));
      else if (sc.lit) res.literals.add(sc.lit);
      else res.unresolved.push(sc.term);
    });
    partPos.push(pos);
  });
  // 「植付後萌芽前」「植付後～萌芽前」のように移植・植付の後で萌芽(発芽・出芽)前までの期間は、植付直後の位置(PLA)だけ。
  // 生育期(GROW)以降は含まない。「休眠期～萌芽前」など植付を伴わない萌芽前は、従来どおり季節の語として扱う
  if (/(萌芽|発芽|出芽)前/.test(main) && partPos.some((ps) => ps.has(P.PLA))) {
    partPos.forEach((ps) => { ps.delete(P.GROW); ps.delete(P.HILL); ps.delete(P.HARV); });
    res.literals.add('萌芽前');   // 「萌芽前」の枠(季節の語)と照合するために残す
    res.preEmerge = true;         // 植付後・萌芽前の行(matchTime で、生育期・萌芽後の枠には当てず、萌芽前の枠には確定させる)
  }
  const all = new Set();   // 全端の位置の和集合(範囲でないときはこれがそのまま結果、範囲のときは最小～最大の間を埋める)
  partPos.forEach((ps) => ps.forEach((p) => all.add(p)));
  if (parts.length >= 2 && partPos.every((ps) => ps.size > 0)) {
    const first = partPos[0];
    const last = partPos[partPos.length - 1];
    if (Math.max(...first) > Math.min(...last)) {
      // 終点が始点より前の位置 = 年をまたぐ期間(収穫終了後から萌芽まで 等)。生育期などは含めず、始点側だけを使う
      first.forEach((p) => res.positions.add(p));
    } else {
      range(Math.min(...all), Math.max(...all)).forEach((p) => res.positions.add(p));   // 範囲は間を埋める
    }
  } else all.forEach((p) => res.positions.add(p));
  return res;
}

// ============================================================ 方法・対象の語彙
// 方法は「種類/細分」の階層で持つ。規定の「散布」(親)は、行の「株元散布」(SPRAY/BASE)を含むが、逆は「かもしれない」(maybe)になる。
//   SPRAY 散布(/AERIAL 無人航空機・空中, /FLOOD 湛水, /BASE 株元, /FOLIAGE 茎葉・葉面)   DRENCH 灌注(/BASE 株元, /SOIL 土壌)
//   MIX 混和(/SOIL 土壌混和)   SIDE 側条施用   COAT 塗布   SEEDTREAT 種子処理(粉衣・浸漬)   TRUNK 樹幹   FUME くん煙・くん蒸
//   JET 噴射   THROW 投げ入れ・滴下   INJECT 注入   STOCK 株処理   ROWTREAT 畦間処理
const METHODS = [
  ['SPRAY/AERIAL', /無人航空機|無人ヘリ|空中散布|航空散布|ドローン/],
  ['SPRAY/FLOOD', /湛水散布|湛水周縁散布|落水散布|原液湛水/],
  ['SPRAY/BASE', /株元散布/],
  ['SPRAY/FOLIAGE', /茎葉散布|葉面散布|茎葉兼/],   // 「雑草茎葉兼土壌散布」も茎葉への散布を含む
  ['DRENCH/BASE', /株元灌注|株元かん注/],
  ['DRENCH/SOIL', /土壌灌注|土壌かん注/],
  ['MIX/SOIL', /土壌混和|全面混和|作条混和/],
  ['SIDE', /側条施用|側条/],
  ['COAT', /塗布|塗沫|塗抹/],
  ['SEEDTREAT', /粉衣|浸漬|種子処理/],
  ['TRUNK', /樹幹/],
  ['FUME', /くん煙|くん蒸|煙霧/],
  ['JET', /噴射/],
  ['THROW', /投げ入れ|投入|滴下/],
  ['INJECT', /注入/],
  ['STOCK', /株処理|株元処理/],
  ['ROWTREAT', /畦間処理|畦間/],
  ['HOLE', /植穴/],                                   // 植穴処理(定植時の植穴への施用)
  ['SOILAPPLY', /土中施用|(?:は種|播種)同時施(?:薬|用)/],   // は種同時施薬機を用いた土中施用
];
// 細分が特定できないときの汎用の方法(「散布」とだけ書かれた行など)。細分が見つかった場合は重ねて付けない
const GENERIC = [['SPRAY', /散布/], ['DRENCH', /灌注|かん注|灌水/], ['MIX', /混和/]];
// 「樹幹散布」「種子粉衣」のように対象が方法を決める語は、汎用の散布/灌注を重ねない
const EXCLUSIVE = ['TRUNK', 'SEEDTREAT', 'COAT', 'FUME', 'JET', 'THROW', 'INJECT', 'STOCK', 'ROWTREAT', 'SIDE', 'HOLE', 'SOILAPPLY'];

/** 文字列 t に含まれる方法の集合(METHODS のキー / 汎用キー)を返す。行の使用方法にも規定文の条件にも使う */
function scanMethods(t) {
  const set = new Set();   // 見つかった方法
  METHODS.forEach(([k, re]) => { if (re.test(t)) set.add(k); });
  // 「培土に均一に混和する」「床土に混和」など、土(培土・床土・覆土・土壌)へ混ぜる記述は土壌混和とみなす。
  // 散布や灌注などを併記している場合(「散布して土壌と混和」)は別の方法が主なので、ここでは決めない
  if (/混和/.test(t) && /土/.test(t) && !/散布|灌注|かん注|灌水|くん蒸|噴射/.test(t) && ![...set].some((x) => x.startsWith('MIX'))) set.add('MIX/SOIL');
  const exclusive = EXCLUSIVE.some((k) => set.has(k));
  GENERIC.forEach(([k, re]) => {
    if (!exclusive && re.test(t) && ![...set].some((x) => x === k || x.startsWith(k + '/'))) set.add(k);
  });
  return set;
}

// 処理の対象。NURSERY=育苗箱・トレイ・ポット  BED=床土・覆土  SEED=種子・種いも・球根  FIELD=圃場・本圃
//   これに加えて、剤型は 'FORM:粒剤' のように scanTargets が動的に追加する(剤型別の規定用)
const TARGETS = [
  ['NURSERY', /育苗箱|育苗トレイ|セルトレイ|セル成型|ペーパーポット|育苗ポット|苗床/],
  ['BED', /床土|覆土/],
  ['SEED', /種子|種もみ|種籾|種いも|種イモ|種芋|種球|球根|浸種/],
  ['FIELD', /圃場|ほ場|本圃/],
];
// 剤型として認識する語。規定文中の剤型の検出と、辞書の zaikei が剤型を表す語かの判定(その他・農薬肥料などを除く)に使う
const FORMS = /粒剤|粉剤|乳剤|水和剤|水溶剤|エアゾル剤|くん煙剤|フロアブル|顆粒|液剤|ゾル|油剤|マイクロカプセル|ジャンボ|パック/;

/** 文字列 t に含まれる対象('NURSERY' など)と剤型('FORM:粒剤' など)の集合を返す */
function scanTargets(t) {
  const set = new Set();   // 見つかった対象・剤型
  TARGETS.forEach(([k, re]) => { if (re.test(t)) set.add(k); });
  const f = t.match(FORMS);
  if (f) set.add('FORM:' + f[0]);
  return set;
}

// ============================================================ 規定文のパース
function normalizeParen(s) { return norm(s); }   // (旧名。現在は norm と同じ)

/**
 * 節の条件部(「は種時の土壌混和、定植時の株元散布」など)を、列挙ごとの atom の配列にする。
 * atom = { raw, timeKey, timeOnly, positions, literals, methods, targets, parsed, specificity, fieldStart }
 *   positions/literals : 時期の条件(位置の集合 / 季節・月の語の集合)。どちらも空なら時期の指定なし
 *   methods / targets  : 方法の条件 / 対象・剤型の条件。空なら指定なし
 *   timeKey            : 時期表現の比較キー(行の時期と同じ表現かの判定用)。timeOnly: 時期だけの条件(方法・対象の指定なし)
 *   specificity        : 指定された軸の数(時期1+方法1+対象の数)。複数の枠に当てはまるときは大きいほうを優先する
 *   parsed             : 何か1つでも解釈できたか(false なら「条件を解釈できません」の警告)
 *   fieldStart         : 「本田・本圃」を含む条件か(田植同時の行を優先的にここへ割り当てるため)
 */
function parseAtomList(cond) {
  const items = cond.split(LIST_SEP).filter(Boolean);   // 列挙を分けた各条件の文字列
  const scans = items.map((it) => scanTerm(it.replace(/までの処理$|まで$|の処理$|処理$/, '')));
  inheritRel(scans);
  return items.map((it, i) => {
    const upto = /(時|期|前)までの?処理?$|までの処理$/.test(it) && !/から/.test(it);
    const sc = scans[i];
    let positions = new Set(atomPositions(sc, upto));
    let literals = new Set(sc.lit ? [sc.lit] : []);
    const cleaned = it.replace(/\([^)]*\)/g, '').replace(/までの処理$|まで$|の処理$|処理$/, '');
    if (/(?<!\d)~|~(?!\d)|から/.test(cleaned)) {          // 「収穫終了後～落葉期」など: 使用行の時期と同じ解釈にする
      const pp = parsePeriod(cleaned, { positions: new Set(), literals: new Set(), unresolved: [] });
      if (pp.positions.size || pp.literals.size) { positions = pp.positions; literals = pp.literals; }
    }
    const methods = scanMethods(it);
    const targets = scanTargets(it);
    // 「育苗期」等の時期語に含まれる「育苗」を対象(育苗箱)としては数えない
    const parsed = positions.size > 0 || literals.size > 0 || methods.size > 0 || targets.size > 0;
    const dims = (positions.size || literals.size ? 1 : 0) + (methods.size ? 1 : 0) + (targets.size ? targets.size : 0);
    return { raw: it, growthOnly: sc.anchor === 'GROW' && !/本田|本圃/.test(sc.term), timeKey: (positions.size || literals.size) ? timeKeyOf(it) : '', timeOnly: methods.size === 0 && targets.size === 0, positions, literals, methods, targets, parsed, specificity: dims, fieldStart: /本田|本圃/.test(it) };
  });
}

/**
 * 括弧の対応を見て、括弧の外(depth 0)の区切り文字だけで分割する。
 *   isSep(ch): その文字が区切り候補か / cut(buf): それまでに溜めた文字列 buf で区切ってよいか(「回以内」で終わっているときだけ区切る等)
 */
function splitTop(str, isSep, cut) {
  const out = [];   // 分割結果
  let depth = 0;    // 現在の括弧の深さ
  let buf = '';     // 区切りを待って溜めている文字列
  for (const ch of str) {
    if (ch === '(') depth++;
    if (ch === ')') depth--;
    if (depth === 0 && isSep(ch) && cut(buf)) { out.push(buf); buf = ''; continue; }
    buf += ch;
  }
  if (buf) out.push(buf);
  return out;
}
/** 文字列 b が回数の上限で終わっているか(「…は1回以内」「…は1回以内(内訳)」)。節の区切りの「、」と条件の列挙の「、」を見分けるのに使う */
const endsWithLimit = (b) => /\d回(以内)?$/.test(b) || (/\)$/.test(b) && /回/.test(b));

/**
 * 作物別の規定「A、Bは4回以内(…)、上記以外のCは1回」を作物の節ごとに分ける。
 * 戻り値: [{ crops(作物名の記述), names(作物名の配列), total(総量), inner(括弧内の内訳。無ければ null) }]
 */
function parseCropSegments(s) {
  const segs = [];   // 作物ごとの節
  let pos = 0;       // 次に読む位置
  while (pos < s.length) {
    let depth = 0;
    let idx = -1;
    let m = null;
    for (let k = pos; k < s.length; k++) {
      const ch = s[k];
      if (ch === '(') depth++;
      else if (ch === ')') depth--;
      else if (depth === 0 && ch === 'は') {
        const mm = /^は(\d+)回(以内)?/.exec(s.slice(k));
        if (mm) { idx = k; m = mm; break; }
      }
    }
    if (idx < 0) break;
    const crops = s.slice(pos, idx);
    let end = idx + m[0].length;
    let inner = null;
    if (s[end] === '(') {
      let d = 0;
      let k = end;
      for (; k < s.length; k++) {
        if (s[k] === '(') d++;
        else if (s[k] === ')') { d--; if (d === 0) break; }
      }
      inner = s.slice(end + 1, k);
      end = k + 1;
    }
    segs.push({ crops, names: crops.split(/、|及び|又は/).filter(Boolean), total: Number(m[1]), inner });
    pos = end + (/^[、,]/.test(s.slice(end)) ? 1 : 0);
  }
  return segs;
}

/** 作物名 sakumotsu に該当する節を選ぶ。無ければ「その他・上記以外」の節、それも無ければ null */
function pickCropSegment(segs, sakumotsu) {
  const sak = norm(sakumotsu);
  const isOther = (seg) => /その他|上記以外|以外/.test(seg.crops);
  let hit = null;
  if (sak) {
    hit = segs.find((g) => !isOther(g) && g.names.some((n) => n.replace(/\(.*\)/, '') === sak || (sak.length >= 2 && (n.includes(sak) || sak.includes(n.replace(/\(.*\)/, ''))))));
  }
  return hit || segs.find(isOther) || null;
}

/**
 * 括弧の内側の節列(「AはN回以内、BはM回以内」)を slot/atom にして rule に追加する。
 *   inner : 括弧の内側の文字列    rule: 追加先(rule.slots / rule.atoms / rule.warnings)
 *   prefix: 枠の id の接頭辞('S' → S1, S2, ... / 入れ子は 'S1.' → S1.1)
 *   parent: 入れ子のとき { atoms: 親の条件 }。あれば追加する枠は overlay(内数)になる
 * 「合計」付き、または条件が1つ → 1枠を共有。「合計」なしの列挙 → 条件ごとに別枠(id は S2-1, S2-2 …)
 * 「但し当該処理をする場合には…」のような条件付きの節は評価せず、警告(=要確認)にする
 */
function parseClauses(inner, rule, prefix, parent) {
  let prevAtoms = null;   // 直前の節の条件(「但し」で始まる節を、その内数として扱うため)
  splitTop(inner, (c) => c === '、' || c === ',', endsWithLimit).forEach((clause, ci) => {
    const id0 = prefix + (ci + 1);   // この節の枠 id
    // 入れ子の括弧を分離: head=「条件と上限」の部分、child=入れ子の括弧の中身
    let head = clause;
    let child = null;
    const p = clause.indexOf('(');
    if (p >= 0 && clause.endsWith(')')) { head = clause.slice(0, p); child = clause.slice(p + 1, -1); }
    let cond = null;      // 条件部の文字列
    let limit = null;     // この節の上限回数
    let shared = false;   // 「合計」付きか(複数条件で1枠を共有)
    let m = head.match(/^(.+)は(合計)?(\d+)回(?:以内)?$/) || head.match(/^(.+?)(合計)?(\d+)回(?:以内)?$/);
    if (!m) { rule.warnings.push('規定の節を解釈できません: ' + clause); return; }
    cond = m[1]; shared = !!m[2]; limit = Number(m[3]);
    let conditional = false;   // 「但し…」で始まる条件付きの節か
    if (/^但し/.test(cond)) { cond = cond.replace(/^但し[、,]?(当該処理をする場合には)?/, ''); conditional = true; }
    if (/場合/.test(cond)) {
      rule.warnings.push('条件付きの規定は評価していません: ' + clause);
      return;
    }
    const atoms = /^\d+年間に?$/.test(cond)
      ? [{ raw: cond, positions: new Set(), literals: new Set(), methods: new Set(), targets: new Set(), parsed: true, specificity: 0 }]
      : parseAtomList(cond);
    atoms.forEach((a) => { if (!a.parsed) rule.warnings.push('条件を解釈できません: ' + a.raw); });
    let par = parent;   // この節を overlay にする場合の親(入れ子、または「但し」の節の直前の節)
    if (conditional && !/当該処理/.test(clause) && prevAtoms) par = { atoms: prevAtoms };       // 直前の節の内数
    else if (conditional && /当該処理/.test(clause)) rule.warnings.push('「当該処理をする場合」の条件付き節は通常の枠として扱っています: ' + clause);

    // 枠を1つ作り、その条件(atomsOf)を rule.atoms に slotId 付きで登録する
    const mk = (id, label, atomsOf) => {
      const slot = { id, label, limit, overlay: !!par };
      if (par) slot.parentAtoms = par.atoms;
      rule.slots.push(slot);
      atomsOf.forEach((a) => rule.atoms.push({ ...a, slotId: id, overlay: !!par }));
      return slot;
    };
    let lastSlot;   // 最後に作った枠(現在は参照していない)
    if (shared || atoms.length === 1) lastSlot = mk(id0, cond, atoms);
    else atoms.forEach((a, k) => { lastSlot = mk(`${id0}-${k + 1}`, a.raw, [a]); });
    if (!par || par === parent) prevAtoms = atoms;
    if (child) {
      const stripped = child.replace(/^但し[、,]?/, '');
      parseClauses(stripped, rule, id0 + '.', { atoms });
    }
  });
}

/**
 * 規定文を解析する。text: 規定文、opts.sakumotsu: 作物別規定の選択に使う作物名。
 * 戻り値 rule = { raw, total(総量の上限), slots[], atoms[], warnings[](解釈できなかった部分。あれば 要確認), crop(採用した作物の節) }
 * 括弧が無い規定は slots が空(=総量のみで、内訳の判定対象なし)
 */
function parseRuleRaw(text, opts = {}) {
  let s = norm(text);   // 正規化した規定文(作物別規定のときは選んだ節を「N回以内(…)」の形に直したもの)
  const rule = { raw: String(text == null ? '' : text), total: null, slots: [], atoms: [], warnings: [], crop: null };

  if (s && !/^\d/.test(s)) {                       // 作物別の規定
    const segs = parseCropSegments(s);
    const seg = segs.length ? pickCropSegment(segs, opts.sakumotsu) : null;
    if (!seg) { rule.warnings.push('作物別の規定を解釈できません: ' + rule.raw.slice(0, 40)); return rule; }
    rule.crop = seg.crops;
    if (!opts.sakumotsu || !seg.names.some((n) => n.includes(norm(opts.sakumotsu)))) {
      if (/その他|上記以外|以外/.test(seg.crops)) rule.warnings.push('作物名に一致せず「' + seg.crops + '」の規定を採用しました');
    }
    s = seg.total + '回以内' + (seg.inner ? '(' + seg.inner + ')' : '');
  }

  const t = s.match(/^(\d+)回(?:以内)?/);   // 先頭の総量
  if (t) rule.total = Number(t[1]);
  // 「1株当り1回」「1花につき1回」のように、時期・方法・対象の要素を含まない単位当たりの回数規定は、
  // 内訳の判定対象がない単なる回数なので要確認にしない(括弧の内訳がある規定だけ、総量を読めないことを警告する)
  else if (s.includes('(')) rule.warnings.push('総使用回数を読み取れません: ' + text);

  const i = s.indexOf('(');       // 内訳の括弧の開始
  const j = s.lastIndexOf(')');   // 内訳の括弧の終了(入れ子があるので最後の閉じ括弧)
  if (i < 0 || j < i) return rule;
  parseClauses(s.slice(i + 1, j), rule, 'S', null);
  return rule;
}

// ============================================================ 行の解釈と照合
// 3値の大小(no < maybe < yes)。worst=AND(全部の軸が合って初めて yes)、best=OR(どれか1つ合えば良い)
const RANK = { no: 0, maybe: 1, yes: 2 };
const worst = (a, b) => (RANK[a] <= RANK[b] ? a : b);
const best = (a, b) => (RANK[a] >= RANK[b] ? a : b);

/**
 * 使用行 r = { jiki, hoho, ekiryo, yakuzai(or meisho), zaikei } を照合用に正規化する。
 * 戻り値: { jiki(解析済み時期), methods(方法の集合), targets(対象の集合), form(剤型または薬剤名), hoho, fieldSimul(田植同時か) }
 * 業務ルール(ここで行の解釈を補正する):
 *   田植同時(側条施用の田植え時・移植時を含む)は本田の処理、育苗箱への散布は移植前の処理として扱う
 */
function normalizeRowRaw(r) {
  const jiki = parseJiki(r.jiki);   // 解析済みの使用時期
  const hoho = norm(r.hoho);        // 使用方法(正規化)
  const ekiryo = norm(r.ekiryo);    // 使用液量(「箱あたり」等、対象を示すことがある)
  const jt = norm(r.jiki);          // 使用時期(正規化した生の文字列)
  const methods = scanMethods(hoho);   // 行の方法
  const targets = new Set();           // 行の対象(剤型は別に form で持つ)
  scanTargets(hoho + ekiryo).forEach((x) => { if (!x.startsWith('FORM:')) targets.add(x); });
  if (/種|浸種/.test(jt) && /種子|浸種/.test(jt)) targets.add('SEED');
  // 剤型別の規定(「粒剤は1回以内、水和剤は4回以内」など)の判定には、辞書の剤型(zaikei)を使う。
  // zaikei が無い・「その他」「農薬肥料」など規定文に出てくる剤型名でないときだけ、薬剤名から推定する
  const zk0 = norm(r.zaikei).replace(/^エアゾル$/, 'エアゾル剤');   // 辞書の剤型(表記ゆれを補正)
  const zk = FORMS.test(zk0) ? zk0 : '';                              // 剤型を表す語のときだけ採用
  const form = zk || norm(r.yakuzai || r.meisho || '');               // 剤型の照合に使う文字列(剤型が使えなければ薬剤名)
  // 田植同時の施用(田植同時散布機など)は、移植と同時でも本田への処理として判定する
  // 使用時期が「田植え時」「移植時」の側条施用(田植えと同時に側条へ施用)も同様に扱う。は種時・直播時の側条施用は対象外
  const fieldSimul = /(田植|移植)(え)?同時/.test(hoho) || (/側条/.test(hoho) && /田植|移植/.test(jt));
  // 育苗箱への散布は、移植前の処理として判定する(使用時期が「移植当日」までの範囲でも、移植後は含めない)
  let jikiRow = jiki;   // 照合に使う時期(育苗箱散布のときだけ複製して補正する)
  // 育苗箱と本田の両方の処理が1行に書かれている登録は、移植前だけとは言えないのでこの扱いにしない
  const nurserySpray = targets.has('NURSERY') && /散布/.test(hoho) && !/本田|本圃/.test(jt + hoho);
  if (nurserySpray && jiki.positions.size) {
    const pre = new Set([...jiki.positions].filter((p) => p <= P.PLB));
    jikiRow = Object.assign({}, jiki, { positions: pre.size ? pre : new Set([P.PLB]) });   // jiki はキャッシュ共有なので複製する
  }
  return { jiki: jikiRow, methods, targets, form, hoho, fieldSimul };
}

/**
 * 時期の照合(3値)。atom に時期の指定が無ければ yes。行の時期が不明なら maybe。
 * 行の位置・語のうち atom に含まれる割合が全部なら yes、一部なら maybe(例: 「移植前～移植当日」の行は「移植前」の枠に一部だけ重なる)、無ければ no。
 */
function matchTime(atom, row) {
  if (atom.positions.size === 0 && atom.literals.size === 0) return 'yes';
  const j = row.jiki;   // 行の解析済み時期
  if (row.fieldSimul && atom.fieldStart && j.positions.has(P.PL)) return 'yes';   // 田植同時 = 本田
  if (j.preEmerge) {   // 植付後萌芽前の行: 「萌芽前」の枠に当たる。「生育期」「萌芽後」など生育期の枠には当たらない
    if (atom.literals.has('萌芽前')) return 'yes';
    if (atom.growthOnly) return 'no';
  }
  if (j.positions.size === 0 && j.literals.size === 0) return 'maybe';   // 時期不明
  let inter = 0;   // 行の位置・語のうち atom に含まれるものの数
  let total = 0;   // 行の位置・語の総数
  j.positions.forEach((p) => { total++; if (atom.positions.has(p)) inter++; });
  j.literals.forEach((l) => { total++; if (atom.literals.has(l)) inter++; });
  if (inter === 0) return atom.fieldStart && j.positions.has(P.PL) ? 'maybe' : 'no';   // 移植時の同時施用は本田か育苗の延長か不明
  return inter === total ? 'yes' : 'maybe';
}

/**
 * 方法の照合(3値)。atom に方法の指定が無ければ yes、行の方法が不明なら maybe。
 * 行の方法が atom と同じか、その細分(規定「散布」に対して行「株元散布」)なら yes。
 * 逆に、行が親(「散布」とだけ登録)で atom が細分(「株元散布」「無人航空機散布」)のときは no(方法の登録どおりに照合する)。
 */
function matchMethod(atom, row) {
  if (atom.methods.size === 0) return 'yes';
  if (row.methods.size === 0) return 'maybe';
  let res = 'no';
  atom.methods.forEach((a) => {
    row.methods.forEach((r) => {
      if (r === a || r.startsWith(a + '/')) res = best(res, 'yes');
      // 行の方法が「散布」とだけ登録されている場合は、株元散布・無人航空機散布などの細分の枠には当てない
      // (細分の方法は、行に「株元散布」「無人航空機による散布」と登録されるので、方法の登録どおりに照合する)
    });
  });
  return res;
}

/**
 * 対象・剤型の照合(3値)。atom の対象すべてに対し、行が合えば yes(AND)。
 *   FORM:x : 行の剤型に x が含まれれば yes、剤型は分かるが別の剤型なら no、判別できなければ maybe
 *   FIELD  : 行が育苗箱・床土・種子なら no(本田側の枠には該当しない)、それ以外は yes
 *   BED    : 行が床土・覆土なら yes、育苗箱なら maybe(床土に混和する可能性)
 *   その他 : 行の対象に含まれれば yes、無ければ no
 */
function matchTarget(atom, row) {
  let res = 'yes';
  atom.targets.forEach((t) => {
    let r;
    if (t.startsWith('FORM:')) r = !row.form ? 'maybe' : row.form.includes(t.slice(5)) ? 'yes' : (/剤/.test(row.form) ? 'no' : 'maybe');
    else if (t === 'FIELD') r = ['NURSERY', 'BED', 'SEED'].some((x) => row.targets.has(x)) ? 'no' : 'yes';
    else if (t === 'BED') r = row.targets.has('BED') ? 'yes' : row.targets.has('NURSERY') ? 'maybe' : 'no';
    else r = row.targets.has(t) ? 'yes' : 'no';
    res = worst(res, r);
  });
  return res;
}

/** atom と行を時期・方法・対象の3軸で照合し、3軸の worst(最も厳しい値)を返す */
function matchAtom(atom, row) {
  let r = matchTime(atom, row);
  r = worst(r, matchMethod(atom, row));
  r = worst(r, matchTarget(atom, row));
  return r;
}

/**
 * 行を枠に割り当てる。戻り値 { slots: 該当した枠 id の配列, certain: 確定か, overlay: [{ id, certain }] }
 *   certain=true : yes の枠が唯一つ(その枠に確定して数える)
 *   certain=false: 枠が複数ある/maybe だけ(judge が「可能性」として数え、要確認にする)
 *   slots が空   : どの枠にも該当しない(総量にだけ数える。フラグは立てない)
 * 複数の枠が yes のときの絞り込み(上から順に適用):
 *   ① 田植同時の行は「本田」の枠を優先  ② 指定された軸の数(specificity)が大きい枠を優先
 *      規定の「散布」は、行が株元散布など細分のとき1段低く扱う(「粒剤の処理」など他の枠があればそちらを優先)
 *   ③ 時期だけの枠どうしなら、行と同じ時期表現の枠  ④ 移植・植付より前の行で、行と同じ時期表現の「Xの植付前の処理」枠(方法指定なし)と
 *      時期指定のない方法枠が競合するときは、時期で確定する
 * overlay(入れ子=内数)の枠は、親の条件と自分の条件の両方に当てはまるかを別に評価する
 */
function assign(row, rule) {
  const yes = [];     // 確実に該当する条件
  const maybe = [];   // 該当するかもしれない条件
  rule.atoms.forEach((a) => {
    if (a.overlay) return;
    const m = matchAtom(a, row);
    if (m === 'yes') yes.push(a);
    else if (m === 'maybe') maybe.push(a);
  });
  let res = { slots: [], certain: false };   // 戻り値(overlay は最後に付ける)
  if (yes.length) {
    // 田植同時の施用は、規定に「本田」の枠があればそちらを優先する(「移植時までの処理」にも読めるため)
    const pool = row.fieldSimul && yes.some((a) => a.fieldStart) ? yes.filter((a) => a.fieldStart) : yes;
    // 規定の「散布」は厳密に「散布」とだけ表記された行の枠。株元散布などの行が他の枠(「粒剤の処理」など)にも該当する場合は
    // そちらを優先し、「散布」枠は他に該当する枠がないときにだけ使う(数え漏れを避けるため、枠自体は残す)
    // eff: 行に対する条件の実効的な優先度(指定軸の数 − 「散布」枠を細分の行に当てるときの減点1)
    const eff = (a) => a.specificity - (a.methods.has('SPRAY') && !row.methods.has('SPRAY') && [...row.methods].some((m) => m.startsWith('SPRAY/')) ? 1 : 0);
    const top = Math.max(...pool.map(eff));                  // 最も優先度の高い値
    let cand = pool.filter((a) => eff(a) === top);          // 候補の条件(枠が複数残れば不確定)
    // 同格の枠が複数ある場合は、行の時期と同じ表現の枠を優先する(例: 「萌芽直前～萌芽期」の行 → 同じ表現の枠)。
    // 時期だけの枠同士に限る。方法や対象で一致した枠が混ざるときは、どちらの枠にも該当しうるので確定しない
    if (new Set(cand.map((a) => a.slotId)).size > 1 && row.jiki.timeKey && cand.every((a) => a.timeOnly)) {
      const ex = cand.filter((a) => a.timeKey && a.timeKey === row.jiki.timeKey);
      if (ex.length) cand = ex;
    }
    // 移植・植付より前の時期の行で、行と同じ時期表現の「Xの植付前の処理」枠(方法指定なし)と、時期指定のない方法枠(散布など)が
    // 競合する場合は、時期で確定する(畝立て前作条散布などは植付前の土壌処理であり、生育期の散布ではない)
    if (new Set(cand.map((a) => a.slotId)).size > 1 && row.jiki.timeKey && row.jiki.positions.size
        && [...row.jiki.positions].every((p) => p <= P.PLB)) {
      const tm = cand.filter((a) => a.timeKey && a.timeKey.endsWith(row.jiki.timeKey) && a.methods.size === 0 && a.positions.size);
      const rest = cand.filter((a) => !tm.includes(a));
      if (tm.length && new Set(tm.map((a) => a.slotId)).size === 1 && rest.every((a) => !a.positions.size && !a.literals.size)) cand = tm;
    }
    const slots = [...new Set(cand.map((a) => a.slotId))];   // 候補の枠 id(重複を除く)
    res = { slots, certain: slots.length === 1 };
  } else if (maybe.length) {
    res = { slots: [...new Set(maybe.map((a) => a.slotId))], certain: false };
  }
  // 入れ子の枠(「Aは5回以内(そのうちBは4回以内)」のB): 親の条件とBの両方に該当する行を数える
  res.overlay = [];
  rule.slots.filter((sl) => sl.overlay).forEach((sl) => {
    let pm = 'no';   // 親の条件との照合結果(親が複数の条件なら best)
    sl.parentAtoms.forEach((a) => { pm = best(pm, matchAtom(a, row)); });
    let cm = 'no';   // 自分の条件との照合結果
    rule.atoms.filter((a) => a.slotId === sl.id).forEach((a) => { cm = best(cm, matchAtom(a, row)); });
    const r = worst(pm, cm);   // 親と自分の両方に合って初めて内数として数える
    if (r !== 'no') res.overlay.push({ id: sl.id, certain: r === 'yes' });
  });
  return res;
}


// ============================================================ 判定(UI用)
/**
 * 1つの有効成分について、計画表の使用行から内訳枠の超過を判定する。
 * items: [{ no, sakumotsu, yakuzai, jiki, hoho, ekiryo, seibunkaisu }]  (1行 = 1回の使用)
 * 戻り値: { status: 'NG'|'要確認'|'OK'|'', lines: [{ level, text }], flags: Map(item.ref -> [{ level, text }]) }
 *   flags: 超過(NG)または枠未確定(要確認)の内訳枠に属する使用行ごとの理由。item.ref は呼び出し側が付ける任意の識別子
 *   NG      : 確定した使用だけで、内訳枠の上限を超えている
 *   要確認  : 枠を確定できない使用まで含めると超える/解釈できない規定・時期語がある
 *   ''      : 内訳規定がなく、総量だけの規定(判定対象なし)
 * 規定文が複数ある(登録ごとに異なる)場合は、どの規定文も成分の全使用行に当てはめて数え、最悪の結果を返す。
 * (規定文ごとに、その規定文を持つ行だけを数えると、登録が別でも同じ成分・同じ枠の使用が合算されず超過を見逃す)
 */
function judge(items) {
  // groups: 規定文(+作物別規定なら作物名)ごとの判定単位。rows は常に成分の全使用行(規定文が違っても全行に当てはめる)
  const groups = new Map();
  items.forEach((it) => {
    const text = String(it.seibunkaisu || '').trim();
    if (!/\d回/.test(text)) return;                       // '-' や空欄は対象外
    const crop = /^\s*\d/.test(text) ? '' : norm(it.sakumotsu);
    const key = text + '\u0000' + crop;
    if (!groups.has(key)) groups.set(key, { text, sakumotsu: it.sakumotsu, rows: items });
  });

  const lines = [];         // 画面に出す判定行 [{ level: 'NG'|'要確認', text }]
  const flags = new Map();  // 使用行(item.ref)ごとの理由 → 薬剤別の表に引き当てる
  // its の各行に (level, text) の理由を付ける(同じ理由は重複して付けない)
  const flag = (its, level, text) => its.forEach((it) => {
    if (it.ref === undefined) return;
    if (!flags.has(it.ref)) flags.set(it.ref, []);
    const arr = flags.get(it.ref);
    if (!arr.some((f) => f.level === level && f.text === text)) arr.push({ level, text });
  });
  const seen = new Set();   // 判定行の重複除去用
  // 判定行を追加する(同じ内容は1回だけ)
  const push = (level, text) => { const k = level + text; if (!seen.has(k)) { seen.add(k); lines.push({ level, text }); } };
  let hasSlots = false;   // 内訳の枠が1つでもある(=判定対象がある)
  let ng = false;         // 確定した使用だけで超過した枠がある
  let check = false;      // 枠を確定できない使用・解釈できない規定/時期語がある

  groups.forEach((g) => {
    const rule = parseRule(g.text, g.sakumotsu);
    if (rule.slots.length) hasSlots = true;
    const sure = {};       // 枠 id → その枠に確定した使用行
    const possible = {};   // 枠 id → その枠に該当するかもしれない使用行(確定できないもの)
    rule.slots.forEach((sl) => { sure[sl.id] = []; possible[sl.id] = []; });
    const rowWarn = new Set();   // 行ごとの警告文(時期語の解釈失敗・枠を確定できない)
    const needTime = rule.atoms.some((a) => a.positions.size > 0 || a.literals.size > 0);   // 規定に時期の条件があるか

    g.rows.forEach((r) => {
      const nr = normalizeRow(r);   // 照合用に正規化した行
      // 使用時期を解釈できないことが問題になるのは、規定に時期の条件があるときだけ。
      // 総量だけの規定や、方法・対象・剤型だけの内訳規定なら、時期が読めなくても判定に影響しない(単なる回数として数える)
      if (nr.jiki.unresolved.length && needTime) {
        rowWarn.add('使用時期「' + nr.jiki.unresolved.join('/') + '」を解釈できません');
        flag([r], '要確認', '使用時期「' + nr.jiki.unresolved.join('/') + '」を解釈できません');
      }
      if (!rule.slots.length) return;
      const a = assign(nr, rule);   // この規定文の枠への割り当て
      if (a.slots.length && a.certain) sure[a.slots[0]].push(r);
      else if (a.slots.length) {
        a.slots.forEach((id) => possible[id].push(r));
        rowWarn.add('No.' + r.no + ' は該当する内訳枠を確定できません');
        flag([r], '要確認', '該当する内訳枠を確定できません');
      }
      a.overlay.forEach((o) => (o.certain ? sure : possible)[o.id].push(r));
    });

    rule.slots.forEach((sl) => {
      const su = sure[sl.id].length;      // 確定した使用回数
      const po = possible[sl.id].length;  // 可能性のある使用回数
      const label = sl.label + (sl.overlay ? '(内数)' : '');
      if (su > sl.limit) {
        ng = true;
        push('NG', `${label}: ${su}回 / 上限${sl.limit}回 (No.${sure[sl.id].map((x) => x.no).join(',')})`);
        flag(sure[sl.id], 'NG', `${label}: 計${su}回 / 上限${sl.limit}回`);
      } else if (su + po > sl.limit) {
        check = true;
        push('要確認', `${label}: 確定${su}回+可能性${po}回 / 上限${sl.limit}回`);
        flag(sure[sl.id].concat(possible[sl.id]), '要確認', `${label}: 確定${su}回+可能性${po}回 / 上限${sl.limit}回`);
      }
    });
    rule.warnings.forEach((w) => { check = true; push('要確認', w); });
    rowWarn.forEach((w) => { check = true; push('要確認', w); });
  });

  // 総合: NG > 要確認 > OK(枠があり問題なし) > ''(判定する内訳規定なし)
  const status = ng ? 'NG' : check ? '要確認' : hasSlots ? 'OK' : '';
  return { status, lines, flags };
}

return { judge };
})();

// 薬剤名(通称名)から剤型(zaikei)を引く。剤型別の回数規定の判定に使う
// 結果は薬剤名ごとにキャッシュする。未取得の間は空文字を返して薬剤名からの推定に任せ、取得できたら判定表を更新する
const zaikeiCache = new Map();
function zaikeiOf(tsusho) {
	const key = String(tsusho || '').trim();
	if (!key) return '';
	if (zaikeiCache.has(key)) return zaikeiCache.get(key);
	// if (typeof db === 'undefined' || !db) return '';            // データベース未読込: 読込後の再判定で取得する
	let z = '';
	try {
		const res = db.exec(`select zaikei from m_kihon where tsusho = '${key.replace(/'/g, "''")}'`);
		const vals = (res[0]?.values || []).map(v => v[0]).filter(Boolean);
		if (vals.length === 1) z = String(vals[0]);              // 複数あるときは決められないので空にする
	} catch (e) {
		if (typeof debug !== 'undefined' && debug) console.warn('剤型の取得に失敗しました:', key, e);
	}
	zaikeiCache.set(key, z);
	return z;
}

// 計画表から成分ごとの使用状況を集める(成分別・薬剤別の両方の表で共通に使う)
// 戻り値: Map(成分名 -> { count, seibunkaisu(先頭の数字が最大の規定文), mid, limit, uses[] })
// uses の各要素は 1行 = 1回の使用で、ref にその計画表の行(tr)を持つ
function collectSeibunData(planTableBody) {
	const seibunData = new Map();
	Array.from(planTableBody.rows).filter(row => !row.hasAttribute('hidden')).forEach(row => {
		const seibunCell = row.cells[11];
		const seibunkaisuCell = row.cells[12];
		const midCell = row.cells[13];

		if (seibunCell && seibunkaisuCell && midCell) {
			const seibuns = seibunCell.innerHTML.split('<br>').map(s => s.trim().match(/\[(.*?)\]/)?.[1] || s.trim()).filter(Boolean);
			const seibunkaisus = seibunkaisuCell.innerHTML.split('<br>').map(s => s.trim());
			const mids = midCell.innerHTML.split('<br>').map(s => s.trim());
			// 内訳判定に使う、この行の情報(1行 = 1回の使用)
			const use = {
				ref: row,
				no: row.cells[1]?.textContent.trim() || '',
				sakumotsu: row.cells[3]?.textContent.trim() || '',
				yakuzai: row.cells[4]?.textContent.trim() || '',
				zaikei: zaikeiOf(row.cells[4]?.textContent),
				jiki: row.cells[6]?.textContent.trim() || '',
				hoho: row.cells[10]?.textContent.trim() || '',
				ekiryo: row.cells[9]?.textContent.trim() || ''
			};

			seibuns.forEach((seibun, index) => {
				const kaisuText = seibunkaisus[index] || '';
				const currentData = seibunData.get(seibun) || { count: 0, seibunkaisu: '', mid: '', limit: -1, uses: [] };
				currentData.count += 1;
				if (currentData.count === 1) currentData.mid = mids[index] || '';
				const newLimit = parseInt(kaisuText.match(/^\d+/)?.[0] || '0', 10);
				if (newLimit > currentData.limit) {
					currentData.seibunkaisu = kaisuText;
					currentData.limit = newLimit;
				}
				currentData.uses.push({ ...use, seibunkaisu: kaisuText });
				seibunData.set(seibun, currentData);
			});
		}
	});
	return seibunData;
}

// 成分の使用回数をカウントしてテーブルを更新する関数
// 使用回数・使用上限は従来どおり(行数と、成分回数の先頭の数字の最大値)。
// 加えて「判定」列で、成分回数の括弧内(使用時期・方法・対象ごとの内訳上限)を UsageLimit.judge で判定する。
function updateSeibunCountTable() {
	const planTableBody = document.querySelector('#planTable tbody');
	const seibunContainer = document.getElementById('seibunContainer');
	if (!planTableBody || !seibunContainer) {
		if (seibunContainer) seibunContainer.clearContent();
		return;
	}

	const seibunData = collectSeibunData(planTableBody);

	if (seibunData.size === 0) {
		seibunContainer.clearContent();
		return;
	}

	const getPriority = (mid) => mid === '' ? 5 : mid.startsWith('F:') ? 1 : mid.startsWith('I:') ? 2 : mid.startsWith('H:') ? 3 : 4;
	const sortedData = Array.from(seibunData.entries()).sort((a, b) => {
		const pA = getPriority(a[1].mid), pB = getPriority(b[1].mid);
		return pA !== pB ? pA - pB : (a[1].mid).localeCompare(b[1].mid) || a[0].localeCompare(b[0]);
	});

	let totalCount = 0;
	const rowsHtml = sortedData.map(([seibun, data]) => {
		if (data.seibunkaisu !== '-' && data.seibunkaisu !== '') totalCount += data.count;
		const noLimit = (data.seibunkaisu === '-' || data.seibunkaisu === '');
		const verdict = noLimit ? { status: '', lines: [] } : UsageLimit.judge(data.uses);
		// 総量の上限超過、または内訳枠の確定超過があれば強調表示する
		const exceeded = data.limit > 0 && data.count > data.limit || verdict.status === 'NG';
		const countDisplay = noLimit ? '' : (exceeded ? `<em>${data.count}</em>` : data.count);
		let judgeHtml = '-';   // 判定する内訳規定がない(総量のみ・上限なし)場合
		if (verdict.status === 'NG') judgeHtml = '<em>NG</em>';
		else if (verdict.status) judgeHtml = verdict.status;
		if (verdict.lines.length) {
			judgeHtml += '<br>' + verdict.lines.map(l => `${l.level === 'NG' ? '' : '※'}${escapeHtml(l.text)}`).join('<br>');
		}
		return `<tr><td>${seibun}</td><td>${data.mid}</td><td>${countDisplay}</td><td>${data.seibunkaisu}</td><td class="judge">${judgeHtml}</td></tr>`;
	}).join('');

	seibunContainer.innerHTML = `
		<div class="handsontable-like">
			<table id="seibunCountTable">
				<thead>
					<tr><th>有効成分</th><th>RAC</th><th>使用回数</th><th>使用上限</th><th>括弧内判定</th></tr>
				</thead>
				<tbody>${rowsHtml}</tbody>
				<tfoot>
					<tr><td>合計</td><td></td><td>${totalCount}</td><td></td><td></td></tr>
				</tfoot>
			</table>
		</div>
		<div class="iconsbar">
			<svg class="icon" onclick="copyTableToClipboard('seibunCountTable')">
				<title>クリップボードにコピー</title>
				<use href="icons.svg?v=3#clipboard-copy"></use>
			</svg>
		</div>
	`;
}

// 薬剤の使用回数をカウントしてテーブルを更新する関数
function updateYakuzaiCountTable() {
	const planTableBody = document.querySelector('#planTable tbody');
	const container = document.getElementById('yakuzaiCountContainer');
	if (!planTableBody || !container) {
		if (container) container.clearContent();
		return;
	}

	const yakuzaiData = new Map();
	Array.from(planTableBody.rows).filter(row => !row.hasAttribute('hidden')).forEach(row => {
		const timing = row.cells[0]?.textContent.trim() || '';
		const tsusho = row.cells[4]?.textContent.trim() || '';
		const jiki = row.cells[6]?.textContent.trim() || '-';
		const kaisu = row.cells[7]?.textContent.trim() || '-';
		const hoho = row.cells[10]?.textContent.trim() || '';
		const stage = kaisu === '-' || jiki === '-'? '-' :  hoho.includes('塗布') ? '塗布' : hoho.includes('畦間土壌散布') ? '畦間土壌散布' : 
									/収穫(終了)?後/.test(jiki) ? '収穫後' : jiki.includes('休眠期') ? '休眠期' : /(?<!無)種子|種いも|塗沫/.test(hoho) ? '種子' :
									/[萌出]芽前/.test(jiki) ? '出芽前' : jiki.includes('は種前') ? 'は種前' :
									/([は播]種|[移定]植|出芽)(直前|時|当日)/.test(jiki) ? '育苗期' : '生育期';

		if (tsusho) {
			const key = JSON.stringify([tsusho, stage, kaisu]);
			const currentData = yakuzaiData.get(key) || {
				tsusho: tsusho,
				stage: stage,
				kaisu: kaisu,
				count: 0,
				rem: [],
				rows: [],
				limit: parseInt(kaisu.match(/^\d+/)?.[0] || '0', 10)
			};
			currentData.rem.push(timing ? `${timing}/${hoho}` : stage === '生育期' ? `生育期/${hoho}` : `${jiki}/${hoho}`);
			currentData.count += 1;
			currentData.rows.push(row);
			yakuzaiData.set(key, currentData);
		}
	});

	if (yakuzaiData.size === 0) {
		container.clearContent();
		return;
	}

	// 薬剤ごとの上限(時期・方法別)を守っていても、有効成分の「括弧内」の内訳枠(例: は種時の土壌混和と定植時の株元散布は合計1回以内)を
	// 薬剤をまたいで超えることがある。成分別の判定結果を、その使用行ごとに引き当てて薬剤別の表にも出す
	const rowVerdicts = new Map();   // tr -> [{ seibun, status, flags:[{level,text}] }]
	collectSeibunData(planTableBody).forEach((data, seibun) => {
		const noLimit = (data.seibunkaisu === '-' || data.seibunkaisu === '');
		const verdict = noLimit ? { status: '', flags: new Map() } : UsageLimit.judge(data.uses);
		// 成分の総使用回数(成分回数の先頭の数字)を超えている場合も、その成分を含む全使用行の薬剤別の判定に NG として出す
		// (薬剤ごとには上限内でも、同じ成分を含む別の薬剤との合計で超えることがあるため)
		const totalOver = data.limit > 0 && data.count > data.limit;
		data.uses.forEach(use => {
			if (!rowVerdicts.has(use.ref)) rowVerdicts.set(use.ref, []);
			const flags = (verdict.flags.get(use.ref) || []).slice();
			if (totalOver) flags.unshift({ level: 'NG', text: `総使用回数: ${data.count}回 / 上限${data.limit}回` });
			rowVerdicts.get(use.ref).push({ seibun, status: totalOver ? 'NG' : verdict.status, flags });
		});
	});

	const sortedData = Array.from(yakuzaiData.values()).sort((a, b) =>
		a.tsusho.localeCompare(b.tsusho, 'ja') ||
		a.limit - b.limit ||
		a.kaisu.localeCompare(b.kaisu, 'ja')
	);

	const rowsHtml = sortedData.map(data => {
		// この薬剤・時期・方法の使用行が属する成分の内訳枠の判定をまとめる(NG > 要確認 > OK > 判定なし)
		let level = '';
		const reasons = [];
		data.rows.forEach(row => (rowVerdicts.get(row) || []).forEach(v => {
			const lv = v.flags.some(f => f.level === 'NG') ? 'NG' : v.flags.length ? '要確認' : (v.status ? 'OK' : '');
			if (lv === 'NG' || (lv === '要確認' && level !== 'NG') || (lv === 'OK' && level === '')) level = lv;
			v.flags.forEach(f => {
				const t = `${f.level === 'NG' ? '' : '※'}${v.seibun}: ${f.text}`;
				if (!reasons.includes(t)) reasons.push(t);
			});
		}));
		const exceeded = (data.limit > 0 && data.count > data.limit) || level === 'NG';
		const countDisplay = exceeded ? `<em>${data.count}</em>` : data.count;
		let judgeHtml = level === 'NG' ? '<em>NG</em>' : (level || '-');
		if (reasons.length) judgeHtml += '<br>' + reasons.map(escapeHtml).join('<br>');
		const rem = data.rem.map(escapeHtml).join('<br>');
		return `<tr><td>${escapeHtml(data.tsusho)}<td>${rem}</td><td>${countDisplay}</td><td>${escapeHtml(data.kaisu)}</td><td class="judge">${judgeHtml}</td></tr>`;
	}).join('');

	container.innerHTML = `
		<div class="handsontable-like">
			<table id="yakuzaiCountTable">
				<thead>
					<tr><th>薬剤名</th><th>使用時期/方法</th><th>使用回数</th><th>使用上限</th><th>成分の判定(総量・括弧内)</th></tr>
				</thead>
				<tbody>${rowsHtml}</tbody>
			</table>
		</div>
		<div class="iconsbar">
			<svg class="icon" onclick="copyTableToClipboard('yakuzaiCountTable')">
				<title>クリップボードにコピー</title>
				<use href="icons.svg?v=3#clipboard-copy"></use>
			</svg>
		</div>
	`;
}

function handleDrop(event) {
	event.preventDefault();

	// firefox, Safari の場合
	if (!isFileSystemAccessSupported) {
		readFile(event.dataTransfer.files[0]);
		return;
	}

	// Chrome, Edge の場合
	const item = event.dataTransfer.items[0];
	if (item && item.kind === 'file' && item.type === 'application/json') {
		openPlanFile(item);
	} else {
		alert('対応していないファイル形式です。');
	}
}

// 自動保存データ復元
function restorePlan() {
	const savedString = localStorage.getItem('unsavedPlan');
	try {
		const appData = JSON.parse(savedString);
		console.log('planData:', appData.planData);
		const msg = `前回の未保存データ${appData.fileName ? `(ファイル名: ${appData.fileName})` : ''}を復元しました。`;
		loadPlanFromJson(appData.planData, msg); 
		currentFilename = appData.fileName;
	} catch (err) {
		console.error('データの復元に失敗しました:', err);
	}
}

// DOM読込完了時の初期設定
window.addEventListener('DOMContentLoaded', async function() {
	//データベース読込
	if (db === null) await fetchDB();

	// 作物ツリーの生成とイベントハンドラ設定
	const sql = `
		select idsaku, class, toroku, sakumotsu, shukakubui, betsumei, 
		':'||replace(n_concat('、', strconv(sakumotsu, 'k'), strconv(betsumei, 'k'), ruby), '、', ':')||':' as keywords
		from m_sakumotsu where sakumotsu not like '%除く%';
	`;
	await makeCropTree('#cropTree', sql, searchCrop);

	// firefox のリロード時 checkbox 状態復元対策
	clearAllReset();

	// 防除計画テーブルの初期化
	createPlanTable();

	// イベントリスナーの一括登録
	document.getElementById('cbyochuSelect').addEventListener('change', onCbyochuChange);
	document.getElementById('byochuSelect').addEventListener('change', handleByochuSelection);

	// フォールバック用inputが変更された時の処理（Firefox/Safari用）
	const fallbackInput = document.getElementById('fallbackFileInput');
	fallbackInput.addEventListener('change', (e) => {
		readFile(e.target.files[0]);
		fallbackInput.value = ''; // 連続で同じファイルを選んでもイベントが走るように値をリセット
	});

	// ドラッグ＆ドロップのイベントリスナーを設定
	const planContainer = document.getElementById('resultPane');
	planContainer.addEventListener('dragover', (event) => {
		event.preventDefault(); // Allow drop
	});
	planContainer.addEventListener('drop', handleDrop);

	// unsavedPlan がある場合は btnRestorePlan を可視化
	if (localStorage.getItem('unsavedPlan')) document.getElementById('btnRestorePlan')?.classList.remove('hidden');

});

// タブ終了時の処理
window.addEventListener('beforeunload', (event) => {
	if (!isDirty) return; // 保存済みなら即終了
	//event.preventDefault();  // ブラウザの確認ダイアログ表示
	//event.returnValue = ''; // 古いブラウザ（互換性）のための記述
	const appData = {
		planData: convPlanToJson(),
		fileName: currentFilename
	};
	localStorage.setItem('unsavedPlan', JSON.stringify(appData));
});
</script>
