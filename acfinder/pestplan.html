			const nameTd = e.target.closest('td.yk-name');
			const co = e.target.closest('td.yk-co') || (nameTd && container._drugLevel.get(nameTd.dataset.tsusho) === '要確認' ? nameTd : null);
			if (co) {
				clearWarnHighlight();    // 警告色A・Bが有効なときは、すべて解除する
				clearWarnBHighlight();
				if (co.classList.contains('warn-bg-c')) { clearWarnCHighlight(); return; }   // 警告色Cのセルをもう一度クリック: すべて元に戻す
				clearWarnCHighlight();   // 別の薬剤をクリックしたときは前の指定を消す(同時点灯はしない)
				const tsusho = co.dataset.tsusho;
				// この薬剤の薬剤名セルと要確認のセル(薬剤別の表)、防除計画の要確認の原因になった行の薬剤名セルを警告色Cにする
				container.querySelectorAll('td.yk-name, td.yk-co').forEach(c => { if (c.dataset.tsusho === tsusho) c.classList.add('warn-bg-c'); });
				(container._coRows.get(tsusho) || []).forEach(row => row.cells[4]?.classList.add('warn-bg-c'));
				return;
			}
			const td = e.target.closest('td.yk-name, td.yk-ng');   // 薬剤名、またはNG判定のセル。どちらをクリックしても同じ動作
			if (!td) return;
			clearWarnBHighlight();   // 成分クリックによる警告色Bが有効なときは、すべて解除する
			clearWarnCHighlight();   // 併用前提の警告クリックによる警告色Cも解除する
			if (td.classList.contains('warn-bg') || td.classList.contains('warn-bg-d')) { clearWarnHighlight(); return; }   // 光っているセルをもう一度クリック: すべて元に戻す
			clearWarnHighlight();   // 別の薬剤をクリックしたときは前の指定を消し、この薬剤だけを光らせる(同時点灯はしない)
			const tsusho = td.dataset.tsusho;
			if (container._drugLevel.get(tsusho) === 'NG') {
				// NG の薬剤: 薬剤名セルとNG判定のセル(薬剤別の表)、防除計画のNG行の薬剤名セルを警告色Aにする
				container.querySelectorAll('td.yk-name, td.yk-ng').forEach(c => { if (c.dataset.tsusho === tsusho) c.classList.add('warn-bg'); });
				(container._ngRows.get(tsusho) || []).forEach(row => row.cells[4]?.classList.add('warn-bg'));
			} else {
				// NG でない(OK など)の薬剤: 薬剤名セルと、防除計画のその薬剤の全行の薬剤名セルを確認色(青系)にする
				td.classList.add('warn-bg-d');
				(container._drugRows.get(tsusho) || []).forEach(row => row.cells[4]?.classList.add('warn-bg-d'));
			}
		});
	}
}

/**
 * 要確認の内容を選ぶダイアログ。subject: 薬剤名または有効成分名、questions: 判定が作った問い(未回答・回答済み)。
 * 問いごとに選択肢(と「未選択(要確認のまま)」)を出し、「確定して再計算」で選択を usageChoices に入れて両方の表を作り直す。
 * 選択はこの画面の中だけで使い、防除計画(.json)には反映しない
 */
function openUsageResolveDialog(subject, questions) {
	let dlg = document.getElementById('usageResolveDialog');
	if (!dlg) {
		dlg = document.createElement('dialog');
		dlg.id = 'usageResolveDialog';
		document.body.appendChild(dlg);
		dlg.addEventListener('click', (e) => {
			const b = e.target.closest('button[data-act]');
			if (!b) return;
			const act = b.dataset.act;
			if (act === 'ok' || act === 'clear') {
				(dlg._questions || []).forEach((q, i) => {
					const v = act === 'clear' ? '' : (dlg.querySelector(`input[name="urq${i}"]:checked`)?.value || '');
					if (v) usageChoices.set(q.choiceKey, v); else usageChoices.delete(q.choiceKey);
				});
			}
			if (dlg.close) dlg.close(); else dlg.removeAttribute('open');
			if (act === 'ok' || act === 'clear') { updateYakuzaiCountTable(); updateSeibunCountTable(); }
		});
	}
	// 問いの並び: 行をまたぐ問い(総量の条件など)→ 防除計画の行の順
	const firstIdx = (q) => Math.min(...(q.ref ? [q.ref] : (q.rows || [])).map(r => r.rowIndex ?? Infinity), Infinity);
	const qs = questions.slice().sort((x, y) => (x.ref ? 1 : 0) - (y.ref ? 1 : 0) || firstIdx(x) - firstIdx(y));
	dlg._questions = qs;
	const nos = (rows) => rows.map(r => r.cells?.[1]?.textContent.trim()).filter(Boolean).join(',');
	const where = (q) => {
		if (q.ref && q.ref.cells) {
			const c = q.ref.cells;
			const jiki = (c[6]?.textContent || '').trim(), hoho = (c[10]?.textContent || '').replace(/\s+/g, ' ').trim();
			return `No.${(c[1]?.textContent || '').trim()} ${(c[4]?.textContent || '').trim()} (${(c[3]?.textContent || '').trim()}) ${jiki}/${hoho}`;
		}
		return `${q.seibun || q.tsusho || ''} (No.${nos(q.rows || [])})`;
	};
	const body = qs.map((q, i) => {
		const cur = usageChoices.get(q.choiceKey) || '';
		const opt = (value, label) => `<label class="ur-opt"><input type="radio" name="urq${i}" value="${escapeHtml(value)}"${cur === value ? ' checked' : ''}> ${escapeHtml(label)}</label>`;
		return `<fieldset class="ur-q${cur ? ' ur-answered' : ''}"><legend>${escapeHtml(where(q))}</legend>`
			+ `<div class="ur-title">${escapeHtml(q.title)}</div>`
			+ q.options.map(o => opt(o.value, o.label)).join('')
			+ opt('', '未選択(要確認のまま)')
			+ `</fieldset>`;
	}).join('');
	dlg.innerHTML = `<h3>要確認の内容を選択: ${escapeHtml(subject || '')}</h3>`
		+ `<p class="ur-note">選んだ内容で判定をやり直します。この選択はこの画面の中だけのもので、防除計画(.json)には保存されません(再読込、または行の内容・使用回数が変わると元の要確認に戻ります)。</p>`
		+ `<div class="ur-list">${body || '<p>選択できる項目はありません。</p>'}</div>`
		+ `<div class="ur-buttons"><button type="button" data-act="clear">この選択をすべて解除</button><button type="button" data-act="cancel">キャンセル</button><button type="button" data-act="ok">確定して再計算</button></div>`;
	if (dlg.showModal) { if (!dlg.open) dlg.showModal(); } else dlg.setAttribute('open', '');
}

// 警告色C(warn-bg-c)をすべて元の背景色に戻す
function clearWarnCHighlight() {
	document.querySelectorAll('.warn-bg-c').forEach(el => el.classList.remove('warn-bg-c'));
}
// 防除計画の警告色Cのセル(薬剤名)をクリックしたときも、警告色Cをすべて解除する
document.addEventListener('click', (e) => {
	if (e.target.closest('#planTable td.warn-bg-c')) clearWarnCHighlight();
});

// 警告色(warn-bg)をすべて元の背景色に戻す。薬剤別使用回数の薬剤名、または防除計画の警告色の薬剤名をクリックしたときに呼ぶ
function clearWarnHighlight() {
	// 警告色A と、OK の薬剤名のクリックによる確認色(warn-bg-d)は同じ操作で付けるので、一緒に戻す
	document.querySelectorAll('.warn-bg, .warn-bg-d').forEach(el => el.classList.remove('warn-bg', 'warn-bg-d'));
}
// 防除計画の警告色の薬剤名をクリックしたときも、すべての警告色を戻す
document.addEventListener('click', (e) => {
	if (e.target.closest('#planTable td.warn-bg, #planTable td.warn-bg-d')) clearWarnHighlight();
});

function handleDrop(event) {
	event.preventDefault();

	// firefox, Safari の場合
	if (!isFileSystemAccessSupported) {
		readFile(event.dataTransfer.files[0]);
		return;
	}

	// Chrome, Edge の場合
	const item = event.dataTransfer.items[0];
	if (item && item.kind === 'file' && item.type === 'application/json') {
		openPlanFile(item);
	} else {
		alert('対応していないファイル形式です。');
	}
}

// 自動保存データ復元
function restorePlan() {
	const savedString = localStorage.getItem('unsavedPlan');
	try {
		const appData = JSON.parse(savedString);
		console.log('planData:', appData.planData);
		const msg = `前回の未保存データ${appData.fileName ? `(ファイル名: ${appData.fileName})` : ''}を復元しました。`;
		loadPlanFromJson(appData.planData, msg); 
		currentFilename = appData.fileName;
	} catch (err) {
		console.error('データの復元に失敗しました:', err);
	}
}

// DOM読込完了時の初期設定
window.addEventListener('DOMContentLoaded', async function() {
	//データベース読込
	if (db === null) await fetchDB();

	// 作物ツリーの生成とイベントハンドラ設定
	const sql = `
		select idsaku, class, toroku, sakumotsu, shukakubui, betsumei, 
		':'||replace(n_concat('、', strconv(sakumotsu, 'k'), strconv(betsumei, 'k'), ruby), '、', ':')||':' as keywords
		from m_sakumotsu where sakumotsu not like '%除く%';
	`;
	await makeCropTree('#cropTree', sql, searchCrop);

	// firefox のリロード時 checkbox 状態復元対策
	clearAllReset();

	// 防除計画テーブルの初期化
	createPlanTable();

	// イベントリスナーの一括登録
	document.getElementById('cbyochuSelect').addEventListener('change', onCbyochuChange);
	document.getElementById('byochuSelect').addEventListener('change', handleByochuSelection);

	// フォールバック用inputが変更された時の処理（Firefox/Safari用）
	const fallbackInput = document.getElementById('fallbackFileInput');
	fallbackInput.addEventListener('change', (e) => {
		readFile(e.target.files[0]);
		fallbackInput.value = ''; // 連続で同じファイルを選んでもイベントが走るように値をリセット
	});

	// ドラッグ＆ドロップのイベントリスナーを設定
	const planContainer = document.getElementById('resultPane');
	planContainer.addEventListener('dragover', (event) => {
		event.preventDefault(); // Allow drop
	});
	planContainer.addEventListener('drop', handleDrop);

	// unsavedPlan がある場合は btnRestorePlan を可視化
	if (localStorage.getItem('unsavedPlan')) document.getElementById('btnRestorePlan')?.classList.remove('hidden');

});

// 共通ヘッダのタブメニュー(loader.js)は、tabExecuted が true なら選んだタブを別タブ(_blank)で、false なら同じタブ(_self)で開く。
// tabExecuted は、このタブでは updateRowNumbers が「計画に行があるか」で決めるが、薬剤の詳細などの検索表を出すと
// table.js の outputTable / resetTables が「検索結果があるか」で上書きする(結果なしの検索で false に戻る)。
// 入力途中の内容を同じタブの遷移で失わないよう、メニュー項目のクリックの直前(キャプチャ段階)に、
// 計画に行がある、またはユーザーの操作(作物の選択など)があったなら true にし直す

// ユーザーの操作の事実: タブの本体(.tab_content。タイトルバー・タブメニューは除く)で、ユーザー自身が行った
// ポインタの押下(マウス・タッチ・ペン)・キー入力・ファイルのドロップ。一度操作すれば、再読込まで true。
// click・change・input は、プログラムの element.click() からも isTrusted のまま発生する(ブラウザ仕様)ので使わない
// (作物ツリーの状態復元などのプログラムの操作を、ユーザーの操作と取り違えないため)
let userOperated = false;
['pointerdown', 'keydown', 'drop'].forEach(type => document.addEventListener(type, (e) => {
	if (!e.isTrusted || userOperated) return;
	if (e.target instanceof Element && e.target.closest('.tab_content')) userOperated = true;
}, true));

document.addEventListener('click', (e) => {
	if (!(e.target instanceof Element) || !e.target.closest('.menu-item')) return;
	const planRows = document.querySelector('#planTable tbody')?.rows.length || 0;
	if ((planRows > 0 || userOperated) && typeof tabExecuted !== 'undefined') tabExecuted = true;
}, true);

// タブ終了時の処理
window.addEventListener('beforeunload', (event) => {
	if (!isDirty) return; // 保存済みなら即終了
	//event.preventDefault();  // ブラウザの確認ダイアログ表示
	//event.returnValue = ''; // 古いブラウザ（互換性）のための記述
	const appData = {
		planData: convPlanToJson(),
		fileName: currentFilename
	};
	localStorage.setItem('unsavedPlan', JSON.stringify(appData));
});
</script>

<!--div id="tab-header" class="tab_header"></div--><!--	タブヘッダー表示領域確保 -->
<!--	このタブの表示内容 -->
<div class="tab_content">
	<!--div id="caption">防除計画作成支援：作成中...</div-->
	<div class="flex_container">
		<div id="conditionPane">
			<div id="cropTree"></div>
		</div>

			<h3 id="title" class="hidden"></h3>

				<div class="captionLabel">薬剤候補</div>
				<div id="yakuzai_flex">
				<div id="byochuContainer" class="hidden">
					<div id="cbyochuHeader" class="inputbar">
						<select id="cbyochuSelect">
							<option value="" selected>病害虫区分：なし</option>
							<option value="病害">病害</option>
							<option value="害虫">害虫</option>
							<option value="雑草">雑草</option>
							<option value="鳥獣">鳥獣</option>
							<option value="その他">使用目的</option>
						</select>
