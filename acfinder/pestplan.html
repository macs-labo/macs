<script>

// テーブルインスタンスを保存する大域変数
let isRecordMode = false; // 記録モードフラグ
let currentSakumotsu = null; // 現在選択されている作物条件
let currentCbyochu = null;   // 現在選択されているcid
// let currentYoto = null;   // 現在選択されている用途　未使用
let currentByochu = null;   // 現在選択されている病害虫
let currentYakuzai = null;   // 現在選択されている薬剤

// 読み込んだ、または一度保存したファイルハンドル及びファイル名を保持する変数
let currentFileHandle = null;
let currentFilename = '';

// 無保存データフラグ
let isDirty = false;

// refreshPlan で旧データ行(olddata)が発生したことがあるかどうかのフラグ
// （旧データ行がすべて削除されたタイミングで「作成時DB登録日」表示を消すために使う）
let hasHadOldDataRows = false;

// clearContent プロトタイプ宣言
if (!HTMLElement.prototype.clearContent) {
	HTMLElement.prototype.clearContent = function() {
		this.textContent = '';
		//this.className = 'hidden';
	};
}

async function dbExec(sql) {
	await waiting(true, 'データベース検索中');
	try {
		return db.exec(sql);
	} catch (error) {
		throw error;
	} finally {
		await waiting(false);
	}
}

async function searchCrop() {
	const title = document.querySelector('#title');
	
	// Reset all filters and lists
	currentCbyochu = null;
	currentYakuzai = null; // 作物選択が変わったら薬剤フィルターをリセット
	currentByochu = null;  // 作物選択が変わったら病害虫フィルターをリセット
	// 各コンテナをクリア
	document.getElementById('byochuSelect')?.clearContent();
	document.getElementById('racContainer')?.clearContent();
	document.getElementById('yakuzaiContainer')?.clearContent();
	document.getElementById('yakuzaiTekiyo')?.clearContent();

	// Determine currentSakumotsu based on checkedCrops (this can return null)
	currentSakumotsu = makeCropCondition(checkedCrops.map(item => item.sakumotsu));

	if (!currentSakumotsu) { // No crops selected or makeCropCondition returned null
		title?.clearContent();
		title.classList.add('hidden');
		// Clear all related lists and show empty state
		setYakuzaiList(); // These functions now handle null currentSakumotsu
		setRacList();
		setCbyochuList(); // This will populate the cbyochu select, but subsequent byochu filtering will be empty.
		return;
	}

	// If currentSakumotsu is not null, proceed with populating lists
	const crops = checkedCrops.map(item => item.sakumotsu); // checkedCrops から作物だけの配列を取り出し
	title.innerHTML = crops.join(' | ');
	title.classList.remove('hidden');
	//他の SQL
	setCbyochuList();
	/* // yoto リスト用 未使用
	const sqlYoto = `select distinct yoto from tv_tsushoTekiyo where sakumotsu in (${currentSakumotsu}) order by yoto;`;
	setTimeout(() => {
		if (sqlYoto){setYotoList(sqlYoto);} // この関数は現在未使用
	},0);
	*/

	const sql = `select * from tv_tsushoTekiyo where sakumotsu in (${currentSakumotsu});`;
	//console.log(sql);
	try {
		setYakuzaiList();	//選択作物に対応する全ての薬剤リスト
		setRacList();

		let result = await dbExec(sql);
		
	} catch (error) {
		console.error(`エラー: ${error.message}`);
	}
	//setByochuList(sqlByochu);
}

function setCbyochuList(){
	const list = document.getElementById('byochuSelect');
	if (list) list.innerHTML = '';
	document.getElementById('byochuContainer').classList.remove('hidden');
}

function onCbyochuChange(event) {
	const cbyochu = event.target.value;
	if (cbyochu) {
		currentCbyochu = cbyochu;
		const sql = `select distinct n_concat(':',byochu,mokuteki) as byochu from m_tekiyo where sakumotsu in (${currentSakumotsu}) 
			and (byochu in (select byochu from m_byochu left join cbyochu using(cid) where cname ='${currentCbyochu}')
			or mokuteki in (select byochu from m_byochu left join cbyochu using(cid) where cname ='${currentCbyochu}'));`;
		setByochuList(sql);
	} else { // 選択が解除された場合の処理
		currentByochu = null;
		currentCbyochu = null;
		const buttons = document.getElementById('byochuButtons');
		if (buttons) buttons.innerHTML = '';
		const list = document.getElementById('byochuSelect');
		if (list) list.innerHTML = '';
		document.getElementById('yakuzaiTekiyo')?.clearContent();
		if (currentSakumotsu) {
			setYakuzaiList();
			setRacList();
		}
	}
}

//------ 未使用
async function setYotoList(sqlYoto) {
	if (debug) console.log("Executing SQL for yoto list:", sqlYoto); // SQLを確認
	const sqlResult = await dbExec(sqlYoto);
	if (debug) console.log("Result for yoto list:", sqlResult); // 結果を確認
	const yotoContainer = document.getElementById('yotoContainer');
	yotoContainer?.clearContent();

	// ボタン用のコンテナを作成
	const buttonContainer = document.createElement('div');
	buttonContainer.className = 'inputbar';

	const selectAllButton = document.createElement('button');
	selectAllButton.textContent = '全て選択';
	selectAllButton.onclick = () => {
		const checkboxes = selectYoto.querySelectorAll('input[type="checkbox"]');
		checkboxes.forEach(cb => cb.checked = true);
		selectYoto.dispatchEvent(new Event('change', { bubbles: true }));
	};

	const deselectAllButton = document.createElement('button');
	deselectAllButton.textContent = '全て解除';
	deselectAllButton.onclick = () => {
		const checkboxes = selectYoto.querySelectorAll('input[type="checkbox"]');
		checkboxes.forEach(cb => cb.checked = false);
		selectYoto.dispatchEvent(new Event('change', { bubbles: true }));
	};

	buttonContainer.appendChild(selectAllButton);
	buttonContainer.appendChild(deselectAllButton);
	yotoContainer.appendChild(buttonContainer);

	const selectYoto = document.createElement('div');
	selectYoto.id = 'selectYoto';

	if (sqlResult && sqlResult.length > 0 && sqlResult[0].values && sqlResult[0].values.length > 0) {
		sqlResult[0].values.forEach(row => {
			const yoto = row[0];
			if (!yoto) return;

			const checkboxItem = document.createElement('div');
			const checkbox = document.createElement('input');
			checkbox.type = 'checkbox';
			checkbox.value = yoto;
			checkbox.id = 'yoto_' + yoto.replace(/[^a-zA-Z0-9]/g, '_');

			const label = document.createElement('label');
			label.htmlFor = checkbox.id;
			label.textContent = yoto;

			checkboxItem.appendChild(checkbox);
			checkboxItem.appendChild(label);
			selectYoto.appendChild(checkboxItem);
		});
	}

	yotoContainer.appendChild(selectYoto);

	selectYoto.addEventListener('change', (event) => {
		if (event.target.type !== 'checkbox') return;

		const checked = Array.from(selectYoto.querySelectorAll('input:checked')).map(cb => cb.value);
		currentYoto = checked.map(z => `'${z}'`).join(',');

		document.getElementById('byochuSelect')?.clearContent(); // 病害虫リストをクリア

		if (currentYoto) {
			const sql = `select distinct n_concat(':',byochu,mokuteki) as byochu from tv_tsushoTekiyo where sakumotsu in (${currentSakumotsu}) and yoto in (${currentYoto})`;
			setByochuList(sql);
			}
		}
	);
}

// 薬剤リスト作成 
async function setYakuzaiList(sqlOption = '') {
	// currentSakumotsu が null の場合、薬剤リストを空にする
	if (!currentSakumotsu) {
		const yakuzaiDiv = document.getElementById('yakuzaiContainer');
		if (yakuzaiDiv) {
			yakuzaiDiv.innerHTML = `
				<div class="inputbar"><input type="text" id="inputYakuzai" placeholder="絞込薬剤名/用途" disabled><button id="btnFilterYakuzai" disabled>絞込</button></div>
				<select id="yakuzaiSelect" size="10"></select>
			`;
		}
		await waiting(false);

// RACリストを作成する関数
async function setRacList(byochu = false) {
	// currentSakumotsu が null の場合、RACリストを空にする
	if (!currentSakumotsu) {
		const racContainer = document.getElementById('racContainer');
		if (racContainer) {
			racContainer.innerHTML = `
				<div class="inputbar"><input type="text" id="inputRac" placeholder="絞込RACコード/系統名" disabled><button id="btnFilterRac" disabled>絞込</button></div>
				<select id="racSelect" size="10"></select>
			`;
		}
		await waiting(false);
		return;
	}

	const byochuCondition = byochu ? ` and (byochu in (${currentByochu}) or mokuteki in (${currentByochu}))` : '';
	const sql = `with racs as (
		select distinct mid1 as mid, iif(instr(rem1, 'FRAC'), replace(rem1, 'FRAC系統名: ', ''), null) as rem, keito1 as keito from tv_tsushoTekiyo where mid1 is not null and sakumotsu in (${currentSakumotsu})${byochuCondition} union
		select distinct mid2 as mid, iif(instr(rem2, 'FRAC'), replace(rem2, 'FRAC系統名: ', ''), null) as rem, keito2 as keito from tv_tsushoTekiyo where mid2 is not null and sakumotsu in (${currentSakumotsu})${byochuCondition} union
		select distinct mid3 as mid, iif(instr(rem3, 'FRAC'), replace(rem3, 'FRAC系統名: ', ''), null) as rem, keito3 as keito from tv_tsushoTekiyo where mid3 is not null and sakumotsu in (${currentSakumotsu})${byochuCondition} union
		select distinct mid4 as mid, iif(instr(rem4, 'FRAC'), replace(rem4, 'FRAC系統名: ', ''), null) as rem, keito4 as keito from tv_tsushoTekiyo where mid4 is not null and sakumotsu in (${currentSakumotsu})${byochuCondition} union
		select distinct mid5 as mid, iif(instr(rem5, 'FRAC'), replace(rem5, 'FRAC系統名: ', ''), null) as rem, keito5 as keito from tv_tsushoTekiyo where mid5 is not null and sakumotsu in (${currentSakumotsu})${byochuCondition} order by mid)
		select mid as rac, iif(rem = keito, null, replace(rem, keito, '')) as rem, gn_concat(', ', keito) as keito from racs group by mid;
		--select concat(mid, ' ['||iif(rem = keito, null, replace(rem, iif(instr(keito, ', '), explode(', ', keito, 2), keito), ''))||']') as rac, gn_concat(', ', keito) as keito from racs group by mid;
	`;
	const sqlResult = await dbExec(sql);
	const racContainer = document.getElementById('racContainer');
	if (!racContainer) return;

	const rows = sqlResult[0]?.values || [];
	let lastSelectedRac = null;

	const options = rows.map(row => {
		const rac = row[0];
		let rem = (row[1] || '').replace('()', '').replace(/^\((.*?)\)$/, '$1') || '';
		const keito = row[2];
		if (rem && rac.includes(',')) {
			keito.split(',').forEach(item => { rem = rem.replace(item.trim(), ''); });
		}
		const remText = rem ? ` [${rem}]` : '';
		return `<option value="${rac}" data-search="${rac}${remText} ${keito}">${rac}${remText} / ${keito}</option>`;
	}).join('');

	racContainer.innerHTML = `
		<div class="inputbar">
			<input type="text" id="inputRac" placeholder="絞込RACコード/系統名">
			<button id="btnFilterRac">絞込</button>
		</div>
		<select id="racSelect" size="10">${options}</select>
	`;

	const inputRac = racContainer.querySelector('#inputRac');
	const filterButton = racContainer.querySelector('#btnFilterRac');
	const selectBox = racContainer.querySelector('#racSelect');

	const deselectRac = () => {
		Array.from(selectBox.options).forEach(opt => opt.classList.remove('hidden'));
		lastSelectedRac = null;
		selectBox.value = '';
		filterButton.textContent = '絞込';
		setYakuzaiList(currentByochu ? ` and (byochu in (${currentByochu}) or mokuteki in (${currentByochu}))` : '');
	};

	const filterRacList = () => {
		let filterText = inputRac.value.trim();
		if (filterText === '' || filterButton.textContent === '解除') {
			inputRac.value ='';
			deselectRac();
			return;
		}
		
		filterText = romajiConv(filterText.toLowerCase()).toHiragana();
		Array.from(selectBox.options).forEach(option => {
			const optionText = romajiConv(option.dataset.search.toLowerCase()).toHiragana();
			option.classList.toggle('hidden', !optionText.includes(filterText));
		});
		filterButton.textContent = '解除';
		inputRac.blur();
	};

	filterButton.onclick = filterRacList;
	filterButton.addEventListener('mousedown', (e) => { if (document.activeElement === inputRac) e.preventDefault(); });
	inputRac.onchange = filterRacList;
	inputRac.addEventListener('input', () => {
		if (inputRac.value === '') {
			if (typeof isMobile === 'undefined' || !isMobile) { deselectRac(); } 
			else { filterButton.textContent = '絞込'; }
		} else if (filterButton.textContent === '解除') { filterButton.textContent = '絞込'; }
	});

	selectBox.addEventListener('click', (event) => {
		const selectedOption = event.target;
		const currentValue = selectedOption.value;
		if (currentValue) {
			if (currentValue === lastSelectedRac) {
				setYakuzaiList();
				lastSelectedRac = null;
			} else {
				selectBox.value = currentValue;
				let sql = currentByochu ? ` and (byochu in (${currentByochu}) or mokuteki in (${currentByochu}))` : '';
				sql += ` and (mid1 = '${currentValue}' or mid2 = '${currentValue}' or mid3 = '${currentValue}' or mid4 = '${currentValue}' or mid5 = '${currentValue}')`;
				setYakuzaiList(sql);
				lastSelectedRac = currentValue;
			}
		}
	});
}

// 集約された病害虫名(byochu)セルの文字列を、個別の病害虫名の配列に分解する
// （複数行の場合 <br> 区切りで格納されているため、それぞれを個別の項目として比較できるようにする）
function parseByochuList(byochuHtml) {
	if (!byochuHtml) return [];
	return String(byochuHtml)
		.split(/<br\s*\/?>/i)
		.map(s => s.replace(/<[^>]+>/g, '').trim())
		.filter(s => s.length > 0);
}

// 2つの病害虫名セルの内容を、個別の病害虫名の集合として比較し、近さ(Jaccard係数)を返す
function getByochuSimilarity(byochuA, byochuB) {
	const setA = new Set(parseByochuList(byochuA));
	const setB = new Set(parseByochuList(byochuB));
	if (setA.size === 0 && setB.size === 0) return 1;
	let intersection = 0;
	setA.forEach(v => { if (setB.has(v)) intersection++; });
	const union = new Set([...setA, ...setB]).size;
	return union === 0 ? 0 : intersection / union;
}

// 個別の病害虫名の集合として、2つの病害虫名セルの内容が同じかどうかを判定する（並び順は問わない）
function byochuEquals(byochuA, byochuB) {
	const listA = parseByochuList(byochuA).slice().sort();
	const listB = parseByochuList(byochuB).slice().sort();
	if (listA.length !== listB.length) return false;
	return listA.every((v, i) => v === listB[i]);
}

function racEquals(oldVal, newVal) {
	const oldList = (oldVal || '').split('<br>').sort();
	const newList = (newVal || '').split('<br>').sort();
	if (oldList.length !== newList.length) return false;
	return newList.every((v, i) => v.startsWith(oldList[i]));
}

// 病害虫名セルに個別ハイライトを付ける際、病害虫名自体に含まれうる特殊文字をエスケープする
function escapeHtml(str) {
	return String(str)
		.replace(/&/g, '&amp;')
		.replace(/</g, '&lt;')
		.replace(/>/g, '&gt;')
		.replace(/"/g, '&quot;')
		.replace(/'/g, '&#39;');
}

// refreshPlan の比較で使う、カラムごとの「一致」判定
// ・病害虫名(byochu)は個別名の集合として比較する
// ・RAC(mid)は、新データが旧データの後方に情報を追記しただけ（前方一致）であれば「変更なし」とみなす
// ・それ以外は単純な文字列完全一致
function fieldMatches(field, oldVal, newVal) {
	if (field === 'byochu') return byochuEquals(oldVal, newVal);
	if (field === 'mid') return racEquals(oldVal, newVal);
	return (oldVal || '') === (newVal || '');
}

/*
			// 前回「失効」表示にした使用回数セルが残っていれば、元の値に戻す
			const kaisuCell = row.cells[fieldToCellIndex.kaisu];
			if (kaisuCell && kaisuCell.dataset.originalKaisu !== undefined) {
				kaisuCell.textContent = kaisuCell.dataset.originalKaisu;
				delete kaisuCell.dataset.originalKaisu;
			}
*/
			let candidates;
			if (candidateCache.has(yakuzaiName)) {
				candidates = candidateCache.get(yakuzaiName);
			} else {
				candidates = await getYakuzaiCandidates(yakuzaiName);
				candidateCache.set(yakuzaiName, candidates);
			}

			if (candidates.length === 0) {
				notFoundYakuzai.add(yakuzaiName);
				row.classList.add('row-not-found'); // 現在の作物条件で登録が見つからない行を赤字表示
				row.setAttribute('hidden', ''); // 変更候補行と同様に、旧データ行としてマークする
				row.classList.add('olddata');
/*
				if (kaisuCell) {
					kaisuCell.dataset.originalKaisu = kaisuCell.textContent; // 元の値を保持しておき、再実行時に復元できるようにする
					kaisuCell.innerHTML = '<em>[登録削除]</em>'; // 使用回数カラムに「登録削除」表示
				}
*/
				continue;
			}

			// 現在の行の内容を、候補セットと同じ形のオブジェクトとして取得
			const oldData = {
				sakumotsu: row.cells[3]?.textContent.trim() || '',
				byochu: (row.cells[5]?.innerHTML || '').trim(),
				jiki: row.cells[6]?.textContent.trim() || '',
				kaisu: row.cells[7]?.textContent.trim() || '',
				baisu: row.cells[8]?.textContent.trim() || '',
				ekiryo: row.cells[9]?.textContent.trim() || '',
				hoho: row.cells[10]?.textContent.trim() || '',
				seibun: (row.cells[11]?.innerHTML || '').trim(),
				seibunkaisu: (row.cells[12]?.innerHTML || '').trim(),
				mid: (row.cells[13]?.innerHTML || '').trim()
			};

			// 全カラムが一致するレコードが候補内にあれば、その行はそのまま
			// ・病害虫名(byochu)は個別名の集合として比較（並び順は無視）
			// ・RAC(mid)は前方一致（新データが旧データの続きになっているだけ）なら一致とみなす
			const exactMatchCandidate = candidates.find(c => compareFields.every(f => fieldMatches(f, oldData[f], c[f])));
			if (exactMatchCandidate) {
				// RAC(mid)が前方一致で伸びている場合、旧行の表示だけを最新の値に書き換える
				const midCell = row.cells[fieldToCellIndex.mid];
				if (midCell && exactMatchCandidate.mid && exactMatchCandidate.mid !== oldData.mid) {
					midCell.innerHTML = exactMatchCandidate.mid;
				}
				continue;
			}

			// 一致しない場合、最も一致するカラム数が多い候補レコードを探す
			// ・kaisu/baisu/ekiryo/hoho等はDBのGROUP BYキーのため、これらが同点の候補が複数残ることがある
			// ・その場合は「一番最初に見つかったもの」ではなく、病害虫名(byochu)が最も近いものを優先する
			const otherFields = compareFields.filter(f => f !== 'byochu');
			let bestCandidate = null;
			let bestScore = -1;
			let bestByochuSim = -1;
			candidates.forEach(c => {
				const score = otherFields.reduce((n, f) => n + (fieldMatches(f, oldData[f], c[f]) ? 1 : 0), 0);
				const byochuSim = getByochuSimilarity(oldData.byochu, c.byochu);
				if (score > bestScore || (score === bestScore && byochuSim > bestByochuSim)) {
					bestScore = score;
					bestByochuSim = byochuSim;
					bestCandidate = c;
				}
			});
			if (!bestCandidate) continue;

			// 旧行のうち、最新レコードと値が異なるカラムだけを赤字表示する（病害虫名以外）
			// ・RAC(mid)は前方一致であれば「変更なし」として扱い、旧行の表示だけ最新の値に書き換える
			compareFields.forEach(f => {
				if (f === 'byochu') return; // 病害虫名は個別名単位で別途処理する
				if (fieldMatches(f, oldData[f], bestCandidate[f])) {
					if (f === 'mid') {
						const midCell = row.cells[fieldToCellIndex.mid];
						if (midCell && bestCandidate.mid && bestCandidate.mid !== oldData.mid) {
							midCell.innerHTML = bestCandidate.mid;
						}
					}
					return;
				}
				row.cells[fieldToCellIndex[f]]?.classList.add('cell-changed');
			});

			// 病害虫名セルは、候補側に存在しない個別の病害虫名だけを赤字表示する
			if (!byochuEquals(oldData.byochu, bestCandidate.byochu)) {
				const oldByochuItems = parseByochuList(oldData.byochu);
				const candidateByochuSet = new Set(parseByochuList(bestCandidate.byochu));
				if (oldByochuItems.length > 0) {
					row.cells[fieldToCellIndex.byochu].innerHTML = oldByochuItems.map(item =>
						candidateByochuSet.has(item) ? escapeHtml(item) : `<span class="cell-changed">${escapeHtml(item)}</span>`
					).join('<br>');
				} else {
					row.cells[fieldToCellIndex.byochu]?.classList.add('cell-changed');
				}
			}

			// 防除時期はDBの登録内容ではないため、元の行の値をそのまま引き継ぐ
			const timingCell = row.cells[2];
			const [timing, timingMonth, timingPeriod] = getTimingArray(isRecordMode, timingCell);

			const newData = {
				timing, timingMonth, timingPeriod,
				sakumotsu: bestCandidate.sakumotsu,
				byochu: bestCandidate.byochu,
				jiki: bestCandidate.jiki,
				kaisu: bestCandidate.kaisu,
				baisu: bestCandidate.baisu,
				ekiryo: bestCandidate.ekiryo,
				hoho: bestCandidate.hoho,
				seibun: bestCandidate.seibun,
				seibunkaisu: bestCandidate.seibunkaisu,
				mid: bestCandidate.mid
			};

			// 元の行はそのまま残し、最新レコードを新しい行としてすぐ下に挿入する
			const newRow = document.createElement('tr');
			addYakuzaiToPlanRow(newRow, yakuzaiName, newData);
			row.insertAdjacentElement('afterend', newRow);

			// 元の行を「変更候補のある旧データ行」としてマークする（hidden属性で識別、表示自体はCSSで維持）
			row.setAttribute('hidden', '');
			row.classList.add('olddata');
			updatedCount++;
		}

		updateRowNumbers(); // 行番号・使用回数集計等を更新

		// 更新候補・見つからなかった薬剤のいずれも無く、変更が全く無かった場合は
		// 「作成時DB登録日」を「更新時DB登録日」に変更
		if (updatedCount === 0 && notFoundYakuzai.size === 0) {
			setDatasetInfo('更新時DB登録日: ' + currentDbUpdate);
		}

		let msg = updatedCount > 0
			? `${updatedCount} 件の行で登録内容の変更が見つかったため、最新のレコードを行の下に追加しました。\n内容をご確認のうえ、不要な行を削除してください。`
			: '登録内容に変更は見つかりませんでした。';
		if (notFoundYakuzai.size > 0) {
			msg += `\n\n以下の薬剤は、現在の作物条件では登録が見つかりませんでした：\n${Array.from(notFoundYakuzai).join('、')}`;
		}
		alert(msg);

	} catch (e) {
		console.error('防除計画の更新確認中にエラーが発生しました:', e);
		alert('防除計画の更新確認中にエラーが発生しました。');
	} finally {
		waiting(false);
	}
}

// 病害虫リスト作成
async function setByochuList(sql) {
	if (debug) console.log("Executing SQL for Byochu list:", sql);
	const sqlResult = await dbExec(sql);
	const byochuButtons = document.getElementById('byochuButtons');
	const byochuSelect = document.getElementById('byochuSelect');
	if (!byochuButtons || !byochuSelect) return;

	// currentSakumotsu が null の場合、病害虫リストを空にする
	if (!currentSakumotsu) {
		byochuButtons.innerHTML = `
			<button onclick="setAllCheckboxes(document.getElementById('byochuSelect'), handleByochuSelection, true)" disabled>全て選択</button>
			<button onclick="setAllCheckboxes(document.getElementById('byochuSelect'), handleByochuSelection, false)" disabled>全て解除</button>
		`;
		byochuSelect.innerHTML = '';
		await waiting(false);
		return;
	}

	const rows = sqlResult[0]?.values || [];
	
	byochuButtons.innerHTML = `
		<button onclick="setAllCheckboxes(document.getElementById('byochuSelect'), handleByochuSelection, true)">全て選択</button>
		<button onclick="setAllCheckboxes(document.getElementById('byochuSelect'), handleByochuSelection, false)">全て解除</button>
	`;

		const id = 'byochu_' + row[0].replace(/[^a-zA-Z0-9]/g, '_');
		return `<div><input type="checkbox" value="${row[0]}" id="${id}"><label for="${id}">${row[0]}</label></div>`;
	}).join('');

	handleByochuSelection({ target: byochuSelect.querySelector('input') || { type: 'none' } });

}

// 病害虫選択時の処理
async function handleByochuSelection(event) {
	if (event.target.type !== 'checkbox') return;

	const byochuSelect = document.getElementById('byochuSelect');
	if (!byochuSelect) return;

	const checked = Array.from(byochuSelect.querySelectorAll('input:checked')).map(cb => cb.value);
	// コロンで区切られた値を分割し、フラットな配列にする
	const flattenedByochu = checked.flatMap(b => b.split(':').filter(Boolean));
	// 重複を除去
	const uniqueByochu = [...new Set(flattenedByochu)];
	currentByochu = uniqueByochu.map(b => `'${b}'`).join(',');

	// 薬剤リストをクリア
	const yakuzaiContainer = document.getElementById('yakuzaiContainer');
	yakuzaiContainer?.clearContent();
	// RACリストをクリア
	const racContainer = document.getElementById('racContainer');
	racContainer?.clearContent();
	// 適用候補テーブルをクリア
	const tekiyoContainer = document.getElementById('yakuzaiTekiyo');
	tekiyoContainer?.clearContent();

	// Only proceed if crops are selected and there are selected byochu
	if (currentSakumotsu && currentByochu) { // Added currentSakumotsu check
		const sql = ` and (byochu in (${currentByochu}) or mokuteki in (${currentByochu}))`;
	 	setYakuzaiList(sql);
		setRacList(true); // RACリスト更新 病害虫フィルター付き
	} else {
		// If no crops or no byochu, clear and reset lists
		setYakuzaiList(); // Reset to default (empty if no crops)
		setRacList(); // Reset to default (empty if no crops)
	}
}

// sql 実行 結果グリッド作成
async function executeSQLsetGrid(sqls) {
	if (!db) {
		alert("データベースがロードされていません。");
		return;
	}

	// テーブルインスタンスをクリア
	tables.forEach(table => {
		if (table && typeof table.destroy === 'function') {
			table.destroy();
		}
	});
	tables = [];
	let resultDiv = document.getElementById("result");
	if (!resultDiv) return; // resultDiv がなければ何もしない
	// 子要素をすべて削除 (innerHTML = '' よりも安全)
	while (resultDiv.firstChild) {
		resultDiv.removeChild(resultDiv.firstChild);
	}

	try {
		// クエリを逐次実行
		for (const [index, sql] of sqls.entries()) {
			//console.log(sql.query);
			await new Promise((resolve) => {
				// ローディング画面を確実に表示
				waiting(true, `クエリ ${index + 1} 実行中`);
				// UI更新を反映させるためにsetTimeoutを使用
				setTimeout(() => {
					requestAnimationFrame(() => {
						try {
							let searchTime = -performance.now();
							let result = db.exec(sql.query);
							searchTime += performance.now();

							// 結果を表示
							let option = { caption: sql.caption, /* query: sql.query, searchTime: searchTime*/ };
							if (sql.caption.startsWith('適用')) option.hideFooterU20 = false;
							const columns = result[0].columns;
							if (columns.length == 1 && columns[0] == 'chuijiko') {
								const value = result[0].values[0][0];
								result[0].values[0][0] = value.replaceAll(/#/g, "\n");
							}
							// テーブルインスタンスを保存(outputTable は表1つを返す。tables は表の配列のまま保つ)
							const table = outputTable('#result', result, option);
							if (table) {
								tables.push(table);
								tabExecuted = true;
							}
						} catch (error) {
							// クエリごとのエラーをキャッチ
							//setToolbarText(`<span class="error">クエリ${index + 1} エラー: ${error.message}</span>`);
						} finally {
							// 各クエリ実行後にローディング画面を非表示
							waiting(false);
						}
						resolve();
					});
				}, 0); // 0msで次のイベントループに処理を移す
			});
		}

		// すべてのクエリ実行後に結果をチェック
		if (tables.length === 0 && !tabExecuted) {
			//setToolbarText('<span class="success">実行成功（結果なし）</span>');
		}

	} catch (error) {
		// 全体のエラーハンドリング
		waiting(false);
		//setToolbarText(`<span class="error">エラー: ${error.message}</span>`);
	}
//*/
}

// 現在時刻を YYYYMMDD-hhmmss にフォーマット
function formatDateTime(opt = '') {
	const now = new Date();
	let format = { year: 'numeric' };
	switch (opt.toLowerCase()) {
		case 'year': break;
		case 'date': format = {...format, month: '2-digit', day: '2-digit'}; break;
		default: format = {...format, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
	}
	const formattedDate = now.toLocaleString('ja-JP', format);
	return formattedDate.replace(/[\/:]/g, '').replace(' ', '-');
}

// ファイル名のプレフィックス（作物名）を取得する関数
function getFilenamePrefix() {
	const titleElement = document.getElementById('title');
	if (titleElement && titleElement.textContent) {
		// ファイル名として不適切な文字をアンダースコアに置換
		const cropName = titleElement.textContent.replace(/[,/\?%*:|"<>]/g, '_');
		return cropName + '_';
	}
	return '';
}

function parseTiming(timingText) {
	let timingMonth = '', timingPeriod = '';
	if (timingText) {
		if (/^\d{4}-\d{2}-\d{2}$/.test(timingText)) {
			const [year, month, day] = timingText.split('-');
			timingMonth = (+month).toString();
			timingPeriod = day > 20 ? '下旬' : day > 10 ? '中旬' : '上旬';
		} else {
			if (timingText === '日付選択' || timingText === '') {
				[timingText, timingMonth, timingPeriod] = ['', '', ''];
			} else {
				[timingMonth, timingPeriod] = timingText.split('月');
			}
		}
	}
	return [timingText, timingMonth, timingPeriod];
}

function getMonthPeriod(td, timingOnly = false) {
	let timing = '', month = '', period = '';
	const monthSelect = td.querySelector('.timing-month');
	if (monthSelect) {
		month = monthSelect.value || '';
		period = td.querySelector('.timing-period')?.value || '';
		timing = (month && period) ? `${month}月${period}` : ''; // 防除記録用にこのデータは必須
	} else {
		const timingText = td.querySelector('.timing')?.textContent || '';
		[timing, month, period] = parseTiming(timingText);
	}
	if (timingOnly) return timing;
	return [timing, month, period];
}

function getTimingText(td) {
	let timingText;
	if (isRecordMode) {
		timingText = td.querySelector('label')?.textContent || '';
	} else {
		timingText = getMonthPeriod(td, true);
		//if (!timingText) {
		//	timingText = td.querySelector('.timing')?.textContent || '';
		//}
	}
	return timingText;
}

function getTimingArray(mode, td) {
	let timing, timingMonth, timingPeriod;
	if (mode) {
		const timingText = td.querySelector('label')?.textContent || '';
		[timing, timingMonth, timingPeriod] = parseTiming(timingText);
	} else {
		[timing, timingMonth, timingPeriod] = getMonthPeriod(td);
		//if (!timing) {
		//	const timingText = td.querySelector('.timing')?.textContent || '';
		//	[timing, timingMonth, timingPeriod] = parseTiming(timingText);
		//}
	}
	return [timing, timingMonth, timingPeriod];
}

		dataset: currentDbUpdate, // 保存時点の農薬登録情報DBの登録更新日
		sakumotsu: currentSakumotsu, // 作物条件のSQL文字列
		crops: checkedCrops, // 選択作物オブジェクトの配列(モバイル版互換用)
		titleText: document.getElementById('title').textContent, // #title のテキスト内容
		plan: planData
	};

	const headers = ['no', 'timing', 'sakumotsu','yakuzai','byochu','jiki', 'kaisu', 'baisu', 'ekiryo','hoho', 'seibun', 'seibunkaisu', 'mid'];

	table.querySelectorAll('tbody tr').forEach(tr => {
		const rowData = {};
		tr.querySelectorAll('td').forEach((td, index) => {
			if (index > 0) { // 「操作」列をスキップ
				const key = headers[index - 1];
				if (index === 2) { // 防除時期セル
					[rowData.timing, rowData.timingMonth, rowData.timingPeriod] = getTimingArray(isRecordMode, td);
				} else {
					rowData[key] = td.innerHTML; // innerHTMLを使用して<br>タグを保持
				}
			}
		});
		planData.push(rowData);
	});

	return JSON.stringify(saveData, null, 2);
}

// planTable の内容を JSON 形式で保存する関数
async function savePlanFile(overwrite = true) {
	// 登録日の古い旧データ行(olddata)が残っている場合は、保存前に確認する
	const planTableBodyForCheck = document.querySelector('#planTable tbody');
	const hasOldDataRowsForSave = planTableBodyForCheck
		? Array.from(planTableBodyForCheck.rows).some(row => row.hasAttribute('hidden'))
		: false;
	if (hasOldDataRowsForSave) {
		const proceedWithSave = confirm(
			'登録日の古いデータ行が残っています。保存すると現在開いているDBの登録更新日が保存されますので、古いデータ行を削除してから保存することをおすすめします。このまま保存する場合は、次回読み込み時に古いデータ行が残った状態で表示されることをご承知ください。'
		);
		if (!proceedWithSave) return;
	}

	const saveData = convPlanToJson();

	// デフォルトファイル名
	const prefix = getFilenamePrefix(); // 作物名プレフィックス
	const baseName = isRecordMode ? '防除記録' : '防除計画';
	let filename = currentFilename ? currentFilename : `${prefix}${baseName}_${formatDateTime('year')}.json`;
	if (currentFilename) {
		if (isRecordMode) {
			filename = filename.replace('計画', '記録');
		} else {
			filename = filename.replace('記録', '計画');
		}
	}

	// API 非対応ブラウザの場合はダウンロード型保存
	if (!isFileSystemAccessSupported) {
		const blob = new Blob([saveData], { type: 'application/json' });
		saveAs(blob, filename);
		isDirty = false;
		alert(
			`「${filename}」をダウンロードしました。\n\n` +
			"【便利なヒント】\n" +
			"Google Chrome や Microsoft Edge などのブラウザでお使いいただくと、" +
			"同じファイルへの「上書き保存」や「名前を付けて保存」ができるようになり、ファイルがたまらず便利です！"
		);
		return;
	}

	// overwrite = true でファイルハンドルがあり、basename が一致している場合は「上書き」
	if (overwrite && currentFileHandle && currentFilename.includes(baseName)) {
		try {
			const writable = await currentFileHandle.createWritable();
			await writable.write(saveData);
			await writable.close();
			isDirty = false;
			alert('ファイルを上書き保存しました。');
			return;
		} catch (err) {
			console.error('上書き失敗（新規保存に切り替えます）:', err);
		}
	}

	// overwrite = false またはハンドルがない、または basename が不一致、または上書きに失敗した場合は「名前を付けて保存」
	try {
		const fileHandle = await window.showSaveFilePicker({
			suggestedName: filename,
			types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }]
		});
		
		
		const writable = await fileHandle.createWritable();
		await writable.write(saveData);
		await writable.close();

		currentFileHandle = fileHandle; // 次回上書き用にハンドルを記憶
		currentFilename = fileHandle.name;
		isDirty = false;
		alert('新しくファイルを保存しました。次回からは自動で上書きされます。');
		
	} catch (err) {
		if (err.name !== 'AbortError') {
			alert('ファイルの保存に失敗しました。');
		}
	}

}

// 防除計画ファイルを開く
async function openPlanFile(item = null) {

	const planTableBody = document.querySelector('#planTable tbody');
	if (planTableBody && planTableBody.rows.length > 0) {
		if (!confirm('現在の防除計画/記録をクリアして、新しいファイルを読み込みますか？')) {
			return;
		}
	}

	// 【パターンB】Firefox / Safari など（隠しinputを代わりにクリック）
	if (!isFileSystemAccessSupported) {
		document.getElementById('fallbackFileInput')?.click();
		return;
	}

	// 【パターンA】Chrome / Edge など（上書き保存のルートに乗せる）
	try {
		let fileHandle = null;
		if (item) {
			fileHandle = await item.getAsFileSystemHandle();
		} else {
			[fileHandle] = await window.showOpenFilePicker({
				types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }],
				multiple: false
			});
		}
		const file = await fileHandle.getFile();
		const text = await file.text();
		currentFileHandle = fileHandle; // ハンドルを記憶
		currentFilename = fileHandle.name; // ファイル名を保存
		loadPlanFromJson(text); // データ読み込み共通関数へ
	} catch (err) {
		if (err.name !== 'AbortError') alert('ファイルの読み込みに失敗しました。');
	}

}

// fallbackFileInput の場合の読込
function readFile(file) {
	if (!file) return;
	if (!file.name.toLowerCase().endsWith('.json')) {
		alert('対応していないファイル形式です。');
	}

	currentFileHandle = null; // ハンドルは取れないのでnull

	const reader = new FileReader();
	reader.onload = (e) => {
		try {
			loadPlanFromJson(e.target.result); // データ読み込み共通関数へ
		} catch (err) {
			alert('ファイルの解析に失敗しました。正しいJSONファイルか確認してください。');
		}
	};
	reader.onerror = () => {
		alert('ファイルの読み込み中にエラーが発生しました。');
	};
	reader.readAsText(file); // テキストとして読み込み開始
	currentFilename = file.name; // ファイル名保存
}

// JSONファイルを読み込んでplanTableを復元する関数
async function loadPlanFromJson(jsonText, msg) {

	try {
		const loadedData = JSON.parse(jsonText);
		const planData = loadedData.plan;

		// 先頭行が日付形式なら記録モードを自動有効化
		const firstRow = planData[0];
		isRecordMode = !!(firstRow && firstRow.timing && /^\d{4}-\d{2}-\d{2}$/.test(firstRow.timing));
		const modeCheck = document.getElementById('checkRecordMode');
		if (modeCheck) modeCheck.checked = isRecordMode;

		// 'plan', 'titleText', 'crops' の存在をチェック
		if (!Array.isArray(planData) || loadedData.titleText === undefined) { // loadedData.crops はオプションなのでチェックしない
			throw new Error('Invalid JSON format: missing plan, titleText, or crops.');
		}

		// 作物情報の復元
		window.checkedCrops = loadedData.crops || []; // crops がない場合は空配列で初期化

		// currentSakumotsu を checkedCrops から再構築、または古い形式のsakumotsuから復元
		currentSakumotsu = null; // まず初期化
		if (window.checkedCrops.length > 0) {
			currentSakumotsu = makeCropCondition(window.checkedCrops.map(item => item.sakumotsu));
		} else if (loadedData.sakumotsu) { // 古い形式のJSONでcropsがない場合
			currentSakumotsu = loadedData.sakumotsu;
		}

		// 作物ツリーのチェック状態を視覚的に復元
		if (_defaultCropTreeManager && typeof _defaultCropTreeManager.syncCheckState === 'function') {
			_defaultCropTreeManager.syncCheckState();
		}

		// searchCrop を呼び出して、UIと関連リストを更新
		await searchCrop(); // searchCrop が null currentSakumotsu を処理するように変更

		// テーブルを復元
		const planTableBody = document.querySelector('#planTable tbody');
		if (!planTableBody) return;

		// #title のテキスト内容を復元
		const titleElement = document.getElementById('title');
		if (titleElement) {
			titleElement.textContent = loadedData.titleText;
			titleElement.classList.remove('hidden'); // タイトルを表示状態にする
		}

		// 既存のテーブル内容と候補テーブルをクリア
		planTableBody?.clearContent();
		document.getElementById('yakuzaiTekiyo')?.clearContent();

		// JSONデータからテーブルを再構築
		planData.forEach(rowData => {
			const newRow = planTableBody.insertRow();
			const yakuzaiName = rowData.yakuzai || '';
			const data = {
				timing: rowData.timing || '', // Add timing property
				// 日付形式(YYYY-MM-DD)から月と旬を計算するフォールバック
				timingMonth: rowData.timingMonth || (rowData.timing && /^\d{4}-\d{2}-\d{2}$/.test(rowData.timing) ? String(new Date(rowData.timing).getMonth() + 1) : ''),
				timingPeriod: rowData.timingPeriod || (rowData.timing && /^\d{4}-\d{2}-\d{2}$/.test(rowData.timing) ? (new Date(rowData.timing).getDate() <= 10 ? '上旬' : new Date(rowData.timing).getDate() <= 20 ? '中旬' : '下旬') : ''),
				sakumotsu: rowData.sakumotsu || '',
				yakuzai: rowData.yakuzai || '',
				byochu: rowData.byochu || '',
				jiki: rowData.jiki || '',
				kaisu: rowData.kaisu || '-',
				baisu: rowData.baisu || '',
				ekiryo: rowData.ekiryo || '',
				hoho: rowData.hoho || '',
				//yukoseibun: rowData.yukoseibun || '',
				seibun: rowData.seibun || '',
				seibunkaisu: rowData.seibunkaisu || '',
				mid: rowData.mid || ''
			};
			addYakuzaiToPlanRow(newRow, yakuzaiName, data);
		});

		updateRowNumbers(); // 行番号の再採番と成分別使用回数の更新
		isDirty = false;

		// 保存時点の農薬登録情報DB登録更新日(dataset)を表示する
		const dataset = loadedData.dataset ? `作成時DB登録日: ${loadedData.dataset}` : '';
		setDatasetInfo(dataset);

		// jsonファイルを読み込んだので、登録内容更新（refresh）アイコンを有効化する
		document.getElementById('btnRefreshPlan')?.classList.remove('disabled');

		if (!msg) msg = '防除計画/防除記録を読み込みました。';
		alert(msg);

	} catch(err) {
		console.error('JSONファイルの解析に失敗しました:', err);
		alert('ファイルの読み込みに失敗しました。有効なJSONファイルを選択してください。');
	}
}

// planTableの内容をExcelファイルとして保存する関数
async function savePlanTableAsExcel() { // 関数名を savePlanTableExcel から savePlanTableAsExcel に変更
	const table = document.getElementById('planTable');
	if (!table) return;

	const baseName = isRecordMode ? '防除記録' : '防除計画';
	const workbook = new ExcelJS.Workbook();
	const planWorksheet = workbook.addWorksheet(baseName);

	// ヘッダー行を追加 (「操作」列を除く)
	const headers = [];
	table.querySelectorAll('thead th').forEach((th, index) => {
		if (index > 0) headers.push(th.textContent);
	});
	planWorksheet.addRow(headers);

	// データ行を追加 (「操作」列を除く)
	table.querySelectorAll('tbody tr').forEach(tr => {
		const rowData = [];
		tr.querySelectorAll('td').forEach((td, index) => {
			if (index > 0) {
				let cellText;
				if (index === 2) { // 防除時期セル
					cellText = getTimingText(td);
				} else {
					// <br> を改行文字 \n に変換
					cellText = td.innerHTML.replace(/<br\s*\/?>/gi, '\n');
				}
				rowData.push(cellText);
			}
		});
		planWorksheet.addRow(rowData);
	});

	// すべてのセルでテキストの折り返しを有効にする
	planWorksheet.eachRow({ includeEmpty: true }, function(row, rowNumber) {
		row.eachCell({ includeEmpty: true }, function(cell, colNumber) {
			cell.alignment = { wrapText: true, vertical: 'top' };
		});
	});

	// --- 成分別使用回数テーブルを別シートに追加 ---
	const seibunTable = document.getElementById('seibunCountTable');
	if (seibunTable) {
		const seibunWorksheet = workbook.addWorksheet('成分別使用回数');
		const seibunHeaders = [];
		seibunTable.querySelectorAll('thead th').forEach(th => {
			seibunHeaders.push(th.textContent);
		});
		seibunWorksheet.addRow(seibunHeaders);

		// データ行
		seibunTable.querySelectorAll('tbody tr').forEach(tr => {
			const rowData = [];
			tr.querySelectorAll('td').forEach(td => {
				rowData.push(td.textContent);
			});
			seibunWorksheet.addRow(rowData);
		});

		// 合計行 (フッター)
		const tfoot = seibunTable.querySelector('tfoot');
		if (tfoot) {
			tfoot.querySelectorAll('tr').forEach(tr => {
				const rowData = [];
				tr.querySelectorAll('td').forEach(td => {
					rowData.push(td.textContent);
				});
				seibunWorksheet.addRow(rowData);
			});
		}
	}

	// Excel ファイルを生成して保存
	const buffer = await workbook.xlsx.writeBuffer();
	const prefix = getFilenamePrefix(); // 作物名プレフィックス
	const filename = `${prefix}${baseName}_${formatDateTime('date')}.xlsx`;

	// API 非対応ブラウザの場合はダウンロード型保存
	if (!isFileSystemAccessSupported) {
		const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
		saveAs(blob, filename);
		alert('Exelファイルをダウンロードしました。');
		return;
	}

	try {
		const fileHandle = await window.showSaveFilePicker({
			suggestedName: filename,
			types: [{ description: 'JSON Files', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }]
		});
		
		const writable = await fileHandle.createWritable();
		await writable.write(buffer);
		await writable.close();
		alert('ファイルを保存しました');
		
	} catch (err) {
		if (err.name !== 'AbortError') {
			alert('ファイルの保存に失敗しました。');
		}
	}
}

// 指定したテーブルの内容をクリップボードにコピーする関数
async function copyTableToClipboard(tableId) {
	const table = document.getElementById(tableId);
	if (!table) return;

	let data = '';
	const headers = [];
	table.querySelectorAll('thead th').forEach(th => headers.push(th.textContent));
	data += headers.join('\t') + '\n';

	// 結合セル(rowspan)は、貼り付け先で各行に値が入るよう、結合された行にも同じ値を繰り返す
	const spans = [];   // 列番号 -> { rest: 残りの行数, text }
	// セルの文字列。要確認の内容を選ぶボタン(画面操作用)の文字は含めない
	const cellText = (td) => {
		if (!td.querySelector('button.ur-open')) return td.textContent;
		const c = td.cloneNode(true);
		c.querySelectorAll('button.ur-open').forEach(b => b.remove());
		return c.textContent;
	};
	table.querySelectorAll('tbody tr').forEach(row => {
		const rowData = [];
		const cells = Array.from(row.querySelectorAll('td'));
		let ci = 0;
		let k = 0;
		while (k < cells.length || (spans[ci] && spans[ci].rest > 0)) {
			if (spans[ci] && spans[ci].rest > 0) {
				rowData.push(spans[ci].text);
				spans[ci].rest--;
			} else {
				const td = cells[k++];
				rowData.push(cellText(td));
				const rs = parseInt(td.getAttribute('rowspan') || '1', 10);
				if (rs > 1) spans[ci] = { rest: rs - 1, text: cellText(td) };
			}
			ci++;
		}
		data += rowData.join('\t') + '\n';
	});

	const tfoot = table.querySelector('tfoot');
	if (tfoot) {
		tfoot.querySelectorAll('tr').forEach(row => {
			const rowData = [];
			row.querySelectorAll('td').forEach(td => rowData.push(td.textContent));
			data += rowData.join('\t') + '\n';
		});
	}

	try {
		await navigator.clipboard.writeText(data);
		alert('クリップボードにコピーしました。');
	} catch (err) {
		console.error('クリップボードへのコピーに失敗しました: ', err);
		alert('コピーに失敗しました。');
	}
}

// テーブルに行を追加し、ボタンを設定する
function addYakuzaiToPlanRow(row, yakuzaiName, data) {
	// 操作ボタンのセル
	const actionCell = row.insertCell(0);
	actionCell.classList.add('actions');

	actionCell.innerHTML = 
		`<svg class="svg_button" onclick="deleteRow(this)"><title>削除</title><use href="icons.svg?v=3#trash-x"></use></svg>` +
		`<svg class="svg_button" onclick="moveRow(this, 'up')"><title>上へ移動</title><use href="icons.svg?v=3#arrow-up"></use></svg>` +
		`<svg class="svg_button" onclick="moveRow(this, 'down')"><title>下へ移動</title><use href="icons.svg?v=3#arrow-down"></use></svg>`;

	// No, 薬剤名, ... 他の空セル
	row.insertCell(1); // No
	
	const timingCell = row.insertCell(2);
	renderTimingCell(timingCell, data);

	row.insertCell(3).textContent = data.sakumotsu || ''; // 作物名

	row.insertCell(6).textContent = data.jiki || ''; // 使用時期
	row.insertCell(7).textContent = data.kaisu || ''; // 回数
	row.insertCell(8).textContent = data.baisu || ''; // 希釈倍率
	row.insertCell(9).textContent = data.ekiryo || ''; // 使用量
	row.insertCell(10).textContent = data.hoho || ''; // 使用方法
	row.insertCell(11).innerHTML = data.seibun || ''; // 成分
	row.insertCell(12).innerHTML = data.seibunkaisu || ''; // 成分回数
	row.insertCell(13).innerHTML = data.mid || ''; // RAC
}

// タイミングセルの内容を描画・更新するヘルパー
function renderTimingCell(cell, data) {
	cell.innerHTML = '';
	cell.classList.add('timing-cell');

	if (isRecordMode) {
		// 日付入力フィールド
		const dateDisplayWrapper = document.createElement('div'); // This is the wrapper for the display span and hidden input
		dateDisplayWrapper.classList.add('date-display-wrapper');

		const displayLabel = document.createElement('label'); // labelに変更
		// inputと紐付けるための一意なIDを生成
		const uniqueId = 'plan_date_' + Math.random().toString(36).substring(2, 7) + '_' + Date.now();
		displayLabel.htmlFor = uniqueId;

		let displayText = '';
		if (data.timing) {
			displayText = data.timing;
		} else if (data.timingMonth && data.timingPeriod) {
			displayText = `${data.timingMonth}月${data.timingPeriod}`;
		} else {
			displayText = '日付選択';
		}
		displayLabel.textContent = displayText;

		const dateInput = document.createElement('input');
		dateInput.type = 'date';
		dateInput.id = uniqueId;
		dateInput.value = data.timing && /^\d{4}-\d{2}-\d{2}$/.test(data.timing) ? data.timing : '';

		dateInput.onchange = function() {
			displayLabel.textContent = this.value;
			// 先頭行が日付になったら、他の行も（もし未設定なら）自動で合わせるためのフックポイント
			updateRowNumbers();
		};
		dateInput.onclick = function(e) { e.stopPropagation(); };

		dateDisplayWrapper.onclick = function() {
			// labelクリックによりinputが反応するが、ブラウザ互換性のためにshowPickerも維持
			if (typeof dateInput.showPicker === 'function') {
				try { dateInput.showPicker(); } catch (e) {}
			}
		};

		dateDisplayWrapper.appendChild(displayLabel);
		dateDisplayWrapper.appendChild(dateInput);
		cell.appendChild(dateDisplayWrapper);
	} else {
		// 月旬セレクタ
		const timingDiv = document.createElement('div');
		timingDiv.classList.add('timing');
		// data.timing が YYYY-MM-DD 形式ならそのまま表示
		if (data.timing && /^\d{4}-\d{2}-\d{2}$/.test(data.timing)) {
			//timingDiv.textContent = formatToYYMMDD(data.timing);
			timingDiv.textContent = data.timing;
		} else {
			const monthSelect = document.createElement('select');
			monthSelect.className = 'timing-month';
			monthSelect.innerHTML = '<option value="">月</option>' + Array.from({length: 12}, (_, i) => `<option value="${i+1}">${i+1}月</option>`).join('');
			monthSelect.value = data.timingMonth || '';
			const periodSelect = document.createElement('select');
			periodSelect.className = 'timing-period';
			const periods = ['上旬', '中旬', '下旬'];
			periodSelect.innerHTML = '<option value="">旬</option>' + periods.map(p => `<option value="${p}">${p}</option>`).join(''); // Option for period
			periodSelect.value = data.timingPeriod || '';

			monthSelect.onchange = updateRowNumbers;
			periodSelect.onchange = updateRowNumbers;

			timingDiv.appendChild(monthSelect);
			timingDiv.appendChild(periodSelect);
		}
		cell.appendChild(timingDiv);
	}
}

// モード切り替え
function toggleRecordMode(checked) {
	isRecordMode = checked;
	const planTableBody = document.querySelector('#planTable tbody');
	if (!planTableBody) return;

	Array.from(planTableBody.rows).forEach(row => {
		const timingCell = row.cells[2];
		const	[currentTiming, currentMonth, currentPeriod] = getTimingArray(!isRecordMode, timingCell);

		renderTimingCell(timingCell, {
			timing: currentTiming,
			timingMonth: currentMonth,
			timingPeriod: currentPeriod
		});
	});
	updateRowNumbers();
}

// 行を削除する
function deleteRow(button) {
	const row = button.closest('tr');
	row.parentNode.removeChild(row);
	updateRowNumbers();
}

// 行を移動する
function moveRow(button, direction) {
	const row = button.closest('tr');
	const tbody = row.parentNode;
	if (direction === 'up' && row.previousElementSibling) {
		tbody.insertBefore(row, row.previousElementSibling);
	} else if (direction === 'down' && row.nextElementSibling) {
		tbody.insertBefore(row.nextElementSibling, row);
	}
	updateRowNumbers();
}

// 防除時期で計画をソートする関数
function sortPlanByTiming() {
	const planTableBody = document.querySelector('#planTable tbody');
	if (!planTableBody) return;
	const rows = Array.from(planTableBody.rows);
	const periodMap = { '上旬': 1, '中旬': 2, '下旬': 3, '': 0 }; // 0 for unspecified period

	rows.sort((a, b) => {
		// Row A の値を取得
		const dateInputA = a.querySelector('.timing-cell input[type="date"]');
		const monthSelectA = a.querySelector('.timing-cell .timing-month');
		const periodSelectA = a.querySelector('.timing-cell .timing-period');

		let valA = null;
		if (dateInputA && dateInputA.value) {
			valA = new Date(dateInputA.value).getTime(); // Convert to timestamp for sorting
		} else if (monthSelectA && monthSelectA.value && periodSelectA && periodSelectA.value) {
			const m = parseInt(monthSelectA.value, 10);
			const p = periodMap[periodSelectA.value] || 0;
			valA = m * 10 + p; // Numeric representation for month/period
		}

		// Row B の値を取得
		// Row B values
		const dateInputB = b.querySelector('.timing-cell input[type="date"]');
		const monthSelectB = b.querySelector('.timing-cell .timing-month');
		const periodSelectB = b.querySelector('.timing-cell .timing-period');

		let valB = null;
		if (dateInputB && dateInputB.value) {
			valB = new Date(dateInputB.value).getTime();
		} else if (monthSelectB && monthSelectB.value && periodSelectB && periodSelectB.value) {
			const m = parseInt(monthSelectB.value, 10);
			const p = periodMap[periodSelectB.value] || 0;
			valB = m * 10 + p;
		}

		// Handle null/undefined values (unspecified timing) by pushing them to the end
		if (valA === null && valB === null) return 0;
		if (valA === null) return 1; // A is unspecified, push to end
		if (valB === null) return -1; // B is unspecified, push to end

		return valA - valB;
	});

	rows.forEach(row => planTableBody.appendChild(row));
	updateRowNumbers();
}

// No. の再採番とボタンの状態更新
function updateRowNumbers() {
	const planTableBody = document.querySelector('#planTable tbody');
	if (!planTableBody) return;

	// 事故防止のため、ここに来た段階で自動保存データを削除して復元ボタンを隠す
	if (localStorage.getItem('unsavedPlan')) {
		localStorage.removeItem('unsavedPlan');
		document.getElementById('btnRestorePlan')?.classList.add('hidden');
	}

	const rows = planTableBody.rows;
	const hasRows = rows.length > 0;
	isDirty = hasRows;

	// 行がない場合は記録モード解除
	if (!hasRows) {
		isRecordMode = false;
		const checkRecordMode = document.getElementById('checkRecordMode');
		if (checkRecordMode) checkRecordMode.checked = false;
	}

	// 作物ツリーのロック制御
	const cropTree = document.getElementById('cropTree');
	if (cropTree) {
		cropTree.classList.toggle('locked', hasRows);
		cropTree.title = hasRows ? '計画にデータがあるため作物の変更はできません。' : '';
	}

	tabExecuted = hasRows; // 防除計画に行があれば実行済み
	['btnSortPlan', 'btnCopyPlan', 'btnExcelPlan', 'btnSavePlan', 'btnSavePlanAs'].forEach(id => {
		const btn = document.getElementById(id);
		if (btn) {
			btn.classList.toggle('disabled', !hasRows);
		}
	});

	let noCounter = 0;
	for (let i = 0; i < rows.length; i++) {
		const row = rows[i];
		// 変更候補行とペアになっている旧データ行（row-not-found ではない hidden 行）だけを連番から除外する。
		// notFoundYakuzai行（row-not-found）はペアの新しい行を持たないため、通常どおり自分自身の番号を持つ。
		const isPairedOldRow = row.hasAttribute('hidden') && !row.classList.contains('row-not-found');

		// No. を更新
		if (!isPairedOldRow) {
			row.cells[1].textContent = ++noCounter;
		}
		row.cells[1].className = 'No';

		// ボタンの状態を更新
		const icons = row.cells[0].querySelectorAll('svg');
		const upIcon = icons[1];
		const downIcon = icons[2];
		
		if (upIcon) {
			upIcon.classList.toggle('disabled', i === 0);
		}
		if (downIcon) {
			downIcon.classList.toggle('disabled', i === rows.length - 1);
		}
	}

	// 変更候補行とペアになっている旧データ行には、対応する行（直後の行。なければ直前の行）と同じNoを表示する
	for (let i = 0; i < rows.length; i++) {
		const row = rows[i];
		if (!row.hasAttribute('hidden') || row.classList.contains('row-not-found')) continue;
		const refRow = rows[i + 1] || rows[i - 1];
		if (refRow && row.cells[1] && refRow.cells[1]) {
			row.cells[1].textContent = refRow.cells[1].textContent;
		}
	}

	// 各カウントテーブルを更新
	updateYakuzaiCountTable();
	updateSeibunCountTable();

	// hidden属性の旧データ行（refreshPlanで作成）が1件でもあれば「旧データ一括削除」ボタンを表示する
	const hasOldDataRows = Array.from(rows).some(row => row.hasAttribute('hidden'));
	document.getElementById('btnDeleteOldRows')?.classList.toggle('hidden', !hasOldDataRows);

	// 旧データ行(olddata)が発生したことがある状態から、すべて削除されて0件になったら、
	// 「作成時DB登録日」の表示を「更新時DB登録日」に変更
	if (hasOldDataRows) {
		hasHadOldDataRows = true;
	} else if (hasHadOldDataRows) {
		setDatasetInfo('更新時DB登録日: ' + currentDbUpdate);
		hasHadOldDataRows = false;
	}
}

// refreshPlan によって hidden 属性が付いた旧データ行（変更候補あり／notFoundYakuzai）を一括削除する
function deleteOldDataRows() {
	const planTableBody = document.querySelector('#planTable tbody');
	if (!planTableBody) return;

	const oldRows = Array.from(planTableBody.rows).filter(row => row.hasAttribute('hidden'));
	if (oldRows.length === 0) return;

	if (!confirm(`旧データ行（変更候補のある行、または現在の作物条件で登録が見つからない行）を ${oldRows.length} 件削除します。よろしいですか？`)) {
		return;
	}

	oldRows.forEach(row => row.remove());
	updateRowNumbers();
}

// ==== 使用回数上限の超過判定 (成分別・内訳枠): 時期/方法/対象の3軸で規定文を解釈する ====
/*
 * 【全体像】
 *  入力  : 計画表の使用行(1行 = 1回の使用。「使用回数」列の値は使わない)と、有効成分ごとの成分回数(seibunkaisu)の規定文
 *  規定文: 「4回以内(は種時の土壌混和は1回以内、生育期の株元灌注は1回以内、散布は合計2回以内)」のように、
 *          先頭が総量、括弧内が「使用時期・使用方法・対象(剤型など)ごとの内訳上限」
 *  処理  : ①規定文を「枠(slot)」と「条件(atom)」に分解する(parseRule)
 *          ②使用行を 時期(positions) / 方法(methods) / 対象(targets・form) に分解する(normalizeRow)
 *          ③行と条件を 3値(yes/maybe/no)で照合し、行を1つの枠に割り当てる(assign)
 *          ④枠ごとに使用回数を数え、上限超過を NG、確定できない使用を含めて超えるなら 要確認 とする(judge)
 *  方針  : 確定した使用だけで超えたときだけ NG。確定できない使用は候補の枠すべてに「可能性」として数え(最悪の場合)、
 *          それで上限を超えうるときだけ 要確認。超えようがなければ、不明な点があっても OK(1回の使用は上限を超えない)。
 *
 *  【判定要件】(2026-10 確定。要確認548件の精査で定めたもの)
 *   R1  要確認の条件: 枠を確定できない行・読めない時期語の行・解釈できない条件は「可能性」として数え、上限を超えうるときだけ要確認。
 *       規定文そのものを読めない場合は、内訳の上限は最低1回なので、その成分の使用が2回以上のときだけ要確認
 *   R2  排他的な区分(最上位の内訳の上限の合計 ≥ 総量): 使用はどれかの枠に属する。該当しうる枠が1つなら確定(消去法)
 *   R3  排他的な区分で、名指しの時期だけの枠(休眠期処理)と一般の方法の枠(散布・灌注・混和)の両方に当たる行は時期の枠
 *   R4  同格の候補は、方法の語句が使用方法と文字どおり一致する枠、時期が真に狭い枠(定植直後 ⊂ 定植後)を優先
 *   R5  出来事基準の時期(開花・出穂・幼穂形成・入水・伏せ込み・加温・一次/二次生理落果・浸種)は前後関係で照合。
 *       使用時期の括弧書きも読む。行がその出来事に触れていなければ確定しない(maybe)。
 *       前提: 出穂前20日以内は幼穂形成期の後、二次生理落果の時期・後は一次生理落果の後、満開・落花の後は開花の後
 *   R6  横断的な時期の枠(出来事基準の時期だけの節で、内訳の合計が総量を超え、時期の無い方法の節と並ぶもの。例: 出穂期以降)は、
 *       方法の枠と重ねて数える
 *   R7  時期の語彙: 本葉N枚・展開時・出芽時・袋掛け・初発・収穫予定N日前→生育中、覆土前→は種時、鉢上・仮植・株冷蔵・苗の低温暗黒処理→育苗中、
 *       植替→定植、培土→土寄せ、萌芽直前→萌芽前(植付前・植付時も萌芽前)、「その…後」→直前の語の後、作物名の(仮植床)→仮植床での使用
 *   R8  方法・対象の語彙: 土壌表面散布・全面土壌散布・播溝散布・全面均一散布は「散布」と区別、設置・配置、毒餌、鱗片=種子、罹病株、
 *       仮植床・苗床・育苗培土・育苗期=育苗の場所、は種前の浸漬・粉衣=種子への処理
 *   R9  「N倍希釈」の枠は、行の希釈倍数の範囲で照合(収まれば該当、重ならなければ非該当、一部・不明は確定しない)
 *   R10 使用目的: 「茎葉枯凋」「除草剤として」「…に使用する場合」は病害虫名の欄で照合。「異なる目的には使用しない」は2目的以上の使用でNG
 *   R11 条件付きの上限(「当該処理をする場合には」「…をする場合には」)は、条件の処理を計画で使ったときだけ効かせる
 *   R12 規定文の読み方: 「A又はB」は1枠を共有、「粉剤及び粉粒剤のX」「は種又は定植後」は後半を前の語にも分配、
 *       「…までの」は期間、「1花房当り1回」など単位当たりの回数は判定外、先頭が条件の規定(「種子への処理は1回、…」)は総量なしの内訳
 *   R13 1枠に時期の違う条件が並ぶとき、行の時期が条件の時期の和に収まれば、その枠に該当
 *   R14 排他的な区分なのにどの枠にも当たらない行は、時期の読み違いとみなし、方法・対象で否定されない枠を候補に戻す
 *       (0なら総量にだけ数える。規定文と登録の方法が食い違う場合で、規定文側の問題)
 *   R15 含有率で区別する剤型(「2%粒剤」「1%粒剤」)は、農薬名から辞書の含有率を引いて照合。含有率表は、そのような規定を持つ成分を
 *       判定するときだけ、データベース(m_kihon・seibun)からその成分の分を作る(contentPctOf)。引けない農薬は確定しない。
 *       「散布」の受け皿にしか確定的に当たらない株元散布などの行は、方法まで合う別の枠に該当しうるなら確定しない
 *
 *  【用語】
 *   枠(slot)   : 「Xは合計N回以内」1つ分の上限。{ id, label, limit, overlay, parentAtoms }。
 *                「合計」または条件が1つなら複数条件で1枠を共有、「合計」なしの列挙は条件ごとに別枠になる。
 *   条件(atom) : 枠に属する1つの条件(例: 「は種時の土壌混和」)。時期・方法・対象のうち書かれた軸だけを持つ。
 *   overlay    : 入れ子の括弧(内数)。親の条件と自分の条件の両方に当てはまる行を数える追加の枠。
 *   位置(P)    : 作業時期を時間軸上の位置に置き換えた番号(下の P)。
 *   3値照合    : yes=確実に該当 / maybe=該当するかもしれない(情報不足) / no=該当しない。
 *                枠を1つに確定できた行だけを「確定」として数え、確定できない行は「可能性」として別に数える。
 *
 *  【理由の文言と表示】(判定とは別に管理する。表示の集約・並べ替えに判定は使わない)
 *   内訳枠の理由は、規定文の内訳枠の文言そのもの(slotTextOf)+「: 使用回数N回」(要確認は「+可能性M回」)。
 *     例: 「本田での散布、空中散布、無人ヘリ散布は合計3回以内: 使用回数4回」
 *   内訳枠のある成分は、判定がどうであれ、その行が数えられた枠の理由を必ず表示する(OK の枠は judge の facts / okLines)。
 *   成分の総使用回数の理由(「総使用回数は4回以内: 使用回数4回」)も判定によらず必ず表示する。
 *   本剤の使用回数(登録ごと・登録をまたいだ合計)は表の使用回数・使用上限の列で分かるので、理由には書かず判定にだけ反映する。
 *
 *  【要確認の解消(利用者の選択)】
 *   judge は確定できない点ごとに「問い」を作り(questions)、opts.resolve(問い) が答えを返せばその答えで確定して数える。
 *   答えは画面の中だけで持つ(usageChoices)。防除計画(.json)には保存しない。選択がなければ判定は従来と同じ。
 *
 *  【公開】 UsageLimit.judge(items, 成分名, { contentPct(農薬名, 成分名), resolve(問い) })、
 *          UsageLimit.text(item, 成分名, { contentPct })(使用行が当たる内訳枠の規定文の文言。薬剤別の集計キー用。選択は反映しない)、
 *          UsageLimit.stageOf(時期)(現在の表示では使っていない)。ほかはすべてこの関数の内部用。
 *   items の各行: { no, ref, sakumotsu, yakuzai, zaikei, jiki, hoho, ekiryo, baisu(希釈倍数), byochu(病害虫名・使用目的), seibunkaisu }
 */
const UsageLimit = (() => {


// ============================================================ メモ化(計画表の更新ごとに再計算しない)
const jikiCache = new Map();   // 使用時期の文字列 → parseJikiRaw の結果
const ruleCache = new Map();   // 規定文(作物別規定は作物名も含む) → parseRuleRaw の結果
const rowCache = new Map();    // 「時期・方法・液量・薬剤名・剤型」の組 → normalizeRowRaw の結果
/** cache から key の値を返す。無ければ make() で作って保存する(結果は変更しない前提で共有する) */
function memo(cache, key, make) {
  let v = cache.get(key);
  if (v === undefined) { v = make(); cache.set(key, v); }
  return v;
}
/** 使用時期の文字列を解析する(メモ化)。戻り値は parseJikiRaw を参照 */
const parseJiki = (t) => memo(jikiCache, String(t == null ? '' : t), () => parseJikiRaw(t));
/**
 * 規定文を解析する(メモ化)。t: 規定文、sakumotsu: 行の作物名。
 * 作物別の規定(数字で始まらない文)だけが作物名で結果が変わるので、そのときだけキャッシュのキーに作物名を含める
 */
const parseRule = (t, sakumotsu) => {
  const text = String(t == null ? '' : t);
  const key = /^\s*\d/.test(text) ? text : text + '\u0000' + (sakumotsu || '');
  return memo(ruleCache, key, () => parseRuleRaw(text, { sakumotsu }));
};
/** 使用行 r = { jiki, hoho, ekiryo, yakuzai, zaikei } を照合用の形に正規化する(メモ化)。戻り値は normalizeRowRaw を参照 */
const normalizeRow = (r) => memo(rowCache, [r.jiki, r.hoho, r.ekiryo, r.yakuzai, r.zaikei, r.baisu, r.byochu, /仮植/.test(r.sakumotsu || '') ? 'K' : ''].join('\u0001'), () => normalizeRowRaw(r));

// ============================================================ 時期の語彙
// 作業時期を1本の時間軸(年内の作業順)上の位置に置き換える。範囲(A～B)は両端の間の位置をすべて含めて扱う
//   PRE  =0 作付前・耕起前・前作(土壌消毒など)   SOWB =1 は種前(浸種・催芽を含む)   SOW  =2 は種時・直播時
//   RAISE=3 育苗期(は種後～移植前)               PLB  =4 移植・定植・植付の前       PL   =5 移植時・定植時(当日・同時)
//   PLA  =6 移植・定植の直後(植付後萌芽前を含む) GROW =7 生育期・本田・発生期など   HILL =8 土寄せ時・土寄せ後(生育期の後半)
//   HARV =9 収穫期                               AFTER=10 収穫後・剪定後(次作までの休閑期)
const P = { PRE: 0, SOWB: 1, SOW: 2, RAISE: 3, PLB: 4, PL: 5, PLA: 6, GROW: 7, HILL: 8, HARV: 9, AFTER: 10 };
const P_MAX = 10;   // 位置の最大値(AFTER)
/** a から b までの整数配列(両端を含む)。範囲の間を埋めるのに使う */
const range = (a, b) => { const r = []; for (let i = a; i <= b; i++) r.push(i); return r; };

/** 文字列の正規化: 全角→半角(NFKC)、波ダッシュ類(~〜～)を「~」に統一、空白を除去。比較・解析の前に必ず通す */
function norm(s) {
  return String(s == null ? '' : s).normalize('NFKC').replace(/[~〜～]/g, '~').replace(/\s+/g, '');
}

/** 時期の比較キー: 括弧書き・但し書き・語尾(まで/までの処理)を除いた文字列。行の時期と規定文の枠条件が同じ表現かの判定に使う */
function timeKeyOf(t) {
  return norm(t).replace(/\([^)]*\)/g, '').replace(/^[^:、~]{1,12}:/, '').replace(/(但し|ただし|但).*$/, '').replace(/までの処理$|まで$|の処理$|処理$/, '');
}

// ============================================================ 出来事を基準にした時期(event)
// 開花・出穂・入水など、時間軸(P)の位置だけでは前後を区別できない出来事。
// 規定(「開花前は2回以内、開花後は3回以内」)と使用時期(「開花から収穫前日まで」)が同じ出来事に触れていれば、その前後関係で照合する。
// 使用時期の括弧書き(「は種直後～稲出芽前(入水15日前まで)」)も読む
const EVENTS = [
  ['開花', /開花/],
  ['出穂', /出穂/],
  ['幼穂形成', /幼穂形成/],
  ['入水', /入水/],
  ['伏込', /伏せ?込み?/],
  ['加温', /加温/],
  ['一次生理落果', /一次生理落果/],
  ['二次生理落果', /二次生理落果/],
  ['浸種', /浸種/],
];
/**
 * 文字列中の出来事と、それに対する相対位置を返す。戻り値 Map(出来事 → 'before'|'at'|'after'|'from'|'span')
 *   before=前・直前・N日前 / at=時・期(その時期) / after=後・直後・N日後 / from=以降・から(その時期を含めて後) /
 *   span=前と後の両方に触れている(「満開予定日10日前～満開40日後」など)
 * 「加温ハウス」のように前後の語が付かない言及は数えない
 */
function eventsOf(text) {
  const s = norm(text);
  const res = new Map();
  const add = (ev, rel) => {
    const cur = res.get(ev);
    if (!cur || cur === rel) { res.set(ev, rel); return; }
    const set = new Set([cur, rel]);
    // 前と後(以降)の両方 → span。後と以降 → 以降。時と後 → 以降
    if (set.has('before') || set.has('span')) res.set(ev, 'span');
    else res.set(ev, 'from');
  };
  EVENTS.forEach(([ev, re]) => {
    const g = new RegExp(re.source, 'g');
    let m;
    while ((m = g.exec(s))) {
      const t0 = s.slice(m.index + m[0].length);           // 出来事の語の直後
      const hasKi = /^(?:発生)?期/.test(t0);                // 「出穂期」「二次生理落果発生期」
      const tail = t0.replace(/^(?:発生)?期?/, '');
      let rel = null;
      if (/^(?:直前|前)/.test(tail) || /^\d+(?:~\d+)?日前/.test(tail)) rel = 'before';
      else if (/^(?:以降|から|~)/.test(tail)) rel = 'from';
      else if (/^(?:直後|後)/.test(tail) || /^\d+(?:~\d+)?日後/.test(tail)) rel = 'after';
      else if (hasKi || /^(?:時|当日|同時)/.test(tail)) rel = 'at';
      if (rel) add(ev, rel);
    }
  });
  // 満開・落花の後は開花の後(「満開20～40日後」)
  if (/(?:満開|落花)期?(?:後|以降|\d+(?:~\d+)?日後)/.test(s)) add('開花', 'after');
  // 二次生理落果は一次生理落果の後に起こる。二次生理落果の時期・後の使用は、一次生理落果より後
  if (res.has('二次生理落果') && res.get('二次生理落果') !== 'before' && !res.has('一次生理落果')) res.set('一次生理落果', 'after');
  // 麦・稲の幼穂形成期は出穂のおよそ25～45日前。出穂20日前より後(出穂前20日以内)の使用は幼穂形成期の後とみなす(農学上の前提)
  if (!res.has('幼穂形成')) {
    const hm = s.match(/出穂(?:期)?前(\d+)(?:~(\d+))?日/);
    if (hm && Math.max(Number(hm[1]), Number(hm[2] || 0)) <= 20) res.set('幼穂形成', 'after');
  }
  return res;
}
/** 規定の相対位置 a と使用時期の相対位置 r の照合(3値) */
function eventRel(a, r) {
  if (r === 'span') return 'maybe';
  if (a === 'before') return r === 'before' ? 'yes' : 'no';
  if (a === 'after') return r === 'after' || r === 'from' ? 'yes' : r === 'at' ? 'maybe' : 'no';
  if (a === 'from') return r === 'before' ? 'no' : 'yes';
  if (a === 'at') return r === 'at' ? 'yes' : r === 'from' ? 'maybe' : 'no';
  return 'maybe';
}

/**
 * 1つの語(「移植3日前」「定植直後」等)を 作業基準 + 相対位置 に分解する。戻り値 { term, anchor, rel, lit }
 *   anchor: 基準となる作業。'PLANT'(移植・定植・植付) / 'SOW'(は種) / 'RAISE'(育苗) / 'AFTER'(収穫後・剪定後) /
 *           'PRE'(作付前・耕起) / 'GROW'(生育期・発生期などの生育の語) / null(基準なし)
 *   rel   : 基準に対する相対位置。'before'(前) / 'at'(時・当日・同時) / 'just_after'(直後) / 'after'(後) / 'during'(期間中) / null
 *   lit   : 位置に置けない季節・月の語(休眠期・夏・6月・融雪後 など)をそのままの文字列で保持する。これは文字列の一致で照合する
 * 上から順に最初に当たった分類を採用する(順序が意味を持つ。例: 「育苗トレイ」は時期でなく対象なので育苗の分類から除外している)
 */
function scanTerm(t) {
  let anchor = null;   // 基準となる作業(上記)
  let lit = null;      // 位置に置けない語(季節・月)
  let rel = null;      // 基準との前後関係(上記)
  // 仮植(仮植床への植付・仮植前)は本圃に植える前の育苗の段階。「植付」を含むので定植より先に判定する
  if (/仮植/.test(t)) { anchor = 'RAISE'; rel = 'during'; }
  else if (/移植|定植|植付|植え付け|田植|植栽|挿苗|植替/.test(t)) anchor = 'PLANT';   // 挿苗(かんしょ等)・植替(わさび等)は定植と同じ
  else if (/浸種|催芽/.test(t)) { anchor = 'SOW'; rel = 'before'; }
  else if (/は種|播種|直播|種まき/.test(t)) anchor = 'SOW';
  else if (/覆土/.test(t)) { anchor = 'SOW'; rel = 'at'; }   // 覆土前・覆土時 = は種した直後(箱育苗の種籾の上など)。は種時として扱う
  else if (/育苗(?!箱|トレイ|ポット|培土)/.test(t)) anchor = 'RAISE';   // 「育苗トレイ」は時期ではなく対象
  else if (/(収穫|摘採|剪定|刈取)(直|終了|約\d+[カケヶ]?月)?後/.test(t)) anchor = 'AFTER';
  else if (/作付|耕起|前作|地ごしらえ|整地|残渣|土壌消毒/.test(t)) anchor = 'PRE';
  else if (/休眠|根雪|夏期|冬期|秋期|春期|積雪|落葉|萌芽直?前|夏|冬/.test(t)) lit = (t.match(/休眠期?|根雪前?|夏期?|冬期?|秋期?|春期?|積雪期?|落葉期?|萌芽直?前|夏|冬/) || [t])[0].replace('萌芽直前', '萌芽前');   // 萌芽直前 = 萌芽前
  else if (/発芽前|出芽前|緑化|鉢上|苗床|株冷蔵|低温暗黒/.test(t)) { anchor = 'RAISE'; rel = 'during'; }   // 鉢上・株冷蔵・苗の低温暗黒処理は育苗中の作業
  else if (/植代|しろかき|代かき/.test(t)) { anchor = 'PLANT'; rel = 'before'; }   // 植代 = 移植の少し前
  else if (/融雪後/.test(t)) lit = '融雪後';
  else if (/\d+月/.test(t)) lit = t.match(/\d+月/)[0];
  else if (/土寄|(?<!育苗)培土(?!混和)/.test(t)) anchor = 'HILL';   // 培土 = 土寄せ(「育苗培土」は育苗用の土なので除く)   // 土寄せ(培土)は生育期の途中の作業。「土寄せ後」は萌芽前・生育初期を含まない
  else if (/本田|本圃|生育|発生|発病|雑草(?!茎葉)|萌芽|葉期|出穂|穂|幼虫|成虫|着色|結実|展葉|伸長|培土|出蕾|成熟|新梢|開花|満開|発芽|抽苔|果実|肥大|落花|株元|収穫期|収穫始|収穫直前|収穫予定|収穫開始予定|出芽|本葉|展開|初発|袋掛|果|苗立|病斑|若齢|初期|終期|盛期|始期|期/.test(t)) anchor = 'GROW';   // 本葉N枚・展開時・出芽時・袋掛け・病害の初発前などは作物の生育中
  if (rel == null) {
    if (/直後/.test(t)) rel = 'just_after';
    else if (/後/.test(t)) rel = 'after';
    else if (/前/.test(t)) rel = 'before';
    else if (/当日|同時|時/.test(t)) rel = 'at';
  }
  return { term: t, anchor, rel, lit };
}

/**
 * 行(使用時期)側: scanTerm の結果が指す位置の集合(P の値の配列)を返す。行は「実際にいつ使ったか」なので点に近い。
 * 例: 「移植前」→[PLB]、「移植後」→[PLA, GROW]、「は種後」→[RAISE]、「定植時」→[PL]
 */
function rowPositions(sc) {
  const a = sc.anchor;   // 基準の作業
  if (a === 'PLANT') return sc.rel === 'before' ? [P.PLB] : sc.rel === 'after' ? [P.PLA, P.GROW] : sc.rel === 'just_after' ? [P.PLA] : [P.PL];
  if (a === 'SOW') return sc.rel === 'before' ? [P.SOWB] : sc.rel === 'just_after' || sc.rel === 'after' ? [P.RAISE] : [P.SOW];
  if (a === 'RAISE') return [P.RAISE];
  if (a === 'PRE') return [P.PRE];
  if (a === 'AFTER') return [P.AFTER];
  if (a === 'GROW') return [P.GROW];
  if (a === 'HILL') return sc.rel === 'before' ? [P.GROW] : [P.HILL];
  return [];
}

/**
 * 規定文(atom)側: 「までの処理」「〜後」「〜前」の意味を区間に展開した位置の配列を返す。規定は「その時期の使用すべて」を指すので区間になる。
 * upto: 「定植時までの処理」のように「まで」で終わる条件(=その時点までの全期間)のとき true
 * 例: 「定植時までの処理」→ PRE～PL、「定植後」→ PLA～AFTERの手前、「本田」→ PLA～AFTERの手前
 */
function atomPositions(sc, upto) {
  const a = sc.anchor;   // 基準の作業
  // 以降の at/bef/aft は、基準が定植か は種かで決まる「その時・その前・その直後」の位置
  if (!a) return [];
  if (a === 'GROW') return /本田|本圃/.test(sc.term) ? range(P.PLA, P_MAX - 1) : [P.PLA, P.GROW, P.HILL, P.HARV];
  if (a === 'HILL') return upto ? [P.PLA, P.GROW, P.HILL] : sc.rel === 'before' ? [P.PLA, P.GROW] : [P.HILL, P.HARV];
  if (a === 'AFTER') return [P.AFTER];
  if (a === 'PRE') return sc.rel === 'before' || upto ? range(P.PRE, P.PRE) : [P.PRE];
  if (a === 'RAISE') return [P.RAISE];
  const at = a === 'PLANT' ? P.PL : P.SOW;
  const bef = a === 'PLANT' ? P.PLB : P.SOWB;
  const aft = a === 'PLANT' ? P.PLA : P.RAISE;
  if (upto) return range(P.PRE, at);
  if (sc.rel === 'before') return range(P.PRE, bef);
  if (sc.rel === 'just_after') return [aft];
  if (sc.rel === 'after') return range(aft, P_MAX - 1);
  return [at];
}

/** 「は種又は定植21日前まで」のように、後ろの語だけが持つ相対位置(前・後など)を、相対位置を持たない前の語に引き継ぐ。scans を直接書き換える */
function inheritRel(scans) {
  for (let i = scans.length - 2; i >= 0; i--) {
    if (scans[i].anchor && scans[i].rel == null && scans[i + 1].rel != null) scans[i].rel = scans[i + 1].rel;
  }
}

const LIST_SEP = /又は|または|もしくは|及び|並びに|かつ|、|,/;   // 語の列挙の区切り(時期・方法・条件の列挙で共通)
// 「収穫前日まで」「14日前まで」のように、時期語を含まず収穫前日数(PHI)だけを表す文字列
const PHI_ONLY = /^(?:収穫|摘採|出荷|摘心)?(?:\d+日)?前(?:日)?まで$/;

/**
 * 使用時期文字列 → { positions, literals, phi, empty, implied, unresolved }
 *   phi: 収穫前日数(「収穫前日まで」=1)。時期語ではない
 *   implied: 時期語が無く収穫前日数だけ → 圃場に作物がある期間とみなす
 */
function parseJikiRaw(text) {
  // res: 戻り値。timeKey=比較キー、phi=収穫前日数、positions=時間軸上の位置(P)の集合、literals=季節・月の語の集合、
  //      empty=時期の記載なし、implied=収穫前日数だけなので「作物が圃場にある期間」とみなした、unresolved=解釈できなかった語
  const res = { raw: String(text == null ? '' : text), timeKey: timeKeyOf(text), phi: null, positions: new Set(), literals: new Set(), empty: false, implied: false, unresolved: [] };
  let s = norm(text);   // 正規化した時期文字列
  if (s === '' || s === '-') { res.empty = true; return res; }
  // 「植付時(仮植床)」のように括弧で仮植床と書かれた行は、仮植床への植付(育苗の段階)。括弧は後で除くので先に本文へ移す
  if (/\(仮植床?\)/.test(s)) s = '仮植床' + s.replace(/\(仮植床?\)/, '');
  res.events = eventsOf(s);   // 開花・出穂などの出来事を基準にした時期(括弧書きも含めて読む)

  const m = s.match(/(?:収穫開始|収穫|摘採|出荷|摘心)(?:(\d+)日)?前(日)?まで/);
  if (m) res.phi = m[1] ? Number(m[1]) : 1;

  // main: 括弧書き・「1回目:」のような見出し・但し書き(収穫前日数など)を除いた、時期語だけの文字列
  let main = s.replace(/\([^)]*\)/g, '').replace(/^[^:、~]{1,12}:/, '').replace(/(但し|ただし|但).*$/, '');
  // 範囲の終点に付く「収穫N日前まで」は時期語ではないので取り除く(phiとして保持済み)
  main = main.replace(/(?:~|から)?(?:[^、~]*?の)?(?:収穫開始|収穫|摘採|出荷|摘心)(?:\d+日)?前(?:日)?まで/g, '');
  if (main === '' || PHI_ONLY.test(main)) {
    if (res.phi != null) {
      res.implied = true;
      [P.PLA, P.GROW, P.HILL, P.HARV].forEach((p) => res.positions.add(p));
    } else res.empty = true;
    return res;
  }

  parsePeriod(main, res);
  return res;
}

/**
 * 時期の文字列(「A～B」「AからB」「A又はB」)を positions/literals/unresolved に解釈して res に足す。
 * 使用行の時期と、規定文の内訳条件(「収穫終了後～落葉期までは3回以内」など)で同じ関数を使い、
 * 同じ文字列なら必ず同じ結果になるようにする。
 */
function parsePeriod(main, res) {
  // parts: 「~」「から」で分けた範囲の各端(1つなら範囲ではない)。partScans: 各端を「又は・及び」でさらに分けた語の scanTerm 結果
  const parts = main.split(/(?<!\d)~|~(?!\d)|から/).filter(Boolean);
  const partScans = parts.map((part) => {
    const scans = part.split(LIST_SEP).filter(Boolean).map(scanTerm);
    inheritRel(scans);
    // 「本葉2～3枚時とその2週間後」「休眠に入る直前及びその約1カ月後」の「その…後」は、直前の語を基準にした後の時期
    scans.forEach((sc, k) => {
      if (k > 0 && /^その/.test(sc.term) && !sc.anchor && !sc.lit) {
        const prev = scans[k - 1];
        sc.anchor = prev.anchor; sc.lit = prev.lit; sc.rel = prev.anchor ? 'after' : sc.rel;
      }
    });
    return scans;
  });
  // 「移植3日前～当日」の「当日」のように基準語を持たない終点は、もう一方の基準語を借りる
  const anchors = partScans.flat().filter((sc) => sc.anchor);
  if (anchors.length) {
    partScans.flat().forEach((sc) => {
      if (!sc.anchor && !sc.lit && (sc.rel === 'at' || sc.rel === 'after' || sc.rel === 'before')) sc.anchor = anchors[0].anchor;
    });
  }
  // 「移植直後～15日」「移植後3日～10日」の「15日」「10日」のように、日数だけの終点は、直前の端の基準を引き継ぐ
  // (直前が「前」なら前、それ以外は後。「移植前3日～1日」なら移植前、「移植後3日～10日」なら移植後)
  partScans.forEach((scans, pi) => {
    if (pi === 0 || scans.length !== 1 || !/^\d+日(間)?$/.test(scans[0].term)) return;
    const prev = partScans[pi - 1].filter((sc) => sc.anchor).pop();
    if (prev) { scans[0].anchor = prev.anchor; scans[0].rel = prev.rel === 'before' ? 'before' : 'after'; }
  });
  // 行のすべての語が「は種・定植・植付の前」(または作付前)を指すか。「は種又は定植9日前まで」は「は種又は定植後」の枠には当たらない
  const anchored = partScans.flat().filter((sc) => sc.anchor);
  res.allBeforeAnchor = anchored.length > 0 && anchored.every((sc) => sc.anchor === 'PRE' || ((sc.anchor === 'SOW' || sc.anchor === 'PLANT') && sc.rel === 'before'));
  const partPos = [];   // 各端が指す位置の集合(範囲の端どうしの前後関係を見るため、端ごとに保持する)
  partScans.forEach((scans) => {
    const pos = new Set();
    scans.forEach((sc) => {
      const ps = rowPositions(sc);
      if (ps.length) ps.forEach((p) => pos.add(p));
      else if (sc.lit) res.literals.add(sc.lit);
      else res.unresolved.push(sc.term);
    });
    partPos.push(pos);
  });
  // 「植付後萌芽前」「植付後～萌芽前」のように移植・植付の後で萌芽(発芽・出芽)前までの期間は、植付直後の位置(PLA)だけ。
  // 生育期(GROW)以降は含まない。「休眠期～萌芽前」など植付を伴わない萌芽前は、従来どおり季節の語として扱う
  if (/(萌芽|発芽|出芽)直?前/.test(main) && partPos.some((ps) => ps.has(P.PLA))) {
    partPos.forEach((ps) => { ps.delete(P.GROW); ps.delete(P.HILL); ps.delete(P.HARV); });
    res.literals.add('萌芽前');   // 「萌芽前」の枠(季節の語)と照合するために残す
    res.preEmerge = true;         // 植付後・萌芽前の行(matchTime で、生育期・萌芽後の枠には当てず、萌芽前の枠には確定させる)
  }
  const all = new Set();   // 全端の位置の和集合(範囲でないときはこれがそのまま結果、範囲のときは最小～最大の間を埋める)
  partPos.forEach((ps) => ps.forEach((p) => all.add(p)));
  if (parts.length >= 2 && partPos.every((ps) => ps.size > 0)) {
    const first = partPos[0];
    const last = partPos[partPos.length - 1];
    if (Math.max(...first) > Math.min(...last)) {
      // 終点が始点より前の位置 = 年をまたぐ期間(収穫終了後から萌芽まで 等)。生育期などは含めず、始点側だけを使う
      first.forEach((p) => res.positions.add(p));
    } else {
      range(Math.min(...all), Math.max(...all)).forEach((p) => res.positions.add(p));   // 範囲は間を埋める
    }
  } else all.forEach((p) => res.positions.add(p));
  return res;
}

// ============================================================ 方法・対象の語彙
// 方法は「種類/細分」の階層で持つ。規定の「散布」(親)は、行の「株元散布」(SPRAY/BASE)を含むが、逆は「かもしれない」(maybe)になる。
//   SPRAY 散布(/AERIAL 無人航空機・空中, /FLOOD 湛水, /BASE 株元, /FOLIAGE 茎葉・葉面)   DRENCH 灌注(/BASE 株元, /SOIL 土壌)
//   MIX 混和(/SOIL 土壌混和)   SIDE 側条施用   COAT 塗布   SEEDTREAT 種子処理(粉衣・浸漬)   TRUNK 樹幹   FUME くん煙・くん蒸
//   JET 噴射   THROW 投げ入れ・滴下   INJECT 注入   STOCK 株処理   ROWTREAT 畦間処理
const METHODS = [
  ['SPRAY/AERIAL', /無人航空機|無人ヘリ|空中散布|航空散布|ドローン/],
  ['SPRAY/FLOOD', /湛水散布|湛水周縁散布|落水散布|原液湛水/],
  ['SPRAY/BASE', /株元散布/],
  // 土壌へ散布する方法。規定の「散布」(厳密に「散布」と書かれた方法)とは区別する
  ['SPRAY/SOIL', /土壌表面散布|全面土壌散布|土壌散布|土壌表面に散布/],
  ['SPRAY/ROW', /播溝散布|作条散布|播溝に散布|作条に散布/],
  ['SPRAY/UNIFORM', /全面均一散布/],
  ['SPRAY/FOLIAGE', /茎葉散布|葉面散布|茎葉兼/],   // 「雑草茎葉兼土壌散布」も茎葉への散布を含む
  ['DRENCH/BASE', /株元灌注|株元かん注/],
  ['DRENCH/SOIL', /土壌灌注|土壌かん注/],
  ['MIX/SOIL', /土壌混和|全面混和|作条混和/],
  ['SIDE', /側条施用|側条/],
  ['COAT', /塗布|塗沫|塗抹/],
  ['SEEDTREAT', /粉衣|浸漬|種子処理/],
  ['TRUNK', /樹幹/],
  ['FUME', /くん煙|くん蒸|煙霧/],
  ['JET', /噴射/],
  ['THROW', /投げ入れ|投入|滴下/],
  ['INJECT', /注入/],
  ['STOCK', /株処理|株元処理/],
  ['ROWTREAT', /畦間処理|畦間/],
  ['HOLE', /植穴/],                                   // 植穴処理(定植時の植穴への施用)
  ['SOILAPPLY', /土中施用|(?:は種|播種)同時施(?:薬|用)/],   // は種同時施薬機を用いた土中施用
  ['PLACE', /設置|配置|吊り?下げ|つり下げ/],          // テープ剤・容器入り剤の設置(散布ではない)
  ['BAIT', /毒餌/],                                   // 米ぬか等との混合毒餌
];
// 細分が特定できないときの汎用の方法(「散布」とだけ書かれた行など)。細分が見つかった場合は重ねて付けない
const GENERIC = [['SPRAY', /散布/], ['DRENCH', /灌注|かん注|灌水/], ['MIX', /混和/]];
// 「樹幹散布」「種子粉衣」のように対象が方法を決める語は、汎用の散布/灌注を重ねない
const EXCLUSIVE = ['TRUNK', 'SEEDTREAT', 'COAT', 'FUME', 'JET', 'THROW', 'INJECT', 'STOCK', 'ROWTREAT', 'SIDE', 'HOLE', 'SOILAPPLY', 'PLACE', 'BAIT'];

/** 文字列 t に含まれる方法の集合(METHODS のキー / 汎用キー)を返す。行の使用方法にも規定文の条件にも使う */
function scanMethods(t) {
  const set = new Set();   // 見つかった方法
  METHODS.forEach(([k, re]) => { if (re.test(t)) set.add(k); });
  // 「培土に均一に混和する」「床土に混和」など、土(培土・床土・覆土・土壌)へ混ぜる記述は土壌混和とみなす。
  // 散布や灌注などを併記している場合(「散布して土壌と混和」)は別の方法が主なので、ここでは決めない
  if (/混和/.test(t) && /土/.test(t) && !/散布|灌注|かん注|灌水|くん蒸|噴射/.test(t) && ![...set].some((x) => x.startsWith('MIX'))) set.add('MIX/SOIL');
  const exclusive = EXCLUSIVE.some((k) => set.has(k));
  // 「全面散布土壌混和」「散布後土壌混和」のように、散布してから土壌に混和する方法は、土壌混和として扱う
  // (散布は混和の前処理で、方法としては土壌混和。散布の枠には数えない)
  const sprayThenMix = set.has('MIX/SOIL') && /散布(?:後|して|し)?[、,]?(?:土壌)?(?:に)?混和/.test(t);
  GENERIC.forEach(([k, re]) => {
    if (k === 'SPRAY' && sprayThenMix) return;
    if (!exclusive && re.test(t) && ![...set].some((x) => x === k || x.startsWith(k + '/'))) set.add(k);
  });
  return set;
}

// 処理の対象。NURSERY=育苗箱・トレイ・ポット  BED=床土・覆土  SEED=種子・種いも・球根  FIELD=圃場・本圃
//   これに加えて、剤型は 'FORM:粒剤' のように scanTargets が動的に追加する(剤型別の規定用)
const TARGETS = [
  ['NURSERY', /育苗箱|育苗トレイ|セルトレイ|セル成型|ペーパーポット|育苗ポット|苗床|仮植床/],
  ['BED', /床土|覆土/],
  ['SEED', /種子|種もみ|種籾|種いも|種イモ|種芋|種球|球根|浸種|鱗片/],   // 鱗片 = にんにくの種球
  ['DISEASED', /罹病株/],                                               // ウイルス罹病株の枯殺など
  ['FIELD', /圃場|ほ場|本圃/],
];
// 剤型として認識する語。規定文中の剤型の検出と、辞書の zaikei が剤型を表す語かの判定(その他・農薬肥料などを除く)に使う
const FORMS = /粒剤|粉剤|乳剤|水和剤|水溶剤|エアゾル剤|くん煙剤|フロアブル|顆粒|液剤|ゾル|油剤|マイクロカプセル|ジャンボ|パック/;

/** 文字列 t に含まれる対象('NURSERY' など)と剤型('FORM:粒剤' など)の集合を返す */
function scanTargets(t) {
  const set = new Set();   // 見つかった対象・剤型
  TARGETS.forEach(([k, re]) => { if (re.test(t)) set.add(k); });
  const f = t.match(FORMS);
  if (f) set.add('FORM:' + f[0]);
  return set;
}
/** 規定の条件にだけ現れる対象: 希釈倍数('DIL:下限-上限')と使用目的('PURPOSE:…')。行の側は希釈倍数・病害虫名(使用目的)の欄で照合する */
function scanRuleTargets(t) {
  const set = new Set();
  // 含有率で区別する剤型(「2%粒剤」「1%粒剤」): 行の製剤の含有率(農薬名から辞書で引く)で照合する
  const pc = norm(t).match(/(\d+(?:\.\d+)?)%(?=粉粒剤|粒剤|粉剤|乳剤|水和剤|水溶剤|液剤|フロアブル)/);
  if (pc) set.add('PCT:' + pc[1]);
  const d = norm(t).match(/(\d+)(?:~(\d+))?倍(?:希釈)?/);
  if (d) set.add('DIL:' + d[1] + '-' + (d[2] || d[1]));
  if (/枯凋/.test(t)) set.add('PURPOSE:枯凋');
  if (/除草剤として/.test(t)) set.add('PURPOSE:除草');
  return set;
}

// ============================================================ 規定文のパース
function normalizeParen(s) { return norm(s); }   // (旧名。現在は norm と同じ)

/** 条件の文字列から方法を表す語句を取り出す(「は種時の播溝土壌混和」→「播溝土壌混和」)。方法の語が無ければ '' */
function methodPhrase(it) {
  const s = norm(it).replace(/\([^)]*\)/g, '');
  const m = s.match(/([^の、]*?(?:散布|混和|灌注|かん注|塗布|浸漬|粉衣|注入|処理|施用|噴射|くん煙|設置|配置))$/);
  if (!m) return '';
  const ph = m[1].replace(/^.*?(?:時|前|後|期|まで|当日)の?/, '');
  return scanMethods(ph).size ? ph : '';
}

/**
 * 節の条件部(「は種時の土壌混和、定植時の株元散布」など)を、列挙ごとの atom の配列にする。
 * atom = { raw, timeKey, timeOnly, positions, literals, methods, targets, parsed, specificity, fieldStart }
 *   positions/literals : 時期の条件(位置の集合 / 季節・月の語の集合)。どちらも空なら時期の指定なし
 *   methods / targets  : 方法の条件 / 対象・剤型の条件。空なら指定なし
 *   timeKey            : 時期表現の比較キー(行の時期と同じ表現かの判定用)。timeOnly: 時期だけの条件(方法・対象の指定なし)
 *   specificity        : 指定された軸の数(時期1+方法1+対象の数)。複数の枠に当てはまるときは大きいほうを優先する
 *   parsed             : 何か1つでも解釈できたか(false なら「条件を解釈できません」の警告)
 *   fieldStart         : 「本田・本圃」を含む条件か(田植同時の行を優先的にここへ割り当てるため)
 */
function parseAtomList(cond) {
  const items = cond.split(LIST_SEP).filter(Boolean);   // 列挙を分けた各条件の文字列
  // 列挙の前の語が剤型だけ・作業の語だけのときは、最後の語の後半を前の語にも掛ける(分配)。
  //   「粉剤及び粉粒剤のは種時の処理」→「粉剤のは種時の処理」「粉粒剤のは種時の処理」
  //   「は種又は定植前の土壌混和」→「は種前の土壌混和」「定植前の土壌混和」、「は種又は定植後」→「は種後」「定植後」
  const last = items[items.length - 1] || '';
  const FORM_WORD = /^(?:[\d.]+%)?(?:粉粒剤|粒剤|粉剤|乳剤|水和剤|水溶剤|フロアブル|液剤|マイクロカプセル剤)/;
  const ACT_WORD = /^(?:は種|播種|定植|移植|植付け?|直播)/;
  for (let k = 0; k < items.length - 1; k++) {
    const it = items[k];
    const fm = it.match(FORM_WORD), lm = last.match(FORM_WORD);
    if (fm && fm[0] === it && lm) { items[k] = it + last.slice(lm[0].length); continue; }
    const am = it.match(ACT_WORD), la = last.match(ACT_WORD);
    if (am && am[0] === it && la && last.length > la[0].length) items[k] = it + last.slice(la[0].length);
  }
  const scans = items.map((it) => scanTerm(it.replace(/までの処理$|まで$|の処理$|処理$/, '')));
  inheritRel(scans);
  return items.map((it, i) => {
    // 「定植時までの処理」「定植当日までの株元散布」「定植時までの灌注処理」のように「…まで」が付く条件は、その時点までの全期間
    const upto = /(時|期|前|当日|日)までの?/.test(it) && !/から/.test(it);
    const sc = scans[i];
    let positions = new Set(atomPositions(sc, upto));
    let literals = new Set(sc.lit ? [sc.lit] : []);
    const cleaned = it.replace(/\([^)]*\)/g, '').replace(/までの処理$|まで$|の処理$|処理$/, '');
    if (/(?<!\d)~|~(?!\d)|から/.test(cleaned)) {          // 「収穫終了後～落葉期」など: 使用行の時期と同じ解釈にする
      const pp = parsePeriod(cleaned, { positions: new Set(), literals: new Set(), unresolved: [] });
      if (pp.positions.size || pp.literals.size) { positions = pp.positions; literals = pp.literals; }
    }
    // 萌芽前は、植付前・植付時(ばれいしょ等)も含む(植え付けた後に萌芽する)
    if (literals.has('萌芽前')) [P.PRE, P.SOWB, P.SOW, P.PLB, P.PL].forEach((x) => positions.add(x));
    const events = eventsOf(it);   // 開花前・出穂期以降・入水前など、出来事を基準にした条件
    const methods = scanMethods(it);
    const targets = scanTargets(it);
    scanRuleTargets(it).forEach((x) => targets.add(x));   // 希釈倍数・使用目的の条件
    // 「育苗期」等の時期語に含まれる「育苗」を対象(育苗箱)としては数えない
    const parsed = positions.size > 0 || literals.size > 0 || methods.size > 0 || targets.size > 0 || events.size > 0;
    const hasTime = positions.size > 0 || literals.size > 0 || events.size > 0;
    const dims = (hasTime ? 1 : 0) + (methods.size ? 1 : 0) + (targets.size ? targets.size : 0);
    return {
      raw: it, growthOnly: sc.anchor === 'GROW' && !/本田|本圃/.test(sc.term), timeKey: hasTime ? timeKeyOf(it) : '',
      timeOnly: methods.size === 0 && targets.size === 0, hasTime, positions, literals, methods, targets, parsed, specificity: dims,
      fieldStart: /本田|本圃/.test(it),
      events,
      // 出来事だけで時期を決める条件(「開花前」「出穂期以降」「入水前」)。行がその出来事に触れていなければ確定できない
      eventOnly: events.size > 0 && !/から|~/.test(cleaned),
      // は種後・定植後のように、は種・定植より後の全期間を指す条件(季節の語だけの行も含みうる)
      afterAnchor: (sc.anchor === 'SOW' || sc.anchor === 'PLANT') && (sc.rel === 'after' || sc.rel === 'just_after'),
      phrase: methodPhrase(it),   // 方法を表す語句(時期の語を除いたもの。行の使用方法と文字どおり一致するかの判定用)
    };
  });
}

/**
 * 括弧の対応を見て、括弧の外(depth 0)の区切り文字だけで分割する。
 *   isSep(ch): その文字が区切り候補か / cut(buf): それまでに溜めた文字列 buf で区切ってよいか(「回以内」で終わっているときだけ区切る等)
 */
function splitTop(str, isSep, cut) {
  const out = [];   // 分割結果
  let depth = 0;    // 現在の括弧の深さ
  let buf = '';     // 区切りを待って溜めている文字列
  for (const ch of str) {
    if (ch === '(') depth++;
    if (ch === ')') depth--;
    if (depth === 0 && isSep(ch) && cut(buf)) { out.push(buf); buf = ''; continue; }
    buf += ch;
  }
  if (buf) out.push(buf);
  return out;
}
/** 文字列 b が回数の上限で終わっているか(「…は1回以内」「…は1回以内(内訳)」)。節の区切りの「、」と条件の列挙の「、」を見分けるのに使う */
const endsWithLimit = (b) => /\d回(以内)?$/.test(b) || (/\)$/.test(b) && /回/.test(b));

/**
 * 作物別の規定「A、Bは4回以内(…)、上記以外のCは1回」を作物の節ごとに分ける。
 * 戻り値: [{ crops(作物名の記述), names(作物名の配列), total(総量), inner(括弧内の内訳。無ければ null) }]
 */
function parseCropSegments(s) {
  const segs = [];   // 作物ごとの節
  let pos = 0;       // 次に読む位置
  while (pos < s.length) {
    let depth = 0;
    let idx = -1;
    let m = null;
    for (let k = pos; k < s.length; k++) {
      const ch = s[k];
      if (ch === '(') depth++;
      else if (ch === ')') depth--;
      else if (depth === 0 && ch === 'は') {
        const mm = /^は(\d+)回(以内)?/.exec(s.slice(k));
        if (mm) { idx = k; m = mm; break; }
      }
    }
    if (idx < 0) break;
    const crops = s.slice(pos, idx);
    let end = idx + m[0].length;
    let inner = null;
    if (s[end] === '(') {
      let d = 0;
      let k = end;
      for (; k < s.length; k++) {
        if (s[k] === '(') d++;
        else if (s[k] === ')') { d--; if (d === 0) break; }
      }
      inner = s.slice(end + 1, k);
      end = k + 1;
    }
