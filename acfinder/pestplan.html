<script>

// テーブルインスタンスを保存する大域変数
let isRecordMode = false; // 記録モードフラグ
let currentSakumotsu = null; // 現在選択されている作物条件

// 防除計画タブの作物条件: 作物ツリーの条件(crop.js の makeCropCondition)に、どの作物でも使える作物名の登録を足す。
//   ・「〜が加害する農作物(等)」: 燐酸第二鉄剤(ナメクジ類)、殺そ剤(野ソ)、コンフューザ(コナガ・ヨトウ類)など。
//     作物ツリーでは選べず、防除計画に薬剤が入ると作物ツリーがロックされて後から足せないため。
//     その害虫がその作物を加害していることが使用の前提なので、候補・計画の作物名はそのまま表示する
//   ・「薬液のつきにくい農作物等」: 展着剤は常に選べるようにする
//   ・「開墾後に栽培する農作物等」は入れない(開墾地での使用が前提の登録のため)
// 作物が選ばれていないときは null(makeCropCondition と同じ)。他のタブの作物条件は変えない
const PLAN_COMMON_CROPS = '(が加害する農作物等?|^薬液のつきにくい農作物等)$';
function makePlanCropCondition(crops) {
	const base = makeCropCondition(crops);
	return base ? `${base} or sakumotsu regexp '${PLAN_COMMON_CROPS}'` : base;
}
let currentCbyochu = null;   // 現在選択されているcid
// let currentYoto = null;   // 現在選択されている用途　未使用
let currentByochu = null;   // 現在選択されている病害虫
let currentYakuzai = null;   // 現在選択されている薬剤

// 読み込んだ、または一度保存したファイルハンドル及びファイル名を保持する変数
let currentFileHandle = null;
let currentFilename = '';

// 無保存データフラグ
let isDirty = false;

// refreshPlan で旧データ行(olddata)が発生したことがあるかどうかのフラグ
// （旧データ行がすべて削除されたタイミングで「作成時DB登録日」表示を消すために使う）
let hasHadOldDataRows = false;

// clearContent プロトタイプ宣言
if (!HTMLElement.prototype.clearContent) {
	HTMLElement.prototype.clearContent = function() {
		this.textContent = '';
		//this.className = 'hidden';
	};
}

async function dbExec(sql) {
	await waiting(true, 'データベース検索中');
	try {
		return db.exec(sql);
	} catch (error) {
		throw error;
	} finally {
		await waiting(false);
	}
}

async function searchCrop() {
	const title = document.querySelector('#title');
	
	// Reset all filters and lists
	currentCbyochu = null;
	currentYakuzai = null; // 作物選択が変わったら薬剤フィルターをリセット
	currentByochu = null;  // 作物選択が変わったら病害虫フィルターをリセット
	// 各コンテナをクリア
	document.getElementById('byochuSelect')?.clearContent();

// 薬剤リスト作成 
async function setYakuzaiList(sqlOption = '') {
	// currentSakumotsu が null の場合、薬剤リストを空にする
	if (!currentSakumotsu) {
		const yakuzaiDiv = document.getElementById('yakuzaiContainer');
		if (yakuzaiDiv) {
			yakuzaiDiv.innerHTML = `
				<div class="inputbar"><input type="text" id="inputYakuzai" placeholder="絞込薬剤名/用途" disabled><button id="btnFilterYakuzai" disabled>絞込</button></div>
				<select id="yakuzaiSelect" size="10"></select>
			`;
		}
		await waiting(false);
		return;
	}
	const sqlYakuzai = `
		select distinct tsusho, seizaiyoto, ruby from tv_tsushoTekiyo left join tsushoruby using(tsusho) where sakumotsu in (${currentSakumotsu})${sqlOption} order by ruby;
	`;
	const sqlResult = await dbExec(sqlYakuzai);
	const yakuzaiDiv = document.getElementById('yakuzaiContainer');
	if (!yakuzaiDiv) return;

	let lastSelectedYakuzai = null;
	const rows = sqlResult[0]?.values || [];

	yakuzaiDiv.innerHTML = `
		<div class="inputbar">
			<input type="text" id="inputYakuzai" placeholder="絞込薬剤名/用途">
			<button id="btnFilterYakuzai">絞込</button>
		</div>
		<select id="yakuzaiSelect" size="10">
			${rows.map(row => `<option value="${row[0]}" data-search="${row[0] || ''} ${row[1] || ''} ${row[2] || ''}">${row[0]}</option>`).join('')}
		</select>
	`;

	const inputYakuzai = yakuzaiDiv.querySelector('#inputYakuzai');
	const filterButton = yakuzaiDiv.querySelector('#btnFilterYakuzai');
	const selectBox = yakuzaiDiv.querySelector('#yakuzaiSelect');

	const filterYakuzaiList = () => {
		let filterText = inputYakuzai.value.trim();
		if (filterButton.textContent === '解除' || filterText === '') {
			inputYakuzai.value = '';
			Array.from(selectBox.options).forEach(option => { option.classList.remove('hidden'); });
		} else {
			filterText = romajiConv(filterText.toLowerCase()).toHiragana();
			Array.from(selectBox.options).forEach(option => {
				const optionText = romajiConv(option.dataset.search.toLowerCase()).toHiragana();
				option.classList.toggle('hidden', !optionText.includes(filterText));
			});
		}
		filterButton.textContent = inputYakuzai.value === '' ? '絞込' : '解除';
		if (filterButton.textContent === '解除') inputYakuzai.blur();
	};

	filterButton.onclick = filterYakuzaiList;
	filterButton.addEventListener('mousedown', (e) => { if (document.activeElement === inputYakuzai) e.preventDefault(); });
	inputYakuzai.onchange = filterYakuzaiList;
	inputYakuzai.addEventListener('input', () => {
		if (inputYakuzai.value === '') {
			if (typeof isMobile === 'undefined' || !isMobile) {
				filterYakuzaiList();
				lastSelectedYakuzai = null;
			} else { filterButton.textContent = '絞込'; }
		} else if (filterButton.textContent === '解除') { filterButton.textContent = '絞込'; }
	});

	selectBox.addEventListener('click', (event) => {
		const selectedOption = event.target;
		const currentValue = selectedOption.value;
		if (currentValue && currentValue !== lastSelectedYakuzai) {
			lastSelectedYakuzai = currentValue;
			showYakuzaiTekiyo(currentValue);
		}
	});
}

// RACリストを作成する関数
async function setRacList(byochu = false) {
	// currentSakumotsu が null の場合、RACリストを空にする
	if (!currentSakumotsu) {
		const racContainer = document.getElementById('racContainer');
		if (racContainer) {
			racContainer.innerHTML = `
				<div class="inputbar"><input type="text" id="inputRac" placeholder="絞込RACコード/系統名" disabled><button id="btnFilterRac" disabled>絞込</button></div>
				<select id="racSelect" size="10"></select>
			`;
		}
		await waiting(false);
		return;
	}

	const byochuCondition = byochu ? ` and (byochu in (${currentByochu}) or mokuteki in (${currentByochu}))` : '';
	const sql = `with racs as (
		select distinct mid1 as mid, iif(instr(rem1, 'FRAC'), replace(rem1, 'FRAC系統名: ', ''), null) as rem, keito1 as keito from tv_tsushoTekiyo where mid1 is not null and sakumotsu in (${currentSakumotsu})${byochuCondition} union
		select distinct mid2 as mid, iif(instr(rem2, 'FRAC'), replace(rem2, 'FRAC系統名: ', ''), null) as rem, keito2 as keito from tv_tsushoTekiyo where mid2 is not null and sakumotsu in (${currentSakumotsu})${byochuCondition} union
		select distinct mid3 as mid, iif(instr(rem3, 'FRAC'), replace(rem3, 'FRAC系統名: ', ''), null) as rem, keito3 as keito from tv_tsushoTekiyo where mid3 is not null and sakumotsu in (${currentSakumotsu})${byochuCondition} union
		select distinct mid4 as mid, iif(instr(rem4, 'FRAC'), replace(rem4, 'FRAC系統名: ', ''), null) as rem, keito4 as keito from tv_tsushoTekiyo where mid4 is not null and sakumotsu in (${currentSakumotsu})${byochuCondition} union
		select distinct mid5 as mid, iif(instr(rem5, 'FRAC'), replace(rem5, 'FRAC系統名: ', ''), null) as rem, keito5 as keito from tv_tsushoTekiyo where mid5 is not null and sakumotsu in (${currentSakumotsu})${byochuCondition} order by mid)
		select mid as rac, iif(rem = keito, null, replace(rem, keito, '')) as rem, gn_concat(', ', keito) as keito from racs group by mid;
		--select concat(mid, ' ['||iif(rem = keito, null, replace(rem, iif(instr(keito, ', '), explode(', ', keito, 2), keito), ''))||']') as rac, gn_concat(', ', keito) as keito from racs group by mid;
	`;
	const sqlResult = await dbExec(sql);
	const racContainer = document.getElementById('racContainer');
	if (!racContainer) return;

	const rows = sqlResult[0]?.values || [];
	let lastSelectedRac = null;

	const options = rows.map(row => {
		const rac = row[0];
		let rem = (row[1] || '').replace('()', '').replace(/^\((.*?)\)$/, '$1') || '';
		const keito = row[2];
		if (rem && rac.includes(',')) {
			keito.split(',').forEach(item => { rem = rem.replace(item.trim(), ''); });
		}
		const remText = rem ? ` [${rem}]` : '';
		return `<option value="${rac}" data-search="${rac}${remText} ${keito}">${rac}${remText} / ${keito}</option>`;
	}).join('');

	racContainer.innerHTML = `
		<div class="inputbar">
			<input type="text" id="inputRac" placeholder="絞込RACコード/系統名">
			<button id="btnFilterRac">絞込</button>
		</div>
		<select id="racSelect" size="10">${options}</select>
	`;

	const inputRac = racContainer.querySelector('#inputRac');
	const filterButton = racContainer.querySelector('#btnFilterRac');
	const selectBox = racContainer.querySelector('#racSelect');

	const deselectRac = () => {
		Array.from(selectBox.options).forEach(opt => opt.classList.remove('hidden'));
		lastSelectedRac = null;
		selectBox.value = '';
		filterButton.textContent = '絞込';
		setYakuzaiList(currentByochu ? ` and (byochu in (${currentByochu}) or mokuteki in (${currentByochu}))` : '');
	};

	const filterRacList = () => {
		let filterText = inputRac.value.trim();
		if (filterText === '' || filterButton.textContent === '解除') {
			inputRac.value ='';
			deselectRac();
			return;
		}
		
		filterText = romajiConv(filterText.toLowerCase()).toHiragana();
		Array.from(selectBox.options).forEach(option => {
			const optionText = romajiConv(option.dataset.search.toLowerCase()).toHiragana();
			option.classList.toggle('hidden', !optionText.includes(filterText));
		});
		filterButton.textContent = '解除';
		inputRac.blur();
	};

	filterButton.onclick = filterRacList;
	filterButton.addEventListener('mousedown', (e) => { if (document.activeElement === inputRac) e.preventDefault(); });
	inputRac.onchange = filterRacList;
	inputRac.addEventListener('input', () => {
		if (inputRac.value === '') {
			if (typeof isMobile === 'undefined' || !isMobile) { deselectRac(); } 
			else { filterButton.textContent = '絞込'; }
		} else if (filterButton.textContent === '解除') { filterButton.textContent = '絞込'; }
	});

	selectBox.addEventListener('click', (event) => {
		const selectedOption = event.target;
		const currentValue = selectedOption.value;
		if (currentValue) {
			if (currentValue === lastSelectedRac) {
				setYakuzaiList();
				lastSelectedRac = null;
			} else {
				selectBox.value = currentValue;
				let sql = currentByochu ? ` and (byochu in (${currentByochu}) or mokuteki in (${currentByochu}))` : '';
				sql += ` and (mid1 = '${currentValue}' or mid2 = '${currentValue}' or mid3 = '${currentValue}' or mid4 = '${currentValue}' or mid5 = '${currentValue}')`;
				setYakuzaiList(sql);
				lastSelectedRac = currentValue;
			}
		}
	});
}

// 薬剤の適用候補テーブルを表示する関数
async function showYakuzaiTekiyo(yakuzaiName) {
	const tekiyoContainer = document.getElementById('yakuzaiTekiyo');
	tekiyoContainer?.clearContent(); // 既存の内容をクリア

	if (!yakuzaiName || !currentSakumotsu) return;

	let results = [];
	try {
		// 薬剤の適用候補をすべて取得するためのSQL文をここに記述
		// concat_ws は重複連結 mid1〜mid5 に同じ rac が含まれる場合に対応
		/*
			--seibun1,
			(ifnull((select seibun from tSeibun where ippanmei = seibun1),seibun1)),
			--seibun2,
			(ifnull((select seibun from tSeibun where ippanmei = seibun2),seibun2)),
			--seibun3,
			(ifnull((select seibun from tSeibun where ippanmei = seibun3),seibun3)),
			--seibun4,
			(ifnull((select seibun from tSeibun where ippanmei = seibun4),seibun4)),
			--seibun5) 
			(ifnull((select seibun from tSeibun where ippanmei = seibun5),seibun5))
			-- 
				n_concat(' ', seibun1, '['||(select seibun from tSeibun where ippanmei = seibun1)||']') , 
				n_concat(' ', seibun2, '['||(select seibun from tSeibun where ippanmei = seibun2)||']') , 
				n_concat(' ', seibun3, '['||(select seibun from tSeibun where ippanmei = seibun3)||']') , 
				n_concat(' ', seibun4, '['||(select seibun from tSeibun where ippanmei = seibun4)||']') , 
				n_concat(' ', seibun5, '['||(select seibun from tSeibun where ippanmei = seibun5)||']')  
		*/
		const sql = `
			SELECT sakumotsu, 
			gn_concat('<br>',json_array(byochu)) as byochu,
			gn_concat('<br>',json_array(mokuteki)) as mokuteki,
			jiki, kaisu, baisu, ekiryo,hoho, 
			concat_ws('<br>', yuko1, yuko2, yuko3, yuko4, yuko5) as seibun,
			concat_ws('<br>',kaisu1,kaisu2,kaisu3,kaisu4,kaisu5) as seibunkaisu,
			concat_ws('<br>',
				concat_ws('/',mid1,keito1,replace(rem1, 'FRAC系統名: ', ''), risk1),
				concat_ws('/',mid2,keito2,replace(rem2, 'FRAC系統名: ', ''), risk2),
				concat_ws('/',mid3,keito3,replace(rem3, 'FRAC系統名: ', ''), risk3),
				concat_ws('/',mid4,keito4,replace(rem4, 'FRAC系統名: ', ''), risk4),
				concat_ws('/',mid5,keito5,replace(rem5, 'FRAC系統名: ', ''), risk5)
			) as mid,
			MAX(seizaiojas) as seizaiojas   -- 製剤の有機JAS・特栽の区分(t_tokusai: 全成分が有機JAS・特栽の対象の製剤だけ)
			FROM t_tekiyo
			WHERE tsusho = '${yakuzaiName}' AND sakumotsu IN (${currentSakumotsu})
			GROUP BY tsusho, sakumotsu, jiki, kaisu, baisu, ekiryo, hoho;
		`;
		if (debug) console.log(sql);
		results = await dbExec(sql);
	} catch (e) {
		console.error("薬剤適用候補の取得中にエラーが発生しました:", e);
		tekiyoContainer.textContent = '適用候補の取得に失敗しました。';
		return;
	}

	if (results.length === 0 || results[0].values.length === 0) {
		tekiyoContainer.textContent = '適用候補が見つかりませんでした。';
		return;
	}

	const headers = ['操作', '作物名', '通称名', '対象病害虫', '使用時期', '使用回数', '希釈倍数/使用量', '使用液量', '使用方法', '有効成分', '成分回数', 'RAC', '有機JAS・特栽'];
	const columns = results[0].columns;
	let tableHtml = `<div class="handsontable-like">
		<table id="candidateTable">
		<thead><tr>${headers.map(text => `<th>${text}</th>`).join('')}</tr></thead>
		<tbody>`;

	results[0].values.forEach(valueRow => {
		const byochuText = String(valueRow[columns.indexOf('byochu')] || '').replace(/\["null"\]|\[null\]|\["|"\]/g, '');
		const mokutekiText = String(valueRow[columns.indexOf('mokuteki')] || '').replace(/\["null"\]|\[null\]|\["|"\]/g, '');
		const byochuMokuteki = [byochuText, mokutekiText].filter(Boolean).join('<br>');

		tableHtml += `
			<tr>
				<td class="actions">
					<svg class="svg_button" onclick="addCandidateToPlan(this)">
						<title>計画に追加</title>
						<use href="icons.svg?v=3#plus"></use>
					</svg>
				</td>
				<td>${valueRow[columns.indexOf('sakumotsu')] || ''}</td>
				<td>${yakuzaiName}</td>
				<td>${byochuMokuteki}</td>
				<td>${valueRow[columns.indexOf('jiki')] || ''}</td>
				<td>${valueRow[columns.indexOf('kaisu')] || '-'}</td>
				<td>${valueRow[columns.indexOf('baisu')] || ''}</td>
				<td>${valueRow[columns.indexOf('ekiryo')] || ''}</td>
				<td>${valueRow[columns.indexOf('hoho')] || ''}</td>
				<td>${valueRow[columns.indexOf('seibun')] || ''}</td>
				<td>${valueRow[columns.indexOf('seibunkaisu')] || ''}</td>
				<td>${valueRow[columns.indexOf('mid')] || ''}</td>
				<td>${escapeHtml(String(valueRow[columns.indexOf('seizaiojas')] || ''))}</td>
			</tr>`;
	});

	tableHtml += `</tbody></table></div>`;
	tekiyoContainer.innerHTML = tableHtml;
}

// 指定した薬剤名・現在の作物条件(currentSakumotsu)で、DBの最新の適用候補一覧を取得するヘルパー関数
// showYakuzaiTekiyo と同じ検索条件・整形ロジックを、比較しやすいオブジェクト配列として返す
async function getYakuzaiCandidates(yakuzaiName) {
	if (!yakuzaiName || !currentSakumotsu) return [];

	const sql = `
		SELECT sakumotsu, 
		gn_concat('<br>',json_array(byochu)) as byochu,
		gn_concat('<br>',json_array(mokuteki)) as mokuteki,
		jiki, kaisu, baisu, ekiryo, hoho, 
		concat_ws('<br>', MAX(yuko1), MAX(yuko2), MAX(yuko3), MAX(yuko4), MAX(yuko5)) as seibun,
		concat_ws('<br>', MAX(kaisu1), MAX(kaisu2), MAX(kaisu3), MAX(kaisu4), MAX(kaisu5)) as seibunkaisu,
		concat_ws('<br>',
			concat_ws('/', MAX(mid1), MAX(keito1), replace(MAX(rem1), 'FRAC系統名: ', ''), MAX(risk1)),
			concat_ws('/', MAX(mid2), MAX(keito2), replace(MAX(rem2), 'FRAC系統名: ', ''), MAX(risk2)),
			concat_ws('/', MAX(mid3), MAX(keito3), replace(MAX(rem3), 'FRAC系統名: ', ''), MAX(risk3)),
			concat_ws('/', MAX(mid4), MAX(keito4), replace(MAX(rem4), 'FRAC系統名: ', ''), MAX(risk4)),
			concat_ws('/', MAX(mid5), MAX(keito5), replace(MAX(rem5), 'FRAC系統名: ', ''), MAX(risk5))
		) as mid
		FROM t_tekiyo
		WHERE tsusho = '${yakuzaiName}' AND sakumotsu IN (${currentSakumotsu})
		GROUP BY tsusho, sakumotsu, jiki, kaisu, baisu, ekiryo, hoho;
	`;

	let results = [];
	try {
		if (debug) console.log(sql);
		results = await dbExec(sql);
	} catch (e) {
		console.error('候補薬剤の再取得中にエラーが発生しました:', e);
		return [];
	}

	if (!results.length || !results[0].values.length) return [];

	const columns = results[0].columns;
	return results[0].values.map(valueRow => {
		const byochuText = String(valueRow[columns.indexOf('byochu')] || '').replace(/\["null"\]|\[null\]|\["|"\]/g, '');
		const mokutekiText = String(valueRow[columns.indexOf('mokuteki')] || '').replace(/\["null"\]|\[null\]|\["|"\]/g, '');
		const byochuMokuteki = [byochuText, mokutekiText].filter(Boolean).join('<br>');
		return {
			sakumotsu: String(valueRow[columns.indexOf('sakumotsu')] || ''),
			byochu: byochuMokuteki,
			jiki: String(valueRow[columns.indexOf('jiki')] || ''),
			kaisu: String(valueRow[columns.indexOf('kaisu')] || '-') || '-',
			baisu: String(valueRow[columns.indexOf('baisu')] || ''),
			ekiryo: String(valueRow[columns.indexOf('ekiryo')] || ''),
			hoho: String(valueRow[columns.indexOf('hoho')] || ''),
			seibun: String(valueRow[columns.indexOf('seibun')] || ''),
			seibunkaisu: String(valueRow[columns.indexOf('seibunkaisu')] || ''),
			mid: String(valueRow[columns.indexOf('mid')] || '')
		};
	});
}

// 集約された病害虫名(byochu)セルの文字列を、個別の病害虫名の配列に分解する
// （複数行の場合 <br> 区切りで格納されているため、それぞれを個別の項目として比較できるようにする）
function parseByochuList(byochuHtml) {
	if (!byochuHtml) return [];
	return String(byochuHtml)
		.split(/<br\s*\/?>/i)
		.map(s => s.replace(/<[^>]+>/g, '').trim())
		.filter(s => s.length > 0);
}

// 2つの病害虫名セルの内容を、個別の病害虫名の集合として比較し、近さ(Jaccard係数)を返す
function getByochuSimilarity(byochuA, byochuB) {
	const setA = new Set(parseByochuList(byochuA));
	const setB = new Set(parseByochuList(byochuB));
	if (setA.size === 0 && setB.size === 0) return 1;
	let intersection = 0;
	setA.forEach(v => { if (setB.has(v)) intersection++; });
	const union = new Set([...setA, ...setB]).size;
	return union === 0 ? 0 : intersection / union;
}

// 個別の病害虫名の集合として、2つの病害虫名セルの内容が同じかどうかを判定する（並び順は問わない）
function byochuEquals(byochuA, byochuB) {
	const listA = parseByochuList(byochuA).slice().sort();
	const listB = parseByochuList(byochuB).slice().sort();
	if (listA.length !== listB.length) return false;
	return listA.every((v, i) => v === listB[i]);
}

function racEquals(oldVal, newVal) {
	const oldList = (oldVal || '').split('<br>').sort();
	const newList = (newVal || '').split('<br>').sort();
	if (oldList.length !== newList.length) return false;
	return newList.every((v, i) => v.startsWith(oldList[i]));
}

// 病害虫名セルに個別ハイライトを付ける際、病害虫名自体に含まれうる特殊文字をエスケープする
function escapeHtml(str) {
	return String(str)
		.replace(/&/g, '&amp;')
		.replace(/</g, '&lt;')
		.replace(/>/g, '&gt;')
		.replace(/"/g, '&quot;')
		.replace(/'/g, '&#39;');
}

// refreshPlan の比較で使う、カラムごとの「一致」判定
// ・病害虫名(byochu)は個別名の集合として比較する
// ・RAC(mid)は、新データが旧データの後方に情報を追記しただけ（前方一致）であれば「変更なし」とみなす
// ・それ以外は単純な文字列完全一致
function fieldMatches(field, oldVal, newVal) {
	if (field === 'byochu') return byochuEquals(oldVal, newVal);
	if (field === 'mid') return racEquals(oldVal, newVal);
	return (oldVal || '') === (newVal || '');
}

// 防除計画表(#planTable)の各行を、DBの最新の登録内容と比較し、差分があれば
// 最も一致度の高い最新レコードをその行の下に挿入する（登録内容更新）
async function refreshPlan() {
	const planTableBody = document.querySelector('#planTable tbody');
	if (!planTableBody || planTableBody.rows.length === 0) return;

	if (!currentSakumotsu) {
		alert('対象作物が設定されていないため、更新できません。');
		return;
	}

	if (!confirm('現在の防除計画を、データベースの最新の登録内容と比較します。\n変更が見つかった行の下には、最新のレコードが追加されます。\nよろしいですか？')) {
		return;
	}

	waiting(true, '登録内容を確認中...');

	// 比較対象のカラム（作物名・薬剤名以外の登録内容）
	const compareFields = ['sakumotsu', 'byochu', 'jiki', 'kaisu', 'baisu', 'ekiryo', 'hoho', 'seibun', 'seibunkaisu', 'mid'];
	// 各フィールドに対応する旧行（#planTable）のセル位置
	const fieldToCellIndex = { sakumotsu: 3, byochu: 5, jiki: 6, kaisu: 7, baisu: 8, ekiryo: 9, hoho: 10, seibun: 11, seibunkaisu: 12, mid: 13 };
	const candidateCache = new Map(); // 薬剤名ごとに候補セットをキャッシュし、同じ薬剤への再検索を避ける
	const rows = Array.from(planTableBody.rows); // 追加行を巻き込まないよう、処理前の行を固定
	const notFoundYakuzai = new Set();
	let updatedCount = 0;

	try {
		for (const row of rows) {
			const yakuzaiName = row.cells[4]?.textContent.trim() || '';
			if (!yakuzaiName) continue;

			// 再実行時に前回の表示が残らないよう、一旦クリア
			row.classList.remove('row-not-found');
			row.removeAttribute('hidden'); // 旧データ行としてのマークもリセット
			row.classList.remove('olddata');
			Object.values(fieldToCellIndex).forEach(idx => row.cells[idx]?.classList.remove('cell-changed'));
			// 病害虫名セル内に前回付けた個別ハイライト(<span>)が残っていれば、プレーンな表示に戻す
			const byochuCell = row.cells[fieldToCellIndex.byochu];
			if (byochuCell) {
				byochuCell.innerHTML = parseByochuList(byochuCell.innerHTML).join('<br>');
			}
/*
			// 前回「失効」表示にした使用回数セルが残っていれば、元の値に戻す
			const kaisuCell = row.cells[fieldToCellIndex.kaisu];
			if (kaisuCell && kaisuCell.dataset.originalKaisu !== undefined) {
				kaisuCell.textContent = kaisuCell.dataset.originalKaisu;
				delete kaisuCell.dataset.originalKaisu;
			}
*/
			let candidates;
			if (candidateCache.has(yakuzaiName)) {
				candidates = candidateCache.get(yakuzaiName);
			} else {
				candidates = await getYakuzaiCandidates(yakuzaiName);
				candidateCache.set(yakuzaiName, candidates);
			}

			if (candidates.length === 0) {
				notFoundYakuzai.add(yakuzaiName);
				row.classList.add('row-not-found'); // 現在の作物条件で登録が見つからない行を赤字表示
				row.setAttribute('hidden', ''); // 変更候補行と同様に、旧データ行としてマークする
				row.classList.add('olddata');
/*
				if (kaisuCell) {
					kaisuCell.dataset.originalKaisu = kaisuCell.textContent; // 元の値を保持しておき、再実行時に復元できるようにする
					kaisuCell.innerHTML = '<em>[登録削除]</em>'; // 使用回数カラムに「登録削除」表示
				}
*/
				continue;
			}

			// 現在の行の内容を、候補セットと同じ形のオブジェクトとして取得
			const oldData = {
				sakumotsu: row.cells[3]?.textContent.trim() || '',
				byochu: (row.cells[5]?.innerHTML || '').trim(),
				jiki: row.cells[6]?.textContent.trim() || '',
				kaisu: row.cells[7]?.textContent.trim() || '',
				baisu: row.cells[8]?.textContent.trim() || '',
				ekiryo: row.cells[9]?.textContent.trim() || '',
				hoho: row.cells[10]?.textContent.trim() || '',
				seibun: (row.cells[11]?.innerHTML || '').trim(),
				seibunkaisu: (row.cells[12]?.innerHTML || '').trim(),
				mid: (row.cells[13]?.innerHTML || '').trim()
			};

			// 全カラムが一致するレコードが候補内にあれば、その行はそのまま
			// ・病害虫名(byochu)は個別名の集合として比較（並び順は無視）
			// ・RAC(mid)は前方一致（新データが旧データの続きになっているだけ）なら一致とみなす
			const exactMatchCandidate = candidates.find(c => compareFields.every(f => fieldMatches(f, oldData[f], c[f])));
			if (exactMatchCandidate) {
				// RAC(mid)が前方一致で伸びている場合、旧行の表示だけを最新の値に書き換える
				const midCell = row.cells[fieldToCellIndex.mid];
				if (midCell && exactMatchCandidate.mid && exactMatchCandidate.mid !== oldData.mid) {
					midCell.innerHTML = exactMatchCandidate.mid;
				}
				continue;
			}

			// 一致しない場合、最も一致するカラム数が多い候補レコードを探す
			// ・kaisu/baisu/ekiryo/hoho等はDBのGROUP BYキーのため、これらが同点の候補が複数残ることがある
			// ・その場合は「一番最初に見つかったもの」ではなく、病害虫名(byochu)が最も近いものを優先する
			const otherFields = compareFields.filter(f => f !== 'byochu');
			let bestCandidate = null;
			let bestScore = -1;
			let bestByochuSim = -1;
			candidates.forEach(c => {
				const score = otherFields.reduce((n, f) => n + (fieldMatches(f, oldData[f], c[f]) ? 1 : 0), 0);
				const byochuSim = getByochuSimilarity(oldData.byochu, c.byochu);
				if (score > bestScore || (score === bestScore && byochuSim > bestByochuSim)) {
					bestScore = score;
					bestByochuSim = byochuSim;
					bestCandidate = c;
				}
			});
			if (!bestCandidate) continue;

			// 旧行のうち、最新レコードと値が異なるカラムだけを赤字表示する（病害虫名以外）
			// ・RAC(mid)は前方一致であれば「変更なし」として扱い、旧行の表示だけ最新の値に書き換える
			compareFields.forEach(f => {
				if (f === 'byochu') return; // 病害虫名は個別名単位で別途処理する
				if (fieldMatches(f, oldData[f], bestCandidate[f])) {
					if (f === 'mid') {
						const midCell = row.cells[fieldToCellIndex.mid];
						if (midCell && bestCandidate.mid && bestCandidate.mid !== oldData.mid) {
							midCell.innerHTML = bestCandidate.mid;
						}
					}
					return;
				}
				row.cells[fieldToCellIndex[f]]?.classList.add('cell-changed');
			});

			// 病害虫名セルは、候補側に存在しない個別の病害虫名だけを赤字表示する
			if (!byochuEquals(oldData.byochu, bestCandidate.byochu)) {
				const oldByochuItems = parseByochuList(oldData.byochu);
				const candidateByochuSet = new Set(parseByochuList(bestCandidate.byochu));
				if (oldByochuItems.length > 0) {
					row.cells[fieldToCellIndex.byochu].innerHTML = oldByochuItems.map(item =>
						candidateByochuSet.has(item) ? escapeHtml(item) : `<span class="cell-changed">${escapeHtml(item)}</span>`
					).join('<br>');
				} else {
					row.cells[fieldToCellIndex.byochu]?.classList.add('cell-changed');
				}
			}

			// 防除時期はDBの登録内容ではないため、元の行の値をそのまま引き継ぐ
			const timingCell = row.cells[2];
			const [timing, timingMonth, timingPeriod] = getTimingArray(isRecordMode, timingCell);

			const newData = {
				timing, timingMonth, timingPeriod,
				sakumotsu: bestCandidate.sakumotsu,
				byochu: bestCandidate.byochu,
				jiki: bestCandidate.jiki,
				kaisu: bestCandidate.kaisu,
				baisu: bestCandidate.baisu,
				ekiryo: bestCandidate.ekiryo,
				hoho: bestCandidate.hoho,
				seibun: bestCandidate.seibun,
				seibunkaisu: bestCandidate.seibunkaisu,
				mid: bestCandidate.mid
			};

			// 元の行はそのまま残し、最新レコードを新しい行としてすぐ下に挿入する
			const newRow = document.createElement('tr');
			addYakuzaiToPlanRow(newRow, yakuzaiName, newData);
			row.insertAdjacentElement('afterend', newRow);

			// 元の行を「変更候補のある旧データ行」としてマークする（hidden属性で識別、表示自体はCSSで維持）
			row.setAttribute('hidden', '');
			row.classList.add('olddata');
			updatedCount++;
		}

		updateRowNumbers(); // 行番号・使用回数集計等を更新

		// 更新候補・見つからなかった薬剤のいずれも無く、変更が全く無かった場合は
		// 「作成時DB登録日」を「更新時DB登録日」に変更
		if (updatedCount === 0 && notFoundYakuzai.size === 0) {
			setDatasetInfo('更新時DB登録日: ' + currentDbUpdate);
		}

		let msg = updatedCount > 0
			? `${updatedCount} 件の行で登録内容の変更が見つかったため、最新のレコードを行の下に追加しました。\n内容をご確認のうえ、不要な行を削除してください。`
			: '登録内容に変更は見つかりませんでした。';
		if (notFoundYakuzai.size > 0) {
			msg += `\n\n以下の薬剤は、現在の作物条件では登録が見つかりませんでした：\n${Array.from(notFoundYakuzai).join('、')}`;
		}
		alert(msg);

	} catch (e) {
		console.error('防除計画の更新確認中にエラーが発生しました:', e);
		alert('防除計画の更新確認中にエラーが発生しました。');
	} finally {
		waiting(false);
	}
}

async function setByochuList(sql) {

	const byochuButtons = document.getElementById('byochuButtons');
	const byochuSelect = document.getElementById('byochuSelect');

// 病害虫選択時の処理
async function handleByochuSelection(event) {
	if (event.target.type !== 'checkbox') return;

	const byochuSelect = document.getElementById('byochuSelect');
	if (!byochuSelect) return;

	const checked = Array.from(byochuSelect.querySelectorAll('input:checked')).map(cb => cb.value);
	// コロンで区切られた値を分割し、フラットな配列にする
	const flattenedByochu = checked.flatMap(b => b.split(':').filter(Boolean));
	// 重複を除去
	const uniqueByochu = [...new Set(flattenedByochu)];
	currentByochu = uniqueByochu.map(b => `'${b}'`).join(',');

	// 薬剤リストをクリア
	const yakuzaiContainer = document.getElementById('yakuzaiContainer');
	yakuzaiContainer?.clearContent();
	// RACリストをクリア
	const racContainer = document.getElementById('racContainer');
	racContainer?.clearContent();
	// 適用候補テーブルをクリア
	const tekiyoContainer = document.getElementById('yakuzaiTekiyo');
	tekiyoContainer?.clearContent();

	// Only proceed if crops are selected and there are selected byochu
	if (currentSakumotsu && currentByochu) { // Added currentSakumotsu check
		const sql = ` and (byochu in (${currentByochu}) or mokuteki in (${currentByochu}))`;
	 	setYakuzaiList(sql);
		setRacList(true); // RACリスト更新 病害虫フィルター付き
	} else {
		// If no crops or no byochu, clear and reset lists
		setYakuzaiList(); // Reset to default (empty if no crops)
		setRacList(); // Reset to default (empty if no crops)
	}
}

// sql 実行 結果グリッド作成
async function executeSQLsetGrid(sqls) {
	if (!db) {
		alert("データベースがロードされていません。");
		return;
	}

	// テーブルインスタンスをクリア
	tables.forEach(table => {
		if (table && typeof table.destroy === 'function') {
			table.destroy();
		}
	});
	tables = [];
	let resultDiv = document.getElementById("result");
	if (!resultDiv) return; // resultDiv がなければ何もしない
	// 子要素をすべて削除 (innerHTML = '' よりも安全)
	while (resultDiv.firstChild) {
		resultDiv.removeChild(resultDiv.firstChild);
	}

	try {
		// クエリを逐次実行
		for (const [index, sql] of sqls.entries()) {
			//console.log(sql.query);
			await new Promise((resolve) => {
				// ローディング画面を確実に表示
				waiting(true, `クエリ ${index + 1} 実行中`);
				// UI更新を反映させるためにsetTimeoutを使用
				setTimeout(() => {
					requestAnimationFrame(() => {
						try {
							let searchTime = -performance.now();
							let result = db.exec(sql.query);
							searchTime += performance.now();

							// 結果を表示
							let option = { caption: sql.caption, /* query: sql.query, searchTime: searchTime*/ };
							if (sql.caption.startsWith('適用')) option.hideFooterU20 = false;
							const columns = result[0].columns;
							if (columns.length == 1 && columns[0] == 'chuijiko') {
								const value = result[0].values[0][0];
								result[0].values[0][0] = value.replaceAll(/#/g, "\n");
							}
							// テーブルインスタンスを保存(outputTable は表1つを返す。tables は表の配列のまま保つ)
							const table = outputTable('#result', result, option);
							if (table) {
								tables.push(table);
								tabExecuted = true;
							}
						} catch (error) {
							// クエリごとのエラーをキャッチ
							//setToolbarText(`<span class="error">クエリ${index + 1} エラー: ${error.message}</span>`);
						} finally {
							// 各クエリ実行後にローディング画面を非表示
							waiting(false);
						}
						resolve();
					});
				}, 0); // 0msで次のイベントループに処理を移す
			});
		}

		// すべてのクエリ実行後に結果をチェック
		if (tables.length === 0 && !tabExecuted) {
			//setToolbarText('<span class="success">実行成功（結果なし）</span>');
		}

	} catch (error) {
		// 全体のエラーハンドリング
		waiting(false);
		//setToolbarText(`<span class="error">エラー: ${error.message}</span>`);
	}
//*/
}

// 防除計画テーブルを作成する関数
function createPlanTable() {

// 現在のデータセットのDB更新日を表示する
function setDatasetInfo(dbUpdate) {
	const datasetInfoEl = document.getElementById('datasetInfo');
	if (!datasetInfoEl) return;
	datasetInfoEl.textContent = dbUpdate;
	datasetInfoEl.classList.toggle('hidden', !dbUpdate);
}

// 現在時刻を YYYYMMDD-hhmmss にフォーマット
function formatDateTime(opt = '') {
	const now = new Date();
	let format = { year: 'numeric' };
	switch (opt.toLowerCase()) {
		case 'year': break;
		case 'date': format = {...format, month: '2-digit', day: '2-digit'}; break;
		default: format = {...format, hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
	}
	const formattedDate = now.toLocaleString('ja-JP', format);
	return formattedDate.replace(/[\/:]/g, '').replace(' ', '-');
}

// ファイル名のプレフィックス（作物名）を取得する関数
function getFilenamePrefix() {
	const titleElement = document.getElementById('title');
	if (titleElement && titleElement.textContent) {
		// ファイル名として不適切な文字をアンダースコアに置換
		const cropName = titleElement.textContent.replace(/[,/\?%*:|"<>]/g, '_');
		return cropName + '_';
	}
	return '';
}

function parseTiming(timingText) {
	let timingMonth = '', timingPeriod = '';
	if (timingText) {
		if (/^\d{4}-\d{2}-\d{2}$/.test(timingText)) {
			const [year, month, day] = timingText.split('-');
			timingMonth = (+month).toString();
			timingPeriod = day > 20 ? '下旬' : day > 10 ? '中旬' : '上旬';
		} else {
			if (timingText === '日付選択' || timingText === '') {
				[timingText, timingMonth, timingPeriod] = ['', '', ''];
			} else {
				[timingMonth, timingPeriod] = timingText.split('月');
			}
		}
	}
	return [timingText, timingMonth, timingPeriod];
}

function getMonthPeriod(td, timingOnly = false) {
	let timing = '', month = '', period = '';
	const monthSelect = td.querySelector('.timing-month');
	if (monthSelect) {
		month = monthSelect.value || '';
		period = td.querySelector('.timing-period')?.value || '';
		timing = (month && period) ? `${month}月${period}` : ''; // 防除記録用にこのデータは必須
	} else {
		const timingText = td.querySelector('.timing')?.textContent || '';
		[timing, month, period] = parseTiming(timingText);
	}
	if (timingOnly) return timing;
	return [timing, month, period];
}

function getTimingText(td) {
	let timingText;
	if (isRecordMode) {
		timingText = td.querySelector('label')?.textContent || '';
	} else {
		timingText = getMonthPeriod(td, true);
		//if (!timingText) {
		//	timingText = td.querySelector('.timing')?.textContent || '';
		//}
	}
	return timingText;
}

function getTimingArray(mode, td) {
	let timing, timingMonth, timingPeriod;
	if (mode) {
		const timingText = td.querySelector('label')?.textContent || '';
		[timing, timingMonth, timingPeriod] = parseTiming(timingText);
	} else {
		[timing, timingMonth, timingPeriod] = getMonthPeriod(td);
		//if (!timing) {
		//	const timingText = td.querySelector('.timing')?.textContent || '';
		//	[timing, timingMonth, timingPeriod] = parseTiming(timingText);
		//}
	}
	return [timing, timingMonth, timingPeriod];
}

// planTable の内容を json 形式にする関数
function convPlanToJson() {
	const table = document.getElementById('planTable');
	if (!table) return '';

	const planData = [];

	const saveData = {
		dataset: currentDbUpdate, // 保存時点の農薬登録情報DBの登録更新日
		sakumotsu: currentSakumotsu, // 作物条件のSQL文字列
		crops: checkedCrops, // 選択作物オブジェクトの配列(モバイル版互換用)
		titleText: document.getElementById('title').textContent, // #title のテキスト内容
		ojasCount: getOjasCountMode(), // 成分回数の合計に数えない成分: 'all'(全カウント) / 'jas'(有機JAS非カウント) / 'jas_tokusai'(有機JAS・特栽可能性非カウント)
		harvest: getHarvestSetting(), // 収穫前日数の設定 { enabled(判定する), month, period(収穫開始の月旬), date(記録モードの収穫開始年月日) }。収穫開始は stages の「収穫開始」と同じ値(旧版互換)
		stages: getStageSettings(), // 生育ステージの時期 { ステージ名: { month, period(計画モードの月旬), date(記録モードの年月日) } }(「定植」「収穫開始」)
		plan: planData
	};

	const headers = ['no', 'timing', 'sakumotsu','yakuzai','byochu','jiki', 'kaisu', 'baisu', 'ekiryo','hoho', 'seibun', 'seibunkaisu', 'mid'];

	table.querySelectorAll('tbody tr').forEach(tr => {
		const rowData = {};
		tr.querySelectorAll('td').forEach((td, index) => {
			if (index > 0) { // 「操作」列をスキップ
				const key = headers[index - 1];
				if (index === 2) { // 防除時期セル
					[rowData.timing, rowData.timingMonth, rowData.timingPeriod] = getTimingArray(isRecordMode, td);
				} else {
					rowData[key] = td.innerHTML; // innerHTMLを使用して<br>タグを保持
				}
			}
		});
		planData.push(rowData);
	});

	return JSON.stringify(saveData, null, 2);
}

// planTable の内容を JSON 形式で保存する関数
async function savePlanFile(overwrite = true) {
	// 登録日の古い旧データ行(olddata)が残っている場合は、保存前に確認する
	const planTableBodyForCheck = document.querySelector('#planTable tbody');
	const hasOldDataRowsForSave = planTableBodyForCheck
		? Array.from(planTableBodyForCheck.rows).some(row => row.hasAttribute('hidden'))
		: false;
	if (hasOldDataRowsForSave) {
		const proceedWithSave = confirm(
			'登録日の古いデータ行が残っています。保存すると現在開いているDBの登録更新日が保存されますので、古いデータ行を削除してから保存することをおすすめします。このまま保存する場合は、次回読み込み時に古いデータ行が残った状態で表示されることをご承知ください。'
		);
		if (!proceedWithSave) return;
	}

	const saveData = convPlanToJson();

	// デフォルトファイル名
	const prefix = getFilenamePrefix(); // 作物名プレフィックス
	const baseName = isRecordMode ? '防除記録' : '防除計画';
	let filename = currentFilename ? currentFilename : `${prefix}${baseName}_${formatDateTime('year')}.json`;
	if (currentFilename) {
		if (isRecordMode) {
			filename = filename.replace('計画', '記録');
		} else {
			filename = filename.replace('記録', '計画');
		}
	}

	// API 非対応ブラウザの場合はダウンロード型保存
	if (!isFileSystemAccessSupported) {
		const blob = new Blob([saveData], { type: 'application/json' });
		saveAs(blob, filename);
		isDirty = false;
		alert(
			`「${filename}」をダウンロードしました。\n\n` +
			"【便利なヒント】\n" +
			"Google Chrome や Microsoft Edge などのブラウザでお使いいただくと、" +
			"同じファイルへの「上書き保存」や「名前を付けて保存」ができるようになり、ファイルがたまらず便利です！"
		);
		return;
	}

	// overwrite = true でファイルハンドルがあり、basename が一致している場合は「上書き」
	if (overwrite && currentFileHandle && currentFilename.includes(baseName)) {
		try {
			const writable = await currentFileHandle.createWritable();
			await writable.write(saveData);
			await writable.close();
			isDirty = false;
			alert('ファイルを上書き保存しました。');
			return;
		} catch (err) {
			console.error('上書き失敗（新規保存に切り替えます）:', err);
		}
	}

	// overwrite = false またはハンドルがない、または basename が不一致、または上書きに失敗した場合は「名前を付けて保存」
	try {
		const fileHandle = await window.showSaveFilePicker({
			suggestedName: filename,
			types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }]
		});
		
		
		const writable = await fileHandle.createWritable();
		await writable.write(saveData);
		await writable.close();

		currentFileHandle = fileHandle; // 次回上書き用にハンドルを記憶
		currentFilename = fileHandle.name;
		isDirty = false;
		alert('新しくファイルを保存しました。次回からは自動で上書きされます。');
		
	} catch (err) {
		if (err.name !== 'AbortError') {
			alert('ファイルの保存に失敗しました。');
		}
	}

}

// 防除計画ファイルを開く
async function openPlanFile(item = null) {

	const planTableBody = document.querySelector('#planTable tbody');
	if (planTableBody && planTableBody.rows.length > 0) {
		if (!confirm('現在の防除計画/記録をクリアして、新しいファイルを読み込みますか？')) {
			return;
		}
	}

	// 【パターンB】Firefox / Safari など（隠しinputを代わりにクリック）
	if (!isFileSystemAccessSupported) {
		document.getElementById('fallbackFileInput')?.click();
		return;
	}

	// 【パターンA】Chrome / Edge など（上書き保存のルートに乗せる）
	try {
		let fileHandle = null;
		if (item) {
			fileHandle = await item.getAsFileSystemHandle();
		} else {
			[fileHandle] = await window.showOpenFilePicker({
				types: [{ description: 'JSON Files', accept: { 'application/json': ['.json'] } }],
				multiple: false
			});
		}
		const file = await fileHandle.getFile();
		const text = await file.text();
		currentFileHandle = fileHandle; // ハンドルを記憶
		currentFilename = fileHandle.name; // ファイル名を保存
		loadPlanFromJson(text); // データ読み込み共通関数へ
	} catch (err) {
		if (err.name !== 'AbortError') alert('ファイルの読み込みに失敗しました。');
	}

}

// fallbackFileInput の場合の読込
function readFile(file) {
	if (!file) return;
	if (!file.name.toLowerCase().endsWith('.json')) {
		alert('対応していないファイル形式です。');
	}

	currentFileHandle = null; // ハンドルは取れないのでnull

	const reader = new FileReader();
	reader.onload = (e) => {
		try {
			loadPlanFromJson(e.target.result); // データ読み込み共通関数へ
		} catch (err) {
			alert('ファイルの解析に失敗しました。正しいJSONファイルか確認してください。');
		}
	};
	reader.onerror = () => {
		alert('ファイルの読み込み中にエラーが発生しました。');
	};
	reader.readAsText(file); // テキストとして読み込み開始
	currentFilename = file.name; // ファイル名保存
}

// JSONファイルを読み込んでplanTableを復元する関数
async function loadPlanFromJson(jsonText, msg) {

	try {
		const loadedData = JSON.parse(jsonText);
		const planData = loadedData.plan;

		// 先頭行が日付形式なら記録モードを自動有効化
		const firstRow = planData[0];
		isRecordMode = !!(firstRow && firstRow.timing && /^\d{4}-\d{2}-\d{2}$/.test(firstRow.timing));
		const modeCheck = document.getElementById('checkRecordMode');
		if (modeCheck) modeCheck.checked = isRecordMode;

		// 'plan', 'titleText', 'crops' の存在をチェック
		if (!Array.isArray(planData) || loadedData.titleText === undefined) { // loadedData.crops はオプションなのでチェックしない
			throw new Error('Invalid JSON format: missing plan, titleText, or crops.');
		}

		// 作物情報の復元
		window.checkedCrops = loadedData.crops || []; // crops がない場合は空配列で初期化

		// currentSakumotsu を checkedCrops から再構築、または古い形式のsakumotsuから復元
		currentSakumotsu = null; // まず初期化
		if (window.checkedCrops.length > 0) {
			currentSakumotsu = makePlanCropCondition(window.checkedCrops.map(item => item.sakumotsu));
		} else if (loadedData.sakumotsu) { // 古い形式のJSONでcropsがない場合
			currentSakumotsu = loadedData.sakumotsu;
		}

		// 作物ツリーのチェック状態を視覚的に復元
		if (_defaultCropTreeManager && typeof _defaultCropTreeManager.syncCheckState === 'function') {
			_defaultCropTreeManager.syncCheckState();
		}

		// searchCrop を呼び出して、UIと関連リストを更新
		await searchCrop(); // searchCrop が null currentSakumotsu を処理するように変更

		// テーブルを復元
		const planTableBody = document.querySelector('#planTable tbody');
		if (!planTableBody) return;

		// #title のテキスト内容を復元
		const titleElement = document.getElementById('title');
		if (titleElement) {
			titleElement.textContent = loadedData.titleText;
			titleElement.classList.remove('hidden'); // タイトルを表示状態にする
		}

		// 収穫前日数の設定を復元(項目の無い古い形式のファイルは未設定・判定しないに戻す。旧版の「収穫中も散布あり」は読み捨てる)
		setHarvestSetting(loadedData.harvest);
		// 生育ステージの時期を復元(項目の無い古いファイルは、収穫開始だけを harvest から読む)
		setStageSettings(loadedData.stages, true);
		// 成分回数の合計に数えない成分の選択を復元(項目の無い古いファイルは全カウント)
		setOjasCountMode(loadedData.ojasCount);

		// 既存のテーブル内容と候補テーブルをクリア
		planTableBody?.clearContent();
		document.getElementById('yakuzaiTekiyo')?.clearContent();

		// JSONデータからテーブルを再構築
		planData.forEach(rowData => {
			const newRow = planTableBody.insertRow();
			const yakuzaiName = rowData.yakuzai || '';
			const data = {
				timing: rowData.timing || '', // Add timing property
				// 日付形式(YYYY-MM-DD)から月と旬を計算するフォールバック
				timingMonth: rowData.timingMonth || (rowData.timing && /^\d{4}-\d{2}-\d{2}$/.test(rowData.timing) ? String(new Date(rowData.timing).getMonth() + 1) : ''),
				timingPeriod: rowData.timingPeriod || (rowData.timing && /^\d{4}-\d{2}-\d{2}$/.test(rowData.timing) ? (new Date(rowData.timing).getDate() <= 10 ? '上旬' : new Date(rowData.timing).getDate() <= 20 ? '中旬' : '下旬') : ''),
				sakumotsu: rowData.sakumotsu || '',
				yakuzai: rowData.yakuzai || '',
				byochu: rowData.byochu || '',
				jiki: rowData.jiki || '',
				kaisu: rowData.kaisu || '-',
				baisu: rowData.baisu || '',
				ekiryo: rowData.ekiryo || '',
				hoho: rowData.hoho || '',
				//yukoseibun: rowData.yukoseibun || '',
				seibun: rowData.seibun || '',
				seibunkaisu: rowData.seibunkaisu || '',
				mid: rowData.mid || ''
			};
			addYakuzaiToPlanRow(newRow, yakuzaiName, data);
		});

		updateRowNumbers(); // 行番号の再採番と成分別使用回数の更新
		isDirty = false;

		// 保存時点の農薬登録情報DB登録更新日(dataset)を表示する
		const dataset = loadedData.dataset ? `作成時DB登録日: ${loadedData.dataset}` : '';
		setDatasetInfo(dataset);

		// jsonファイルを読み込んだので、登録内容更新（refresh）アイコンを有効化する
		document.getElementById('btnRefreshPlan')?.classList.remove('disabled');

		if (!msg) msg = '防除計画/防除記録を読み込みました。';
		alert(msg);

	} catch(err) {
		console.error('JSONファイルの解析に失敗しました:', err);
		alert('ファイルの読み込みに失敗しました。有効なJSONファイルを選択してください。');
	}
}

// planTableの内容をExcelファイルとして保存する関数
async function savePlanTableAsExcel() { // 関数名を savePlanTableExcel から savePlanTableAsExcel に変更
	const table = document.getElementById('planTable');
	if (!table) return;

	const baseName = isRecordMode ? '防除記録' : '防除計画';
	const workbook = new ExcelJS.Workbook();
	const planWorksheet = workbook.addWorksheet(baseName);

	// ヘッダー行を追加 (「操作」列を除く)
	const headers = [];
	table.querySelectorAll('thead th').forEach((th, index) => {
		if (index > 0) headers.push(th.textContent);
	});
	planWorksheet.addRow(headers);

	// データ行を追加 (「操作」列を除く)
	table.querySelectorAll('tbody tr').forEach(tr => {
		const rowData = [];
		tr.querySelectorAll('td').forEach((td, index) => {
			if (index > 0) {
				let cellText;
				if (index === 2) { // 防除時期セル
					cellText = getTimingText(td);
				} else {
					// <br> を改行文字 \n に変換
					cellText = td.innerHTML.replace(/<br\s*\/?>/gi, '\n');
				}
				rowData.push(cellText);
			}
		});
		planWorksheet.addRow(rowData);
	});

	// すべてのセルでテキストの折り返しを有効にする
	planWorksheet.eachRow({ includeEmpty: true }, function(row, rowNumber) {
		row.eachCell({ includeEmpty: true }, function(cell, colNumber) {
			cell.alignment = { wrapText: true, vertical: 'top' };
		});
	});

	// --- 成分別使用回数テーブルを別シートに追加 ---
	const seibunTable = document.getElementById('seibunCountTable');
	if (seibunTable) {
		const seibunWorksheet = workbook.addWorksheet('成分別使用回数');
		const seibunHeaders = [];
		seibunTable.querySelectorAll('thead th').forEach(th => {
			seibunHeaders.push(th.textContent);
		});
		seibunWorksheet.addRow(seibunHeaders);

		// データ行
		seibunTable.querySelectorAll('tbody tr').forEach(tr => {
			const rowData = [];
			tr.querySelectorAll('td').forEach(td => {
				rowData.push(td.textContent);
			});
			seibunWorksheet.addRow(rowData);
		});

		// 合計行 (フッター)
		const tfoot = seibunTable.querySelector('tfoot');
		if (tfoot) {
			tfoot.querySelectorAll('tr').forEach(tr => {
				const rowData = [];
				tr.querySelectorAll('td').forEach(td => {
					rowData.push(td.textContent);
				});
				seibunWorksheet.addRow(rowData);
			});
		}
	}

	// Excel ファイルを生成して保存
	const buffer = await workbook.xlsx.writeBuffer();
	const prefix = getFilenamePrefix(); // 作物名プレフィックス
	const filename = `${prefix}${baseName}_${formatDateTime('date')}.xlsx`;

	// API 非対応ブラウザの場合はダウンロード型保存
	if (!isFileSystemAccessSupported) {
		const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
		saveAs(blob, filename);
		alert('Exelファイルをダウンロードしました。');
		return;
	}

	try {
		const fileHandle = await window.showSaveFilePicker({
			suggestedName: filename,
			types: [{ description: 'JSON Files', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }]
		});
		
		const writable = await fileHandle.createWritable();
		await writable.write(buffer);
		await writable.close();
		alert('ファイルを保存しました');
		
	} catch (err) {
		if (err.name !== 'AbortError') {
			alert('ファイルの保存に失敗しました。');
		}
	}
}

// planTableの内容をクリップボードにコピーする関数
async function copyPlanTableToClipboard() {
	const table = document.getElementById('planTable');
	if (!table) return;

	let data = '';
	const headers = [];
	// ヘッダーを取得（「操作」列を除く）
	table.querySelectorAll('thead th').forEach((th, index) => {
		if (index > 0) { // 0番目の「操作」列をスキップ
			headers.push(th.textContent);
		}
	});
	data += headers.join('\t') + '\n';

	// ボディの各行を取得
	table.querySelectorAll('tbody tr').forEach(row => {
		const rowData = [];
		row.querySelectorAll('td').forEach((td, index) => {
			if (index > 0) { // 0番目の「操作」列をスキップ
				let cellText;
				if (index === 2) { // 防除時期セル
					cellText = getTimingText(td);
				} else {
					cellText = td.textContent.replace(/\n/g, ' '); // セル内の改行はスペースに置換
				}
				rowData.push(cellText);
			}
		});
		data += rowData.join('\t') + '\n';
	});

	try {
		await navigator.clipboard.writeText(data);
		alert('計画をクリップボードにコピーしました。');
	} catch (err) {
		console.error('クリップボードへのコピーに失敗しました: ', err);
		alert('コピーに失敗しました。');
	}
}

// 指定したテーブルの内容をクリップボードにコピーする関数
async function copyTableToClipboard(tableId) {
	const table = document.getElementById(tableId);
	if (!table) return;

	let data = '';
	const headers = [];
	table.querySelectorAll('thead th').forEach(th => headers.push(th.textContent));
	data += headers.join('\t') + '\n';

	// 結合セル(rowspan)は、貼り付け先で各行に値が入るよう、結合された行にも同じ値を繰り返す
	const spans = [];   // 列番号 -> { rest: 残りの行数, text }
	// セルの文字列。要確認の内容を選ぶボタン(画面操作用)の文字は含めない
	const cellText = (td) => {
		if (!td.querySelector('button.ur-open')) return td.textContent;
		const c = td.cloneNode(true);
		c.querySelectorAll('button.ur-open').forEach(b => b.remove());
		return c.textContent;
	};
	table.querySelectorAll('tbody tr').forEach(row => {
		const rowData = [];
		const cells = Array.from(row.querySelectorAll('td'));
		let ci = 0;
		let k = 0;
		while (k < cells.length || (spans[ci] && spans[ci].rest > 0)) {
			if (spans[ci] && spans[ci].rest > 0) {
				rowData.push(spans[ci].text);
				spans[ci].rest--;
			} else {
				const td = cells[k++];
				rowData.push(cellText(td));
				const rs = parseInt(td.getAttribute('rowspan') || '1', 10);
				if (rs > 1) spans[ci] = { rest: rs - 1, text: cellText(td) };
			}
			ci++;
		}
		data += rowData.join('\t') + '\n';
	});

	const tfoot = table.querySelector('tfoot');
	if (tfoot) {
		tfoot.querySelectorAll('tr').forEach(row => {
			const rowData = [];
			row.querySelectorAll('td').forEach(td => rowData.push(td.textContent));
			data += rowData.join('\t') + '\n';
		});
	}

	try {
		await navigator.clipboard.writeText(data);
		alert('クリップボードにコピーしました。');
	} catch (err) {
		console.error('クリップボードへのコピーに失敗しました: ', err);
		alert('コピーに失敗しました。');
	}
}

// タイミングセルの内容を描画・更新するヘルパー
/**
 * 時期のセル(防除計画の防除時期・生育ステージの時期で共通)を作る。計画モードは月・旬の選択、記録モードは日付(ラベル+隠した日付入力)。
 * onChange(cell): 値が変わったとき(防除計画は updateRowNumbers)。記録モードで日付が空のときは、ラベルの月旬(計画モードで入れた時期)
 * か、上の行の日付の月でカレンダーを開く(openTimingCalendar)
 */
function renderTimingCell(cell, data, onChange = () => updateRowNumbers()) {
	cell.innerHTML = '';
	cell.classList.add('timing-cell');

	if (isRecordMode) {
		// 日付入力フィールド
		const dateDisplayWrapper = document.createElement('div'); // This is the wrapper for the display span and hidden input
		dateDisplayWrapper.classList.add('date-display-wrapper');

		const displayLabel = document.createElement('label'); // labelに変更
		// inputと紐付けるための一意なIDを生成
		const uniqueId = 'plan_date_' + Math.random().toString(36).substring(2, 7) + '_' + Date.now();
		displayLabel.htmlFor = uniqueId;

		let displayText = '';
		if (data.timing) {
			displayText = data.timing;
		} else if (data.timingMonth && data.timingPeriod) {
			displayText = `${data.timingMonth}月${data.timingPeriod}`;
		} else {
			displayText = '日付選択';
		}
		displayLabel.textContent = displayText;

		// 日付の値は隠した日付入力に持つ(並べ替え・保存などはこの値を読む)。選択はこの画面のカレンダー(openTimingCalendar)で行う
		const dateInput = document.createElement('input');
		dateInput.type = 'date';
		dateInput.id = uniqueId;
		dateInput.hidden = true;
		dateInput.tabIndex = -1;
		dateInput.value = data.timing && /^\d{4}-\d{2}-\d{2}$/.test(data.timing) ? data.timing : '';
		displayLabel.htmlFor = '';
		displayLabel.tabIndex = 0;
		displayLabel.setAttribute('role', 'button');
		displayLabel.title = 'クリックでカレンダーを開く';

		const open = (e) => {
			e.stopPropagation();
			openTimingCalendar(uniqueId, dateInput.value || displayLabel.textContent, (v) => {
				dateInput.value = v;
				displayLabel.textContent = v || displayText;
				// 先頭行が日付になったら、他の行も（もし未設定なら）自動で合わせるためのフックポイント
				onChange(cell);
			});
		};
		dateDisplayWrapper.onclick = open;
		displayLabel.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(e); } };

		dateDisplayWrapper.appendChild(displayLabel);
		dateDisplayWrapper.appendChild(dateInput);
		cell.appendChild(dateDisplayWrapper);
	} else {
		// 月旬セレクタ
		const timingDiv = document.createElement('div');
		timingDiv.classList.add('timing');
		// data.timing が YYYY-MM-DD 形式ならそのまま表示
		if (data.timing && /^\d{4}-\d{2}-\d{2}$/.test(data.timing)) {
			//timingDiv.textContent = formatToYYMMDD(data.timing);
			timingDiv.textContent = data.timing;
		} else {
			const monthSelect = document.createElement('select');
			monthSelect.className = 'timing-month';
			monthSelect.innerHTML = '<option value="">月</option>' + Array.from({length: 12}, (_, i) => `<option value="${i+1}">${i+1}月</option>`).join('');
			monthSelect.value = data.timingMonth || '';
			const periodSelect = document.createElement('select');
			periodSelect.className = 'timing-period';
			const periods = ['上旬', '中旬', '下旬'];
			periodSelect.innerHTML = '<option value="">旬</option>' + periods.map(p => `<option value="${p}">${p}</option>`).join(''); // Option for period
			periodSelect.value = data.timingPeriod || '';

			monthSelect.onchange = () => onChange(cell);
			periodSelect.onchange = () => onChange(cell);

			timingDiv.appendChild(monthSelect);
			timingDiv.appendChild(periodSelect);
		}
		cell.appendChild(timingDiv);
	}
}

// 行を削除する
function deleteRow(button) {
	const row = button.closest('tr');
	row.parentNode.removeChild(row);
	updateRowNumbers();
}

// 行を移動する
function moveRow(button, direction) {
	const row = button.closest('tr');
	const tbody = row.parentNode;
	if (direction === 'up' && row.previousElementSibling) {
		tbody.insertBefore(row, row.previousElementSibling);
	} else if (direction === 'down' && row.nextElementSibling) {
		tbody.insertBefore(row.nextElementSibling, row);
	}
	updateRowNumbers();
}

// 防除時期で計画をソートする関数
function sortPlanByTiming() {
	const planTableBody = document.querySelector('#planTable tbody');
	if (!planTableBody) return;
	const rows = Array.from(planTableBody.rows);
	const periodMap = { '上旬': 1, '中旬': 2, '下旬': 3, '': 0 }; // 0 for unspecified period
	// 月旬の計画は、1行目(防除時期の入った最初の行)をその作の最初の防除とし、その月旬から始まる1年間(作期)の順に並べる
	// (11月始まりの作で1月の行が先頭に来て、作期の起点が変わらないように。収穫前日数の判定と同じ考え方)
	const idxOf = (row) => {
		const m = parseInt(row.querySelector('.timing-cell .timing-month')?.value || '', 10);
		const p = periodMap[row.querySelector('.timing-cell .timing-period')?.value || ''] || 0;
		return m >= 1 && p >= 1 ? (m - 1) * 3 + (p - 1) : null;   // 0～35(年内の旬の通し番号)
	};
	const anchorRow = rows.find((row) => idxOf(row) !== null);
	const anchorIdx = anchorRow ? idxOf(anchorRow) : 0;

	rows.sort((a, b) => {
		// Row A の値を取得
		const dateInputA = a.querySelector('.timing-cell input[type="date"]');
		const monthSelectA = a.querySelector('.timing-cell .timing-month');
		const periodSelectA = a.querySelector('.timing-cell .timing-period');

		let valA = null;
		if (dateInputA && dateInputA.value) {
			valA = new Date(dateInputA.value).getTime(); // Convert to timestamp for sorting
		} else if (monthSelectA && monthSelectA.value && periodSelectA && periodSelectA.value) {
			valA = ((idxOf(a) - anchorIdx) % 36 + 36) % 36; // 作期の起点(1行目の月旬)からの旬の数
		}

		// Row B の値を取得
		// Row B values
		const dateInputB = b.querySelector('.timing-cell input[type="date"]');
		const monthSelectB = b.querySelector('.timing-cell .timing-month');
		const periodSelectB = b.querySelector('.timing-cell .timing-period');

		let valB = null;
		if (dateInputB && dateInputB.value) {
			valB = new Date(dateInputB.value).getTime();
		} else if (monthSelectB && monthSelectB.value && periodSelectB && periodSelectB.value) {
			valB = ((idxOf(b) - anchorIdx) % 36 + 36) % 36;
		}

		// Handle null/undefined values (unspecified timing) by pushing them to the end
		if (valA === null && valB === null) return 0;
		if (valA === null) return 1; // A is unspecified, push to end
		if (valB === null) return -1; // B is unspecified, push to end

		return valA - valB;
	});

	rows.forEach(row => planTableBody.appendChild(row));
	updateRowNumbers();
}

// No. の再採番とボタンの状態更新。行が無くなったら、記録モードと収穫前日数(判定のチェック・収穫開始時期・表)を初期化し、
// 作物の選択からやり直せるようにする。最後に薬剤別・成分別使用回数の表(と収穫前日数の表)を作り直す
function updateRowNumbers() {
	const planTableBody = document.querySelector('#planTable tbody');
	if (!planTableBody) return;

	// 事故防止のため、ここに来た段階で自動保存データを削除して復元ボタンを隠す
	if (localStorage.getItem('unsavedPlan')) {
		localStorage.removeItem('unsavedPlan');
		document.getElementById('btnRestorePlan')?.classList.add('hidden');
	}

	const rows = planTableBody.rows;
	const hasRows = rows.length > 0;
	isDirty = hasRows;

	// 行がない場合は記録モード解除
	if (!hasRows) {
		isRecordMode = false;
		const checkRecordMode = document.getElementById('checkRecordMode');
		if (checkRecordMode) checkRecordMode.checked = false;
		// 収穫前日数も完全に初期化する(判定のチェック・収穫開始時期・収穫開始年月日を外し、欄と表を消す)
		setHarvestSetting(null);
		setStageSettings(null);   // 生育ステージの時期も消す
		const harvestContainer = document.getElementById('harvestContainer');
		if (harvestContainer) harvestContainer.innerHTML = '';
	}

	// 作物ツリーのロック制御
	const cropTree = document.getElementById('cropTree');
	if (cropTree) {
		cropTree.classList.toggle('locked', hasRows);
		cropTree.title = hasRows ? '計画にデータがあるため作物の変更はできません。' : '';
	}

	tabExecuted = hasRows; // 防除計画に行があれば実行済み
	['btnSortPlan', 'btnCopyPlan', 'btnExcelPlan', 'btnSavePlan', 'btnSavePlanAs'].forEach(id => {
		const btn = document.getElementById(id);
		if (btn) {
			btn.classList.toggle('disabled', !hasRows);
		}
	});

	let noCounter = 0;
	for (let i = 0; i < rows.length; i++) {
		const row = rows[i];
		// 変更候補行とペアになっている旧データ行（row-not-found ではない hidden 行）だけを連番から除外する。
		// notFoundYakuzai行（row-not-found）はペアの新しい行を持たないため、通常どおり自分自身の番号を持つ。
		const isPairedOldRow = row.hasAttribute('hidden') && !row.classList.contains('row-not-found');

		// No. を更新
		if (!isPairedOldRow) {
			row.cells[1].textContent = ++noCounter;
		}
		row.cells[1].className = 'No';

		// ボタンの状態を更新
		const icons = row.cells[0].querySelectorAll('svg');
		const upIcon = icons[1];
		const downIcon = icons[2];
		
		if (upIcon) {
			upIcon.classList.toggle('disabled', i === 0);
		}
		if (downIcon) {
			downIcon.classList.toggle('disabled', i === rows.length - 1);
		}
	}

	// 変更候補行とペアになっている旧データ行には、対応する行（直後の行。なければ直前の行）と同じNoを表示する
	for (let i = 0; i < rows.length; i++) {
		const row = rows[i];
		if (!row.hasAttribute('hidden') || row.classList.contains('row-not-found')) continue;
		const refRow = rows[i + 1] || rows[i - 1];
		if (refRow && row.cells[1] && refRow.cells[1]) {
			row.cells[1].textContent = refRow.cells[1].textContent;
		}
	}

	// 各カウントテーブルを更新
	updateYakuzaiCountTable();
	updateSeibunCountTable();

	// hidden属性の旧データ行（refreshPlanで作成）が1件でもあれば「旧データ一括削除」ボタンを表示する
	const hasOldDataRows = Array.from(rows).some(row => row.hasAttribute('hidden'));
	document.getElementById('btnDeleteOldRows')?.classList.toggle('hidden', !hasOldDataRows);

	// 旧データ行(olddata)が発生したことがある状態から、すべて削除されて0件になったら、
	// 「作成時DB登録日」の表示を「更新時DB登録日」に変更
	if (hasOldDataRows) {
		hasHadOldDataRows = true;
	} else if (hasHadOldDataRows) {
		setDatasetInfo('更新時DB登録日: ' + currentDbUpdate);
		hasHadOldDataRows = false;
	}
}

// refreshPlan によって hidden 属性が付いた旧データ行（変更候補あり／notFoundYakuzai）を一括削除する
function deleteOldDataRows() {
	const planTableBody = document.querySelector('#planTable tbody');
	if (!planTableBody) return;

	const oldRows = Array.from(planTableBody.rows).filter(row => row.hasAttribute('hidden'));
	if (oldRows.length === 0) return;

	if (!confirm(`旧データ行（変更候補のある行、または現在の作物条件で登録が見つからない行）を ${oldRows.length} 件削除します。よろしいですか？`)) {
		return;
	}

	oldRows.forEach(row => row.remove());
	updateRowNumbers();
}

// ============================================================ 併用前提の登録(他の薬剤に加用・混用・併用して使う登録)
// 使用方法(・希釈倍数)に「ジベレリンに加用」「トマト落果防止剤と併用」「エスレル10の…液と混合して」のように相手の薬剤が書かれた登録は、
// 相手の薬剤と同時に使う前提。計画の同じ防除時期(未設定なら計画全体)に相手が無ければ、薬剤別使用回数の判定に警告(要確認)を出す
// 相手の名前 → 成分名の読み替え(剤型の総称で書かれたもの)
const CO_USE_ALIAS = { 'トマト落果防止剤': ['4-CPA'], '4-CPA剤': ['4-CPA'], 'マシン油乳剤': ['マシン油'] };
// 総称で書かれた相手 → 成分名のパターン(「銅水和剤」は銅を含む成分の水和剤、「有機銅水和剤」はオキシン銅)
const CO_USE_CLASS = [[/^有機銅/, /オキシン銅/], [/^銅(?:水和剤|剤)?$/, /銅/]];
// 計画では確かめられない相手(農薬ではない資材、または範囲の決まらない総称)。これが選択肢に含まれる登録は、相手が無くても警告しない
const CO_USE_UNTRACKABLE = /展着剤|蛋白加水分解物|尿素|有機殺菌剤|^殺虫剤$|防除用殺虫剤|倉庫|容積|投薬|肥料|食餌|米ぬか|^水$/;
/**
 * 使用方法などの文字列から、同時に使う相手の薬剤を取り出す。戻り値: [{ text: 元の記述, alts: [{ keys:[成分名・農薬名…], re:成分名のパターン|null }…], untrackable }]
 *   alts は「又は」で並んだ選択肢。どれか1つの選択肢が計画にあれば良い
 *   書き方: 「Xに加用」「Xと混用」「Xに混用して」「Xと併用」「Xと(等量)混合」「X(含有率)液剤を…加用のうえ」
 */
function coUsePartnersOf(text) {
	const s = String(text || '').normalize('NFKC').replace(/[~〜～]/g, '~');
	const out = [];
	const take = (seg) => {
		seg = seg.replace(/^.*場合/, '').replace(/^第\d+回目/, '').replace(/^.*以降/, '').replace(/処理$/, '');
		if (!seg) return;
		const alts = seg.split(/又は|または|若しくは|もしくは/).map((x) => x
			.replace(/の?[\d.~]+(?:倍|ppm|%)[^]*$/, '')   // 濃度・倍数・含有率以降(「60~80倍液」「の2000~8000倍希釈液」「21.5%液剤」)を除く
			.replace(/(?:希釈)?液$/, '')
			.trim()).filter(Boolean);
		if (!alts.length) return;
		out.push({
			text: seg,
			untrackable: alts.some((x) => CO_USE_UNTRACKABLE.test(x)),
			alts: alts.map((x) => ({
				keys: [x, x.replace(/(?:乳剤|水和剤|水溶剤|液剤|粒剤|剤)$/, '')].concat(CO_USE_ALIAS[x] || []).filter(Boolean),
				re: (CO_USE_CLASS.find(([k]) => k.test(x)) || [])[1] || null,
			})),
		});
	};
	let m;
	const re = /(に加用|と混用|に混用|と併用|と(?:等量)?混合)/g;
	while ((m = re.exec(s))) {
		// 直前の区切り(括弧・読点・句点・空白・コロン)から、加用などの語の手前までが相手の記述。「本剤と…」のように本剤自身なら対象外
		const seg = s.slice(0, m.index).split(/[(\s、。,:]/).pop();
		if (/^本剤$/.test(seg)) continue;
		take(seg);
	}
	const re2 = /([^\s、。,(:]+?)を[^、。\s]*?加用/g;   // 「エテホン21.5%液剤を1㎡あたり1.0mL加用のうえ」
	while ((m = re2.exec(s))) take(m[1]);
	return out;
}
/**
 * 計画表の行ごとに、併用前提の登録の相手の薬剤が計画にあるかを調べる。戻り値: Map(行 tr → [{ level: 'OK'|'要確認', text: 理由 }])
 * 相手は、同じ作物で、防除時期が両方に入っていれば同じ防除時期の、別の行の有効成分名または薬剤名と照合する
 */
function checkCoUse(rows) {
	const norm = (x) => String(x || '').normalize('NFKC').replace(/\s+/g, '');
	// 防除時期の比較キー(日付、または「6月上旬」など)。未設定なら ''
	const timingKeyOf = (td) => {
		if (!td) return '';
		try {
			if (typeof getTimingArray === 'function') {
				const [timing, month, period] = getTimingArray(typeof isRecordMode !== 'undefined' && isRecordMode, td);
				return norm(timing || (month && period ? `${month}月${period}` : ''));
			}
		} catch (e) { /* 読めなければ文字列で比べる */ }
		const t = norm(td.textContent);
		return t === '日付選択' ? '' : t;
	};
	const info = rows.map((row) => ({
		row,
		timing: timingKeyOf(row.cells[2]),
		// 作物は括弧書き(品種・栽培条件。「ぶどう(デラウェア)[無核栽培](施設栽培)」の(…)[…])を除いた本体で比べる。
		// 登録ごとに作物名の書き方が違っても、同じ作物の計画として相手を探せるようにする
		crop: norm(row.cells[3]?.textContent).replace(/[(\[].*$/, ''),
		name: norm(row.cells[4]?.textContent),
		seibuns: (row.cells[11]?.innerHTML || '').split('<br>').map((x) => norm(x.trim().match(/\[(.*?)\]/)?.[1] || x.replace(/<[^>]*>/g, ''))).filter(Boolean),
		partners: coUsePartnersOf((row.cells[10]?.textContent || '') + ' ' + (row.cells[8]?.textContent || '')),
	}));
	const res = new Map();
	info.forEach((a) => {
		a.partners.forEach((pt) => {
			if (pt.untrackable) return;
			const found = info.some((b) => b !== a
				&& (!a.crop || !b.crop || a.crop === b.crop)
				&& (!a.timing || !b.timing || a.timing === b.timing)
				&& pt.alts.some((alt) => (alt.re && b.seibuns.some((x) => alt.re.test(x)))
					|| alt.keys.some((k) => { const kk = norm(k); return b.seibuns.includes(kk) || b.name === kk || b.name.startsWith(kk); })));
			const where = a.timing ? `同じ防除時期(${a.timing})` : '計画(防除時期が未設定のため計画全体)';
			const names = pt.alts.map((x) => x.keys[0]).join('」又は「');
			if (!res.has(a.row)) res.set(a.row, []);
			// 理由は相手の有無によらず作る(相手がある場合は OK、無い場合は要確認)
			if (found) { res.get(a.row).push({ level: 'OK', text: `併用前提: 「${names}」と同時に使う登録(${where}にあり)` }); return; }
			// 相手が計画に無い: 利用者が「計画外の相手と同時に使う/単体で使う」を選んでいれば、その答えで判定する
			const question = {
				kind: 'co', key: 'co\u0001' + pt.text, ref: a.row, rows: [a.row], tsusho: a.row.cells[4]?.textContent.trim() || '',
				title: `「${names}」と同時に使う登録ですが、${where}に該当する薬剤がありません。どのように使いますか`,
				options: [{ value: 'yes', label: `計画に無い「${names}」と同時に使う` }, { value: 'no', label: '単体で使う(登録の使い方ではない)' }],
			};
			const c = typeof resolveUsageChoice === 'function' ? resolveUsageChoice(question) : undefined;
			if (c === 'yes') { question.answer = c; res.get(a.row).push({ level: 'OK', text: `併用前提: 「${names}」と同時に使う登録(計画外の薬剤と同時に使う: 選択)`, question }); }
			else if (c === 'no') { question.answer = c; res.get(a.row).push({ level: 'NG', text: `併用前提: 「${names}」と同時に使う登録を単体で使用(選択)`, question }); }
			else res.get(a.row).push({ level: '要確認', text: `併用前提: 「${names}」と同時に使う登録ですが、${where}に該当する薬剤がありません`, question });
		});
	});
	return res;
}

// 農薬名(通称名)に含まれる有効成分の含有率(%)を引く。「2%粒剤は1回以内、1%粒剤は…」のように含有率で使用回数の枠を分けた
// 規定を持つ成分を判定するときだけ UsageLimit から呼ばれる。初めて問い合わせのあった成分について、その成分を含む全製剤の
// 「通称名 → 含有率」の表をデータベース(m_kihon・seibun の nodo)から作り、以後はその表を使う(成分ごとに1回だけ検索)
const contentPctCache = new Map();   // 成分名 → Map(通称名 → 含有率 | null)
function contentPctOf(tsusho, seibun) {
	const s = String(seibun || '').trim();
	const t = String(tsusho || '').trim();
	if (!s || !t) return null;
	if (!contentPctCache.has(s)) {
		if (typeof db === 'undefined' || !db) return null;   // データベース未読込: 不明として扱う(読込後の再判定で引く)
		const table = new Map();
		try {
			const q = s.replace(/'/g, "''");
			// kihon ビュー(init_create_view.sql)を使う。有効成分名(seibun)が無い成分(フェロモン剤・展着剤など。計画では一般名)もあるので一般名でも引く
			const res = db.exec(`select distinct tsusho, nodo from kihon where seibun = '${q}' or ippanmei = '${q}'`);
			(res[0]?.values || []).forEach(([name, nodo]) => {
				const m = String(nodo || '').match(/([\d.]+)\s*%/);
				if (!name || !m) return;
				const v = Number(m[1]);
				// 同じ通称名で含有率の違う登録があれば、どちらか決められないので不明(null)にする
				table.set(name, table.has(name) && table.get(name) !== v ? null : v);
			});
		} catch (e) {
			if (typeof debug !== 'undefined' && debug) console.warn('含有率の取得に失敗しました:', s, e);
			return null;   // 取得に失敗したときはキャッシュしない(次回もう一度試す)
		}
		contentPctCache.set(s, table);
	}
	const v = contentPctCache.get(s).get(t);
	return typeof v === 'number' ? v : null;
}

// 薬剤名(通称名)から剤型(zaikei)を引く。剤型別の回数規定の判定に使う
// 結果は薬剤名ごとにキャッシュする。未取得の間は空文字を返して薬剤名からの推定に任せ、取得できたら判定表を更新する
const zaikeiCache = new Map();
function zaikeiOf(tsusho) {
	const key = String(tsusho || '').trim();
	if (!key) return '';
	if (zaikeiCache.has(key)) return zaikeiCache.get(key);
	if (typeof db === 'undefined' || !db) return '';            // データベース未読込: 読込後の再判定で取得する
	let z = '';
	try {
		const res = db.exec(`select distinct zaikei from m_kihon where tsusho = '${key.replace(/'/g, "''")}'`)   // 剤型の元のテーブル(tv_tsushoTekiyo の zaikei も m_kihon から);
		const vals = (res[0]?.values || []).map(v => v[0]).filter(Boolean);
		if (vals.length === 1) z = String(vals[0]);              // 複数あるときは決められないので空にする
	} catch (e) {
		if (typeof debug !== 'undefined' && debug) console.warn('剤型の取得に失敗しました:', key, e);
	}
	zaikeiCache.set(key, z);
	return z;
}

// 使用回数(成分回数・薬剤の使用回数)の総量の上限を読む。
// 「2回、但し降雨等により再処理を行う場合は合計4回以内」のように、条件付きで上限が広がる規定は
//   base(通常の上限)=2、max(条件を満たす場合の上限)=4、cond='降雨等により再処理を行う場合' とする。条件の無い規定は max = base
// 判定: 回数 > max → NG、base < 回数 ≦ max → 要確認(条件を満たすかは計画では分からない)、回数 ≦ base → OK
function parseKaisuLimit(text) {
	const s = String(text || '').normalize('NFKC');
	const base = parseInt(s.match(/^\s*(\d+)/)?.[1] || '0', 10);
	const m = s.match(/但し(.+?場合)は(?:合計)?(\d+)回(?:以内)?/);
	if (base > 0 && m && !s.includes('(')) return { base, max: Math.max(base, Number(m[2])), cond: m[1].trim() };
	return { base, max: base, cond: '' };
}
// ============================================================ 要確認の選択(その場限り)
// 要確認の原因(内訳枠を確定できない使用行、条件付きの上限、併用前提の相手が計画に無い登録など)について、利用者がダイアログで
// 該当する内容を選ぶと、その答えで判定をやり直す。選択はこの画面の中だけで持ち、防除計画(.json)には保存しない
// (再読込で消える。行の内容や使用回数が変わった問いは別の問いとして扱うので、古い選択は使われない)
const usageChoices = new Map();   // 選択のキー → 選んだ value
const usageRowUid = new WeakMap();   // 防除計画の行(tr) → この画面の中だけの通し番号
let usageRowUidSeq = 0;
// 行の識別: 通し番号と、判定に関わる列(防除時期・作物・薬剤・使用時期・使用回数・希釈倍数・方法・有効成分・成分回数)の内容
function usageRowSig(row) {
	if (!row || !row.cells) return '';
	if (!usageRowUid.has(row)) usageRowUid.set(row, ++usageRowUidSeq);
	return usageRowUid.get(row) + '\u0002' + [2, 3, 4, 6, 7, 8, 10, 11, 12].map(i => (row.cells[i]?.textContent || '').trim()).join('\u0002');
}
// 問いの選択のキー: 行の問いは行の識別 + 問いのキー、行をまたぐ問い(総量の条件など)は関わる全行の識別 + 問いのキー
function usageChoiceKey(q) {
	const rows = q.ref ? [q.ref] : (q.rows || []);
	return rows.map(usageRowSig).join('\u0003') + '\u0004' + q.key;
}
// 判定から呼ばれる: 問い q に利用者の選択があればその value、無ければ undefined
function resolveUsageChoice(q) {
	q.choiceKey = usageChoiceKey(q);
	return usageChoices.get(q.choiceKey);
}

/**
 * 総量の判定。戻り値 { status: 'OK'|'要確認'|'NG'|'', text: 理由, question }。上限なし(base=0)は status も text も ''。
 * 理由(text)は判定とは別に、判定結果によらず同じ書式の事実(回数と上限)として常に作る(OK のときも作る)
 * ctx({ key, rows, subject, seibun, tsusho })を渡すと、条件付きの上限(「但し降雨等により再処理を行う場合は合計4回以内」)で要確認のとき、
 * 条件に当たるかの問い(question)を作り、利用者の選択があればその答えで判定する(当たる → 条件の上限、当たらない → 通常の上限)
 */
function judgeKaisuTotal(count, text, label, ctx) {
	const L = parseKaisuLimit(text);
	if (!(L.base > 0)) return { status: '', text: '' };
	// 理由の文言: 「(label)は(規定の文言): 使用回数N回」(「総使用回数は4回以内: 使用回数5回」「本剤の使用回数は1回、但し降雨等…合計2回以内: 使用回数2回」)
	const words = String(text || '').normalize('NFKC').replace(/\(.*$/, '').replace(/\s+/g, '').trim();
	let fact = `${label}は${words}: 使用回数${count}回`;
	let status = count > L.max ? 'NG' : count > L.base ? '要確認' : 'OK';
	let question = null;
	if (ctx && status === '要確認' && L.cond) {
		question = {
			kind: 'cond', key: ctx.key, ref: null, rows: ctx.rows || [], seibun: ctx.seibun, tsusho: ctx.tsusho,
			title: `${ctx.subject ? ctx.subject + ': ' : ''}${label}が${count}回で、通常の上限${L.base}回を超えています。「${L.cond}」に当たりますか`,
			options: [{ value: 'yes', label: `当たる(上限${L.max}回で判定)` }, { value: 'no', label: `当たらない(上限${L.base}回で判定)` }],
		};
		const c = resolveUsageChoice(question);
		if (c === 'yes') { question.answer = c; status = 'OK'; fact += `(${L.cond}に当たる: 選択)`; }
		else if (c === 'no') { question.answer = c; status = 'NG'; fact += `(${L.cond}に当たらない: 選択)`; }
	}
	return { status, text: fact, question };
}

// 計画表から成分ごとの使用状況を集める(成分別・薬剤別の両方の表で共通に使う)
// 戻り値: Map(成分名 -> { count, seibunkaisu(先頭の数字が最大の規定文), mid, limit, uses[] })
// uses の各要素は 1行 = 1回の使用で、ref にその計画表の行(tr)を持つ
function collectSeibunData(planTableBody) {
	const seibunData = new Map();
	Array.from(planTableBody.rows).filter(row => !row.hasAttribute('hidden')).forEach(row => {
		const seibunCell = row.cells[11];
		const seibunkaisuCell = row.cells[12];
		const midCell = row.cells[13];

		if (seibunCell && seibunkaisuCell && midCell) {
			const seibuns = seibunCell.innerHTML.split('<br>').map(s => s.trim().match(/\[(.*?)\]/)?.[1] || s.trim()).filter(Boolean);
			const seibunkaisus = seibunkaisuCell.innerHTML.split('<br>').map(s => s.trim());
			const mids = midCell.innerHTML.split('<br>').map(s => s.trim());
			// 内訳判定に使う、この行の情報(1行 = 1回の使用)
			const use = {
				ref: row,
				no: row.cells[1]?.textContent.trim() || '',
				sakumotsu: row.cells[3]?.textContent.trim() || '',
				yakuzai: row.cells[4]?.textContent.trim() || '',
				zaikei: zaikeiOf(row.cells[4]?.textContent),
				jiki: row.cells[6]?.textContent.trim() || '',
				hoho: row.cells[10]?.textContent.trim() || '',
				ekiryo: row.cells[9]?.textContent.trim() || '',
				baisu: row.cells[8]?.textContent.trim() || '',    // 希釈倍数(「500倍希釈灌注は1回以内」などの照合用)
				byochu: row.cells[5]?.textContent.trim() || '',   // 病害虫名・使用目的(「茎葉枯凋は1回以内」「除草剤としては3回以内」などの照合用)
				stage: currentRowStages.get(row)?.stage,          // 段階別使用回数の登録の行の段階(苗床・本圃・決まらない)。それ以外の行は undefined
				eventDates: currentRowEvents.get(row)             // 生育ステージの出来事(開花・出穂など)に対する防除時期の前後。無ければ undefined
			};

			seibuns.forEach((seibun, index) => {
				const kaisuText = seibunkaisus[index] || '';
				const currentData = seibunData.get(seibun) || { count: 0, seibunkaisu: '', mid: '', limit: -1, uses: [] };
				currentData.count += 1;
				// RAC 列(コード/系統/FRAC系統名など/耐性リスク)は、情報のいちばん多い行のものを使う(耐性リスクを落とさないため。RAC別使用回数の表示用)
				const midText = mids[index] || '';
				if (currentData.count === 1 || midText.split('/').filter(x => x.trim()).length > currentData.mid.split('/').filter(x => x.trim()).length) currentData.mid = midText;
				const newLimit = parseInt(kaisuText.match(/^\d+/)?.[0] || '0', 10);
				if (newLimit > currentData.limit) {
					currentData.seibunkaisu = kaisuText;
					currentData.limit = newLimit;
				}
				currentData.uses.push({ ...use, seibunkaisu: kaisuText });
				seibunData.set(seibun, currentData);
			});
		}
	});
	return seibunData;
}

// 成分の総使用回数の条件付き上限の問いの文脈(成分別・薬剤別の両方の表で同じキーにして、同じ選択を使う)
function seibunTotalCtx(seibun, data) {
	return { key: 'total\u0001' + seibun + '\u0001' + data.seibunkaisu + '\u0001' + data.count, rows: data.uses.map(u => u.ref), seibun, subject: seibun };
}
// 判定のセルに出す「要確認の内容を選択」のボタン。問いが無ければ出さない
function usageResolveButtonHtml(qs, attrName, value) {
	if (!qs || !qs.length) return '';
	const open = qs.filter(q => q.answer === undefined).length;
	const done = qs.length - open;
	const label = open ? `内容を選択(未選択${open}件${done ? `・選択済み${done}件` : ''})` : `選択を変更(選択済み${done}件)`;
	return `<br><button type="button" class="ur-open${open ? '' : ' ur-done'}" ${attrName}="${escapeHtml(value)}" title="要確認になった項目が、確認対象のどの内容に当たるかを選んで再計算します(保存はされません)">${label}</button>`;
}

// RAC別使用回数の表(#seibunCountTable)を作る関数。判定はしない(成分の使用回数の判定は薬剤別使用回数の表で行う)。
// 防除計画の RAC 欄(「F:11/メトキシアクリレート/QoI殺菌剤(Qo阻害剤)/高(…)」「I:1(B)/有機リン系」)を、RAC・系統・有効成分の3段でまとめる。列:
//   RAC / RAC回数 / 系統 / 系統回数 / 有効成分 / 成分回数 / 薬剤名(その成分を含む通称と回数)
//   RAC     : RAC コード。英字が括弧付きのコード(IRAC の 1(A)・1(B) など)は、数字が同じものを連用しない決まりなので数字で1つにまとめる(「I:1」)。
//             括弧の無い英字付きのコード(4A・25B など)は、英字が違えば連用できるのでコードのまま(「I:4A」)
//   RAC回数 : そのコードの成分を含む防除計画の行の数(同じコードの成分を2つ含む1回の散布も1回)。下に FRAC グループ名・耐性リスクなど
//             (RAC 欄の3番目以降)を添える
//   系統    : RAC 欄の2番目(系統名)。括弧付きの英字のコードは系統記号を頭に付ける(「1(A): 有機リン系」)。系統回数は、その系統の成分を含む行の数
//   成分回数: その成分を含む行の数。表の末尾に成分回数の合計(成分使用回数の合計。ラジオボタンの選択(全カウント・有機JAS非カウント・有機JAS・特栽可能性非カウント)で数えない成分だけを除く)を出す
//   RAC 欄が空の成分は RAC 欄を「-」にまとめ、系統欄に区分(フェロモン剤・植調剤・製剤の用途)を出す。展着剤は表に入れない。同じ RAC コードでも系統名の違う成分(F:11 のアゾキシストロビンとピリベンカルブ)は別の系統になる
// どの項目(RAC・系統・有効成分・薬剤名とその回数)をクリックしても、その項目に当たる防除計画の行の薬剤名と、薬剤別使用回数の表の薬剤名を
// 警告色Bにする(光っている所をクリックすると、すべて消灯)
// ============================================================ 有機JAS・特栽の区分(成分回数の合計に数えない成分)
// kihon ビュー(init_create_view.sql)の ojas は、薬剤の種類・系統・成分ごとに ojas_shurui / ojas_keito / ojas_seibun(spec)を
// つないだ文字列。「○」「○…に限る」= 有機JAS で使用できる成分(条件付きを含む)、「特栽(認証団体によって取扱いが異なる)」=
// 特栽で数えない可能性がある成分。
// 製剤としての評価: tv_tsushoTekiyo の seizaiojas(t_tokusai。全成分に ojas がある製剤だけ値があり、エコピタ液剤は特栽)も併せて見て、
//   成分の区分と製剤の区分の低いほう(有機JAS > 特栽可能性 > なし)を、その薬剤でのその成分の区分にする。
//   成分に ojas が無い(名前で引けない)ときは、製剤の区分をそのまま使う(全成分が対象の製剤なので、全成分に同じ区分が付く)。
//   ・有機JAS非カウント: 製剤が有機JAS(seizaiojas が「○…」)で、成分も有機JAS のときだけ数えない
//     (エコピタ液剤の還元澱粉糖化物、有機JAS の成分と特栽の成分の混合剤、対象外の成分を含む混合剤の有機JAS の成分は数える)
//   ・有機JAS・特栽可能性非カウント: 製剤が有機JAS か特栽可能性(全成分が対象)のときだけ数えない
//   製剤の区分が読めないとき(DB の読み込みの失敗など)は数える(厳しいほうに倒す)。
// 判定には使わず、RAC別使用回数の表の成分回数・合計の数え方だけに使う。

/** 成分回数の合計に数えない成分の選択: 'all'(全カウント) / 'jas'(有機JAS非カウント) / 'jas_tokusai'(有機JAS・特栽可能性非カウント) */
function getOjasCountMode() {
	return document.querySelector('input[name="ojasCount"]:checked')?.value || 'all';
}
/** 選択を入力欄に入れる(ファイルの読み込み時)。不明な値・項目なしは全カウント */
function setOjasCountMode(mode) {
	const v = ['all', 'jas', 'jas_tokusai'].includes(mode) ? mode : 'all';
	document.querySelectorAll('input[name="ojasCount"]').forEach(r => { r.checked = (r.value === v); });
}
/** 選択が変わったとき: 計画の変更として扱い、表を作り直す */
function onOjasCountChange() {
	updateRowNumbers();
}

const ojasCache = new Map();       // 通称 → Map(成分名(ippanmei・seibun の両方) → ojas の文字列)。DB は変わらないので読み直さない
const ojasProdCache = new Map();   // 通称 → 製剤の ojas(tv_tsushoTekiyo の seizaiojas。無ければ '')
const spreaderCache = new Map();   // 通称 → 展着剤(農薬の種類が「…展着剤」)なら成分名の配列、展着剤でなければ null
const kihonInfoCache = new Map();  // 通称 → { yoto(製剤の用途), ingredients: [{ name(有効成分名、無ければ一般名), ippanmei, seibun, keito(系統) }] }
/**
 * 通称の一覧について、kihon ビューから成分の ojas と農薬の種類(展着剤か)、tv_tsushoTekiyo から製剤の seizaiojas を
 * 読み込んでおく(読み込み済みの通称は読まない)
 */
function loadOjas(tsushos) {
	const need = [...new Set(tsushos)].filter(t => t && !(ojasCache.has(t) && ojasProdCache.has(t) && spreaderCache.has(t) && kihonInfoCache.has(t)));
	if (!need.length || typeof db === 'undefined' || !db) return;
	try {
		const list = need.map(t => `'${String(t).replace(/'/g, "''")}'`).join(',');
		const res = db.exec(`select tsusho, shurui, ippanmei, seibun, ojas, seizaiyoto, keito from kihon where tsusho in (${list})`);
		const resProd = db.exec(`select tsusho, max(seizaiojas) from tv_tsushoTekiyo where tsusho in (${list}) group by tsusho`);
		need.forEach(t => { ojasCache.set(t, new Map()); ojasProdCache.set(t, ''); spreaderCache.set(t, null); kihonInfoCache.set(t, { yoto: '', ingredients: [] }); });
		(resProd[0]?.values || []).forEach(([t, oj]) => { if (oj) ojasProdCache.set(String(t), String(oj)); });
		(res[0]?.values || []).forEach(([t, shurui, ippanmei, seibun, ojas, yoto, keito]) => {
			// 製剤の用途と成分(RAC コードの無い成分の区分 noRacCategoryOf と、計画の有効成分欄が空の行の成分に使う)
			const ki = kihonInfoCache.get(t);
			if (ki) {
				if (yoto && !ki.yoto) ki.yoto = String(yoto);
				const name = String(seibun || ippanmei || '');
				if (name && !ki.ingredients.some(x => x.name === name)) ki.ingredients.push({ name, ippanmei: String(ippanmei || ''), seibun: String(seibun || ''), keito: String(keito || '') });
			}
			// 展着剤: 成分名(有効成分名が無いので一般名)を集める
			if (/展着剤$/.test(String(shurui || ''))) {
				const list = spreaderCache.get(t) || [];
				const name = String(seibun || ippanmei || '');
				if (name && !list.includes(name)) list.push(name);
				spreaderCache.set(t, list);
			}
			if (!ojas) return;
			const m = ojasCache.get(t);
			if (!m) return;
			if (ippanmei) m.set(String(ippanmei), String(ojas));
			if (seibun) m.set(String(seibun), String(ojas));
		});
	} catch (e) {
		need.forEach(t => { ojasCache.delete(t); ojasProdCache.delete(t); spreaderCache.delete(t); kihonInfoCache.delete(t); });   // 次の表の作り直しで読み直す
		console.error('有機JAS・特栽の区分(kihon.ojas・seizaiojas)の取得に失敗しました:', e);   // 失敗したときは区分なし(全部数える)のまま
	}
}
/** 薬剤(通称)の成分の ojas の文字列。無ければ ''。計画の有効成分名と kihon の名前が違うときは、片方がもう片方を含むものを使う */
function ojasOf(tsusho, seibun) {
	const m = ojasCache.get(tsusho);
	if (!m || !seibun) return '';
	let oj = m.get(seibun);
	if (oj === undefined) {
		const hit = [...m.keys()].find(k => k.includes(seibun) || seibun.includes(k));
		oj = hit ? m.get(hit) : '';
	}
	return oj || '';
}
/** 展着剤なら成分名の配列、展着剤でない(または読めない)なら null */
function spreaderOf(tsusho) {
	return spreaderCache.get(tsusho) || null;
}
/** 有機JAS で使用できない展着剤の成分(パラフィン・カゼイン以外)。展着剤でなければ [] */
const ORGANIC_SPREADER = /パラフィン|カゼイン/;
function spreaderNgSeibuns(tsusho) {
	return (spreaderOf(tsusho) || []).filter(n => !ORGANIC_SPREADER.test(n));
}
/**
 * RAC コードの無い成分の系統欄の区分。系統が性フェロモンなど → 'フェロモン剤'、植物成長調整剤・殺菌植調剤など → '植調剤'、
 * そのほかは製剤の用途(殺そ剤・その他など)。DB が読めないときは ''
 */
function noRacCategoryOf(tsusho, seibun) {
	const info = kihonInfoCache.get(tsusho);
	if (!info) return '';
	const ing = info.ingredients.find(i => i.name === seibun || i.ippanmei === seibun || i.seibun === seibun)
		|| info.ingredients.find(i => i.name && seibun && (i.name.includes(seibun) || seibun.includes(i.name)));
	if (/フェロモン/.test(ing?.keito || '')) return 'フェロモン剤';
	if (/植調|植物成長調整/.test(info.yoto)) return '植調剤';
	return info.yoto || '';
}
/** 製剤(通称)の seizaiojas。無ければ '' */
function ojasProdOf(tsusho) {
	return ojasProdCache.get(tsusho) || '';
}
/**
 * その薬剤でのその成分の区分(成分と製剤の低いほう。成分に ojas が無ければ製剤の区分)。戻り値 { cat: 'jas' | 'tokusai' | '', seibunOjas, prodOjas }
 *   製剤の区分は全成分が対象のときだけあるので、対象外の成分を含む混合剤の成分は '' になる
 */
function ojasUseOf(tsusho, seibun) {
	const seibunOjas = ojasOf(tsusho, seibun);
	const prodOjas = ojasProdOf(tsusho);
	const rank = { jas: 2, tokusai: 1, '': 0 };
	const a = ojasCategory(seibunOjas), b = ojasCategory(prodOjas);
	// 成分に ojas が無い(または計画の有効成分名と kihon の名前が合わない)ときは、製剤の seizaiojas をその成分の区分にする
	// (seizaiojas は全成分が対象の製剤だけにあるので、コンフューザ類など成分名で引けないものもここで拾える)
	if (!a) return { cat: b, seibunOjas, prodOjas };
	return { cat: rank[a] <= rank[b] ? a : b, seibunOjas, prodOjas };
}
/** ojas の文字列の区分: 'tokusai'(特栽可能性) / 'jas'(有機JAS) / ''(なし) */
function ojasCategory(oj) {
	return !oj ? '' : oj.includes('特栽') ? 'tokusai' : oj.includes('○') ? 'jas' : '';
}
/** その区分を、選択(mode)で合計に数えないか */
function ojasExcluded(cat, mode) {
	return (mode === 'jas' && cat === 'jas') || (mode === 'jas_tokusai' && (cat === 'jas' || cat === 'tokusai'));
}

// RAC コードの FRAC系統名など(rac_sg.fgroup。系統ごと)と耐性リスク(rac_mg.risk。コードごと。FRAC の耐性管理ガイドラインの有無を含む)。
// 計画の行の RAC 列(保存したときの内容)に入っていなくても出せるように、DB(spec)から引く。読めないときは計画の行の内容を使う
let racRiskCache = null;   // { fgroup: Map(コード\u0001系統 → fgroup), fgroupByCode: Map(コード → Set(fgroup)), risk: Map(コード → risk) }
function racRiskInfoOf(code, keito) {
