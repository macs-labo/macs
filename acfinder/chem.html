<script>
// Declare chemListManager globally
var chemListManager;

// 薬剤候補リスト作成 optGroup 版
async function setYakuzaiList(sql = '') {
	// 薬剤リスト作成
	await waiting(true, '薬剤リストを取得中...');

	try {
		if (!sql) {
			sql = `
				drop table if exists t_chemTekiyo;
				create temp table t_chemTekiyo as select * from tv_meishoTekiyo;
			`;
		}
		sql += `
			with t_kihon as (select distinct bango, meisho, tsusho from t_chemTekiyo)
			select distinct tsusho, bango, meisho, kws from t_kihon left join tsushoruby using(tsusho) left join kwlists using(bango) order by ruby;
		`;
		console.log('薬剤リスト作成: ', sql);
		const sqlResult = db.exec(sql);

		let chemsData = [];
		// Check if sqlResult has data
		if (sqlResult && sqlResult[0] && sqlResult[0].values && sqlResult[0].values.length > 0) {
			chemsData = sqlResult[0].values.map(row => ({
				tsusho: row[0],
				bango: row[1],
				meisho: row[2],
				keywords: row[3] // kws_val
			}));
		}

		// Custom renderer for ChemListManager to display bango and meisho
		let group = '';
		const renderer = (row) => {
			const tsusho = row.tsusho;
			const info = `${tsusho}|${row.keywords}`;
			let groupItem = '';
			if (group !== tsusho) {
				group = tsusho;
				groupItem = `
					<div class="checkListItem" data-group data-info="${tsusho}|${info}" title="${tsusho}"><em>${tsusho}</em></div>
				`;
			}
			const bango = row.bango;
			const name = `${bango} ${row.meisho}`;
			return `${groupItem}
				<div class="checkListItem" data-info="${bango}|${tsusho}|${info}" title="${name}">
					<input type="radio" name="chemSelect" value="${name}" id="${bango}"><label for="${bango}">${name}</label>
				</div>
			`;
		};
		await chemListManager.update(chemsData, renderer);

		// #selectYakuzai を表示
		const selectYakuzai = document.getElementById("selectYakuzai");
		selectYakuzai.classList.remove("hidden");
	} catch(e) {
		console.error('薬剤リストの取得に失敗しました:', e);
	} finally {
		await waiting(false);
	}
}

// Function to return bango on selectBox selection (change event)
// This will be called by ChemListManager's onChangeCallback
function handleYakuzaiSelection(selected) {
	if (!selected) return;
	console.log('選択薬剤: ', selected);
	const [bango, meisho] = selected.split(' ');

	// Find the selected chemical data from chemListManager's internal list
	//const selectedChem = chemListManager.chems.find(chem => chem.bango === bango);
	//const meisho = selectedChem ? selectedChem.meisho : '';

	const display = document.getElementById("selectedValue");
	const crops = checkedCrops.length === 0 ? '' : ' ／ ' + checkedCrops.map(item => item.sakumotsu).join(searchMethod === ' or ' ? ' | ' : ' & ');
	const sakumotsu = checkedCrops.length === 0 ? '' : `「${checkedCrops.map(item => item.sakumotsu).join('」「')}」及びその上位作物群に対する`;

	if (bango) {
		display.textContent = `${bango} ${meisho}${crops}`;
		display.classList.remove("hidden");
		// caption と sql 設定
		const sqls = [
			{ caption: '剤の概要', query: `
					SELECT bango,shurui,dokusei AS seizaidokusei,torokubi,ryakusho,zaikei,yoto AS seizaiyoto, ojas AS seizaiojas
					FROM m_kihon AS a LEFT JOIN seizai USING(bango) LEFT JOIN t_tokusai USING(bango) WHERE bango = '${bango}'
			`},
			{ caption: '', query: `
				SELECT chuijiko from suisan WHERE bango = '${bango}'
			`},
			{ caption: '有効成分一覧', query: `
				SELECT
					ippanmei, seibun, iso, nodo, dokusei, jogai, yoto, koka, keito,
					mid, rackeito, sayoten, sayokiko, fgroup, risk, ojas
				FROM kihon WHERE bango = '${bango}'
			`},
			{ caption: `「${bango} ${meisho}」の${sakumotsu}適用`, query: `
				select * from t_chemTekiyo where bango = '${bango}'
			`}
		];
		executeSQLsetGrid(sqls);

	} else {
		display.textContent = "";
		tables = resetTables(tables); // Clear tables if no chemical is selected
	}
}

let searchMethod = ' and ';

async function searchCrop() {
	tables = resetTables(tables);
	searchMethod = _defaultCropTreeManager.searchMethod;
	const title = document.querySelector('#selectedValue');
	if (checkedCrops.length === 0) {
		title.innerHTML = '';
		title.classList.add('hidden');
		console.log('作物選択解除時の薬剤リスト');
		await setYakuzaiList(); // Reset to full list if no crops selected
		return;
	}

	const crops = checkedCrops.map(item => item.sakumotsu); // checkedCrops から作物だけの配列を取り出し
	title.innerHTML = crops.join(searchMethod === ' or ' ? ' | ' : ' & ');
	title.classList.remove('hidden');

	const expandCropFlags = crops.map(crop => `(${expandCrops(crop)}) as ${normalizeColName(crop)}`).join(',');
	const cropFlags = crops.map(crop => `max(${normalizeColName(crop)}) as ${normalizeColName(crop)}`).join(',');
	const dropCols = crops.map(crop => `alter table t_chemTekiyo drop column ${normalizeColName(crop)}`).join(';\n');
	const sql = `
		drop table if exists t_chemTekiyo;
		create temp table t_chemTekiyo as
		with t_sakumotsu as (select sakumotsu, ${expandCropFlags} from m_sakumotsu left join sakuhojo using(idsaku))
		select * from tv_meishoTekiyo left join t_sakumotsu using(sakumotsu) where sakumotsu in (${makeCropCondition(crops)});
		delete from t_chemTekiyo where bango not in (
			with t_bango1 as (select bango, ${cropFlags} from t_chemTekiyo group by bango)
			select bango from t_bango1 where ${normalizeColName(crops.join(searchMethod))}
		);
		${dropCols};
	`;
	console.log('作物選択時の薬剤リスト', sql);
	await setYakuzaiList(sql);
}

// sql 実行 結果グリッド作成
async function executeSQLsetGrid(sqls) {
	// テーブルインスタンスをクリア
	tables = resetTables(tables);

	// クエリを逐次実行
	for (const [index, sql] of sqls.entries()) {
		await waiting(true, `クエリ ${index + 1} 実行中`);
		try {
			let searchTime = -performance.now();
			let result = db.exec(sql.query);
			searchTime += performance.now();

			if (!result || result.length === 0) continue;

			// 結果を表示
			let option = { caption: sql.caption };
			if (sql.caption.endsWith('適用')) option.hideFooterU20 = false;
			const columns = result[0].columns;
			if (columns.length == 1 && columns[0] == 'chuijiko') {
				const value = result[0].values[0][0];
				result[0].values[0][0] = value.replaceAll(/#/g, "\n");
			}
			const table = outputTable('#result', result, option);
			if (table) tables.push(table);
		} catch (error) {
			console.error(`クエリ${index + 1} エラー: ${error.message}`);
		}
	}
	await waiting(false);
}

// DOM読込完了時の初期設定
window.addEventListener('DOMContentLoaded', async function() {
	//データベース読込
	if (db === null) await fetchDB();
	
	// ChemListManager の初期化
	chemListManager = new ChemListManager('#selectYakuzai', (selected) => {
		handleYakuzaiSelection(selected);
	});
	chemListManager.init({ title: '薬剤選択', showCategory: true, autoSelect: true });

	// 作物ツリーの生成とイベントハンドラ設定
	const sql = `
		select idsaku, class, toroku, sakumotsu, shukakubui, betsumei, 
		':'||replace(n_concat('、', strconv(sakumotsu, 'k'), strconv(betsumei, 'k'), ruby), '、', ':')||':' as keywords
		from m_sakumotsu where sakumotsu not like '%除く%';
	`;
	await makeCropTree('#cropTree', sql, searchCrop, { showSearchMethod: true });

	// 作物ツリー開閉トグラーイベントハンドラ設定
	const condToggler = document.getElementById('condToggler');
	condToggler.textContent = '▲▼';
	condToggler.title = '作物ツリーを開閉';
	condToggler.addEventListener('click', () => {
		const hSplitter = document.getElementById('h-splitter');
		const cropTree = document.getElementById('cropTree');
		condToggler.classList.toggle('closed');
		cropTree.classList.toggle('closed');
		hSplitter.classList.toggle('closed');
	});

	// firefox のリロード時 checkbox 状態復元対策
	clearAllReset();

	// 薬剤リストを作成
	console.log('起動時の薬剤リスト');
	await setYakuzaiList();

	// URLパラメータから crops を取得して選択作物を設定
	const urlParams = new URLSearchParams(window.location.search);
	const crops = urlParams.get('crops');
	if (crops && typeof _defaultCropTreeManager.syncCheckState === 'function') {
		_defaultCropTreeManager.syncCheckState(crops);
		await searchCrop();
	} else {
		// crops パラメータがない場合、chemCropTreeInitState === 1' なら condTggler.click イベント発火
		const cropTreeState = localStorage.getItem('chemCropTreeInitState') || '0';
		if (cropTreeState === '1') {
			condToggler.click();
			chemListManager.filterInput.focus();
		}
	}

	// URLパラメータからkeywordを取得して自動検索
	const keyword = urlParams.get('keyword');
	if (keyword) {
		if (chemListManager.filterInput) {
			chemListManager.filterInput.value = keyword.replaceAll(',', ' ');
			await chemListManager._handleFilter(); // Manually trigger filter
		}
	}
});
</script>
