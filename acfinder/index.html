(function() {
	// 当面、公開ディレクトリの場合は強制的にデスクトップ版にリダイレクト
	if (window.location.href.includes('/acfinder/')) {
		window.location.href = 'crop.html';
	}
	// ディスプレイの論理幅が 1280px 以上ならデスクトップ版にリダイレクト
	const isDesktopSize = window.screen.width >= 1280;
	if (isDesktopSize) {
		// URLパラメータでデバッグ用に回避できるようにしておく
		const urlParams = new URLSearchParams(window.location.search);
		if (urlParams.get('mode') !== 'mobile') {
			window.location.href = 'crop.html';
		}
	}
})();

<script>
// --- 共通の簡易スワイプ検知関数 ---

function addSwipeHandler(element, swiper, loop = true) {
	let touchStartX = 0;
	let touchEndX = 0;

	element.addEventListener('touchstart', (e) => {
		touchStartX = e.changedTouches[0].screenX;
	}, { passive: true });

	element.addEventListener('touchend', (e) => {
		// 自身、または現在表示中のスライド内にある Swiper がズーム中ならスワイプを無視
		const isZooming = (s) => s && s.zoom && s.zoom.scale > 1 && !s.isReturningToSingleScale;

		if (isZooming(swiper)) return;

		// mainSwiper の場合、中にある cropSwiper 等のズーム状態もチェック
		const activeSlide = swiper.slides[swiper.activeIndex];
		if (activeSlide) {
			const nestedSwiperEl = activeSlide.querySelector('.swiper-initialized');
			if (nestedSwiperEl && nestedSwiperEl.swiper && isZooming(nestedSwiperEl.swiper)) return;
		}

		touchEndX = e.changedTouches[0].screenX;
		const threshold = 40; // Minimum distance for a swipe to be recognized
		
		// 左フリック（指を左へ動かす） -> 次のスライドへ（右端なら左端へ）
		if (touchEndX < touchStartX - threshold) {
			if (loop && swiper.activeIndex === swiper.slides.length - 1) {
				swiper.slideTo(0);
			} else if (swiper.activeIndex < swiper.slides.length - 1) {
				// 解放済みのステップ（インスタンス保持）を超えてのスワイプを禁止
				if (!loop && swiper.maxReachedStep !== undefined && swiper.activeIndex >= swiper.maxReachedStep) return;
				swiper.slideTo(swiper.activeIndex + 1);
			}
		}
		// 右フリック（指を右へ動かす） -> 前のスライドへ（左端なら右端へ）
		if (touchEndX > touchStartX + threshold) {
			if (loop && swiper.activeIndex === 0) {
				swiper.slideTo(swiper.slides.length - 1);
			} else if (swiper.activeIndex > 0) {
				swiper.slideTo(swiper.activeIndex - 1);
			}
		}
	}, { passive: true });
}

// --- UI更新ロジック ---

// メインタブの更新（インジケータ連動）
function updateMainTabs(index) {
	const btns = document.querySelectorAll('.main-btn');
	btns.forEach((btn, i) => {
		if (i === index) {
			btn.classList.add('active');
		} else {
			btn.classList.remove('active');
		}
	});
}

// ステップバーの更新
function updateStepBar(index, maxStep = 0) {
	// 現在アクティブなメインタブ（スライド）内にあるステップ項目のみを対象にする
	const activeMainSlide = document.querySelector('.main-swiper > .swiper-wrapper > .swiper-slide-active');
	if (!activeMainSlide) return;

	const items = activeMainSlide.querySelectorAll('.step-item');
	items.forEach((item, i) => {
		item.classList.remove('active', 'completed', 'locked'); // 既存のクラスを全て削除
		if (i === index) {
			item.classList.add('active');
		} else if (i < index) {
			item.classList.add('completed');
		}
		
		if (maxStep !== undefined && i > maxStep) {
			item.classList.add('locked');
		}
	});
}

// ズーム操作の適用
function applyZoom(scale) {
	const newZoom = Math.max(0.5, Math.min(2.0, Math.round(scale * 20) / 20));
	document.documentElement.style.setProperty('--app-zoom', newZoom);
	localStorage.setItem('appZoom', newZoom);
	const zoomLevelEl = document.querySelector('#main-menu-dialog #zoom-level');
	if (zoomLevelEl) zoomLevelEl.textContent = `${Math.round(newZoom * 100)}%`;
}

// 他のタブでのズーム変更を検知して反映
window.addEventListener('storage', (event) => {
	if (event.key === 'appZoom') applyZoom(parseFloat(event.newValue) || 1.0);
});

// ズーム可能なSwiperインスタンスを作成するヘルパー関数
function createZoomableSwiper(selector, mainSwiperInstance, slideChangeCallback = null) {
	const swiperInstance = new Swiper(selector, {
		observer: true,
		observeParents: true,
		nested: true,
		allowTouchMove: true,
		allowSlideNext: true,
		allowSlidePrev: true,
		noSwiping: true,
		noSwipingClass: 'swiper-slide',
		zoom: {
			maxRatio: 3,
			minRatio: 1, // 縮小時、appZoom の倍率で止まるように設定
			toggle: false,
		},
		speed: 300,
		on: {
			zoomChange: function(swiper, scale) {
				// ズーム中のみスワイプによるステップ遷移（内側）とタブ遷移（外側）を禁止
				const isZoomed = scale > 1;
				swiper.allowSlideNext = !isZoomed;
				swiper.allowSlidePrev = !isZoomed;
				swiper.params.noSwiping = !isZoomed;

				// 親である mainSwiper もロックする
				if (mainSwiperInstance) {
					mainSwiperInstance.allowSlideNext = !isZoomed;
					mainSwiperInstance.allowSlidePrev = !isZoomed;
					mainSwiperInstance.allowTouchMove = !isZoomed;
				}
			},
			'zoom.onGestureEnd': function(swiper, event) {
				const scale = swiper.zoom.scale;

				if (scale > 1 && scale < 1.1) {
					swiper.zoom.out();
					swiper.isReturningToSingleScale = true;
					swiper.allowSlideNext = true;
					swiper.allowSlidePrev = true;
					swiper.params.noSwiping = true;
					if (mainSwiperInstance) {
						mainSwiperInstance.allowSlideNext = true;
						mainSwiperInstance.allowSlidePrev = true;
						mainSwiperInstance.allowTouchMove = true;
					}
					setTimeout(() => {
						swiper.isReturningToSingleScale = false;
						swiper.update();
					}, 300);
				} else {
					const isZoomed = scale > 1;
					swiper.allowSlideNext = !isZoomed;
					swiper.allowSlidePrev = !isZoomed;
					swiper.params.noSwiping = !isZoomed;
					if (mainSwiperInstance) {
						mainSwiperInstance.allowSlideNext = !isZoomed;
						mainSwiperInstance.allowSlidePrev = !isZoomed;
						mainSwiperInstance.allowTouchMove = !isZoomed;
					}
					if (!isZoomed) swiper.update();
				}
			},
			slideChange: function() {
				// 未開放ステップへのスワイプを制限
				if (this.maxReachedStep !== undefined && this.activeIndex > this.maxReachedStep) {
					this.slideTo(this.maxReachedStep);
					return;
				}
				if (slideChangeCallback) {
					slideChangeCallback.call(this); // Swiperインスタンスのコンテキストでコールバックを呼び出す
				}
			}
		}
	});

	swiperInstance.maxReachedStep = 0; // 最大到達ステップを 0 で初期化
	return swiperInstance;
}

		noSwipingClass: 'swiper-slide',
		speed: 300,
		on: {
			slideChange: function() {
				updateMainTabs(this.activeIndex);
			},
		}
	});

	// 2. 作物タブのSwiper
	const cropSwiper = createZoomableSwiper('.crop-swiper', mainSwiper, function() {
		// slideChangeCallback: cropSwiper の slideChange イベントでステップバーを更新
		updateStepBar(this.activeIndex, this.maxReachedStep);
	});

	// 3. 病害虫タブのSwiper
	const pestSwiper = createZoomableSwiper('.pest-swiper', mainSwiper, function() {
		updateStepBar(this.activeIndex, this.maxReachedStep);
	});

	// 4. 薬剤タブのSwiper
	const chemSwiper = createZoomableSwiper('.chem-swiper', mainSwiper, function() {
		updateStepBar(this.activeIndex, this.maxReachedStep);
	});

	// クリック時のジャンプ
	mainJump = function(index) {
		mainSwiper.slideTo(index);
	};

	// ステップのジャンプ
	stepJump = function(index) {
		// 現在のメインタブにある「中身（内側）のSwiper」を動的に取得する
		const activeMainSlide = mainSwiper.slides[mainSwiper.activeIndex];
		const nestedSwiperEl = activeMainSlide.querySelector('.swiper-initialized');

		if (nestedSwiperEl && nestedSwiperEl.swiper) {
			const targetSwiper = nestedSwiperEl.swiper;
			// 解放済みのステップ（maxReachedStep以下）であれば遷移を許可
			if (index <= targetSwiper.maxReachedStep) {
				targetSwiper.slideTo(index);
			}
		}
	};

	// タブバーのスワイプ
	addSwipeHandler(document.querySelector('.main-nav'), mainSwiper, true);

	// ステップバーのスワイプ (各タブのSwiperに対して個別に設定)
	[
		{ el: '.crop-swiper', instance: cropSwiper },
		{ el: '.pest-swiper', instance: pestSwiper },
		{ el: '.chem-swiper', instance: chemSwiper }
	].forEach(item => {
		const bar = document.querySelector(item.el)?.closest('.tab-container')?.querySelector('.step-bar');
		if (bar) addSwipeHandler(bar, item.instance, false);
	});

	// 作物ツリーの生成とイベントハンドラ設定
	try {
		const cropTreeSql = `
			select idsaku, class, toroku, sakumotsu, shukakubui, betsumei,
			':'||replace(n_concat('、', strconv(sakumotsu, 'k'), strconv(betsumei, 'k'), ruby), '、', ':')||':' as keywords
			from m_sakumotsu where sakumotsu not like '%除く%';
		`;
		cropManager = new CropTreeManager('#cropTreeCrop', onCropCheckMobile, false);
		cropManager.init(cropTreeSql);
	} catch (e) {
		console.error("作物ツリーの生成に失敗しました:", e);
		// データベースが未ロードでもフレームだけは見せるためにエラーをキャッチ
		document.querySelector('#cropTreeCrop').innerHTML = '<p style="padding:10px; color:red;">データベース読込待機中またはエラー</p>';
	}

	// 初期状態のインジケータをセット
	updateMainTabs(0);
	updateStepBar(0);

});

// モバイル版の作物チェック時のコールバック関数（仮）
function onCropCheckMobile(selectedCrops) {
	const cropSwiper = document.querySelector('.crop-swiper').swiper;
	if (selectedCrops.length > 0) {
		// 選択があればステップ2（病害虫）を解放
		if (cropSwiper.maxReachedStep < 1) {
			cropSwiper.maxReachedStep = 1;
			updateStepBar(cropSwiper.activeIndex, cropSwiper.maxReachedStep);
		}
	} else {
		// 選択がなければリセット
		cropSwiper.maxReachedStep = 0;
		if (cropSwiper.activeIndex > 0) cropSwiper.slideTo(0);
		updateStepBar(0, cropSwiper.maxReachedStep);
	}
}
</script>
</head>
<body>
<div id="loading"></div><!-- loading メッセージ表示領域確保 -->
<header>
	<div class="title">
		<h1>ACFinderBE Mobile</h1>
		<h2 id="db-update"></h2>
	</div>
	<div class="menu">
		<svg class="icon" onclick="showMainMenu()">
			<title>メニュー</title>
			<use href="icons.svg#menu"></use>
		</svg>
	</div>
</header>

<nav class="main-nav">
	<button class="main-btn active" onclick="mainJump(0)">作物</button>
	<button class="main-btn" onclick="mainJump(1)">病害虫</button>
	<button class="main-btn" onclick="mainJump(2)">薬剤</button>
</nav>

<div class="swiper main-swiper">
	<div class="swiper-wrapper">
		
		<!-- 【作物タブ】 -->
		<div class="swiper-slide">
			<div class="tab-container">
				<!-- ステップバー -->
				<div class="step-bar">
					<div class="step-item active" onclick="stepJump(0)">1</div>
					<div class="step-item" onclick="stepJump(1)">2</div>
					<div class="step-item" onclick="stepJump(2)">3</div>
					<div class="step-item" onclick="stepJump(3)">4</div>
				</div>

				<!-- 内部Swiper -->
				<div class="swiper crop-swiper">
					<div class="swiper-wrapper">
						<!-- ① 作物ツリー -->
						<div class="swiper-slide step-fixed">
							<div class="swiper-zoom-container">
								<div id="cropTreeCrop" class="swiper-zoom-target step-zoom-target"></div>
							</div>
						</div>

						<!-- ② 病害虫選択 -->
						<div class="swiper-slide step-fixed">
							<div class="swiper-zoom-container">
								<div class="swiper-zoom-target step-zoom-target">
									<h4>対象病害虫</h4>
									<div class="list-box">
										<p style="color: #666;">病害虫選択のコンテンツがここに表示されます。</p>
										<!-- ここに病害虫選択のUIを実装 -->
									</div>
								</div>
							</div>
						</div>

						<!-- ③ 農薬選択 -->
						<div class="swiper-slide step-fixed">
							<div class="swiper-zoom-container">
								<div class="swiper-zoom-target step-zoom-target">
									<h4>農薬リスト</h4>
									<div class="list-box">
										<p style="color: #666;">農薬選択のコンテンツがここに表示されます。</p>
										<!-- ここに農薬選択のUIを実装 -->
									</div>
								</div>
							</div>
						</div>

						<!-- ④ 詳細表示 -->
						<div class="swiper-slide step-scrollable">
							<div class="swiper-zoom-container">
								<div class="swiper-zoom-target step-zoom-target">
									<h4>登録情報詳細</h4>
									<div class="content-info">
										<p style="color: #666;">ここに選択された農薬の詳細情報が表示されます。</p>
										<!-- ここに詳細表示のコンテンツを実装 -->
									</div>
								</div>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!-- 【病害虫タブ】 -->
		<div class="swiper-slide">
			<div class="tab-container">
				<!-- ステップバー -->
				<div class="step-bar">
					<div class="step-item active" onclick="stepJump(0)">1</div>
					<div class="step-item locked" onclick="stepJump(1)">2</div>
					<div class="step-item locked" onclick="stepJump(2)">3</div>
				</div>

				<!-- 内部Swiper -->
				<div class="swiper pest-swiper">
					<div class="swiper-wrapper">
						<div class="swiper-slide step-fixed">
							<div class="swiper-zoom-container">
								<div class="swiper-zoom-target step-zoom-target">
									<h4>病害虫検索</h4>
									<p style="color: #666;">病害虫・雑草名からの検索画面をここに実装します。</p>
								</div>
							</div>
						</div>
						<!-- 以降のステップ（検索結果、詳細等）は必要に応じて追加 -->
					</div>
				</div>
			</div>
		</div>
		<!-- 【薬剤タブ】 -->
		<div class="swiper-slide">
			<div class="tab-container">
				<!-- ステップバー -->
				<div class="step-bar">
					<div class="step-item active" onclick="stepJump(0)">1</div>
					<div class="step-item locked" onclick="stepJump(1)">2</div>
				</div>

				<!-- 内部Swiper -->
				<div class="swiper chem-swiper">
					<div class="swiper-wrapper">
						<div class="swiper-slide step-fixed">
							<div class="swiper-zoom-container">
								<div class="swiper-zoom-target step-zoom-target">
									<h4>薬剤検索</h4>
									<p style="color: #666;">薬剤名・成分名からの検索画面をここに実装します。</p>
								</div>
							</div>
						</div>
						<!-- 以降のステップは必要に応じて追加 -->
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
</body>
</html>
