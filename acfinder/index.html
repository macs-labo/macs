<script>
(function() {
	// 当面、公開ディレクトリの場合は強制的にデスクトップ版にリダイレクト
	if (window.location.href.includes('/acfinder/')) {
		window.location.href = 'crop.html';
	}
	// ディスプレイの論理幅が 1280px 以上ならデスクトップ版にリダイレクト
	const isDesktopSize = window.screen.width >= 1280;
	if (isDesktopSize) {
		// URLパラメータでデバッグ用に回避できるようにしておく
		const urlParams = new URLSearchParams(window.location.search);
		if (urlParams.get('mode') !== 'mobile') {
			window.location.href = 'crop.html';
		}
	}
})();
</script>

<style>

.menu-item {

/* テーマ選択ダイアログの選択中スタイル */

}

}

.menu-container button,
form button {
	padding: 0 4px;
	height: 32px;
  display: flex;
  justify-content: center;

	border: 1px solid var(--border-color);

}

form button:hover {

}

	text-align: center;

	color: var(--text-color);
}

<script>
// --- 共通の簡易スワイプ検知関数 ---
let maxReachedStep = 0; // 解放済みの最大ステップ

function addSwipeHandler(element, swiper, loop = true) {
	let touchStartX = 0;
	let touchEndX = 0;

	element.addEventListener('touchstart', (e) => {
		touchStartX = e.changedTouches[0].screenX;
	}, { passive: true });

	element.addEventListener('touchend', (e) => {
		touchEndX = e.changedTouches[0].screenX;
		const threshold = 40;
		
		// 左フリック（指を左へ動かす） -> 次のスライドへ（右端なら左端へ）
		if (touchEndX < touchStartX - threshold) {
			if (loop && swiper.activeIndex === swiper.slides.length - 1) {
				swiper.slideTo(0);
			} else if (loop || swiper.activeIndex < maxReachedStep) {
				swiper.slideNext();
			}
		}
		// 右フリック（指を右へ動かす） -> 前のスライドへ（左端なら右端へ）
		if (touchEndX > touchStartX + threshold) {
			if (loop && swiper.activeIndex === 0) {
				swiper.slideTo(swiper.slides.length - 1);
			} else {
				swiper.slidePrev();
			}
		}
	}, { passive: true });
}

// --- UI更新ロジック ---

// メインタブの更新（インジケータ連動）
function updateMainTabs(index) {
	const btns = document.querySelectorAll('.main-btn');
	btns.forEach((btn, i) => {
		if (i === index) {
			btn.classList.add('active');
		} else {
			btn.classList.remove('active');
		}
	});
}

// ステップバーの更新
function updateStepBar(index) {
	const items = document.querySelectorAll('.step-item');
	items.forEach((item, i) => {
		item.classList.remove('active', 'completed', 'locked');
		if (i === index) {
			item.classList.add('active');
		} else if (i < index) {
			item.classList.add('completed');
		}
		
		if (i > maxReachedStep) {
			item.classList.add('locked');
		}
	});
}

// メインメニューの表示
function showMainMenu() {
	const dialogId = 'main-menu-dialog';
	let dialog = document.getElementById(dialogId);
	
	if (!dialog) {
		dialog = document.createElement('dialog');
		dialog.id = dialogId;
		dialog.className = 'menu-dialog';
		document.body.appendChild(dialog);
	}
	
	// 位置をアイコンの直下に固定
	const icon = document.querySelector('header .menu');
	const rect = icon.getBoundingClientRect();
	dialog.style.position = 'fixed';
	dialog.style.margin = '0';
	dialog.style.top = (rect.bottom + 5) + 'px';
	dialog.style.right = '10px';
	dialog.style.left = 'auto';

	// ズームコントロールのHTMLを生成
	const currentZoom = parseFloat(localStorage.getItem('appZoom')) || 1.0;
	const zoomControlsHtml = `
		<div class="zoom-controls">
			<div class="zoom-item">
				<span class="menu-item-name">🔎 ズーム</span>
				<button type="button" id="zoom-reset">リセット</button>
			</div>
			<div class="zoom-item">
				<button type="button" id="zoom-out" title="ズームアウト">－</button>
				<span id="zoom-level">${Math.round(currentZoom * 100)}%</span>
				<button type="button" id="zoom-in" title="ズームイン">＋</button>
			</div>
		</div>
	`;

	dialog.innerHTML = `
		<div class="menu-container">
			${zoomControlsHtml}
			<ul class="menu-list">
				<li class="menu-item" onclick="showThemeSelection()">
					<div class="menu-item-name">🎨 テーマ選択</div>
				</li>
				<li class="menu-item" onclick="showNotificationDialog()">
					<div class="menu-item-name">🔔 DB更新通知受信</div>
				</li>
				<li class="menu-item" onclick="document.getElementById('main-menu-dialog').close();">
					<div class="menu-item-name">
						<a href="https://github.com/macs-labo/macs/tree/main/acfinder#readme" target="_blank" style="text-decoration: none; color: inherit;">
							⚠️ 使用上の注意事項
						</a>
					</div>
				</li>
				<li class="menu-item" onclick="document.getElementById('main-menu-dialog').close();">
					<div class="menu-item-name">
						<a href="https://github.com/macs-labo/macs#readme" target="_blank" style="text-decoration: none; color: inherit;">
							📖 利用規約
						</a>
					</div>
				</li>
				<li class="menu-item" onclick="showVersionInfo()">
					<div class="menu-item-name">ℹ️ バージョン情報</div>
				</li>
				<li class="menu-item" onclick="location.href='crop.html?mode=desktop'">
					<div class="menu-item-name">🖥️ デスクトップ版へ切替</div>
				</li>
			</ul>
		</div>
		<form method="dialog">
			<span>メニュー</span><button>閉じる</button>
		</form>
	`;

	dialog.onclick = (e) => { if (e.target === dialog) dialog.close(); };
	dialog.showModal();

	// ズーム操作のイベントリスナーを設定
	dialog.querySelector('#zoom-in').addEventListener('click', (e) => {
		e.stopPropagation();
		const current = parseFloat(document.body.style.zoom) || 1.0;
		applyZoom(current + 0.05);
	});
	dialog.querySelector('#zoom-out').addEventListener('click', (e) => {
		e.stopPropagation();
		const current = parseFloat(document.body.style.zoom) || 1.0;
		applyZoom(current - 0.05);
	});
	dialog.querySelector('#zoom-reset').addEventListener('click', (e) => {
		e.stopPropagation();
		applyZoom(1.0);
	});
}

// テーマ選択ダイアログの表示
function showThemeSelection() {
	const dialogId = 'theme-menu-dialog';
	let dialog = document.getElementById(dialogId);
	if (!dialog) {
		dialog = document.createElement('dialog');
		dialog.id = dialogId;
		dialog.className = 'menu-dialog';
		document.body.appendChild(dialog);
	}

	const current = localStorage.getItem('selected_theme_name');
	let listHtml = colorThemes.map((t, idx) => `
		<li class="menu-item ${current === t.name ? 'active' : ''}" onclick="applyTheme(${idx}); document.getElementById('${dialogId}').close(); document.getElementById('main-menu-dialog').close();">
			<div class="menu-item-name">${t.title}</div>
		</li>
	`).join('');
	
	if (localStorage.getItem('user_custom_css_save')) {
		listHtml += `<li class="menu-item ${current === 'custom' ? 'active' : ''}" onclick="applyTheme('custom'); document.getElementById('${dialogId}').close(); document.getElementById('main-menu-dialog').close();"><div class="menu-item-name">ユーザカスタムテーマ</div></li>`;
	}

	dialog.innerHTML = `<div class="menu-container"><ul class="menu-list">${listHtml}</ul></div><form method="dialog"><span>テーマ選択</span><button>閉じる</button></form>`;
	dialog.onclick = (e) => { if (e.target === dialog) dialog.close(); };
	dialog.showModal();
}

// バージョン情報ダイアログ
function showVersionInfo() {
	let year = appVer.split('.')[0];
	if (year !== '2026') year = '2026-' + year;
	const dialogId = 'version-dialog';
	let dialog = document.getElementById(dialogId);
	if (!dialog) {
		dialog = document.createElement('dialog');
		dialog.id = dialogId;
		dialog.className = 'menu-dialog';
		document.body.appendChild(dialog);
	}
	dialog.innerHTML = `
		<div class="menu-container">
			<div class="info-container">
				<h1>ACFinderBE Mobile</h1>
				<h2>Release: ${appVer}</h2>
				<p>Agricultural Chemicals Finder<br>Browser Edition for Mobile</p>
				<p>&copy; ${year} TEAM ACFinder<br>Licensed under the MIT License</p>
			</div>
		</div>
		<form method="dialog"><span>バージョン情報</span><button>閉じる</button></form>
	`;
	dialog.onclick = (e) => { if (e.target === dialog) dialog.close(); };
	dialog.showModal();
}

// ズーム操作の適用
function applyZoom(scale) {
	const newZoom = Math.max(0.5, Math.min(2.0, Math.round(scale * 20) / 20));
	document.body.style.zoom = newZoom;
	localStorage.setItem('appZoom', newZoom);
	const zoomLevelEl = document.querySelector('#main-menu-dialog #zoom-level');
	if (zoomLevelEl) zoomLevelEl.textContent = `${Math.round(newZoom * 100)}%`;
}

// 他のタブでのズーム変更を検知して反映
window.addEventListener('storage', (event) => {
	if (event.key === 'appZoom') applyZoom(parseFloat(event.newValue) || 1.0);
});

let mainJump;
let stepJump;
let cropManager; // 作物タブ専用マネージャ

window.addEventListener('DOMContentLoaded', async () => {

	//データベース読込
	if (db === null) await fetchDB();

	// --- Swiperの初期化 ---

	// 1. メインタブのSwiper
	const mainSwiper = new Swiper('.main-swiper', {
		observer: true,
		observeParents: true,
		allowTouchMove: true,
		noSwiping: true,
		noSwipingClass: 'swiper-slide',
		zoom: {
			maxRatio: 3,
			minRatio: 1, // 縮小時、appZoom の倍率で止まるように設定
			toggle: false,
		},
		speed: 300,
		on: {
			slideChange: function() {
				updateMainTabs(this.activeIndex);
			}
		}
	});

	// 2. 作物内部のSwiper
	const cropSwiper = new Swiper('.crop-swiper', {
		observer: true,
		observeParents: true,
		nested: true,
		allowTouchMove: true,
		noSwiping: true,
		noSwipingClass: 'swiper-slide',
		zoom: {
			maxRatio: 3,
			minRatio: 1, // 縮小時、appZoom の倍率で止まるように設定
			toggle: false,
		},
		speed: 300,
		// スライドが切り替わった時にインジケータを更新
		on: {
			slideChange: function() {
				updateStepBar(this.activeIndex);
			}
		}
	});

	// クリック時のジャンプ
	mainJump = function(index) {
		mainSwiper.slideTo(index);
	};

	// ステップのジャンプ
	stepJump = function(index) {
		if (index <= maxReachedStep) {
			cropSwiper.slideTo(index);
		}
	};

	// タブバーのスワイプ
	addSwipeHandler(document.querySelector('.main-nav'), mainSwiper, true);

	// ステップバーのスワイプ
	addSwipeHandler(document.querySelector('.step-bar'), cropSwiper, false);

	// 作物ツリーの生成とイベントハンドラ設定
	try {
		const cropTreeSql = `
			select idsaku, class, toroku, sakumotsu, shukakubui, betsumei,
			':'||replace(n_concat('、', strconv(sakumotsu, 'k'), strconv(betsumei, 'k'), ruby), '、', ':')||':' as keywords
			from m_sakumotsu where sakumotsu not like '%除く%';
		`;
		cropManager = new CropTreeManager('#cropTreeMobile', onCropCheckMobile, false);
		cropManager.init(cropTreeSql);
	} catch (e) {
		console.error("作物ツリーの生成に失敗しました:", e);
		// データベースが未ロードでもフレームだけは見せるためにエラーをキャッチ
		document.querySelector('#cropTreeMobile').innerHTML = '<p style="padding:10px; color:red;">データベース読込待機中またはエラー</p>';
	}

	// 初期状態のインジケータをセット
	updateMainTabs(0);
	updateStepBar(0);

	// 初期ズーム適用
	applyZoom(parseFloat(localStorage.getItem('appZoom')) || 1.0);

});

// モバイル版の作物チェック時のコールバック関数（仮）
function onCropCheckMobile(selectedCrops) {
	const cropSwiper = document.querySelector('.crop-swiper').swiper;
	if (selectedCrops.length > 0) {
		// 選択があればステップ2（病害虫）を解放
		if (maxReachedStep < 1) {
			maxReachedStep = 1;
			updateStepBar(cropSwiper.activeIndex);
		}
	} else {
		// 選択がなければリセット
		maxReachedStep = 0;
		if (cropSwiper.activeIndex > 0) cropSwiper.slideTo(0);
		updateStepBar(0);
	}
}
</script>
</head>
<body>
<div id="loading"></div><!-- loading メッセージ表示領域確保 -->
<header>
	<div class="title">
		<h1>ACFinderBE Mobile</h1>
		<h2 id="db-update"></h2>
	</div>
	<div class="menu">
		<svg class="icon" onclick="showMainMenu()">
			<title>メニュー</title>
			<use href="icons.svg#menu"></use>
		</svg>
	</div>
</header>

<nav class="main-nav">
	<button class="main-btn active" onclick="mainJump(0)">作物</button>
	<button class="main-btn" onclick="mainJump(1)">病害虫</button>
	<button class="main-btn" onclick="mainJump(2)">薬剤</button>
</nav>

<div class="swiper main-swiper">
	<div class="swiper-wrapper">
		
		<!-- 【作物タブ】 -->
		<div class="swiper-slide">
			<div class="crop-container">
				<!-- ステップバー -->
				<div class="step-bar swiper-no-swiping">
					<div class="step-item active" onclick="stepJump(0)">1</div>
					<div class="step-item" onclick="stepJump(1)">2</div>
					<div class="step-item" onclick="stepJump(2)">3</div>
					<div class="step-item" onclick="stepJump(3)">4</div>
				</div>

				<!-- 内部Swiper -->
				<div class="swiper crop-swiper">
					<div class="swiper-wrapper">
						<!-- ① 作物ツリー -->
						<div class="swiper-slide step-fixed">
							<div class="swiper-zoom-container">
								<div id="cropTreeMobile" class="swiper-zoom-target"></div>
							</div>
						</div>

						<!-- ② 病害虫選択 -->
						<div class="swiper-slide step-fixed">
							<div class="swiper-zoom-container swiper-zoom-target">
								<h4>対象病害虫</h4>
								<div class="list-box" style="padding:10px;">
									<p style="color: #666;">病害虫選択のコンテンツがここに表示されます。</p>
									<!-- ここに病害虫選択のUIを実装 -->
								</div>
