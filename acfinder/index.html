<html lang="ja" data-mode="mobile">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="apple-touch-icon" href="../apple-touch-icon-180x180.png" sizes="180x180">
<link rel="icon" type="image/png" href="../android-chrome-192x192.png" sizes="192x192">
<link rel="manifest" href="./manifest.json">
<title>ACFinderBE Mobile</title>
<script>
(function() {
	// 当面、公開ディレクトリの場合は強制的にデスクトップ版にリダイレクト
	if (window.location.href.includes('/acfinder/')) {
		window.location.href = 'crop.html';
	}
	// ディスプレイの論理幅が 1280px 以上ならデスクトップ版にリダイレクト
	const isDesktopSize = window.screen.width >= 1280;
	if (isDesktopSize) {
		// URLパラメータでデバッグ用に回避できるようにしておく
		const urlParams = new URLSearchParams(window.location.search);
		if (urlParams.get('mode') !== 'mobile') {
			window.location.href = 'crop.html';
		}
	}

	// 公開ディレクトリの場合ここで終了
	if (window.location.href.includes('/acfinder/')) return;
	// タッチデバイスでない場合はここで終了
	if (!('ontouchstart' in window)) return;

	// 開発版はデバッガーを画面の真ん中に巨大なログ画面を出す（タッチスクロール可能）
	// 既存のデバッガーがあれば消す
	document.getElementById('pwa-logger-v2')?.remove();

	const div = document.createElement('div');
	div.id = 'pwa-logger-v2';
	// 画面中央に配置、背景を濃くして文字を大きく（16px）、タッチ操作を100%許可
	div.style.cssText = 'position:fixed;top:10%;left:5%;width:90%;height:70%;overflow-y:scroll;background:rgba(10,10,10,0.95);color:#00ff00;font-family:monospace;font-size:16px;z-index:999999;padding:15px;box-sizing:border-box;border:3px solid #ff5555;pointer-events:auto;user-select:text;-webkit-overflow-scrolling:touch;';
	div.style.display = 'none';

	// 閉じるボタンを上部に配置
	const closeBtn = document.createElement('button');
	closeBtn.textContent = '【ログを閉じる】';
	closeBtn.style.cssText = 'width:100%;padding:10px;background:#333;color:#fff;font-size:16px;font-weight:bold;margin-bottom:15px;border:none;';
	closeBtn.onclick = () => div.style.display = 'none';
	div.appendChild(closeBtn);

	document.documentElement.appendChild(div);

	const originalLog = console.log;
	console.log = function(...args) {
		originalLog.apply(console, args);
		const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a) : a).join(' ');
		const logLine = document.createElement('div');
		logLine.style.cssText = 'border-bottom:1px solid #333;padding:5px 0;white-space:pre-wrap;word-break:break-all;';
		logLine.textContent = `[LOG] ${msg}`;
		div.appendChild(logLine);
		div.scrollTop = div.scrollHeight;
	};

	// エラーを検知したら、一番目立つように赤文字で大きく追加
	window.addEventListener('error', function(e) {
		const logLine = document.createElement('div');
		logLine.style.cssText = 'color:#ff3333;font-weight:bold;border:2px solid #ff3333;padding:10px;margin:10px 0;background:rgba(255,0,0,0.1);white-space:pre-wrap;word-break:break-all;';
		logLine.textContent = `🚨 [ERR] ${e.message}\n📍 at ${e.filename}\n🔢 line: ${e.lineno}:${e.colno}`;
		div.insertBefore(logLine, div.firstChild); // 最新のエラーを一番上に表示
		div.style.display = 'block'; // 隠れていても強制表示
	});

	// 👈 【追加】画面を「3本指でタップ」するたびに、ログ画面を表示・非表示にする
	window.addEventListener('touchstart', function(e) {
		if (e.touches.length === 3) { // 3本指タッチを検知
			if (div.style.display === 'none') {
				div.style.display = 'block';
				// 開いた瞬間に、通常ログの最下部（最新）へスクロールさせる
				div.scrollTop = div.scrollHeight;
			} else {
				div.style.display = 'none';
			}
		}
	});

	// --- グローバル・一時的ピンチズームの実装 ---
	(function initGlobalPinchZoom() {
		let startDist = 0;
		let startZoom = 1;
		let isPinching = false;
		let targetEl = null;

		// 現在表示中のアクティブなコンテンツ要素を取得する
		const getActiveContent = () => {
			const activeMain = document.querySelector('.main-swiper > .swiper-wrapper > .swiper-slide-active');
			if (!activeMain) return null;
			const nested = activeMain.querySelector('.swiper-wrapper > .swiper-slide-active');
			const targetSlide = nested || activeMain;
			// Swiperのレイアウト崩れを防ぐため、スライド内部のコンテナを対象にする
			return targetSlide.querySelector('.step-fixed, .step-scrollable') || targetSlide;
		};

		window.addEventListener('touchstart', (e) => {
			if (e.touches.length === 2) {
				isPinching = true;
				targetEl = getActiveContent();
				if (!targetEl) return;

				startDist = Math.hypot(
					e.touches[0].pageX - e.touches[1].pageX,
					e.touches[0].pageY - e.touches[1].pageY
				);
				// コンテンツの現在の相対ズーム値を取得
				startZoom = parseFloat(targetEl.style.zoom) || 1.0;
			}
		}, { passive: false });

		window.addEventListener('touchmove', (e) => {
			if (isPinching && e.touches.length === 2 && targetEl) {
				e.preventDefault(); // ネイティブのズームやスクロールを防止
				const dist = Math.hypot(
					e.touches[0].pageX - e.touches[1].pageX,
					e.touches[0].pageY - e.touches[1].pageY
				);
				const ratio = (dist * 0.6) / startDist; 

				let newZoom = startZoom * ratio;
				// 1.0未満（appZoom相当）にならないよう制限
				if (newZoom < 1.0) newZoom = 1.0;
				if (newZoom > 2) newZoom = 2; // 最大ズーム制限（任意）

				targetEl.style.zoom = newZoom;
				// ズーム中はスクロール可能にする
				if (newZoom > 1.0) {
					targetEl.style.overflow = 'auto';
				} else {
					targetEl.style.overflow = '';
				}
			}
		}, { passive: false });

		window.addEventListener('touchend', () => { 
			isPinching = false; 
			targetEl = null;
		});
	})();
})();
</script>

<script>
window.isMobile = true;

// --- 共通の簡易スワイプ検知関数 ---

function addSwipeHandler(element, swiper, loop = true) {
	let touchStartX = 0;
	let touchEndX = 0;

	element.addEventListener('touchstart', (e) => {
		touchStartX = e.changedTouches[0].screenX;
	}, { passive: true });

	element.addEventListener('touchend', (e) => {
		// 自身、または現在表示中のスライド内にある Swiper がズーム中ならスワイプを無視
		const isZooming = (s) => s && s.zoom && s.zoom.scale > 1 && !s.isReturningToSingleScale;

		if (isZooming(swiper)) return;

		// mainSwiper の場合、中にある cropSwiper 等のズーム状態もチェック
		const activeSlide = swiper.slides[swiper.activeIndex];
		if (activeSlide) {
			const nestedSwiperEl = activeSlide.querySelector('.swiper-initialized');
			if (nestedSwiperEl && nestedSwiperEl.swiper && isZooming(nestedSwiperEl.swiper)) return;
		}

		touchEndX = e.changedTouches[0].screenX;
		const threshold = 40; // Minimum distance for a swipe to be recognized
		
		// 左フリック（指を左へ動かす） -> 次のスライドへ（右端なら左端へ）
		if (touchEndX < touchStartX - threshold) {
			if (loop && swiper.activeIndex === swiper.slides.length - 1) {
				swiper.slideTo(0);
			} else if (swiper.activeIndex < swiper.slides.length - 1) {
				// 解放済みのステップ（インスタンス保持）を超えてのスワイプを禁止
				if (!loop && swiper.maxReachedStep !== undefined && swiper.activeIndex >= swiper.maxReachedStep) return;
				swiper.slideTo(swiper.activeIndex + 1);
			}
		}
		// 右フリック（指を右へ動かす） -> 前のスライドへ（左端なら右端へ）
		if (touchEndX > touchStartX + threshold) {
			if (loop && swiper.activeIndex === 0) {
				swiper.slideTo(swiper.slides.length - 1);
			} else if (swiper.activeIndex > 0) {
				swiper.slideTo(swiper.activeIndex - 1);
			}
		}
	}, { passive: true });
}

// メインタブの更新（インジケータ連動）
function updateMainTabs(index) {
	const btns = document.querySelectorAll('.main-btn');
	btns.forEach((btn, i) => {

// ステップバーの更新
function updateStepBar(swiperInstance, maxStep) {
	if (!swiperInstance) return;

	// 一時ズーム中ならリセット
	if (swiperInstance.zoom && swiperInstance.zoom.scale > 1) swiperInstance.zoom.out();

	// maxStep が指定された場合は更新する
	if (maxStep !== undefined) swiperInstance.maxReachedStep = maxStep;

	const index = swiperInstance.activeIndex;
	const currentMax = swiperInstance.maxReachedStep;

	// 現在アクティブなメインタブ（スライド）内にあるステップ項目のみを対象にする
	const activeMainSlide = document.querySelector('.main-swiper > .swiper-wrapper > .swiper-slide-active');
	if (!activeMainSlide) return;

	// ステップアイテム (1, 2, 3...) の表示更新
	activeMainSlide.querySelectorAll('.step-item').forEach((item, i) => {
		item.classList.remove('active', 'completed', 'locked'); // 既存のクラスを全て削除
		if (i === index) {
			item.classList.add('active');
		} else if (i < index) {
			item.classList.add('completed');
		}
		if (i > currentMax) {
			item.classList.add('locked');
		}
	});

	// ナビゲーションボタンとタッチバーの更新
	const isFirstStep = index === 0;
	const isLastStep = index === currentMax;

	// アイコン（◀ ▶）と画面端のタッチバー（« »）の両方を更新
	activeMainSlide.querySelectorAll('.prev-step').forEach(el => el.classList.toggle('disabled', isFirstStep));
	activeMainSlide.querySelectorAll('.next-step').forEach(el => el.classList.toggle('disabled', isLastStep));
	document.querySelectorAll('.prev-touch-bar').forEach(el => el.classList.toggle('disabled', isFirstStep));
	document.querySelectorAll('.next-touch-bar').forEach(el => el.classList.toggle('disabled', isLastStep));
}

// ズーム操作の適用
function applyZoom(scale) {
	const newZoom = Math.max(0.5, Math.min(2.0, Math.round(scale * 20) / 20));
	document.documentElement.style.setProperty('--app-zoom', newZoom);
	// 永続設定変更時は一時的なズーム（インラインスタイル）をクリアする
	document.body.style.zoom = '';
	localStorage.setItem('appZoom', newZoom);
	const zoomLevelEl = document.querySelector('#main-menu-dialog #zoom-level');
	if (zoomLevelEl) zoomLevelEl.textContent = `${Math.round(newZoom * 100)}%`;
}

// すべてのスライドの一時ズームをリセットする
function clearAllSlideZoom() {
	document.querySelectorAll('.step-fixed, .step-scrollable').forEach(el => {
		el.style.zoom = '';
		el.style.overflow = '';
	});
}

// 他のタブでのズーム変更を検知して反映
window.addEventListener('storage', (event) => {
	if (event.key === 'appZoom') {
		applyZoom(parseFloat(event.newValue) || 1.0);
		clearAllSlideZoom();
	}
});

// ズーム可能なSwiperインスタンスを作成するヘルパー関数
function createZoomableSwiper(selector, mainSwiperInstance, slideChangeCallback = null) {
	const swiperInstance = new Swiper(selector, {
		observer: true,
		observeParents: true,
		nested: true,
		allowTouchMove: true,
		allowSlideNext: true,
		allowSlidePrev: true,
		noSwiping: true,
		noSwipingClass: 'no-swipe',
		speed: 300,
		on: {
			slideChange: function() {
				clearAllSlideZoom();
				// 未開放ステップへのスワイプを制限
				if (this.maxReachedStep !== undefined && this.activeIndex > this.maxReachedStep) {
					this.slideTo(this.maxReachedStep);
					return;
				}
				if (slideChangeCallback) {
					slideChangeCallback.call(this); // Swiperインスタンスのコンテキストでコールバックを呼び出す
				}
			}
		}
	});

	swiperInstance.maxReachedStep = 0; // 最大到達ステップを 0 で初期化
	return swiperInstance;
}

	try {

			':'||replace(n_concat('、', strconv(sakumotsu, 'k'), strconv(betsumei, 'k'), ruby), '、', ':')||':' as keywords

		cropCropManager.init(cropTreeSql, {

// 作物タブ step.1 の作物ツリーチェック時のコールバック関数
function onCheckCropCrop(selectedCrops) {
	const cropSwiper = document.querySelector('.crop-swiper').swiper;
	if (selectedCrops.length > 0) {
		// 選択があれば step.2 (病害虫)を解放
		const newMax = Math.max(cropSwiper.maxReachedStep, 1);
		updateStepBar(cropSwiper, newMax);
		// step.2 作成
		setupCropPest();
	} else {
		// 選択がなければリセット
		if (cropSwiper.activeIndex > 0) cropSwiper.slideTo(0);
		updateStepBar(cropSwiper, 0);
	}
}

// 作物タブ step.2: 病害虫選択
async function setupCropPest() {
	// ヘッダ設定
	const title = document.querySelector('#cropHead2');
	const crops = cropCropManager.checkedCrops.map(item => item.sakumotsu); // checkedCrops から作物だけの配列を取り出し
	const searchMethod = cropCropManager.searchMethod;
	title.innerHTML = crops.join(searchMethod.includes('or') ? ' | ' : ' & ');

	// 病害虫リスト作成
	await waiting(true, '病害虫リストを取得中...');

	const cropSwiper = document.querySelector('.crop-swiper').swiper;
	const byochuListbox = document.getElementById("cropPestList");

	// SQL実行とDOM更新を一つの関数にまとめる
	const executeUpdate = async () => {
		try {
			// UI スレッドを一度解放して、Loading 表示のレンダリングを確定させる
			await new Promise(resolve => setTimeout(resolve, 0));

			const expandCropFlags = crops.map(crop => `(${expandCrops(crop)}) as ${normalizeColName(crop)}`);
			const cropFlags = crops.map(crop => `max(${normalizeColName(crop)}) as ${normalizeColName(crop)}`).join(',');
			const sql =`
				drop table if exists t_cropTekiyo;
				create temp table t_cropTekiyo as
				with t_sakumotsu as (select sakumotsu, ${expandCropFlags.join(',')} from m_sakumotsu left join sakuhojo using(idsaku)),
				t_tekiyo as (select * from tv_tsushoTekiyo where sakumotsu in (${makeCropCondition(crops)})),
				t_byochu1 as (select idbyochu, byochu as byochu2, betsumei as byochuruby from m_byochu),
				t_byochu2 as (select distinct ifnull(byochu, ifnull(mokuteki, hoho)) as byochu2 from m_tekiyo),
				t_byochu3 as (select ifnull(idbyochu, '59999999') as idbyochu, byochu2, iif(byochu2 = '添加', 'てんか', byochuruby) as byochuruby from t_byochu2 left join t_byochu1 using(byochu2) order by idbyochu)
				select * from t_tekiyo left join t_sakumotsu using(sakumotsu) left join  t_byochu3 on ifnull(byochu, ifnull(mokuteki, hoho)) = byochu2;
				delete from t_cropTekiyo where tsusho not in (
					with t_tsusho1 as (select tsusho, ${cropFlags} from t_cropTekiyo group by tsusho)
					select tsusho from t_tsusho1 where ${normalizeColName(crops.join(searchMethod))}
				);
				with t_byochu as (select distinct byochu2 as byochu from t_cropTekiyo),
				t_gByochu as (select cid, gid, format('%d%03d%', cid, gid) as idbyochu, gname as byochu, strconv(gname) as byochuruby
				from t_byochu left join m_byochu using(byochu) left join gbyochu using(cid, gid) where gname is not null)
				select distinct idbyochu, byochu2, byochuruby from t_cropTekiyo where byochu not regexp '菌(\\)|による)'
				union select idbyochu, byochu, byochuruby from t_gByochu order by idbyochu;
			`;
			if (debug) console.log(sql.replace(/^\t+/gm, ''));

			const sqlResult = db.exec(sql);

			// 重い SQL 実行後に再度スレッドを解放し、DOM 更新によるフリーズを防ぐ
			await new Promise(resolve => setTimeout(resolve, 0));

			if (sqlResult?.[0]?.values) {
				const pests = sqlResult[0].values.map(row => ({
					idbyochu: row[0],
					byochu: row[1],
					betsumei: row[2]
				}));
				cropPestManager.update(pests);			// スライドを病害虫選択まで開放（次以降は未開放にする）
				updateStepBar(cropSwiper, 1);
			} else {
				cropPestManager.update([]);
				cropSwiper.slideTo(0);
				updateStepBar(cropSwiper, 0);
			}
		} catch (e) {
			console.error("病害虫リスト取得エラー:", e);
		} finally {
			waiting(false);
		}
	};

	// アニメーション中の負荷を避けるため、スライド完了を待ってから実行
	if (cropSwiper.activeIndex === 1) {
		// 既にStep 2にいる場合は即座に(ただし非同期で)実行
		setTimeout(executeUpdate, 50);
	} else {
		// ハンドラ自体が時間を占有しないよう、イベント内からさらに非同期で実行
		cropSwiper.once('transitionEnd', () => {
			setTimeout(executeUpdate, 0);
		});
		cropSwiper.slideTo(1);
	}

}

// 作物タブ step.3: 薬剤選択
async function setupCropChem() {
	// ヘッダ設定
	const title = document.querySelector('#cropHead3');
	const checkedPests = cropPestManager.checkedPests;
	const pests = checkedPests.map(pest => pest.byochu);
	title.innerHTML = pests.join(' & ');

	await waiting(true, '薬剤リストを作成中...');

	const cropSwiper = document.querySelector('.crop-swiper').swiper;
	const chemListbox = document.getElementById("cropChemList");
	const results = checkedPests.map(pest => {
		const cond = pest.id.includes('%') ? `idbyochu like '${pest.id}'` : `byochu2 = '${pest.byochu}'`;
		return { cond, col: `(${cond}) as ${normalizeColName(pest.byochu)}` };
	});
	const pestCondition = results.map(r => r.cond).join(' or ');
	const pestColumns = results.map(r => r.col).join(', ');
	const pestFlags = pests.map(pest => `max(${normalizeColName(pest)}) as ${normalizeColName(pest)}`).join(', ');
	const crops = cropCropManager.checkedCrops.map(item => item.sakumotsu);
	const cropColumns = crops.map(crop => `${normalizeColName(crop)}`).join(', ');
	const cropFlags = crops.map(crops => `max(${normalizeColName(crops)}) as ${normalizeColName(crops)}`).join(', ');

	const executeUpdate = async () => {
		try {
			await new Promise(resolve => setTimeout(resolve, 0));

			// Step 2 で作成された t_cropTekiyo を使用して薬剤を抽出
			const sql = `
				with t_byochu as (select distinct byochu2, ${pestColumns} from t_cropTekiyo where (${pestCondition})),
				t_tsusho1 as (select tsusho, ${pestFlags}, ${cropColumns} from t_byochu left join t_cropTekiyo using(byochu2) group by tsusho, ${cropColumns}),
				t_tsusho2 as (select tsusho, ${cropFlags} from t_tsusho1 where (${normalizeColName(pests.join(' and '))}) group by tsusho),
				t_tsusho3 as (select tsusho from t_tsusho2 where (${normalizeColName(crops.join(cropCropManager.searchMethod))}) and (${pestCondition})),
				t_tekiyo as (select tsusho, sakumotsu,
					gn_concat(',', iif(ifnull(jiki,'-')='-','時期無指定',jiki)) as jiki, gn_concat(',', iif(ifnull(kaisu,'-')='-','回数無指定',kaisu)) as kaisu, gn_concat(',', iif(ifnull(hoho,'-')='-','方法無指定',hoho)) as hoho,
					n_concat('|', ifnull(seizaidokusei, '-'), shurui, n_concat('/', keito1, mid1, rem1), n_concat('/', keito2, mid2, rem2), n_concat('/', keito3, mid3, rem3), n_concat('/', keito4, mid4, rem4), n_concat('/', keito5, mid5, rem5), ruby) as keywords
					from t_cropTekiyo left join tsushoruby using(tsusho) where tsusho in (select tsusho from t_tsusho3)
					group by tsusho, sakumotsu order by ruby
				)
				select tsusho, gn_concat('|', format('%s:%s/%s/%s', sakumotsu, jiki, kaisu, hoho)) as tekiyo, keywords from t_tekiyo group by tsusho;
			`;
			if (debug) console.log(sql.replace(/^\t+/gm, ''));

			const sqlResult = db.exec(sql);

			await new Promise(resolve => setTimeout(resolve, 0));

			if (sqlResult?.[0]?.values) {
				const chems = sqlResult[0].values.map(row => ({
					tsusho: row[0],
					tekiyo: row[1],
					keywords: row[2]
				}));
				cropChemManager.update(chems);
				// スライドを薬剤選択まで開放（次以降は未開放にする）
				updateStepBar(cropSwiper, 2);
			} else {
				cropChemManager.update([]);
				updateStepBar(cropSwiper, 1);
			}
		} catch (e) {

// 薬剤タブ step.2: 薬剤選択
async function setupChemChem() {
	// ヘッダ設定
	const title = document.querySelector('#chemHead2');
	const crops = chemCropManager.checkedCrops.map(item => item.sakumotsu); // checkedCrops から作物だけの配列を取り出し
	title.innerHTML = crops.join(chemCropManager.searchMethod.includes('or') ? ' | ' : ' & ');

	await waiting(true, '薬剤リストを作成中...');

	const chemSwiper = document.querySelector('.chem-swiper').swiper;
	const chemListbox = document.getElementById("chemChemList");
	const expandCropCondition = crops.map(crop => `(${expandCrops(crop)})`).join(' or ');
	const expandCropFlags = crops.map(crop => `(${expandCrops(crop)}) as ${normalizeColName(crop)}`).join(', ');
	const cropFlags = crops.map(crop => `max(${normalizeColName(crop)}) as ${normalizeColName(crop)}`).join(', ');
	const sql =`
		drop table if exists t_chemTekiyo;
		create temp table t_chemTekiyo as
		with t_sakumotsu as (select sakumotsu, ${expandCropFlags} from m_sakumotsu left join sakuhojo using(idsaku)),
		t_tekiyo as (select * from tv_meishoTekiyo where sakumotsu in (${makeCropCondition(crops)}))
		select * from t_tekiyo left join t_sakumotsu using(sakumotsu) where (${normalizeColName(crops.join(' or '))});
		delete from t_chemTekiyo where bango not in (
			with t_bango as (select bango, ${cropFlags} from t_chemTekiyo group by bango)
			select bango from t_bango where (${normalizeColName(crops.join(cropCropManager.searchMethod))})
		);
		with t_tekiyo1 as (select bango, meisho, tsusho, ruby, sakumotsu,
			gn_concat(',', iif(ifnull(jiki,'-')='-','時期無指定',jiki)) as jiki, gn_concat(',', iif(ifnull(kaisu,'-')='-','回数無指定',kaisu)) as kaisu, gn_concat(',', iif(ifnull(hoho,'-')='-','方法無指定',hoho)) as hoho,
			n_concat('|', ifnull(seizaidokusei, '-'), shurui, n_concat('/', keito1, mid1, rem1), n_concat('/', keito2, mid2, rem2), n_concat('/', keito3, mid3, rem3), n_concat('/', keito4, mid4, rem4), n_concat('/', keito5, mid5, rem5), seizaiyoto, seizaikoka, ruby) as keywords
			from t_chemTekiyo left join tsushoruby using(tsusho) group by bango, sakumotsu
		),
		t_tekiyo2 as (select bango, meisho, tsusho, gn_concat('|', format('%s:%s/%s/%s', sakumotsu, jiki, kaisu, hoho)) as tekiyo, keywords from t_tekiyo1 group by bango order by ruby, bango)
		select * from t_tekiyo2;
	`;
	if (debug) console.log(sql.replace(/^\t+/gm, ''));

	let group = '';
	const renderer = (row) => {
		const tsusho = row.tsusho;
		const info = `${row.tekiyo}|${row.keywords}`;
		let groupItem = '';
		if (group !== tsusho) {
			group = tsusho;
			groupItem = `
				<div class="checkListItem" data-group title="${tsusho}|${info}">
					<span><em>${tsusho}</em></span><!--&nbsp;--><span><small>${info}</small></span>
				</div>
			`;
		}
		const bango = row.bango;
		const name = `${bango} ${row.meisho}`;
		return `${groupItem}
			<div class="checkListItem" title="${name}|${info}">
				<input type="radio" name="chemSelect" value="${name}" id="${bango}"><label for="${bango}">${name}</label>
			</div>
		`;
	};

	const executeUpdate = async () => {
		try {
			await new Promise(resolve => setTimeout(resolve, 0));

			const sqlResult = db.exec(sql);

			await new Promise(resolve => setTimeout(resolve, 0));

			if (sqlResult?.[0]?.values) {
				const chems = sqlResult[0].values.map(row => ({
					bango: row[0],
					meisho: row[1],
					tsusho: row[2],
					tekiyo: row[3],
					keywords: row[4]
				}));
				chemChemManager.update(chems, renderer);
				// スライドを薬剤選択まで開放（次以降は未開放にする）
				updateStepBar(chemSwiper, 1);
			} else {
				chemChemManager.update([]);
				updateStepBar(chemSwiper, 0);
			}
		} catch (e) {
			console.error("薬剤リスト作成エラー:", e);
		} finally {
			waiting(false);
		}
	};

	if (chemSwiper.activeIndex === 1) {
		setTimeout(executeUpdate, 50);
	} else {
		chemSwiper.once('transitionEnd', () => {
			setTimeout(executeUpdate, 0);
		});
		chemSwiper.slideTo(1);
	}
}

					jiki, kaisu, baisu, ekiryo, hoho, basho, jikan, ondo, dojo, chitai, tekiyaku
				FROM ${tableName} WHERE bango = ${bango}
				group by sakumotsu, jiki, kaisu, baisu, ekiryo, hoho, basho, jikan, ondo, dojo, chitai, tekiyaku
			`
		}
	];

	const executeUpdate = async () => {
		try {
			await new Promise(resolve => setTimeout(resolve, 0));
			await chemDetailManager.update(chem, 't_chemTekiyo', sqls);
		} catch (e) {
			console.error("詳細表示エラー:", e);
		} finally {
			waiting(false);
		}
	};

	if (chemSwiper.activeIndex === 2) {
		setTimeout(executeUpdate, 50);
	} else {
		chemSwiper.once('transitionEnd', () => {
			setTimeout(executeUpdate, 0);
		});
		chemSwiper.slideTo(2);
	}
}

function initChemTab() {
	// 薬剤タブ用 Managers
	chemChemManager = new ChemListManager('#chemChemWrapper', (chem) => {
		const chemSwiper = document.querySelector('.chem-swiper').swiper;
		if (chem) {
			updateStepBar(chemSwiper, Math.max(chemSwiper.maxReachedStep, 2));
			setupChemDetail();
		}
	});

	chemChemManager.init({ title: '薬剤選択', showCategory: true });

	// 薬剤詳細マネージャ初期化
	chemDetailManager = new ChemDetailManager('#chemDetailWrapper');
	chemDetailManager.init();

	// 薬剤タブ step.1 作成
	setupChemCrop();

}

let mainJump;
let stepJump;
let stepMove;
let cropCropManager, cropPestManager, cropChemManager, cropDetailManager; // 作物タブ用
let pestPestManager, pestCropManager, pestChemManager, pestDetailManager; // 病害虫タブ用
let chemChemManager, chemCropManager, chemDetailManager; // 薬剤タブ用
let initializedTabs = [true, false, false]; // 作物タブ(0)は初期ロード時に初期化済み

window.addEventListener('DOMContentLoaded', async () => {

	// 初期ズーム適用
	applyZoom(parseFloat(localStorage.getItem('appZoom')) || 1.0);

	//データベース読込
	if (db === null) await fetchDB();

	// --- Swiperの初期化 ---

	// 1. メインタブのSwiper
	const mainSwiper = new Swiper('.main-swiper', {
		observer: true,
		observeParents: true,
		allowTouchMove: true,
		allowSlideNext: true, 
		allowSlidePrev: true,
		noSwiping: true,
		noSwipingClass: 'tab-container', // スライド自体ではなく、中身のコンテナを指定
		speed: 300,
		on: {
			slideChange: function() {
				clearAllSlideZoom();
				updateMainTabs(this.activeIndex);
				// タブに初めて移動したときに初期化を実行
				if (!initializedTabs[this.activeIndex]) {
					if (this.activeIndex === 1) initPestTab();
					if (this.activeIndex === 2) initChemTab();
					initializedTabs[this.activeIndex] = true;
				}
			},
			// After main tab changes, update the step navigation buttons for the new active nested Swiper
			transitionEnd: function() { // transitionEnd を使用して、スライドが完全に切り替わってから実行
				const nestedSwiperEl = this.slides[this.activeIndex].querySelector('.swiper-initialized');
				if (nestedSwiperEl && nestedSwiperEl.swiper) updateStepBar(nestedSwiperEl.swiper);
			}
		}
	});

	// 2. 作物タブのSwiper
	const cropSwiper = createZoomableSwiper('.crop-swiper', mainSwiper, function() {
		// slideChangeCallback: cropSwiper の slideChange イベントでステップバーを更新
		updateStepBar(this);
	});

	// 3. 病害虫タブのSwiper
	const pestSwiper = createZoomableSwiper('.pest-swiper', mainSwiper, function() {
		updateStepBar(this);
	});

	// 4. 薬剤タブのSwiper
	const chemSwiper = createZoomableSwiper('.chem-swiper', mainSwiper, function() {
		updateStepBar(this);
	});

	// クリック時のジャンプ
	mainJump = function(index) {
		mainSwiper.slideTo(index);
	};

	// ステップのジャンプ
	stepJump = function(index) {
		// 現在のメインタブにある「中身（内側）のSwiper」を動的に取得する
		const activeMainSlide = mainSwiper.slides[mainSwiper.activeIndex];
		const nestedSwiperEl = activeMainSlide.querySelector('.swiper-initialized');

		if (nestedSwiperEl && nestedSwiperEl.swiper) {
			const targetSwiper = nestedSwiperEl.swiper;
			// 未解放ステップは pointer-events: none になっているため、
			// ここに到達した時点でジャンプ可能なステップであることが保証される
			targetSwiper.slideTo(index);

		}
	};

	// ステップの前後移動
	stepMove = function(direction) {
		const activeMainSlide = mainSwiper.slides[mainSwiper.activeIndex];
		const nestedSwiperEl = activeMainSlide.querySelector('.swiper-initialized');
		if (nestedSwiperEl && nestedSwiperEl.swiper) {
			const targetSwiper = nestedSwiperEl.swiper; // Get the nested Swiper instance

			// 移動できないステップへの前後移動タッチエリアは pointer-events: none になっているため、
			// ここに到達した時点で前後移動可能であることが保証される
			if (direction === 'prev') {
				targetSwiper.slidePrev();
			} else {
				targetSwiper.slideNext();
			}
		}
	}

	// タブバーのスワイプ
	addSwipeHandler(document.querySelector('.main-nav'), mainSwiper, true);

	// ステップバーのスワイプ (各タブのSwiperに対して個別に設定)
	[
		{ el: '.crop-swiper', instance: cropSwiper },
		{ el: '.pest-swiper', instance: pestSwiper },
		{ el: '.chem-swiper', instance: chemSwiper }
	].forEach(item => {
		const bar = document.querySelector(item.el)?.closest('.tab-container')?.querySelector('.step-bar');
		if (bar) addSwipeHandler(bar, item.instance, false);
	});

	// 作物タブ初期化
	initCropTab();

	// 初期状態のインジケータをセット
	updateMainTabs(0);
	updateStepBar(cropSwiper, 0); // Initial step bar and navigation update

});

let backTapCount = 0;
let backTimer = null;

// 1. 起動時（最初のタップが必要）
window.addEventListener('load', () => {
	const initHistory = () => {
		// Entry 0 (境界線)
		history.replaceState({ isBottom: false }, ''); 
		// Entry 1 (アプリ本体)
		history.pushState({ isBottom: true }, ''); 
		
		window.removeEventListener('click', initHistory);
	};
	window.addEventListener('click', initHistory);
});

// 2. 戻るボタンの監視
window.addEventListener('popstate', (event) => {
	if (!event.state || !event.state.isBottom) {
		// 💡 境界線に触れた
		backTapCount++;

		if (backTapCount >= 2) {
			// 2回連続で戻ったなら、そのままアプリ終了（前のサイトへ戻る）
			// ここで何もしなければ、ブラウザの自然な挙動で終了します
		} else {
			// 1回目の「戻る」：即座に履歴を Entry 1 に復帰させて、メッセージを出す
			history.pushState({ isBottom: true }, '');
			
			showToast("もう一度戻ると終了します"); // 自作の通知

			// 一定時間（例: 2秒）経ったらカウントをリセット
			clearTimeout(backTimer);
			backTimer = setTimeout(() => {
				backTapCount = 0;
			}, 2000);
		}
	}
});

function showToast(message) {
	const toast = document.getElementById("toast");
	
	// メッセージをセット
	toast.innerText = message;
	
	// クラスを付与して表示
	toast.classList.add("show");

	// 2秒後にクラスを外して隠す
	setTimeout(() => {
		toast.classList.remove("show");
	}, 2000);
}

</script>
