<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="./manifest.json">
<script>
const urlParams = new URLSearchParams(window.location.search);

// ディスプレイの論理幅が 1280px 以上で mode=mobile でなければデスクトップ版にリダイレクト
const isDesktopSize = window.screen.width >= 1280;
if (isDesktopSize) {
	// URLパラメータでデバッグ用に回避できるようにしておく
	const mode = urlParams.get('mode')?.toLocaleLowerCase();
	if (mode !== 'mobile') {
		urlParams.delete('mode');
		// `tab` URL パラメータ取得
		let initTab = 0;
		const pTab = urlParams.get('tab')?.toLocaleLowerCase();
		urlParams.delete('tab');
		if (pTab === 'pest' || pTab === 1) initTab = 1;
		if (pTab === 'chem' || pTab === 2) initTab = 2;
		const tabs = ['crop.html', 'pest.html', 'chem.html'];
		let url = './' + tabs[initTab];
		window.location.href = url;
		setTimeout(() => {
			window.close();
		}, 300);
	}
}
// ディスプレイの論理幅が 1280px 未満または mode=mobile の場合は、モバイル版にリダイレクト
let url = './app/index.html';
if (urlParams.size > 0) url += '?' + urlParams.toString();
window.location.href = url;
</script>
</head>
<html>
</html>
